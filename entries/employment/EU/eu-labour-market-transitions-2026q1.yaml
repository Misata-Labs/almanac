notes: Share of people in each labour status in the previous quarter who were employed, unemployed or inactive in
  2026-Q1, both sexes, not seasonally adjusted, from Eurostat dataflow lfsi_long_q. The three columns starting from
  a status are percentages of the people who held that status a quarter earlier (units PC_EMP, PC_UNE and PC_INAC
  respectively), so each triple sums to about one hundred; employed_to_unemployed and employed_to_inactive together
  give a quarterly job-separation probability for a synthetic workforce. Rows are keyed by the Eurostat geo code
  and carry the English name from the GEO codelist. Eurostat's copyright notice states that its data are released
  under the Creative Commons Attribution 4.0 International licence; the notice page renders dynamically and is referenced
  rather than hashed.
