notes: 'Mean and median gross hourly earnings in euro from the 2022 Structure of Earnings Survey (Eurostat dataflow
  earn_ses_hourly), for industry, construction and services except public administration (NACE B to S excluding
  O), all working-time arrangements and ages, by sex (total, female, male) and by the ISCO-08 occupation groups
  Eurostat publishes for this wave: all occupations, non-manual workers (major groups 1 to 5), skilled manual workers
  (6 to 8) and manual workers (7 to 9). The survey is four-yearly; 2022 is the latest wave. Rows are keyed by the
  Eurostat geo code and carry the English country name from the GEO codelist; a cell Eurostat does not publish is
  stored as null. Eurostat''s copyright notice states that its data are released under the Creative Commons Attribution
  4.0 International licence; the notice page renders dynamically and is referenced rather than hashed.'
