notes: 'Job vacancy rate (vacant posts as a percentage of occupied plus vacant posts, not seasonally adjusted) in
  2025-Q4 for enterprises with ten or more employees, from Eurostat dataflow jvs_q_nace2: the business economy total
  (NACE sections B to S, column b_s) and each section B to S where the country reports it. Columns are the lower-case
  section letter. Rows are keyed by the Eurostat geo code and carry the English name from the GEO codelist. Eurostat''s
  copyright notice states that its data are released under the Creative Commons Attribution 4.0 International licence;
  the notice page renders dynamically and is referenced rather than hashed.'
