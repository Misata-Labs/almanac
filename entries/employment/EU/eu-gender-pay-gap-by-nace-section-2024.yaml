notes: 'Unadjusted gender pay gap for 2024 from Eurostat dataflow earn_gr_gpgr2: the difference between the average
  gross hourly earnings of men and of women as a percentage of men''s, for industry, construction and services except
  public administration (B-S_X_O), the whole of B to S, the business economy (B-N) and each section from C to S
  that Eurostat publishes. Ireland reports only the three aggregates, so its section cells are null. Rows are keyed
  by the Eurostat geo code and carry the English country name from the GEO codelist; a cell Eurostat does not publish
  is stored as null. Observation flags published with the data: provisional (p): AT (all published columns); BE
  (all published columns); DE (all published columns); ES (all published columns); FR (all published columns); IE
  (all published columns); IT (all published columns); NL (all published columns); SE (all published columns). Eurostat''s
  copyright notice states that its data are released under the Creative Commons Attribution 4.0 International licence;
  the notice page renders dynamically and is referenced rather than hashed.'
