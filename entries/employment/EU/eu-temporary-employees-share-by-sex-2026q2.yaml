notes: Employees aged 15 to 64 with a temporary contract as a percentage of all employees of that age in 2026-Q2,
  for all persons, men and women, from Eurostat dataflow lfsq_etpga (quarterly Labour Force Survey). 2026-Q2 is
  the latest quarter in the fetched range with the widest country coverage. Rows are keyed by the Eurostat geo code
  and carry the English name from the GEO codelist. Eurostat's copyright notice states that its data are released
  under the Creative Commons Attribution 4.0 International licence; the notice page renders dynamically and is referenced
  rather than hashed.
