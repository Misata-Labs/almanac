notes: 'Hourly labour cost in euro for 2024 from Eurostat dataflow lc_lci_lev (labour cost for the labour cost index:
  compensation of employees plus taxes minus subsidies), for the whole economy except public administration (B-S_X_O),
  the aggregates industry except construction (B-E), business economy (B-N), services of the business economy (G-N)
  and non-market services (P-S), and each NACE section B to S. For B-S_X_O the table also carries the wages-and-salaries
  and the non-wage components in euro per hour and Eurostat''s published share of non-wage costs in percent; the
  derived wage share is their complement expressed as a ratio. Belgium reports 2024 as its latest year, which is
  why the table is built on 2024 rather than the provisional 2025 figures. Rows are keyed by the Eurostat geo code
  and carry the English country name from the GEO codelist; a cell Eurostat does not publish is stored as null.
  Observation flags published with the data: provisional (p): AT (all published columns). Eurostat''s copyright
  notice states that its data are released under the Creative Commons Attribution 4.0 International licence; the
  notice page renders dynamically and is referenced rather than hashed.'
