- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 22
  tolerance: 0
- statistic: value[2026-S2,de]
  expected: 2343
  tolerance: 1.0e-09
- statistic: value[2016-S1,fr]
  expected: 1467
  tolerance: 1.0e-09
- statistic: max[de]
  expected: 2343
  tolerance: 1.0e-09
notes: Gross monthly statutory minimum wages in euro on 1 January and 1 July of each year from 2016 to 2026, from
  Eurostat dataflow earn_mw_cur (semi-annual data, currency EUR). Rows are keyed by the Eurostat half-year label
  (for example 2026-S1) and carry the first day of that half in the from column, so a generator can pick the minimum
  wage in force on any date; the other columns are the lower-case geo codes, listed with their English names under
  countries, with null where a country has no statutory minimum wage or no value for the half-year. Eurostat's copyright
  notice states that its data are released under the Creative Commons Attribution 4.0 International licence; the
  notice page renders dynamically and is referenced rather than hashed.
