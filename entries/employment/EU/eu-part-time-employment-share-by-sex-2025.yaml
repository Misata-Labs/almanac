notes: Employed persons aged 15 to 64 working part time as a percentage of total employment of that age in 2025,
  for all persons, men and women, from Eurostat dataflow lfsa_eppga (annual Labour Force Survey, part-time status
  as declared by the respondent). Rows are keyed by the Eurostat geo code and carry the English name from the GEO
  codelist. Eurostat's copyright notice states that its data are released under the Creative Commons Attribution
  4.0 International licence; the notice page renders dynamically and is referenced rather than hashed.
