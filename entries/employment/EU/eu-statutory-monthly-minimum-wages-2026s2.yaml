notes: 'Gross monthly statutory minimum wages in force on 1 July 2026 from Eurostat dataflow earn_mw_cur, in euro,
  in national currency and in purchasing power standards, for every country Eurostat reports a value for (EU member
  states plus candidate countries and the United States). Countries Eurostat lists without a value for the period
  are omitted. valid_from and valid_to bound the half-year the figures describe. Rows are keyed by the Eurostat
  geo code and carry the English country name from the GEO codelist. Observation flags published with the data:
  AL pps estimated; BE pps estimated; BG pps estimated; CY pps estimated; CZ pps estimated; DE pps estimated; EE
  pps estimated; EL pps estimated; ES pps estimated; FR pps estimated; HR pps estimated; HU pps estimated; IE pps
  estimated; LT pps estimated; LU pps estimated; LV pps estimated; ME pps estimated; MK pps estimated; MT pps estimated;
  NL pps estimated; PL pps estimated; PT pps estimated; RO pps estimated; RS pps estimated; SI pps estimated; SK
  pps estimated; US pps estimated. Eurostat''s copyright notice states that its data are released under the Creative
  Commons Attribution 4.0 International licence; the notice page renders dynamically and is referenced rather than
  hashed.'
