assumed:
- parameter: distributions.*.parameters.shares
  value: count / sum of counts within each group
  method: derived
  rationale: The publisher gives counts; shares are each count over the group total. Blank cells (for example housewife
    among men) are unpublished and left out rather than set to zero.
