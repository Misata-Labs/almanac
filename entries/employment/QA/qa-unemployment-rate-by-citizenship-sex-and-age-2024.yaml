notes: Unemployment rate (percent of the labour force) in Qatar in 2024 for citizens, foreign citizens and all persons,
  by sex, for ages 15+, 15-24, 25+ and 15-64, from ILOSTAT indicator UNE_DEAP_SEX_AGE_CCT_RT (labour force survey).
  The query is closed to that one year. Rows are keyed '<citizenship>:<sex>' with citizenship all, citizens or foreign_citizens
  and sex total, men or women; age_15_64 is null where ILOSTAT publishes no value. The ILOSTAT terms-of-use page
  could not be fetched byte-stably in this session, so the licence is recorded as unstated and the entry stays at
  license-review until a reviewer confirms the terms that apply to ILOSTAT data.
