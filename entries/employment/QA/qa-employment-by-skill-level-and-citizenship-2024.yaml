assumed:
- parameter: distributions[*].parameters.shares
  value: count / total
  method: derived
  rationale: ILOSTAT publishes thousands of employed persons per category; shares are each category over the sum
    of the categories for that citizenship and sex, kept only where the sum is within one percent of the published
    total.
tests:
- statistic: share[citizens:total,OCU_SKILL_L3-4]
  expected: 0.606561
  tolerance: 0.005
- statistic: share[foreign_citizens:men,OCU_SKILL_L2]
  expected: 0.656374
  tolerance: 0.005
- statistic: share[foreign_citizens:women,OCU_SKILL_L1]
  expected: 0.275796
  tolerance: 0.005
- statistic: share[all:total,OCU_SKILL_L2]
  expected: 0.588182
  tolerance: 0.005
- statistic: sum_of_shares[citizens:total]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[foreign_citizens:men]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[foreign_citizens:women]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[all:total]
  expected: 1
  tolerance: 0.0001
notes: Employed persons in Qatar in 2024 by occupational skill level (ISCO-08 skill level 1 low, level 2 medium,
  levels 3 and 4 high) for citizens and foreign citizens, by sex, from ILOSTAT indicator EMP_TEMP_SEX_OCU_CCT_NB
  (labour force survey). The skill mix differs sharply between nationals and migrants and between foreign men and
  women. Conditioning keys are '<citizenship>:<sex>' with citizenship all, citizens or foreign_citizens and sex
  total, men or women; the published thousands and the English category labels ride alongside the shares. The ILOSTAT
  terms-of-use page could not be fetched byte-stably in this session, so the licence is recorded as unstated and
  the entry stays at license-review until a reviewer confirms the terms that apply to ILOSTAT data.
