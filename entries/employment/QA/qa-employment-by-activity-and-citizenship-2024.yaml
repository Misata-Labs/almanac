  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[foreign_citizens:women]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[all:total]
  expected: 1
  tolerance: 0.0001
notes: Employed persons in Qatar in 2024 by aggregate economic activity (agriculture; manufacturing; construction;
  mining, electricity, gas and water; market services; public administration, community, social and other services)
  for citizens and foreign citizens, by sex, from ILOSTAT indicator EMP_TEMP_SEX_ECO_CCT_NB (labour force survey).
  Citizens work overwhelmingly in public administration and services while most foreign men work in construction
  and market services, so drawing the sector after nationality gives a realistic synthetic workforce. Conditioning
  keys are '<citizenship>:<sex>' with citizenship all, citizens or foreign_citizens and sex total, men or women;
  the published thousands and the English category labels ride alongside the shares. The ILOSTAT terms-of-use page
  could not be fetched byte-stably in this session, so the licence is recorded as unstated and the entry stays at
  license-review until a reviewer confirms the terms that apply to ILOSTAT data.
