assumed:
- parameter: distributions[*].parameters.shares
  value: count / total
  method: derived
  rationale: ILOSTAT publishes thousands of employed persons per category; shares are each category over the sum
    of the categories for that citizenship and sex, kept only where the sum is within one percent of the published
    total.
tests:
- statistic: share[citizens:total,ECO_AGGREGATE_PUB]
  expected: 0.74438
  tolerance: 0.005
- statistic: share[foreign_citizens:men,ECO_AGGREGATE_CON]
  expected: 0.388514
  tolerance: 0.005
- statistic: share[foreign_citizens:women,ECO_AGGREGATE_PUB]
  expected: 0.590351
  tolerance: 0.005
- statistic: share[all:total,ECO_AGGREGATE_MKT]
