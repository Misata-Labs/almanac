notes: Employed persons in Qatar in 2024 in the broad age groups 15-24, 25-54, 55-64 and 65+ for citizens and foreign
  citizens, by sex, from ILOSTAT indicator EMP_TEMP_SEX_AGE_CCT_NB (labour force survey), for assigning ages to
  synthetic employees by nationality. Conditioning keys are '<citizenship>:<sex>' with citizenship all, citizens
  or foreign_citizens and sex total, men or women; the published thousands and the English category labels ride
  alongside the shares. The ILOSTAT terms-of-use page could not be fetched byte-stably in this session, so the licence
  is recorded as unstated and the entry stays at license-review until a reviewer confirms the terms that apply to
  ILOSTAT data.
