assumed:
- parameter: days_per_month
  value: 30
  method: assumed
  rationale: The Decree-Law text does not define the daily wage for monthly-paid workers; 30 days a month is assumed.
- parameter: cap_months
  value: 24
  method: derived
  rationale: Article 51(6) caps the benefit at two years' wage, read as 24 months of the basic wage.
