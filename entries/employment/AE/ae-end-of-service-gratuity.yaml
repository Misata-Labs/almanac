id: ae-end-of-service-gratuity
title: 'UAE end-of-service gratuity for foreign workers: 21 days'' basic wage a year for five years, 30 days thereafter,
  capped at two years'
kind: rule
domain: employment
region: AE
status: license-review
tier: B
valid_from: '2022-02-02'
valid_to: null
tags:
- gcc
- labour-law
- payroll
- end-of-service
- gratuity
- uae
use_cases:
- payroll-demo
- hr-demo
- hr-analytics
spec:
  implementation: almanac.rules.gcc_end_of_service
  parameters:
    currency: AED
    wage_unit: day
    days_per_month: 30
    tiers:
    - up_to_years: 5
      per_year: '21'
    - up_to_years: null
      per_year: '30'
    minimum_years: 1
    cap_months: 24
    wage_basis: last basic wage
    applies_to: full-time foreign workers; nationals receive pension under the pensions and social security legislation
  vectors:
  - input:
      op: accrual
      year: 3
    expected: '21'
    origin: source
    note: 'Article 51(2)(a): 21 days for each of the first five years'
  - input:
      op: accrual
      year: 6
    expected: '30'
    origin: source
    note: 'Article 51(2)(b): 30 days for each year exceeding five'
  - input:
      op: award_months
      years: '0.9'
    expected: '0'
    origin: source
    note: 'Article 51(2): entitlement requires a year or more of continuous service'
  - input:
      monthly_wage: 10000
      years: 5
    expected: '35000.00'
    origin: derived
    note: 5 x 21 days at 10,000 / 30
  - input:
      monthly_wage: 10000
      years: 10
    expected: '85000.00'
    origin: derived
    note: 5 x 21 + 5 x 30 = 255 days
  - input:
      monthly_wage: 10000
      years: 30
    expected: '240000.00'
    origin: derived
    note: capped at two years' (24 months') wage
  - input:
      monthly_wage: 9000
      years: '2.5'
    expected: '15750.00'
    origin: derived
    note: 52.5 days at 300 a day
