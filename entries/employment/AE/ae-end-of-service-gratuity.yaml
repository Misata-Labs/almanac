notes: 'End-of-service benefit for a full-time foreign worker under Article 51 of Federal Decree-Law No. 33 of 2021:
  after at least a year of continuous service, 21 days of the last basic wage for each of the first five years and
  30 days for each later year, part years pro rata, unpaid absence excluded, the total capped at two years'' wage.
  The 2021 law makes no reduction for resignation. UAE nationals are covered by pension legislation instead. The
  law does not convert a monthly wage to a daily one in the text fetched; the entry uses 30 days a month, which
  is an assumption, as is reading two years'' wage as 24 months of basic wage. Monetary vectors are computed from
  the stated rule.'
