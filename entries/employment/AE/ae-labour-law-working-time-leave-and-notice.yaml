notes: 'Limits that UAE private-sector payroll and HR systems enforce under Federal Decree-Law No. 33 of 2021 on
  the Regulation of Employment Relationships, in force from 2 February 2022: probation of at most six months (14
  days'' written notice to end it), 8 hours a day or 48 a week, no more than 5 consecutive hours without a break,
  overtime of at most 2 hours a day and 144 hours in any three weeks, overtime paid at the basic wage plus at least
  25% (50% between 10 pm and 4 am, and for weekend work), annual leave of 30 days per year of service (2 days a
  month between six months and a year), and contract notice of 30 to 90 days. Ramadan hours are set by the Implementing
  Regulation, which was not fetched. The text is the consolidated English translation with amendments, which states
  that it is not an official translation.'
