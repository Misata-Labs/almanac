notes: Unemployment rate (unemployed as a ratio of the labour force) in the UAE in 2018 by nationality (Citizen,
  Non-Citizen, Total), sex (Male, Female, Total) and five-year age group from 15 - 19 to 65 +, with totals, from
  the Federal Competitiveness and Statistics Centre labour force survey dataset 'Unemployment rate by nationality,
  age and gender' (2016-2018). 2018 is the latest year the federal open data portal carries for this breakdown.
  Keys are nationality|sex|age_group. The gap between citizen and non-citizen rates is large and should drive the
  employment status of synthetic residents by nationality. Bayanat, the UAE federal open data portal run by the
  Federal Competitiveness and Statistics Centre, states on its Copyright and Data Licensing page that datasets on
  the portal are available under the Creative Commons Attribution 4.0 International licence unless otherwise stated;
  that page is rendered per request and is referenced rather than hashed. Bayanat download links carry an opaque
  resource token issued by the portal.
