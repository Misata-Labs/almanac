notes: Employment in United Arab Emirates in 2024 in fourteen ISIC Rev.4 section groups (A; B; C; D and E; F; G;
  H and J; I; K; L, M and N; O; P; Q; R, S, T and U) for all persons ('total'), men and women, from ILOSTAT indicator
  EMP_2EMP_SEX_ECO_NB (ILO modelled estimates). The modelled series covers all six GCC states for the same year,
  which the survey series do not. Codes keep the ILOSTAT form (ECO_ISIC4_<sections>); the parameters carry the English
  labels and the thousands employed. The query is closed to one year so that projections for later years stay out.
  The ILOSTAT terms-of-use page could not be fetched byte-stably in this session, so the licence is recorded as
  unstated and the entry stays at license-review until a reviewer confirms the terms that apply to ILOSTAT data.
