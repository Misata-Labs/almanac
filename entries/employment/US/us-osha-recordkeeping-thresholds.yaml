notes: 'The numeric thresholds of OSHA''s injury and illness recordkeeping rule: the company size below which routine
  recordkeeping is not required (1904.1), the hours within which a work-related fatality and an in-patient hospitalization,
  amputation or loss of an eye must be reported and how long after the incident each remains reportable (1904.39),
  and the establishment sizes that trigger annual electronic submission of the Form 300A summary and of the Form
  300 and 301 case data (1904.41). Read from the eCFR text as of 2026-10-29; valid_from is the date of the latest
  version of 1904.41, the most recently amended of the three sections. US federal government works carry no copyright,
  but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded as unstated and
  the entry held at license-review.'
