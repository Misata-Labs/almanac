notes: Annual base pay in US dollars for each General Schedule grade and step effective January 2026, incorporating
  the 1 percent general increase, from the OPM salary table 2026-GS, with the within-grade increase amount for each
  grade (null for GS-1 and GS-2, where the table says the amount varies). Locality payments are added on top (see
  the locality entry). The PDF renders some digits with kerning that splits them across lines in extracted text,
  so the builder rejoins those fragments before parsing; cited cells are ones that extract cleanly. OPM states no
  licence on the table; US federal government works are generally not subject to copyright.
