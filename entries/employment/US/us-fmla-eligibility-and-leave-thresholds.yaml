id: us-fmla-eligibility-and-leave-thresholds
title: United States FMLA employer coverage, employee eligibility and leave entitlement thresholds, 29 CFR 825
kind: rule
domain: employment
region: US
status: license-review
tier: A
valid_from: '2016-12-01'
valid_to: null
tags:
- fmla
- leave
- eligibility
- hr-policy
- 29-cfr-825
use_cases:
- hr-analytics
- workforce-planning
- payroll-demo
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    rows:
      employer_coverage_min_employees:
        value: 50
        unit: employees for each working day
        section: 825.104(a)
      employer_coverage_min_workweeks:
        value: 20
        unit: calendar workweeks in the current or preceding calendar year
        section: 825.104(a)
      employee_min_months_employed:
        value: 12
        unit: months
        section: 825.110(a)(1)
      employee_min_hours_of_service:
        value: 1250
        unit: hours in the preceding 12 months
        section: 825.110(a)(2)
      worksite_min_employees:
        value: 50
        unit: employees
        section: 825.110(a)(3)
      worksite_radius_miles:
        value: 75
        unit: miles
        section: 825.110(a)(3)
      break_in_service_years_not_counted:
        value: 7
        unit: years
        section: 825.110(b)(1)
      leave_entitlement_workweeks:
        value: 12
        unit: workweeks per 12-month period
        section: 825.200(a)
      servicemember_caregiver_leave_workweeks:
        value: 26
        unit: workweeks in a single 12-month period
        section: 825.200(f)
  vectors:
  - input:
      key: employee_min_hours_of_service
      column: value
    expected: 1250
    origin: source
  - input:
      key: leave_entitlement_workweeks
      column: value
    expected: 12
    origin: source
  - input:
      key: employer_coverage_min_employees
      column: value
    expected: 50
    origin: source
  - input: servicemember_caregiver_leave_workweeks
    expected: true
    origin: source
  - input: paid_leave_workweeks
    expected: false
    origin: derived
