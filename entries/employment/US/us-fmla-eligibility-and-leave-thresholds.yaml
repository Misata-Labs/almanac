notes: The thresholds that decide whether an employer is covered by the Family and Medical Leave Act, whether an
  employee is eligible for leave, and how much leave the Act provides, as 29 CFR 825.104, 825.110 and 825.200 state
  them in the eCFR text as of 2026-10-29. valid_from is the date of the latest version of 825.110 in the eCFR versions
  endpoint. US federal government works carry no copyright, but neither the eCFR API nor the regulation text states
  reuse terms, so the licence is recorded as unstated and the entry held at license-review.
