notes: The federal minimum hourly wage for employees covered by section 6(a)(1) of the Fair Labor Standards Act
  as the Fair Minimum Wage Act of 2007 set it in three steps, the last of which remains in force in the 2023 edition
  of the United States Code. The parameters also carry the youth opportunity wage of subsection (g)(1) that may
  be paid for a limited number of days after hiring. States and territories may set higher or, for the territories
  named in the section, different rates. US federal statutes carry no copyright, but the govinfo page states no
  reuse terms, so the licence is recorded as unstated and the entry held at license-review; the HTML form of the
  source makes the entry tier B.
