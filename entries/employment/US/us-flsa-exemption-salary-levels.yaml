notes: 'The minimum salary an employee must be paid to qualify for the executive, administrative or professional
  exemption from overtime under section 13(a)(1) of the Fair Labor Standards Act, as 29 CFR 541.600 states it in
  the eCFR text as of 2026-10-29: the standard weekly level, the lower levels for the territories, the equivalent
  biweekly, semimonthly and monthly amounts, the hourly rate for computer employees and the total annual compensation
  level for the highly compensated employee test of 541.601. valid_from is the date of the latest version of 541.600
  in the eCFR versions endpoint. US federal government works carry no copyright, but neither the eCFR API nor the
  regulation text states reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
