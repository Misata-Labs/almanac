assumed:
- parameter: steps
  value: each limit equals the hourly minimum wage in force times 130, divided by 3 and rounded up (SGB IV § 8(1a))
  method: derived
  rationale: The guidelines state the 2026 and 2027 limits and Anlage 1 tabulates the earlier ones; a period whose
    limit repeats the previous one is merged into it. From 1 October 2022 the formula in SGB IV § 8(1a) applied
    to the minimum wage steps in de-statutory-minimum-wage-2022-2027 reproduces each limit, which a reviewer can
    use as a cross-check.
