  tolerance: 0
notes: 'The Geringfügigkeitsgrenze, the monthly earnings limit for a marginal employment (Minijob) under SGB IV
  § 8(1a): the pay for ten hours a week at the statutory minimum wage, computed as the hourly minimum wage times
  130, divided by three and rounded up to full euros, and announced by the Federal Ministry of Labour in the Bundesanzeiger.
  The steps come from the 2026 marginal employment guidelines of the social insurance central bodies, published
  by the Minijob-Zentrale, which state the limits from 1 January 2026 and 1 January 2027 and tabulate the earlier
  ones in Anlage 1 (the first period of that table, ending 31 March 2003, has no start date and is left out). Earnings
  above the limit and up to the transition zone ceiling in SGB IV § 20(2), kept under transition_zone_upper_limit,
  fall in the Übergangsbereich (Midijob), where employee contributions are computed on a reduced base. Gesetze im
  Internet and the guidelines carry no licence statement, so the licence is recorded as unstated and the entry stays
  at license-review.'
