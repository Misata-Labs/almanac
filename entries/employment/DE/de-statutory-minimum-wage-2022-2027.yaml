notes: 'The general statutory minimum wage in euro per hour, gross, by the date each level took effect: the amount
  fixed in MiLoG § 1(2) from 1 October 2022, the two steps of the Fourth Minimum Wage Adjustment Ordinance (MiLoV4)
  and the two steps of the Fifth (MiLoV5, BGBl. 2025 I Nr. 268), the last of which takes effect on 1 January 2027.
  Sector minimum wages under the Posted Workers Act take precedence where higher and are not included; MiLoG § 22
  exempts some groups, such as minors without vocational training, from the minimum wage. Gesetze im Internet carries
  no licence statement, so the licence is recorded as unstated and the entry stays at license-review.'
