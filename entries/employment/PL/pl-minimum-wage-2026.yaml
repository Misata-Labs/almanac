notes: The Polish minimum remuneration for work (minimalne wynagrodzenie za pracę) for a full-time employee and
  the minimum hourly rate for specified civil-law contracts, both from 1 January 2026, as the Council of Ministers
  regulation of 11 September 2025 sets them under article 2(5) of the Act of 10 October 2002 on the minimum wage.
  Part-time employees receive at least the proportional monthly amount. The Dziennik Ustaw PDF, served by the Sejm
  ELI API, carries no licence statement, so the licence is recorded as unstated and the entry stays at license-review.
