assumed:
- parameter: distributions.*.parameters.shares
  value: count / sum of counts within each group
  method: derived
  rationale: The publisher gives counts; shares are each count over the group total.
- parameter: column order
  value: change %, Sep 2026, Aug 2026, 2025
  method: derived
  rationale: Tables 17 and 18 use the bulletin's three-period layout; on Table 24 (vehicles), whose pie chart prints
    shares for September 2026, the first count column reproduces those shares, so the first column is read as September
    2026 here too.
