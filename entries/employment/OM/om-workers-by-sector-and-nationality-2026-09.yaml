notes: 'Workers in Oman at the end of September 2026 by sector of employment, for Omanis (Table 17) and expatriates
  (Table 18) of the NCSI Monthly Statistical Bulletin (October 2026 issue). Sector labels are the bulletin''s: Government
  (حكومي), Private (خاص), Family (عائلي), Communal (أهلي) and Other. The two groups together give the nationality-by-sector
  table for synthetic employees. NCSI data are published under the Open Government License of the Sultanate of Oman,
  whose general provisions say it is compatible with Creative Commons Attribution 4.0; it is not itself an SPDX
  licence, so the entry stays at license-review.'
