notes: 'The Spanish salario mínimo interprofesional for 2026 fixed by Real Decreto 126/2026 (BOE 19 February 2026),
  with effect from 1 January to 31 December 2026: the general amount by day or by month (article 1), the annual
  amount used to compare total pay (article 3.1, which corresponds to fourteen monthly payments), the daily minimum
  for fixed-term workers whose service with one company does not exceed 120 days, which includes the proportional
  share of Sundays, holidays and the two extraordinary payments (article 4.1), and the hourly minimum for household
  employees working by the hour (article 4.2). The BOE XML carries no licence statement, so the licence is recorded
  as unstated and the entry stays at license-review.'
