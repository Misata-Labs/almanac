notes: Share of employees whose job is temporary (fixed-term, agency or other non-permanent contract) from OECD
  dataflow DF_TEMP_I (employment by permanency of the job, incidence, percentage of employees in the same subgroup),
  for all employees, men, women and the 15 to 24 and 25 to 54 age bands. The complement of each share is the permanent-contract
  share. Rows are keyed by ISO 3166-1 alpha-3 code and carry the OECD reference-area label; OECD, EU and G7 aggregates
  are left out. Values are the 2024 observations of the dataflow. The OECD terms and conditions page could not be
  fetched byte-stably in this session, so the licence is recorded as unstated and the entry stays at license-review
  until a reviewer confirms the terms that apply to OECD data.
