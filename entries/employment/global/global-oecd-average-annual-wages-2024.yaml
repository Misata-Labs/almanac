notes: 'Average annual wages per full-time equivalent employee from the OECD earnings dataflow AV_AN_WAGE: the constant-price
  series converted at purchasing power parities (US dollars, PPP converted, constant prices) and the current-price
  series in national currency units. The currency column names the national currency the second column is expressed
  in. Rows are keyed by ISO 3166-1 alpha-3 code and carry the OECD reference-area label; OECD, EU and G7 aggregates
  are left out. Values are the 2024 observations of the dataflow. The OECD terms and conditions page could not be
  fetched byte-stably in this session, so the licence is recorded as unstated and the entry stays at license-review
  until a reviewer confirms the terms that apply to OECD data.'
