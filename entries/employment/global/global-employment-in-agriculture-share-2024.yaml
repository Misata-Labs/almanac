notes: 'Employment in agriculture (% of total employment) (modeled ILO estimate) for 2024 from the World Development
  Indicators API (indicator SL.AGR.EMPL.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1
  alpha-3 code, with regional and income aggregates removed. 2024 is the most recent year whose coverage is close
  to the series'' best recent year. Source note from the World Bank: Employment is defined as persons of working
  age who were engaged in any activity to produce goods or provide services for pay or profit, whether at work during
  the reference period or not at work due to temporary absence from a job, or to working-time arrangement. The agriculture
  sector consists of activities in agriculture, hunting, forestry and fishing, in accordance with division 1 (ISIC
  2) or  The World Bank licenses its datasets under CC BY 4.0.'
