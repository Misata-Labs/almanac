notes: Minimum wages relative to the mean and median wages of full-time workers (OECD dataflow MIN2AVE, percent)
  joined with the statutory minimum wage at current prices in national currency (dataflow MW_CURP) per year, per
  month and per hour where the OECD publishes that pay period. Rows are keyed by ISO 3166-1 alpha-3 code and carry
  the OECD reference-area label; OECD, EU and G7 aggregates are left out. Values are the 2024 observations of the
  dataflow. The OECD terms and conditions page could not be fetched byte-stably in this session, so the licence
  is recorded as unstated and the entry stays at license-review until a reviewer confirms the terms that apply to
  OECD data.
