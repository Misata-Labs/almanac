notes: 'Labor force participation rate, female (% of female population ages 15+) (modeled ILO estimate) for 2024
  from the World Development Indicators API (indicator SL.TLF.CACT.FE.ZS, data last updated 2026-10-08), one row
  per economy keyed by ISO 3166-1 alpha-3 code, with regional and income aggregates removed. 2024 is the most recent
  year whose coverage is close to the series'' best recent year. Source note from the World Bank: The labor force
  participation rate is the labor force as a percent of the population ages 15 and older. The labor force is the
  sum of all persons of working age who are employed and those who are unemployed. The World Bank licenses its datasets
  under CC BY 4.0.'
