notes: 'OECD indicators of the strictness of employment protection legislation (dataflow DF_EPL, version 4 methodology,
  scale 0 least restrictive to 6 most restrictive): regular contracts against individual and collective dismissals,
  regular contracts against individual dismissals only, the additional provisions for collective dismissals, and
  the regulation of temporary contracts. Rows are keyed by ISO 3166-1 alpha-3 code and carry the OECD reference-area
  label; OECD, EU and G7 aggregates are left out. Values are the 2024 observations of the dataflow. The OECD terms
  and conditions page could not be fetched byte-stably in this session, so the licence is recorded as unstated and
  the entry stays at license-review until a reviewer confirms the terms that apply to OECD data.'
