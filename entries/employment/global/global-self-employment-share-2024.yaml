notes: 'Self-employed, total (% of total employment) (modeled ILO estimate) for 2024 from the World Development
  Indicators API (indicator SL.EMP.SELF.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1
  alpha-3 code, with regional and income aggregates removed. 2024 is the most recent year whose coverage is close
  to the series'' best recent year. Source note from the World Bank: Self-employed workers are those workers who,
  working on their own account or with one or a few partners or in cooperative, hold the type of jobs defined as
  a "self-employment jobs." i.e. jobs where the remuneration is directly dependent upon the profits derived from
  the goods and services produced. Self-employed workers include sub-categories of employers, own-account workers
  and members of produc The World Bank licenses its datasets under CC BY 4.0.'
