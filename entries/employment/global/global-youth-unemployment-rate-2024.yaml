notes: 'Unemployment, youth total (% of total labor force ages 15-24) (modeled ILO estimate) for 2024 from the World
  Development Indicators API (indicator SL.UEM.1524.ZS, data last updated 2026-10-08), one row per economy keyed
  by ISO 3166-1 alpha-3 code, with regional and income aggregates removed. 2024 is the most recent year whose coverage
  is close to the series'' best recent year. Source note from the World Bank: Youth unemployment refers to the share
