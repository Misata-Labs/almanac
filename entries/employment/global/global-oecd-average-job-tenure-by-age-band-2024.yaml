notes: Average length of time workers have been with their current employer, in years, from OECD dataflow DF_TENURE_AVE
  (job tenure intervals, average job tenure, total declared tenure). The dependent-employment measure is given for
  all ages, for the 15 to 24, 25 to 54 and 55 to 64 age bands and for men and women; the all-employment measure,
  which includes the self-employed, is the last column. Rows are keyed by ISO 3166-1 alpha-3 code and carry the
  OECD reference-area label; OECD, EU and G7 aggregates are left out. Values are the 2024 observations of the dataflow.
  The OECD terms and conditions page could not be fetched byte-stably in this session, so the licence is recorded
  as unstated and the entry stays at license-review until a reviewer confirms the terms that apply to OECD data.
