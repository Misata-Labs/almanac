notes: 'The Dutch statutory minimum hourly wage for employees aged 21 and over and the corresponding youth minimum
  wages for ages 15 to 20, from the two indexation regulations of the Minister of Social Affairs and Employment
  published in the Staatscourant: the hourly amount fixed in article 1 under article 8(1)(a) of the Wet minimumloon
  en minimumvakantiebijslag, and the youth wage tables in the explanatory notes, which apply the percentages of
  the Besluit minimumjeugdloon (kept under youth_percentages). Employees aged 18 to 20 on a beroepsbegeleidende
  leerweg (bbl) contract have their own rates, selected with the categories bbl 20, bbl 19 and bbl 18. reference_monthly_wage
  is the article 8(1)(b) monthly amount, which since 2024 no longer sets anyone''s minimum pay but indexes benefits.
  The holiday allowance of at least 8 percent is on top. The Staatscourant XML carries no licence statement, so
  the licence is recorded as unstated and the entry stays at license-review.'
