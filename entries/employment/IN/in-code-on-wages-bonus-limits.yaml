notes: Chapter IV of the Code on Wages, 2019 (successor to the Payment of Bonus Act, 1965, in force from 21 November
  2025) requires every establishment employing twenty or more persons to pay each eligible employee who worked at
  least thirty days in the accounting year a minimum bonus of eight and one-third per cent. of wages earned or one
  hundred rupees, whichever is higher, regardless of allocable surplus; where the allocable surplus is larger, bonus
  rises in proportion to wages up to twenty per cent. Bonus is due within eight months of the close of the accounting
  year. Eligibility is limited to employees drawing wages up to an amount the appropriate Government notifies, and
  bonus for employees above a notified calculation ceiling is computed as if their wage were that ceiling or the
  minimum wage; neither amount is stated in the Code, so ``eligibility_wage_ceiling`` is left empty. The rule returns
  the minimum and maximum bonus for a year's wages.
