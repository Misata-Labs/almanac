  tolerance: 0
notes: Gratuity under Chapter V of the Code on Social Security, 2020 (in force from 21 November 2025, replacing
  the Payment of Gratuity Act, 1972). It is payable on superannuation, retirement, resignation, death, disablement
  or expiry of a fixed term after at least five years of continuous service (three for working journalists); the
  five-year condition does not apply on death, disablement or expiry of a fixed term, and section 2(o) of the Industrial
  Relations Code makes a fixed-term worker eligible after one year under the contract. The amount is fifteen days'
  wages for every completed year or part above six months, on the last wages drawn; a monthly-rated employee's fifteen
  days' wages are the monthly wage divided by twenty-six and multiplied by fifteen (Explanation 3), seasonal workers
  get seven days a season, and fixed-term and deceased employees are paid pro rata. Section 53(3) caps the total
  at an amount the Central Government notifies; the cap cited is the twenty lakh rupees notified under the 1972
  Act in 2018 (S.O. 1420(E)), which section 164(2) keeps in force under the Code until replaced. Wages here are
  wages as defined in the Code (see in-code-on-wages-wage-definition-50-percent-rule).
