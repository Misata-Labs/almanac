assumed:
- parameter: pro_rata_method
  value: exact months of service divided by twelve
  method: derived
  rationale: The Code says fixed-term and deceased employees are paid 'on pro rata basis' without a formula; the
    rule pro-rates the annual fifteen days by the months served.
- parameter: ceiling
  value: 2000000
  method: derived
  rationale: No ceiling notified under section 53(3) of the Code was found on India Code; the 2018 ceiling under
    the repealed 1972 Act is carried forward on the strength of the savings clause in section 164(2).
