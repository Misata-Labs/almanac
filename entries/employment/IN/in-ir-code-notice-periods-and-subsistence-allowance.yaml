notes: Notice periods and suspension pay under the Industrial Relations Code, 2020 (in force from 21 November 2025).
  No one in an industrial establishment may strike, and no employer lock out, without notice given within the sixty
  days before, within fourteen days of the notice, before the date the notice names, during conciliation and seven
  days after it, or during Tribunal or arbitration proceedings and sixty days after (section 62). A change in the
  conditions listed in the Third Schedule needs twenty-one days' notice (section 40); closure of an undertaking
  needs sixty days' notice to the appropriate Government (section 74, not below fifty workers); retrenchment needs
  one month's notice or wages in lieu (section 70). A suspended worker is paid subsistence allowance of fifty per
  cent. of wages for the first ninety days and seventy-five per cent. thereafter unless the delay is the worker's
  doing; inquiries should ordinarily finish within ninety days (section 38, for establishments with standing orders).
