notes: 'Hours and leave limits of the Occupational Safety, Health and Working Conditions Code, 2020, in force from
  21 November 2025: no worker may work more than eight hours a day (with intervals and spread-over notified by the
  appropriate Government) or more than six days a week; motor transport workers may be asked to work a weekly holiday
  but never more than ten days in a row; holidays lost to an exemption are given back within the month or the two
  months after. Overtime, beyond the daily or weekly hours the appropriate Government prescribes, is paid at twice
  the rate of wages, needs the worker''s consent, and is counted daily or weekly whichever favours the worker; the
  Code on Wages separately sets overtime at not less than twice the normal rate for minimum-wage employees. A worker
  who has worked 180 days in a calendar year earns one day of annual leave with wages for every twenty days worked
  (fifteen for adolescents and below-ground mine workers). Weekly-hour and overtime-hour caps are left to State
  and Central rules and are not in this entry.'
