notes: Maternity benefit under Chapter VI of the Code on Social Security, 2020 (in force from 21 November 2025,
  replacing the Maternity Benefit Act, 1961). A woman who has actually worked at least eighty days for the employer
  in the twelve months before her expected delivery is paid her average daily wage for up to twenty-six weeks, of
  which no more than eight may precede the expected delivery; with two or more surviving children the maximum is
  twelve weeks, no more than six before delivery. An adopting mother of a child under three months, or a commissioning
  mother, gets twelve weeks from hand-over. On return she is allowed two nursing breaks a day until the child is
  fifteen months old. The chapter applies to factories, mines and plantations and to shops and establishments with
  ten or more employees (see in-labour-code-establishment-size-thresholds). Establishments covered by the ESIC chapter
  pay maternity benefit through ESIC instead.
