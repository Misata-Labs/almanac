  parameters:
    rows:
      provident_fund_chapter:
        threshold: 20
        counts: employees
        law: Code on Social Security, First Schedule, Chapter III
      esic_chapter:
        threshold: 10
        counts: persons (other than a seasonal factory)
        law: Code on Social Security, First Schedule, Chapter IV
      gratuity_shops_and_establishments:
        threshold: 10
        counts: employees on any day of the preceding twelve months
        law: Code on Social Security, First Schedule, Chapter V
      maternity_benefit_shops_and_establishments:
        threshold: 10
        counts: employees on any day of the preceding twelve months
        law: Code on Social Security, First Schedule, Chapter VI
      creche_facility:
        threshold: 50
        counts: employees
        law: Code on Social Security s 67(1)
      bonus_chapter:
        threshold: 20
        counts: persons on any day of the accounting year
        law: Code on Wages s 38(2)
      standing_orders_chapter:
        threshold: 300
        counts: workers on any day of the preceding twelve months
        law: Industrial Relations Code s 28(1)
      layoff_retrenchment_closure_permission_chapter:
        threshold: 300
        counts: workers on average per working day in the preceding twelve months
        law: Industrial Relations Code s 77(1)
      layoff_compensation_sections:
        threshold: 50
        counts: workers on average per working day in the preceding calendar month
        law: Industrial Relations Code s 65(1)(a)
      closure_notice_section:
        threshold: 50
        counts: workers on any day in the preceding twelve months
        law: Industrial Relations Code s 74(1) proviso (i)
      supervisor_worker_wage_limit:
        threshold: 18000
        counts: rupees of wages per month; supervisors above it are not workers
        law: Industrial Relations Code s 2(zr)(iv)
