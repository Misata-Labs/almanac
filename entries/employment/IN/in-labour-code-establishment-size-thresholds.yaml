notes: Headcount and wage thresholds at which the Labour Codes (in force from 21 November 2025) start to apply,
  for generating establishments with consistent compliance obligations. Under the Code on Social Security the provident
  fund chapter covers establishments employing twenty or more, the ESIC chapter ten or more persons (and any establishment
  in a notified hazardous occupation, even with one employee), gratuity and maternity benefit every factory, mine,
  plantation and every shop or establishment with ten or more employees, and a crèche is required at fifty employees.
  Bonus under the Code on Wages applies at twenty persons. Under the Industrial Relations Code, standing orders
  are required at three hundred workers; establishments with three hundred or more need Government permission to
  lay off, retrench or close (Chapter X); lay-off compensation and the sixty-day closure notice do not apply below
  fifty workers; and a supervisor drawing more than eighteen thousand rupees a month is not a 'worker'. Each Code
  lets the appropriate Government vary several of these by notification, and the counting basis differs (employees,
  persons or workers; any day or a daily average), as the ``counts`` column records.
