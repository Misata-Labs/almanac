notes: 'The four Labour Codes, enacted in 2019 and 2020, were brought into force on 21 November 2025 by four notifications
  of that date in the Gazette of India: S.O. 5322(E) for the Code on Wages, S.O. 5320(E) for the Industrial Relations
  Code, S.O. 5319(E) for the Code on Social Security and S.O. 5321(E) for the Occupational Safety, Health and Working
  Conditions Code. India Code''s consolidated texts record each notification in a footnote to section 1(3). A few
  provisions came into force earlier (parts of the Code on Wages on 18 December 2020 and section 142 of the Social
  Security Code on 3 May 2021) and some remain to be notified, as the footnotes list. The Industrial Relations Code
  (Amendment) Act, 2026 is deemed in force from the same date and restates the repeal of the Trade Unions, Standing
  Orders and Industrial Disputes Acts. The ''repeals'' column names the Acts each Code''s repeal section lists (in
  part, for the two Codes that repeal nine and thirteen Acts); payroll records dated on or after 21 November 2025
  should cite the Codes rather than the repealed Acts. India Code states no reuse licence.'
