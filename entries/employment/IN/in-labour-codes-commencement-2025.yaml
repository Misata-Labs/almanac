spec:
  implementation: almanac.rules.lookup_table
  parameters:
    rows:
      code_on_wages_2019:
        act: Act No. 29 of 2019
        in_force_from: '2025-11-21'
        notification: S.O. 5322(E)
        repeals: Payment of Wages Act, 1936; Minimum Wages Act, 1948; Payment of Bonus Act, 1965; Equal Remuneration
          Act, 1976
      industrial_relations_code_2020:
        act: Act No. 35 of 2020
        in_force_from: '2025-11-21'
        notification: S.O. 5320(E)
        repeals: Trade Unions Act, 1926; Industrial Employment (Standing Orders) Act, 1946; Industrial Disputes
          Act, 1947
      code_on_social_security_2020:
        act: Act No. 36 of 2020
        in_force_from: '2025-11-21'
        notification: S.O. 5319(E)
        repeals: nine enactments, among them the Employees' State Insurance Act, 1948, the EPF Act, 1952, the Maternity
          Benefit Act, 1961 and the Payment of Gratuity Act, 1972
      occupational_safety_health_code_2020:
        act: Act No. 37 of 2020
        in_force_from: '2025-11-21'
        notification: S.O. 5321(E)
        repeals: thirteen enactments, among them the Factories Act, 1948, the Mines Act, 1952 and the Contract Labour
          (Regulation and Abolition) Act, 1970
  vectors:
  - input:
      key: code_on_wages_2019
      column: notification
    expected: S.O. 5322(E)
    origin: source
  - input:
      key: code_on_social_security_2020
      column: notification
    expected: S.O. 5319(E)
    origin: source
  - input:
