notes: Exit payments under Chapters IX and XI of the Industrial Relations Code, 2020, in force from 21 November
  2025 (replacing the Industrial Disputes Act, 1947). A worker with at least one year of continuous service may
  be retrenched only after one month's written notice (or wages in lieu) and on payment of compensation of fifteen
  days' average pay for every completed year of continuous service or part above six months (section 70). The employer
  also pays fifteen days' wages last drawn into the worker re-skilling fund, which credits that sum to the worker
  within forty-five days (section 83). A laid-off worker with a year's service is paid fifty per cent. of basic
  wages and dearness allowance for each day of lay-off other than weekly holidays; by agreement the payment may
  stop after forty-five days in twelve months (section 67). Sections 67 to 69 do not apply to establishments averaging
  fewer than fifty workers or covered by Chapter X (three hundred or more), see in-labour-code-establishment-size-thresholds.
  Average pay is defined in the Code and is passed in as a daily amount.
