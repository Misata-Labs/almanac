id: in-code-on-wages-wage-definition-50-percent-rule
title: 'India Code on Wages s 2(y) wage definition: excluded allowances above half of total remuneration count as
  wages'
kind: rule
domain: employment
region: IN
status: license-review
tier: B
valid_from: '2025-11-21'
valid_to: null
tags:
