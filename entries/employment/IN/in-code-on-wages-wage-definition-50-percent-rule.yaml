spec:
  implementation: almanac.rules.in_labour_codes
  parameters:
    formula: code_wages
    currency: INR
    included_components:
    - basic pay
    - dearness allowance
    - retaining allowance
    excluded_components_counted_against_limit:
    - statutory bonus not part of the terms of employment
    - value of house accommodation, light, water, medical attendance or other amenity
    - employer contribution to pension or provident fund and interest on it
    - conveyance allowance or travelling concession
    - sums to defray special expenses of the employment
    - house rent allowance
    - remuneration under an award or settlement
    - overtime allowance
    - commission
    excluded_components_outside_limit:
    - gratuity on termination
    - retrenchment compensation, retirement benefit or ex gratia on termination
    excluded_share_limit_percent: 50
    in_kind_share_limit_percent: 15
  vectors:
  - input:
      included: 50000
      excluded: 50000
    expected: '50000.00'
    origin: source
    note: excluded payments of exactly one-half of all remuneration are not added back
  - input:
      included: 40000
      excluded: 60000
    expected: '50000.00'
    origin: derived
    note: ₹10,000 of the excluded ₹60,000 lies above half of ₹1,00,000 and is added to wages
  - input:
      included: 25000
      excluded: 75000
    expected: '50000.00'
    origin: derived
  - input:
      included: 60000
      excluded: 40000
    expected: '60000.00'
    origin: derived
    note: excluded payments below the limit leave wages unchanged
  - input:
      included: 15000
      excluded: 0
    expected: '15000.00'
    origin: derived
