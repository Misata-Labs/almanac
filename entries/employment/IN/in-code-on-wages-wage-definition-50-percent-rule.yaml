notes: 'Section 2(y) of the Code on Wages, 2019, in force from 21 November 2025, defines wages as basic pay, dearness
  allowance and retaining allowance, and excludes a list of payments: statutory bonus, amenities, employer provident
  fund and pension contributions, conveyance, special-expense reimbursements, house rent allowance, award payments,
  overtime, commission, gratuity and retrenchment or retirement payments. The first proviso caps the exclusions:
  where the payments under clauses (a) to (i) exceed one-half (or another notified share) of all remuneration, the
  excess is deemed remuneration and added to wages. The rule takes the sum of included components and the sum of
  clause (a) to (i) exclusions and returns the wage. Wages so computed drive provident fund, gratuity and bonus
  calculations, so a synthetic salary structure with a low basic pay and large allowances should be checked here.
  The Explanation separately counts remuneration in kind up to 15% of total wages as wages; the second proviso brings
  conveyance, house rent, award pay and overtime back in for equal-wage and payment-of-wages purposes. Gratuity
  and retrenchment payments (clauses (j) and (k)) are outside the cap and should be left out of ``excluded``.'
