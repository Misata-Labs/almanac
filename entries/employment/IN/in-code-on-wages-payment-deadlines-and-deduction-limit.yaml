notes: Chapter III of the Code on Wages, 2019 (in force from 21 November 2025) fixes how and when wages are paid.
  The wage period may be daily, weekly, fortnightly or monthly but never longer than a month (section 16). Wages
  are due at the end of the shift for daily workers, on the last working day before the weekly holiday for weekly
  workers, before the end of the second day after the fortnight for fortnightly workers, and before the expiry of
  the seventh day of the next month for monthly workers (section 17(1)); an employee who is removed, dismissed,
  retrenched or resigns, or loses work on closure, is paid within two working days (section 17(2)). The appropriate
  Government may set other limits. Total authorised deductions in a wage period may not exceed fifty per cent. of
  the wages (section 18(3)). The rule returns the last payment date for a period end (for weekly wages pass the
  last working day as ``period_end``) and the deduction ceiling for a wage amount; separation payments need a working-day
  calendar and are given as a parameter only.
