assumed:
- parameter: distributions.*.parameters.shares
  value: count / group total
  method: derived
  rationale: The table publishes counts; each share is the category count divided by the group's published total,
    rounded to 6 decimals. The builder checks that the categories add up to the published total.
tests:
- statistic: share["non-saudi-male","Elementary occupations"]
  expected: 0.549616
  tolerance: 0.004
- statistic: share["saudi-female","Clerical support workers"]
  expected: 0.258656
  tolerance: 0.004
- statistic: share["total-total","Professionals"]
  expected: 0.141232
  tolerance: 0.004
- statistic: sum_of_shares["saudi-male"]
  expected: 1
  tolerance: 0.002
- statistic: sum_of_shares["saudi-female"]
  expected: 1
  tolerance: 0.002
- statistic: sum_of_shares["saudi-total"]
  expected: 1
  tolerance: 0.002
notes: Workers on the job registered with the General Organization for Social Insurance (GOSI) in the second quarter
  of 2026, by major occupation group (subscriptions, so a person with jobs in two occupations can be counted twice),
  for each nationality and sex group, from Table 3-5 of GASTAT's Register-based Labour Market Statistics workbook
  (GOSI source, preliminary data pulled on 2 August 2026). The register covers private-sector employees and public
  employees under the social insurance rules; civil-service staff, the security and military sectors and domestic
  workers are outside it. Groups are nationality (saudi, non-saudi, total) by sex (male, female, total), keyed as
  saudi-male, saudi-female, saudi-total, non-saudi-male and so on, matching the publication's nine columns. Counts
  sit beside the shares. Neither file carries a licence statement, so the entry stays at license-review; GASTAT's
  website use policy permits reuse, including commercial reuse, with GASTAT acknowledged as the source and changes
  indicated.
