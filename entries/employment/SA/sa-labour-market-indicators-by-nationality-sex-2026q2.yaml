notes: 'Headline Labour Force Survey rates for the second quarter of 2026 from GASTAT''s Labour Market Statistics
  workbook, Table 1: unemployment rate, employment-to-population ratio and labour force participation rate for the
  population aged 15 and over, in per cent. Groups are nationality (saudi, non-saudi, total) by sex (male, female,
  total), keyed as saudi-male, saudi-female, saudi-total, non-saudi-male and so on, matching the publication''s
  nine columns. Use the participation and unemployment rates to assign an employment status to synthetic adults
  by nationality and sex. Neither file carries a licence statement, so the entry stays at license-review; GASTAT''s
  website use policy permits reuse, including commercial reuse, with GASTAT acknowledged as the source and changes
  indicated.'
