notes: Quarterly unemployment rate (per cent, population aged 15 and over) from GASTAT's Labour Force Survey, Table
  2-1 of the Q2 2026 Labour Market Statistics workbook. value is the national rate; the other columns are the nationality
  by sex rates. The 2026 Q1 row is stored in the workbook rounded to one decimal, unlike the other quarters. GASTAT
  notes the collection mode changed over the period (telephone interviews to Q1 2022, mixed personal and telephone
  interviews afterwards, personal interviews only in Q1 2025), so level shifts can reflect method. Neither file
  carries a licence statement, so the entry stays at license-review; GASTAT's website use policy permits reuse,
  including commercial reuse, with GASTAT acknowledged as the source and changes indicated.
