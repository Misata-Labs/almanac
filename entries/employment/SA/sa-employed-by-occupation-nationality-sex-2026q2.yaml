assumed:
- parameter: distributions.*.parameters.shares
  value: percent / 100
  method: derived
  rationale: The table publishes percentage distributions of the employed; shares are those percentages divided
    by 100 and rounded to 6 decimals. The published percentages sit beside the shares, and each group's column totals
    100 in the source.
tests:
- statistic: share["saudi-female","Professionals"]
  expected: 0.347715
  tolerance: 0.004
- statistic: share["non-saudi-male","Elementary occupations"]
  expected: 0.216352
  tolerance: 0.004
- statistic: share["total-total","Managers"]
  expected: 0.047052
  tolerance: 0.004
- statistic: sum_of_shares["saudi-male"]
  expected: 1
  tolerance: 0.002
- statistic: sum_of_shares["saudi-female"]
  expected: 1
  tolerance: 0.002
- statistic: sum_of_shares["saudi-total"]
  expected: 1
  tolerance: 0.002
notes: Percentage distribution of employed persons (Labour Force Survey, Q2 2026) by major occupation group (Saudi
  classification based on ISCO-08), for each nationality and sex group, from Table 3-4 of GASTAT's Labour Market
  Statistics workbook. Groups are nationality (saudi, non-saudi, total) by sex (male, female, total), keyed as saudi-male,
  saudi-female, saudi-total, non-saudi-male and so on, matching the publication's nine columns. 'Undefined' is GASTAT's
  own category for unclassified responses and is kept so shares sum to one. Neither file carries a licence statement,
  so the entry stays at license-review; GASTAT's website use policy permits reuse, including commercial reuse, with
  GASTAT acknowledged as the source and changes indicated.
