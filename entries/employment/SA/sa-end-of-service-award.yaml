notes: 'The end-of-service award a Saudi employer pays at the end of the employment relation (Labour Law Articles
  84 to 87): half a month''s wage for each of the first five years and a month''s wage for each later year, part
  years pro rata, on the last wage. On resignation the worker receives one third of the award after two to five
  years, two thirds after more than five and less than ten years, and the whole award after ten years; the full
  award is also due when the worker leaves for force majeure, or a female worker ends the contract within six months
  of marriage or three months of giving birth. The Ministry''s 2025 awareness guide restates the same bands after
  the 2025 amendments. Monetary vectors are computed from the stated rules; the source publishes no numeric worked
  example.'
