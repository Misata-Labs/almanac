id: sa-end-of-service-award
title: 'Saudi Labour Law end-of-service award: half a month''s wage per year for five years, a month thereafter,
  reduced on resignation'
kind: rule
domain: employment
region: SA
status: license-review
tier: B
valid_from: '2005-09-27'
valid_to: null
tags:
- gcc
- labour-law
- payroll
- end-of-service
- gratuity
- saudi-arabia
use_cases:
- payroll-demo
- hr-demo
- hr-analytics
spec:
  implementation: almanac.rules.gcc_end_of_service
  parameters:
    currency: SAR
    wage_unit: month
    tiers:
    - up_to_years: 5
      per_year: 1/2
    - up_to_years: null
      per_year: '1'
    minimum_years: 0
    resignation:
    - from_years: 2
      from_inclusive: true
      fraction: 1/3
    - from_years: 5
      from_inclusive: false
      fraction: 2/3
    - from_years: 10
      from_inclusive: true
      fraction: '1'
    full_award_exceptions:
    - worker leaves because of force majeure beyond his control
    - female worker ends the contract within six months of marriage or three months of giving birth
    wage_basis: last wage
  vectors:
  - input:
      op: accrual
      year: 5
    expected: 1/2
    origin: source
    note: 'Article 84: half-month wage for each of the first five years'
  - input:
      op: accrual
      year: 6
    expected: '1'
    origin: source
    note: 'Article 84: one-month wage for each of the following years'
  - input:
      op: resignation_fraction
      years: 3
    expected: 1/3
    origin: source
    note: 'Article 85: one third after two to five years'
  - input:
      op: resignation_fraction
      years: 7
    expected: 2/3
    origin: source
    note: 'Article 85: two thirds after more than five but less than ten years'
  - input:
      op: resignation_fraction
      years: 10
    expected: '1'
    origin: source
    note: 'Article 85: the full award after ten years or more'
  - input:
      op: resignation_fraction
      years: '1.5'
    expected: '0'
    origin: derived
    note: no award is stated for resignation before two years
  - input:
      monthly_wage: 10000
      years: 10
      reason: termination
    expected: '75000.00'
    origin: derived
    note: 5 x 0.5 + 5 x 1 = 7.5 months
  - input:
      monthly_wage: 10000
      years: 3
      reason: resignation
    expected: '5000.00'
    origin: derived
    note: 1.5 months x 1/3
  - input:
      monthly_wage: 8000
      years: '7.5'
      reason: resignation
    expected: '26666.67'
    origin: derived
    note: 5 months x 2/3, part year pro rata
