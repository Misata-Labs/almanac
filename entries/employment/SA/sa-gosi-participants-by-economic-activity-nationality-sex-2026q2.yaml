notes: Workers on the job registered with the General Organization for Social Insurance (GOSI) in the second quarter
  of 2026, by economic activity section (ISIC Rev. 4), for each nationality and sex group, from Table 3-8 of GASTAT's
  Register-based Labour Market Statistics workbook (GOSI source, preliminary data pulled on 2 August 2026). The
  register covers private-sector employees and public employees under the social insurance rules; civil-service
  staff, the security and military sectors and domestic workers are outside it. Groups are nationality (saudi, non-saudi,
  total) by sex (male, female, total), keyed as saudi-male, saudi-female, saudi-total, non-saudi-male and so on,
  matching the publication's nine columns. Counts sit beside the shares. Neither file carries a licence statement,
  so the entry stays at license-review; GASTAT's website use policy permits reuse, including commercial reuse, with
  GASTAT acknowledged as the source and changes indicated.
