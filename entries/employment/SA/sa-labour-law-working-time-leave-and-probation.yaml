        unit: hours
        label: Daily working hours in Ramadan (Muslim workers)
      ramadan_weekly_working_hours_max:
        value: 36
        unit: hours
        label: Weekly working hours in Ramadan (Muslim workers)
      rest_break_after_consecutive_hours:
        value: 5
        unit: hours
        label: Consecutive hours of work before a rest break
      rest_break_minimum_minutes:
        value: 30
        unit: minutes
