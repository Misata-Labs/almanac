notes: 'Statutory limits a Saudi payroll or HR system enforces, as the Ministry of Human Resources and Social Development''s
  2025 awareness guide states them after the Labour Law amendments: 8 hours a day and 48 a week (6 and 36 for Muslim
  workers in Ramadan), a 30-minute break after five consecutive hours, overtime paid at the actual hourly wage plus
  50% of the basic hourly wage (the guide''s example: basic 4,000 and actual 6,000 riyals a month give 33.33 riyals
  an overtime hour on a 30-day, 8-hour basis), annual leave of at least 21 days rising to 30 after five consecutive
  years, probation of at most 180 days, and for an indefinite contract ended without valid reason 15 days'' pay
  per year of service with a two-month minimum. Notice periods appear in the guide only as an image and are not
  included; the pre-amendment Labor Law (Article 75) set 60 days for monthly-paid workers.'
