      overtime_premium_percent_of_basic_hourly_wage:
        value: 50
        unit: percent
        label: 'Overtime: actual hourly wage plus 50% of basic hourly wage'
      compensatory_leave_max_days_per_year:
        value: 30
        unit: days
        label: Compensatory leave for overtime per year
      annual_leave_min_days:
        value: 21
        unit: days
        label: Annual leave
      annual_leave_min_days_after_5_years:
        value: 30
        unit: days
        label: Annual leave after 5 consecutive years
