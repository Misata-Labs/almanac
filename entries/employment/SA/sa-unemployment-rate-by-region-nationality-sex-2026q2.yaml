notes: Unemployment rate in per cent for each of the 13 administrative regions and the Kingdom, by nationality and
  sex, from Table 2-4 of GASTAT's Q2 2026 Labour Market Statistics workbook. Region names are GASTAT's English labels.
  Groups are nationality (saudi, non-saudi, total) by sex (male, female, total), keyed as saudi-male, saudi-female,
  saudi-total, non-saudi-male and so on, matching the publication's nine columns. Small cells (for example non-Saudi
  women in Al-Baha) can be zero or volatile because they rest on few survey respondents. Neither file carries a
  licence statement, so the entry stays at license-review; GASTAT's website use policy permits reuse, including
  commercial reuse, with GASTAT acknowledged as the source and changes indicated.
