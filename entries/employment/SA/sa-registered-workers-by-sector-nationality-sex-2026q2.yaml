notes: Registered workers in the second quarter of 2026 by sector, nationality and sex, from Table 2-3 of GASTAT's
  Register-based Labour Market Statistics workbook. Categories are 'sector|nationality|sex'. Government means staff
  under the civil service regulations; public means government-sector staff registered with GOSI; private means
  GOSI-registered private-sector employees; domestic workers come from the National Information Center with MHRSD
  as data owner and are all non-Saudi. The security and military sectors and anyone not in these registers are excluded.
  GOSI and MHRSD figures are preliminary. Neither file carries a licence statement, so the entry stays at license-review;
  GASTAT's website use policy permits reuse, including commercial reuse, with GASTAT acknowledged as the source
  and changes indicated.
