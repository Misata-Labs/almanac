assumed:
- parameter: distributions.*.parameters.shares
  value: percent / 100
  method: derived
  rationale: The table publishes percentage distributions of the employed; shares are those percentages divided
    by 100 and rounded to 6 decimals. The published percentages sit beside the shares, and each group's column totals
    100 in the source.
