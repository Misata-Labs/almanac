notes: Percentage distribution of employed persons (Labour Force Survey, Q2 2026) by economic activity section (Saudi
  classification based on ISIC), for each nationality and sex group, from Table 3-5 of GASTAT's Labour Market Statistics
  workbook. Groups are nationality (saudi, non-saudi, total) by sex (male, female, total), keyed as saudi-male,
  saudi-female, saudi-total, non-saudi-male and so on, matching the publication's nine columns. 'Undefined' is GASTAT's
  own category for unclassified responses and is kept so shares sum to one. Neither file carries a licence statement,
  so the entry stays at license-review; GASTAT's website use policy permits reuse, including commercial reuse, with
  GASTAT acknowledged as the source and changes indicated.
