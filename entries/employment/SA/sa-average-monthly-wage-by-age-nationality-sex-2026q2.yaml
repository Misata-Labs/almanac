notes: Average monthly wage in Saudi riyals per paid employee in main work, by five-year age group, nationality
  and sex, from Table 6-1 of GASTAT's Q2 2026 Labour Market Statistics workbook (Labour Force Survey estimates covering
  paid employees and paid apprentices who reported their wage). Groups are nationality (saudi, non-saudi, total)
  by sex (male, female, total), keyed as saudi-male, saudi-female, saudi-total, non-saudi-male and so on, matching
  the publication's nine columns. These are survey means, so use them as the centre of a wage distribution, not
  as a cap or floor. Neither file carries a licence statement, so the entry stays at license-review; GASTAT's website
  use policy permits reuse, including commercial reuse, with GASTAT acknowledged as the source and changes indicated.
