assumed:
- parameter: distributions.*.parameters.shares
  value: count / sum of counts within each group
  method: derived
  rationale: The publisher gives counts; shares are each count over the group total. The 'not stated' (غير مبين)
    age row is kept as 'Not stated'.
- parameter: population covered
  value: Kuwaiti workers in the government sector
  method: derived
  rationale: The report's default view selects the government sector and Kuwaiti nationality; the male and female
    totals equal the Kuwait row of the dashboard's government-sector chart.
