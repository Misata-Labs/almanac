notes: 'Workers in Kuwait as at 31 March 2026, all sectors, by nationality for the ten largest nationalities (India,
  Egypt, Kuwait, Bangladesh, Nepal, Syria, Pakistan, the Philippines, Jordan, Sri Lanka) and all others, for men
  and women, from the Central Statistical Bureau''s Labour Market Information System. The Labour Market Information
  System states no reuse licence (its footer reads ''all rights reserved''), so the entry stays at license-review.
  The dashboard always shows the latest quarter: when the CSB publishes the next quarter the page changes and this
  entry''s evidence hash will no longer match, which is the signal to rebuild it.'
