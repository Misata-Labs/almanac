  value: 1929
  unit: currency:KWD
  snippet: 'data: [{name: ''كويتي-ذكر '', y: 1929}'
  source_license: unstated
  content_sha256: 9d8064a311266560305acc7962316ec34a27dee57048275831a8b8a0df818d4e
  role: primary
- publisher: Central Statistical Bureau, State of Kuwait (Labour Market Information System)
  title: CSB Labour Market Information System, main dashboard (HTML, data as at 31 March 2026)
  url: https://lmis.csb.gov.kw/MainDashBoard
  accessed_at: '2026-11-09'
  locator: chart 'average monthly income in the private sector by nationality'
  value: 1681
  unit: currency:KWD
