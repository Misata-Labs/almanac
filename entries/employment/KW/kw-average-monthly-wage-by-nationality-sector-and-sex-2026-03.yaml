assumed:
- parameter: currency
  value: KWD
  method: assumed
  rationale: The charts title the measure average monthly income (متوسط الدخل الشهري) and print no unit; the figures
    are read as Kuwaiti dinars per month, the national currency.
- parameter: category labels
  value: English renderings of the dashboard's Arabic labels, with the Arabic labels kept alongside
  method: assumed
  rationale: The Labour Market Information System publishes Arabic labels only; the English keys are translations
    made for this entry and change no value.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 8
  tolerance: 0
- statistic: max[average_monthly_wage_kwd]
  expected: 1929
  tolerance: 0
notes: 'Average monthly wage of workers in Kuwait as at 31 March 2026 for Kuwaiti and non-Kuwaiti men and women
  in the government sector and in the private sector, keyed sector|nationality|sex, from the Labour Market Information
  System''s dashboard charts (whole dinars as published). Combine with the nationality-by-sector counts in kw-workers-by-nationality-group-sector-and-sex-2026-03
  to draw synthetic salaries. The Labour Market Information System states no reuse licence (its footer reads ''all
  rights reserved''), so the entry stays at license-review. The dashboard always shows the latest quarter: when
  the CSB publishes the next quarter the page changes and this entry''s evidence hash will no longer match, which
  is the signal to rebuild it.'
