assumed:
- parameter: distributions[*].parameters.shares
  value: count / total
  method: derived
  rationale: Thousands employed in each ISIC Rev.4 section group divided by the sum over the groups for that sex,
    kept only where the sum is within one percent of the published ECO_ISIC4_TOTAL.
