assumed:
- parameter: distributions.*.parameters.shares
  value: count / sum of counts within each group
  method: derived
  rationale: The publisher gives counts; shares are each count over the group total.
- parameter: category labels
  value: English renderings of the dashboard's Arabic labels, with the Arabic labels kept alongside
  method: assumed
  rationale: The Labour Market Information System publishes Arabic labels only; the English keys are translations
    made for this entry and change no value.
