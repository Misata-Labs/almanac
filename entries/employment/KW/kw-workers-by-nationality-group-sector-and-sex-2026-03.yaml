notes: 'Workers in Kuwait as at 31 March 2026 by nationality group (Kuwait, other GCC, other Arab, non-Arab Asian,
  non-Arab African, Europe, North and South America, Australia and New Zealand, not stated) for men and women, across
  all sectors and separately for the government and private sectors, from the charts of the Central Statistical
  Bureau''s Labour Market Information System, which compiles administrative records. All-sector counts exceed government
  plus private: the remainder is employment outside those two sectors (the system reports family-sector employment
  in separate tables). The Labour Market Information System states no reuse licence (its footer reads ''all rights
  reserved''), so the entry stays at license-review. The dashboard always shows the latest quarter: when the CSB
  publishes the next quarter the page changes and this entry''s evidence hash will no longer match, which is the
  signal to rebuild it.'
