assumed:
- parameter: distributions[*].parameters.shares
  value: persons in each status divided by the three statuses' total
  method: derived
  rationale: The file publishes seasonally adjusted population levels per status; in employment plus unemployed
    equals the economically active level, and the three statuses partition the age group's population. Shares are
    the levels divided by their sum.
tests:
- statistic: share[25-34,in_employment]
  expected: 0.83907
  tolerance: 0.003
- statistic: share[65+,economically_inactive]
  expected: 0.873644
  tolerance: 0.003
- statistic: share[16-17,unemployed]
  expected: 0.07665
  tolerance: 0.003
- statistic: sum_of_shares[35-49]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[16+]
  expected: 1
  tolerance: 0.0001
notes: Economic activity status of the UK household population given age group, from the Labour Force Survey levels
  for the rolling quarter February to April 2025 (all adults, seasonally adjusted) in edition PWT24 of the ONS labour-market
  dataset. The six age groups partition people aged 16 and over; 16-64 and 16+ are the working-age and whole-population
  totals. Person counts sit beside the shares. The LFS is a sample survey weighted to population totals. The labour-market
  metadata carries no licence field; ONS publishes its datasets under the Open Government Licence v3.0, as the cpih01
  metadata states.
