notes: The sickness absence rate is the percentage of working hours lost to sickness or injury among workers in
  the UK, from the ONS Labour Force Survey, with the number of working days lost (millions), days lost per worker
  and the rate for men and women, one point per calendar year (Tables 1, 2, 3 and 6 of the 2025 workbook). Years
  1995 to 2025 are kept as published. ONS publishes the dataset under the Open Government Licence v3.0 and labels
  it official statistics in development.
