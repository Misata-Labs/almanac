notes: 'The statutory limit on working time in Great Britain: an adult worker''s working time, including overtime,
  may not exceed an average of 48 hours for each seven days over a 17-week reference period (extendable to 52 weeks
  by agreement, and adults may opt out in writing); a young worker under 18 may not work more than 8 hours a day
  or 40 hours a week, with no averaging. Values come from GOV.UK''s guide and from regulations 4 and 5A of the Working
  Time Regulations 1998 as legislation.gov.uk publishes them in XML. The age_band_rates rule returns the weekly
  limit for an age. Exceptions for particular occupations are not modelled. The entry stays at license-review because
  the legislation.gov.uk XML carries no licence statement, although the site publishes legislation under the Open
  Government Licence v3.0. Sources are the GOV.UK content API''s JSON for each page, stable between editorial updates;
  GOV.UK publishes its content under the Open Government Licence v3.0.'
