notes: Earnings thresholds above which employers deduct student loan repayments through PAYE in the 2026 to 2027
  tax year, by plan type (Plan 1, 2, 4 and 5 at 9% of earnings above the threshold, Postgraduate Loan at 6%), with
  the annual, monthly and weekly figures HMRC gives employers. GOV.UK's borrower guide confirms the rates and supplies
  the interest rates and the worked example kept in the parameters. Sources are the GOV.UK content API's JSON for
  each page, stable between editorial updates; GOV.UK publishes its content under the Open Government Licence v3.0.
