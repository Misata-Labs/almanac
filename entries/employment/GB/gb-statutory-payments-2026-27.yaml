- parameter: rows[*].earnings_threshold_weekly
  value: 129
  method: derived
  rationale: DWP prints the £129.00 earnings threshold under each statutory parental payment and GOV.UK states it
    for SMP; the same figure is carried on every parental payment row. SSP has no earnings threshold in the cited
    sources and is recorded as null.
