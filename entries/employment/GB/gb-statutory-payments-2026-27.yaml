notes: 'Weekly statutory payment rates for the 2026 to 2027 tax year: Statutory Maternity, Adoption, Paternity,
  Shared Parental, Parental Bereavement and Neonatal Care Pay at £194.32 or 90% of average weekly earnings, whichever
  is lower (SMP and SAP pay 90% of earnings for the first 6 weeks; SMP runs up to 39 weeks and the SMP rate applies
  from 5 April 2026); Statutory Sick Pay at £123.25 or 80% of average weekly earnings, whichever is lower, for up
  to 28 weeks; and Maternity Allowance at the same standard rate with its £30 earnings threshold. The employer recovery
  percentages are kept as parameters. Sources are the GOV.UK content API''s JSON for each page, stable between editorial
  updates; GOV.UK publishes its content under the Open Government Licence v3.0.'
