notes: 'Gross hourly pay of employee jobs in the April 2025 Annual Survey of Hours and Earnings, workplace-based,
  from the ONS dataset NM_99_1 served by Nomis: the number of employee jobs, the median, the mean and the 10th,
  25th, 75th and 90th percentiles, for each combination of area and worker group. Areas are the United Kingdom,
  Great Britain, England, Wales, Scotland, Northern Ireland and the nine English regions (15 in all); groups are
  all employees, men, women, full-time and part-time. Rows are keyed ''<ONS geography code>:<group>'', for example
  K02000001:all. 1 cells that ONS suppresses as statistically unreliable are null. The 2025 figures are the latest
  Nomis serves; ONS also publishes 2026 provisional ASHE tables only as ZIP archives of spreadsheets, which the
  verifier cannot read. valid_from and valid_to bound the survey year; the ASHE reference date is in April. ONS
