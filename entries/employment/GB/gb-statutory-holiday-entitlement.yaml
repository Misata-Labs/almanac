notes: 'Statutory paid annual leave in Great Britain: 4 weeks under regulation 13 of the Working Time Regulations
  1998 plus 1.6 weeks under regulation 13A, 5.6 weeks in all, capped at 28 days, so a five-day-week worker gets
  28 days and a part-timer gets 5.6 times their working days. Irregular-hours and part-year workers accrue 12.07%
  of the hours worked in each pay period, rounded up from half an hour, for leave years from 1 April 2024. Values
  are read from GOV.UK''s holiday entitlement guide and from the regulations as legislation.gov.uk publishes them.
  The entry is a reference table; it does not compute an individual''s entitlement. It stays at license-review because
  the legislation.gov.uk XML carries no licence statement, although the site publishes legislation under the Open
  Government Licence v3.0. Sources are the GOV.UK content API''s JSON for each page, stable between editorial updates;
  GOV.UK publishes its content under the Open Government Licence v3.0.'
