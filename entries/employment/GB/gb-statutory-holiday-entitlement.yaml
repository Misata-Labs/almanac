spec:
  implementation: almanac.rules.lookup_table
  parameters:
    rows:
      statutory_leave_weeks:
        value: 5.6
        unit: weeks per leave year
        basis: regulation 13 (4 weeks) plus regulation 13A (1.6 weeks)
      basic_leave_weeks:
        value: 4
        unit: weeks per leave year
        basis: regulation 13
      additional_leave_weeks:
        value: 1.6
        unit: weeks per leave year
        basis: regulation 13A, leave years beginning on or after 1 April 2009
      maximum_statutory_days:
        value: 28
        unit: days per leave year
        basis: cap on the aggregate of regulations 13 and 13A; a 5-day week gives 28 days
      irregular_hours_accrual_percent:
        value: 12.07
        unit: percent of hours worked in a pay period
        basis: irregular-hours and part-year workers, leave years from 1 April 2024
      basic_rate_weeks:
        value: 1.6
        unit: weeks per leave year
        basis: 'regular-hours workers: paid at basic rather than normal pay'
    worked_example:
      hours_worked_in_pay_period: 30
      accrued_hours_before_rounding: 3.621
      accrued_hours: 4
  vectors:
  - input:
      key: statutory_leave_weeks
      column: value
    expected: 5.6
    origin: source
  - input:
