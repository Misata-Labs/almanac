assumed:
- parameter: valid_from
  value: '2009-04-01'
  method: derived
  rationale: Regulation 13A gives 1.6 weeks of additional leave for leave years beginning on or after 1 April 2009,
    the date from which the 5.6-week total applies; the 12.07% accrual method for irregular-hours workers applies
    only to leave years beginning on or after 1 April 2024, as its row states.
