notes: 'The four levels of the Standard Occupational Classification 2020 read from the ONS Volume 1 workbook (SOC2020
  descriptions sheet): 9 major groups (one digit), 26 sub-major groups (two digits), 104 minor groups (three digits)
  and 412 unit groups (four digits), each mapped to its title. Unit group codes are the keys used by ASHE and other
  ONS occupation tables, so a synthetic job record can carry a real SOC code and title. The workbook''s descriptive
  text is not reproduced. ONS publishes the classification under the Open Government Licence v3.0.'
