assumed:
- parameter: rows[*].soc_2020_major_group
  value: 1 to 9 in table order
  method: derived
  rationale: The workbook lists the nine SOC 2020 major groups in classification order without their codes; the
    code is the row's position.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 9
  tolerance: 0
- statistic: value[Elementary Occupations,days_lost_per_worker_2025]
  expected: 5.1
  tolerance: 1.0e-09
- statistic: max[days_lost_per_worker_2025]
  expected: 8.1
  tolerance: 1.0e-09
- statistic: value["Managers, Directors and Senior Officials",rate_2024]
  expected: 1.3
  tolerance: 1.0e-09
- statistic: max[rate_2024]
  expected: 2.9
  tolerance: 1.0e-09
notes: Percentage of working hours lost to sickness or injury in 2025, 2024 and 2023 and working days lost per worker
  in 2025 for each of the nine SOC 2020 major occupation groups (Tables 16 SOC20 and 16b SOC20 of the ONS sickness
  absence workbook). Rows are keyed by the group title as the workbook spells it; the soc_2020_major_group column
  gives the one-digit code in the order the table lists the groups, which follows the classification. ONS publishes
  the dataset under the Open Government Licence v3.0 and labels it official statistics in development.
