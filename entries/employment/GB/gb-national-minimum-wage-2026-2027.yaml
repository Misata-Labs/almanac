assumed:
  - parameter: tables[*].from
    value: "1 April of the year named in the table row"
    method: derived
    rationale: The table labels rows 'April 2026' and 'April 2027'; GOV.UK states that rates change on 1 April every year, so each table takes effect on the first of that month.
tests:
  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: count, expected: 2, tolerance: 0}
  - {statistic: "rate[21 and over,2026-04-01]", expected: 12.71, tolerance: 0}
  - {statistic: "rate[Apprentice,2027-04-01]", expected: 8.31, tolerance: 0}
notes: |
  Hourly National Living Wage (21 and over) and National Minimum Wage rates (18 to 20, under
  18, apprentice) from April 2026 and April 2027 as GOV.UK publishes them. The apprentice rate
  applies to apprentices under 19, or 19 and over in the first year of their apprenticeship;
  a caller passes category Apprentice for those workers. Source is the GOV.UK content API's
  JSON for the page; GOV.UK publishes its content under the Open Government Licence v3.0.
