id: gb-national-minimum-wage-2026-2027
title: United Kingdom National Minimum Wage and National Living Wage hourly rates from April 2026 and April 2027
kind: rule
domain: employment
region: GB
status: verified
tier: A
valid_from: 2026-04-01
valid_to: null
tags: [minimum-wage, living-wage, payroll, hourly-rates]
use_cases: [payroll-demo, hr-analytics, workforce-planning]
spec:
  implementation: almanac.rules.age_band_rates
  parameters:
    currency: GBP
    unit: per hour
    bands:
      - {name: "21 and over", min_age: 21}
      - {name: "18 to 20", min_age: 18, max_age: 20}
      - {name: "Under 18", max_age: 17}
    categories: [Apprentice]
    tables:
      - {from: "2026-04-01", rates: {"21 and over": 12.71, "18 to 20": 10.85, "Under 18": 8, "Apprentice": 8}}
      - {from: "2027-04-01", rates: {"21 and over": 13.21, "18 to 20": 11.27, "Under 18": 8.31, "Apprentice": 8.31}}
  vectors:
    - {input: {age: 21, "on": "2026-04-01"}, expected: 12.71, origin: source}
    - {input: {age: 19, "on": "2026-06-15"}, expected: 10.85, origin: source}
    - {input: {age: 17, "on": "2026-06-15"}, expected: 8, origin: source}
    - {input: {age: 21, "on": "2026-06-15", category: Apprentice}, expected: 8, origin: source, note: "GOV.UK example: an apprentice aged 21 in the first year is entitled to £8"}
    - {input: {age: 35, "on": "2027-04-01"}, expected: 13.21, origin: source}
    - {input: {age: 18, "on": "2027-04-01"}, expected: 11.27, origin: source}
    - {input: {age: 16, "on": "2027-05-01"}, expected: 8.31, origin: source}
    - {input: {age: 25, "on": "2027-03-31"}, expected: 12.71, origin: derived, note: the April 2027 table is not yet in force}
