notes: Workers covered by the Social Insurance Organization's private-sector scheme in 2023, by monthly wage band
  in Bahraini dinars, for Bahraini and non-Bahraini men and women. The bands are those of the source (Less than
  50, 50 - 99, ... 1,000 - 1,499, 1,500 +), with doubled spaces in the labels collapsed. Coverage is the private
  sector scheme only; government employees are not included. The Bahrain open data portal publishes no licence for
  this dataset (its catalogue licence field is empty), so the entry stays at license-review until the Information
  & eGovernment Authority's reuse terms are confirmed.
