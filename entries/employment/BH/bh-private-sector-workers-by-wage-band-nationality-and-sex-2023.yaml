assumed:
- parameter: distributions.*.parameters.shares
  value: count / sum of counts within each group
  method: derived
  rationale: The publisher gives counts; shares are each count over the group total.
- parameter: distributions.*.parameters.bands_bhd
  value: low and high Bahraini dinar bounds read from each band label
  method: derived
  rationale: The source labels bands as text ('50 - 99', '1,500 +'); the numeric bounds restate those labels so
    a generator can draw a wage inside the band. 'Less than 50' becomes 0 to 49 and the open top band has no upper
    bound.
tests:
- statistic: share["Bahraini|Male","300 - 349"]
  expected: 0.21708834
  tolerance: 0.005
- statistic: sum_of_shares["Bahraini|Male"]
  expected: 1
  tolerance: 1.0e-06
- statistic: share["Bahraini|Female","300 - 349"]
  expected: 0.17520565
  tolerance: 0.005
- statistic: sum_of_shares["Bahraini|Female"]
  expected: 1
  tolerance: 1.0e-06
- statistic: share["Non-Bahraini|Male","50 - 99"]
  expected: 0.37824577
  tolerance: 0.005
- statistic: sum_of_shares["Non-Bahraini|Male"]
  expected: 1
