notes: Workers covered by the Social Insurance Organization's private-sector scheme in 2023 by economic activity
  (the source's ISIC Rev. 3 style sections, plus 'Non-classified records' and 'Temporarily additional activities'
  as published), for Bahraini and non-Bahraini men and women, with Arabic activity names from the same export. Private-sector
  coverage only. The Bahrain open data portal publishes no licence for this dataset (its catalogue licence field
  is empty), so the entry stays at license-review until the Information & eGovernment Authority's reuse terms are
  confirmed.
