notes: Small company test of section 2(85) of the Companies Act, 2013 (India Code text as on 1 September 2026).
  A company other than a public company is small if its paid-up share capital does not exceed fifty lakh rupees
  and its turnover for the preceding financial year does not exceed two crore rupees, or such higher amounts as
  are prescribed up to ten crore and one hundred crore rupees; holding and subsidiary companies, section 8 companies
  and companies under a special Act are never small. The Companies (Specification of Definitions Details) Amendment
  Rules, 2022 (G.S.R. 700(E), 15 September 2022) prescribe ₹4 crore and ₹40 crore, the latest amendment India Code
  holds. Any later amendment to rule 2(1)(t) would be published by the Ministry of Corporate Affairs or the eGazette,
  neither of which could be reached; check before relying on these ceilings for dates after 2025. Amounts are in
  rupees.
