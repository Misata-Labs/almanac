notes: Outcome of the 9,166 CIRPs admitted up to 30 June 2026 by the class of applicant that initiated them, from
  Table 4 of IBBI's April-June 2026 newsletter workbook, with the realisation by creditors in resolved cases as
  a percentage of liquidation value and of admitted claims, and the average days from commencement to closure. Rows
  are keyed by initiator; 'total' is the all-India row. Tier A (.xlsx); no licence stated, so license-review.
