id: in-msme-classification-criteria
title: India MSME classification by investment and turnover ceilings, 2020 criteria and the revision from 1 April
  2025
kind: rule
domain: company
region: IN
status: license-review
tier: B
valid_from: '2020-07-01'
valid_to: null
tags:
- india
- msme
- compliance
- company-size
use_cases:
- company-generation
- kyb-onboarding
- loan-pricing
- credit-risk
