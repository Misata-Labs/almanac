spec:
  implementation: almanac.rules.in_msme
  parameters:
    currency: INR
    unit: rupees
    exports_excluded_from_turnover: true
    schedules:
    - from: '2020-07-01'
      notification: S.O. 2119(E), 26 June 2020
      ceilings:
        micro:
          investment: 10000000
          turnover: 50000000
        small:
          investment: 100000000
          turnover: 500000000
        medium:
          investment: 500000000
          turnover: 2500000000
    - from: '2025-04-01'
      notification: S.O. 1364(E), 21 March 2025
      ceilings:
        micro:
          investment: 25000000
          turnover: 100000000
        small:
          investment: 250000000
          turnover: 1000000000
        medium:
          investment: 1250000000
          turnover: 5000000000
  vectors:
  - input:
      investment: 25000000
      turnover: 100000000
      'on': '2025-06-30'
    expected: micro
    origin: source
    note: at the 2025 micro ceilings of Rs. 2.5 crore and Rs. 10 crore
  - input:
      investment: 1250000000
      turnover: 5000000000
      'on': '2025-06-30'
    expected: medium
    origin: source
  - input:
      investment: 10000000
      turnover: 50000000
      'on': '2021-01-01'
    expected: micro
    origin: source
    note: at the 2020 micro ceilings
  - input:
      investment: 10000000
      turnover: 60000000
      'on': '2021-01-01'
    expected: small
    origin: source
    note: crossing either ceiling moves the enterprise to the next higher category
  - input:
      investment: 20000000
      turnover: 80000000
      'on': '2025-03-31'
    expected: small
    origin: derived
  - input:
      investment: 20000000
      turnover: 80000000
      'on': '2025-04-01'
    expected: micro
    origin: derived
    note: the same enterprise under the revised ceilings
  - input:
      investment: 300000000
      turnover: 500000000
      'on': '2026-01-01'
    expected: medium
    origin: derived
  - input:
      investment: 1000000000
      turnover: 6000000000
      'on': '2026-01-01'
    expected: not_msme
    origin: derived
