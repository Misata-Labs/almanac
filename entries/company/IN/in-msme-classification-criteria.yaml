notes: 'Classification of enterprises under section 7 of the Micro, Small and Medium Enterprises Development Act,
  2006. From 1 July 2020 (S.O. 2119(E)) an enterprise is micro if investment in plant and machinery or equipment
  does not exceed ₹1 crore and turnover ₹5 crore, small up to ₹10 crore and ₹50 crore, and medium up to ₹50 crore
  and ₹250 crore. The Ministry of MSME''s site records the revision applicable from 1 April 2025, citing S.O. 1364(E)
  of 21 March 2025: micro up to ₹2.5 crore and ₹10 crore, small up to ₹25 crore and ₹100 crore, medium up to ₹125
  crore and ₹500 crore. The criteria are composite: an enterprise exceeding either ceiling of its category moves
  to the next one, so the rule returns the smallest category whose ceilings it meets on both, or not_msme above
  the medium ceilings. Exports are excluded from turnover, and all GSTINs under one PAN count as one enterprise.
  The 2025 notification PDF itself is hosted on dcmsme.gov.in, which could not be reached; the 2025 ceilings are
  cited from the Ministry''s content-management record (JSON), whose text matched on repeated fetches. Amounts are
  in rupees (1 crore = 10,000,000).'
