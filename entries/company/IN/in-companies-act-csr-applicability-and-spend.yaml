id: in-companies-act-csr-applicability-and-spend
title: 'India Companies Act s 135 CSR: applies at ₹500 crore net worth, ₹1,000 crore turnover or ₹5 crore profit;
  spend 2%'
kind: rule
domain: company
region: IN
status: license-review
tier: B
valid_from: '2021-01-22'
valid_to: null
tags:
- india
- companies-act
- csr
- compliance
use_cases:
- company-generation
- kyb-onboarding
- compliance-demo
- financial-reporting
- audit-demo
spec:
  implementation: almanac.rules.in_companies_act
  parameters:
    formula: csr
    currency: INR
    applicability_thresholds:
      net_worth: 5000000000
      turnover: 10000000000
      net_profit: 50000000
    applicability_year: immediately preceding financial year
    spend_percent: 2
    averaging_years: 3
    committee_exemption_ceiling: 5000000
    unspent_transfer_to_schedule_vii_fund_months: 6
    ongoing_project_unspent_account_transfer_days: 30
    penalty: twice the amount to be transferred or one crore rupees, whichever is less
  vectors:
  - input:
      net_worth: 1000000000
      turnover: 2000000000
      net_profit: 50000000
      preceding_net_profits:
      - 50000000
      - 40000000
      - 30000000
    expected:
      applies: true
      obligation: '800000.00'
      committee_required: false
    origin: source
    note: net profit of rupees five crore meets the threshold; 2% of the three-year average
  - input:
      net_worth: 9000000000
      turnover: 20000000000
      net_profit: 400000000
      preceding_net_profits:
      - 400000000
      - 300000000
      - 200000000
    expected:
      applies: true
      obligation: '6000000.00'
      committee_required: true
    origin: derived
    note: an obligation above fifty lakh needs a CSR committee
  - input:
      net_worth: 4990000000
      turnover: 9990000000
      net_profit: 40000000
      preceding_net_profits:
      - 40000000
      - 40000000
      - 40000000
    expected:
      applies: false
      obligation: '0.00'
      committee_required: false
    origin: derived
  - input:
      net_worth: 6000000000
      turnover: 1000000000
      net_profit: 10000000
      preceding_net_profits:
      - 10000000
      - 20000000
      - 30000000
    expected:
      applies: true
      obligation: '400000.00'
      committee_required: false
    origin: derived
    note: obligation up to fifty lakh needs no committee
  - input:
      net_worth: 100000000
      turnover: 10000000000
      net_profit: -10000000
      preceding_net_profits:
      - -50000000
      - 10000000
      - 10000000
    expected:
      applies: true
      obligation: '0.00'
      committee_required: false
    origin: derived
    note: a negative average gives no spend
  - input:
      net_worth: 6000000000
      turnover: 1000000000
      net_profit: 100000000
      preceding_net_profits:
      - 100000000
    expected:
      applies: true
      obligation: '2000000.00'
      committee_required: false
    origin: derived
    note: a company with fewer than three years uses the years it has
