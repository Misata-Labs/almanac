notes: Corporate social responsibility under section 135 of the Companies Act, 2013 (India Code text as on 1 September
  2026). A company with net worth of ₹500 crore or more, turnover of ₹1,000 crore or more or net profit of ₹5 crore
  or more in the immediately preceding financial year must spend in each year at least 2% of its average net profits
  of the three immediately preceding financial years (or the years since incorporation, if fewer), net profit being
  computed under section 198. A CSR committee of the Board is needed unless the amount to be spent does not exceed
  ₹50 lakh (sub-section (9), in force from 22 January 2021, which is why the entry starts on that date). Unspent
  amounts go to a Schedule VII fund within six months of the year end, or for ongoing projects to an Unspent CSR
  Account within thirty days; default draws a penalty of twice the amount or ₹1 crore, whichever is less. The rule
  returns applicability, the minimum spend (never negative) and whether a committee is required; amounts in rupees.
