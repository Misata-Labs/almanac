notes: 'SEBI''s definition of the equity investment universe for mutual fund schemes, from section II of the circular
  on categorisation and rationalisation of mutual fund schemes dated 6 October 2017: large cap is the 1st to 100th
  company by full market capitalisation, mid cap the 101st to 250th and small cap the 251st onwards. Funds use the
  single list AMFI prepares every six months from end-June and end-December data, averaging across exchanges where
  a stock is listed on more than one, and rebalance within a month of each update. SEBI''s Master Circular for Mutual
  Funds of 20 March 2026 restates the same ranks in paragraph 3.9 (applying them to entities, so listed REITs are
  ranked too); that 7 MB file could not be downloaded reliably within the verifier''s time limit, so the 2017 circular
  is cited. Use the rule to label generated listed companies or fund holdings. SEBI states no reuse licence for
  the document.'
