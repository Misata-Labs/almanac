notes: 'Status of the 9,166 corporate insolvency resolution processes admitted under the Insolvency and Bankruptcy
  Code from its commencement to 30 June 2026, from Table 1 of the data workbook behind IBBI''s quarterly newsletter
  for April-June 2026: closed by withdrawal under section 12A, closed on appeal, review or settlement, closed by
  an approved resolution plan, closed by a liquidation order, or still ongoing. Shares are counts divided by 9,166.
  The workbook is an .xlsx file, so the entry is tier A; IBBI states no licence, so it stays at license-review.'
