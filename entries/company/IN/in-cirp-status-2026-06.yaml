assumed:
- parameter: distribution.parameters.shares
  value: count / total, rounded to six decimals
  method: derived
  rationale: The source publishes counts (CIRPs); each share is the category count divided by the sum of the listed
    counts (9166). The counts are kept in distribution.parameters.counts.
