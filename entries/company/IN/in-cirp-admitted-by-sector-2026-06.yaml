assumed:
- parameter: distribution.parameters.shares
  value: count / total, rounded to six decimals
  method: derived
  rationale: The source publishes counts (CIRPs admitted); each share is the category count divided by the sum of
    the listed counts (9166). The counts are kept in distribution.parameters.counts.
tests:
- statistic: share[manufacturing]
  expected: 0.364608
  tolerance: 0.004
- statistic: share[real-estate-renting-and-business-activities]
  expected: 0.217761
  tolerance: 0.004
- statistic: share[construction]
  expected: 0.123173
  tolerance: 0.004
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.002
notes: Sector of the corporate debtor for the 9,166 CIRPs admitted up to 30 June 2026, from Table 3 of IBBI's April-June
  2026 newsletter workbook. Only the eight top-level sector groups are used; the workbook also splits manufacturing
  and real estate/business activities into sub-sectors. IBBI bases the classification on the debtor's corporate
  identification number. Shares are counts divided by 9,166. Tier A (.xlsx); no licence stated, so license-review.
