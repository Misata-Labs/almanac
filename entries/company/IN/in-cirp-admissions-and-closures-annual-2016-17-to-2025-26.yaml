notes: 'Flow of corporate insolvency resolution processes per Indian financial year (April to March) from Table
  2 of IBBI''s April-June 2026 newsletter workbook: CIRPs open at the start, admitted during the year (the series
  value), closed by appeal/review/settlement, by withdrawal under section 12A, by approval of a resolution plan
  or by commencement of liquidation, and open at the end. 2016-17 covers December 2016 to March 2017; the April-June
  2026 quarter in the source is omitted as a partial year. Each year''s flows balance. Tier A (.xlsx); no licence
  stated, so license-review.'
