notes: Registered company insolvencies in England and Wales each month from January 2025 to October 2026, from the
  long-run CSV of the Insolvency Service's October 2026 release. The value is the total not seasonally adjusted;
  the columns split it into compulsory liquidations, creditors' voluntary liquidations (CVLs), administrations,
  company voluntary arrangements (CVAs) and administrative receiverships, and add the seasonally adjusted total
  and the 12-month rolling insolvency rate per 10,000 companies. CVLs were 77.4 per cent of 2025 insolvencies. The
  latest months are provisional and are revised in later releases. Scotland and Northern Ireland, published in the
  same file, are left out. The file states the Open Government Licence 3.0.
