notes: SIC 2007 sections recorded on the UK register in 2025-26, from Table C2 of Companies House's Companies register
  activities release (all corporate body types). A corporate body may record up to four SIC codes, so the counts
  are codes, not companies; the shares are therefore the industry mix of declared activities, which is what a generator
  needs to assign a section to a synthetic UK company. Section X is 'Code not elsewhere classified'. Published on
  GOV.UK under the Open Government Licence v3.0.
