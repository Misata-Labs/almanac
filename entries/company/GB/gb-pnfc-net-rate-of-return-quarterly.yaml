notes: 'Net rate of return (net operating surplus over net capital employed, percent) of UK private non-financial
  corporations, quarterly, the latest 24 quarters, from the ONS profitability of UK companies release. Columns:
  gross_rate_of_return_percent is series LRWV (PNFCs gross rate of return (%)); manufacturing_net_rate_of_return_percent
  is series LRYC (Manufacturing PNFCs net rate of return (%) SA); services_net_rate_of_return_percent is series
  LRYQ (Service sector PNFCs net rate of return (%) SA). Series LRWW (PNFCs net rate of return (%)) from ONS dataset
  PROF, read from the current endpoint, whose bytes change at each release; release date 2025-11-28. The ONS JSON
  endpoint lists the series as months, quarters and years; only the periods in observed_period are kept. ONS publishes
  its data under the Open Government Licence v3.0, as the cpih01 dataset metadata states.'
