notes: Account types label the kind of annual accounts a company last filed (full, small, micro-entity, dormant,
  group, exemption variants); the foreign account and publication-terms codes apply to overseas companies with UK
  establishments. The code lists are enumerations Companies House publishes for its public API (companieshouse/api-enumerations,
  commit 05067abc); codes and labels are copied unchanged. The repository carries no licence file, so the entry
  stays at license-review until the publisher's terms for this file are confirmed; Companies House data is generally
  released under the Open Government Licence, but that is not stated here. valid_from is the date of the pinned
  revision; valid_to is open.
