id: gb-company-accounts-codes
title: United Kingdom Companies House accounts type, foreign accounts and accounts publication terms codes
kind: rule
domain: company
region: GB
status: license-review
tier: A
valid_from: '2026-09-11'
valid_to: null
tags:
- companies-house
- accounts
- filing
- code-list
use_cases:
- company-generation
- kyb-onboarding
- financial-reporting
- audit-demo
spec:
  implementation: almanac.rules.enumeration
  parameters:
    sets:
      account_type:
        'null': 'Null'
        full: Full
        small: Small
        medium: Medium
        group: Group
        dormant: Dormant
        interim: Interim
        initial: Initial
        total-exemption-full: Total Exemption Full
        total-exemption-small: Total Exemption Small
        partial-exemption: Partial Exemption
        audit-exemption-subsidiary: Audit Exemption Subsidiary
        filing-exemption-subsidiary: Filing Exemption Subsidiary
        micro-entity: Micro Entity
        no-accounts-type-available: No accounts type available
        audited-abridged: Audited abridged
        unaudited-abridged: Unaudited abridged
      foreign_account_type:
        accounting-requirements-of-originating-country-apply: Accounting requirements of originating country apply
        accounting-requirements-of-originating-country-do-not-apply: Accounting requirements of originating country
          do not apply
      terms_of_account_publication:
        accounts-publication-date-supplied-by-company: Accounts publication date supplied by company
        accounting-publication-date-does-not-need-to-be-supplied-by-company: Accounts publication date does not
          need to be supplied by company
        accounting-reference-date-allocated-by-companies-house: Accounting reference date allocated by Companies
          House
  vectors:
  - input:
      set: account_type
      value: micro-entity
    expected: true
    origin: source
  - input:
      set: account_type
      value: dormant
    expected: true
    origin: source
  - input:
      set: account_type
      value: total-exemption-full
    expected: true
    origin: source
  - input:
      set: account_type
      value: unaudited-abridged
    expected: true
    origin: source
  - input:
      set: account_type
      value: abbreviated
    expected: false
    origin: derived
    note: not in the current list
  - input:
      set: foreign_account_type
      value: accounting-requirements-of-originating-country-apply
    expected: true
    origin: source
  - input:
      set: terms_of_account_publication
      value: accounting-reference-date-allocated-by-companies-house
    expected: true
    origin: source
  - input:
      set: terms_of_account_publication
      value: full
    expected: false
    origin: derived
    note: an account_type code, not a publication term
