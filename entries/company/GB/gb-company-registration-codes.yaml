notes: Jurisdictions name the register a company is incorporated in; subtypes flag community interest companies
  and private fund limited partnerships; company_birth_type maps each company type to the wording used for its incorporation
  date (incorporated, registered, formed or opened on); register types and locations describe the statutory registers
  a company may keep and where they are inspected. The code lists are enumerations Companies House publishes for
  its public API (companieshouse/api-enumerations, commit 05067abc); codes and labels are copied unchanged. The
  repository carries no licence file, so the entry stays at license-review until the publisher's terms for this
  file are confirmed; Companies House data is generally released under the Open Government Licence, but that is
  not stated here. valid_from is the date of the pinned revision; valid_to is open.
