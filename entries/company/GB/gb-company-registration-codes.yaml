  vectors:
  - input:
      set: jurisdiction
      value: england-wales
    expected: true
    origin: source
  - input:
      set: jurisdiction
      value: scotland
    expected: true
    origin: source
  - input:
      set: jurisdiction
      value: northern-ireland
    expected: true
    origin: source
  - input:
      set: jurisdiction
      value: ireland
    expected: false
    origin: derived
    note: not a Companies House jurisdiction
  - input:
      set: company_subtype
      value: community-interest-company
    expected: true
    origin: source
  - input:
      set: company_birth_type
      value: ltd
    expected: true
    origin: source
  - input:
      set: register_types
      value: persons-with-significant-control
    expected: true
    origin: source
  - input:
      set: register_locations
      value: registered-office
    expected: true
    origin: source
  - input:
      set: register_locations
      value: directors
    expected: false
    origin: derived
    note: a register type, not a location
