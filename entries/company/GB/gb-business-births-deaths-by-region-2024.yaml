  expected: 16
  tolerance: 0
- statistic: max[births]
  expected: 317440
  tolerance: 0
notes: Counts of enterprise births, deaths and active enterprises for 2024 from Tables 1.1d, 2.1d and 3.1d of the
  ONS Business Demography 2024 reference workbook (published 20 November 2025), kept for the United Kingdom, Great
  Britain, England and Wales, England, the nine English regions, Wales, Scotland and Northern Ireland, keyed by
  GSS area code; the workbook's local authority rows are dropped. Counts are control rounded to base 5 by ONS. Birth
  and death rates are derived here as counts over active enterprises. ONS publishes the workbook under the Open
  Government Licence v3.0.
