notes: Officer roles are the appointment types that appear on a company's officer list (director, secretary, LLP
  member, nominee and corporate variants, limited partnership partners and the organ memberships used for European
  entities); identification types describe how a corporate officer is identified. The code lists are enumerations
  Companies House publishes for its public API (companieshouse/api-enumerations, commit 05067abc); codes and labels
  are copied unchanged. The repository carries no licence file, so the entry stays at license-review until the publisher's
  terms for this file are confirmed; Companies House data is generally released under the Open Government Licence,
  but that is not stated here. valid_from is the date of the pinned revision; valid_to is open.
