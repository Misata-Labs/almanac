        other-corporate-body-or-firm: Other Corporate Body or Firm
        registered-overseas-entity-corporate-managing-officer: Corporate managing officer
        limited-partnership-corporate-partner: Limited Partnership Corporate Partner
  vectors:
  - input:
      set: officer_role
      value: director
    expected: true
    origin: source
  - input:
      set: officer_role
      value: secretary
    expected: true
    origin: source
  - input:
      set: officer_role
      value: llp-designated-member
    expected: true
    origin: source
  - input:
      set: officer_role
      value: corporate-director
    expected: true
    origin: source
  - input:
      set: officer_role
      value: chairman
    expected: false
    origin: derived
    note: not a Companies House role code
  - input:
      set: identification_type
      value: uk-limited-company
    expected: true
    origin: source
  - input:
      set: identification_type
      value: eea
    expected: true
    origin: source
  - input:
      set: identification_type
      value: Director
    expected: false
    origin: derived
    note: a label, not a code, and in the wrong set
