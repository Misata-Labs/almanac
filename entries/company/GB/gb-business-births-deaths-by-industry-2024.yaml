assumed:
- parameter: rows[*].birth_rate_percent
  value: 100 * births / active
  method: derived
  rationale: ONS publishes the counts; the birth rate is births as a percentage of active enterprises, rounded to
    two decimals, null where no enterprise is active.
- parameter: rows[*].death_rate_percent
  value: 100 * deaths / active
  method: derived
  rationale: Deaths as a percentage of active enterprises, rounded to two decimals, null where no enterprise is
    active.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 80
  tolerance: 0
- statistic: max[active]
  expected: 260910
  tolerance: 0
notes: Counts of enterprise births, deaths and active enterprises for 2024 at SIC 2007 division level (two-digit
  codes) from Tables 1.2, 2.2 and 3.2 of the ONS Business Demography 2024 reference workbook (published 20 November
  2025); the three-digit group rows beneath each division are dropped. Counts are control rounded to base 5 by ONS,
  so small divisions show zeros. Birth and death rates are derived here as counts over active enterprises. ONS publishes
  the workbook under the Open Government Licence v3.0.
