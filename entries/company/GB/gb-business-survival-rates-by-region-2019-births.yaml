- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 13
  tolerance: 0
- statistic: max[survival_5y_percent]
  expected: 43.5
  tolerance: 1.0e-09
- statistic: min[survival_1y_percent]
  expected: 88.1
  tolerance: 1.0e-09
notes: 'Survival of enterprises born in 2019 from Table 4.1 of the ONS Business Demography 2024 reference workbook
  (published 20 November 2025): births and the number and percentage still active one to five years later, for the
  nine English regions, Wales, Scotland, Northern Ireland and the UK total, keyed by the region name as the workbook
  prints it. The 2019 cohort is the latest with five-year survival. Counts are control rounded to base 5 by ONS.
  ONS publishes the workbook under the Open Government Licence v3.0.'
