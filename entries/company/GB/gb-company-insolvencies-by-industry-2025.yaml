notes: Company insolvencies registered in England and Wales in 2025 by SIC 2007 section letter (Unknown where the
  company has no SIC code), from the Insolvency Service's Business Insolvency Demography 2015 to 2025 release. Each
  row gives counts and rates per 10,000 companies for all insolvencies and for administrations, compulsory liquidations,
  creditors' voluntary liquidations and other procedures. Published counts are multiples of five; null marks a cell
  the publisher suppressed ([c]) for disclosure control. The highest overall rate among known bands is 'I'. Rates
  are the published ones, not recomputed. The file is published under the Open Government Licence 3.0.
