notes: 'Bankruptcy cases commenced in each of the 93 federal judicial districts (including the territories) in the
  twelve months ending 30 September 2026, from Table F-2 of the Administrative Office of the US Courts, with the
  fourteen columns of the table: totals by chapter and the business and nonbusiness splits. Circuit subtotals are
  dropped; a dash in the source (no business filings in Guam and the Northern Mariana Islands) is read as zero;
  AR covers both Arkansas districts, as the source notes; the district rows sum to the published national total
  for every column. Business chapter 11 filings concentrate in a few venues, which matters when generating a plausible
  docket for distressed portfolio companies. The publisher is a US federal body and the resource carries no licence
  statement, so the licence is recorded as unstated and the entry held at license-review.'
