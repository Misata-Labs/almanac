notes: Cases commenced in the US bankruptcy courts in the twelve months ending 30 September 2026, by chapter of
  the Bankruptcy Code and predominant nature of debt, from Table F-2 of the Administrative Office of the US Courts.
  'Other chapters' covers chapters 9, 12 and 15 and section 304 cases and is published for business filings only.
  The table's note defines the nature of debt as business when the debtor is a corporation or partnership or when
  debt related to the operation of a business predominates. Subchapter V cases are not tabulated separately in F-2.
  The publisher is a US federal body and the resource carries no licence statement, so the licence is recorded as
  unstated and the entry held at license-review.
