notes: EU-27 indices (2021 = 100) of bankruptcy declarations and new business registrations for the nine NACE Rev.
  2 aggregates Eurostat publishes in sts_rb_q (industry B-E, construction F, trade G, transport H, accommodation
  and food I, information and communication J, financial, real estate and business services K-N, education, health
  and other services P-S excluding S94, and the business-economy total), seasonally and calendar adjusted, 2025-Q1
  to 2026-Q3. Columns are named bankruptcies_<quarter> and registrations_<quarter>. Eurostat's copyright notice
  states that its data are released under the Creative Commons Attribution 4.0 International licence; the notice
  page renders dynamically and is referenced rather than hashed.
