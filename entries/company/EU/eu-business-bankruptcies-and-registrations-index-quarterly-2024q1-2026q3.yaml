notes: Quarterly indices (2021 = 100) of declarations of bankruptcy and of new business registrations for the EU-27,
  business economy excluding public administration and activities of membership organisations (NACE B-S excluding
  O and S94), seasonally and calendar adjusted, from Eurostat's short-term business statistics dataflow sts_rb_q.
  The dataflow carries indices and growth rates, not counts; use the indices to scale a synthetic default rate through
  time rather than as levels. Eurostat's copyright notice states that its data are released under the Creative Commons
  Attribution 4.0 International licence; the notice page renders dynamically and is referenced rather than hashed.
