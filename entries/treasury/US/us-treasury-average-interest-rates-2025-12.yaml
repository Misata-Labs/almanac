notes: The average interest rate on each class of outstanding US Treasury securities at 2025-12-31, one row per
  line of the Treasury's monthly statement (marketable classes, non-marketable classes, their subtotals and the
  total for all interest-bearing debt), from the Fiscal Data API. Subtotal and total lines are kept as rows because
  the source publishes them; a generator weighting instruments should use the individual classes. The Fiscal Data
  dataset pages render their licence section dynamically and were not captured, so the licence is recorded as unstated
  and the entry held at license-review even though US federal publications are normally free to reuse.
