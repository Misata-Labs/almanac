  expected: 18
  tolerance: 0
notes: The identifiers a covered entity must remove from health information about an individual (and the individual's
  relatives, employers and household members) for the information to be de-identified under the safe harbor method
  of 45 CFR 164.514(b)(2), keyed by the paragraph letter A to R. The parameters also carry the population threshold
  below which the first three digits of a zip code must be replaced by 000 and the age above which ages must be
  aggregated. Read from the eCFR text as of 2026-10-29; valid_from is the date of the latest version of 164.514
  in the eCFR versions endpoint. US federal government works carry no copyright, but neither the eCFR API nor the
  regulation text states reuse terms, so the licence is recorded as unstated and the entry held at license-review.
