id: us-hipaa-safe-harbor-identifiers
title: 'United States HIPAA de-identification safe harbor: the eighteen identifiers of 45 CFR 164.514(b)(2)'
kind: rule
domain: privacy
region: US
status: license-review
tier: A
valid_from: '2016-12-30'
valid_to: null
tags:
- hipaa
- de-identification
- phi
- safe-harbor
- code-list
- 45-cfr-164
use_cases:
- health-demo
- clinical-records
- claims-generation
- person-generation
spec:
  implementation: almanac.rules.enumeration
  parameters:
    zip_code_three_digit_population_threshold: 20000
    age_aggregation_threshold_years: 89
    sets:
      identifiers:
        A: Names
        B: All geographic subdivisions smaller than a State
        C: All elements of dates (except year) for dates directly related to an individual
        D: Telephone numbers
        E: Fax numbers
        F: Electronic mail addresses
        G: Social security numbers
        H: Medical record numbers
        I: Health plan beneficiary numbers
        J: Account numbers
        K: Certificate/license numbers
        L: Vehicle identifiers and serial numbers
        M: Device identifiers and serial numbers
        N: Web Universal Resource Locators (URLs)
        O: Internet Protocol (IP) address numbers
        P: Biometric identifiers
        Q: Full face photographic images and any comparable images
        R: Any other unique identifying number, characteristic, or code
  vectors:
  - input:
      set: identifiers
      value: A
    expected: true
    origin: source
    note: Names
  - input:
      set: identifiers
      value: G
    expected: true
    origin: source
    note: Social security numbers
  - input:
      set: identifiers
      value: R
    expected: true
    origin: source
    note: Any other unique identifying number, characteristic, or code
  - input:
      set: identifiers
      value: S
    expected: false
    origin: derived
