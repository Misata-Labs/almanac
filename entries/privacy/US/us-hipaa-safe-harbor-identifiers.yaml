assumed:
- parameter: sets.identifiers[*]
  value: label cut at the first qualifying clause
  method: derived
  rationale: Each label is the identifier's paragraph text up to the first ', including', ', except' or semicolon,
    so the long geographic and date paragraphs keep only their head clause; the regulation text is the authority
    for the full scope.
