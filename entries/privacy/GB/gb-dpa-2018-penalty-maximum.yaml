notes: 'The ceilings on a penalty notice under the UK data protection regime, from section 157 of the Data Protection
  Act 2018 as legislation.gov.uk publishes it at 2026-10-29. For an undertaking the maximum is the fixed sum or
  the stated percentage of total annual worldwide turnover in the preceding financial year, whichever is higher;
  for anyone else it is the fixed sum. Which tier applies depends on the provision infringed: section 157 and Article
  83 of the UK GDPR assign them. valid_from is the start of the section''s current version. The legislation.gov.uk
  resource carries no licence statement, although the site publishes legislation under the Open Government Licence
  v3.0, so the licence is recorded as unstated and the entry held at license-review. Provisions are cited in legislation.gov.uk''s
  HTML rendering, which makes the entry tier B: the XML rendering of these versions lists unapplied effects whose
  attributes are reordered on every render, so its bytes do not stay fixed.'
