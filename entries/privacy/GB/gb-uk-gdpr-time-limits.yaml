notes: 'Deadlines in the UK GDPR as amended by the Data (Use and Access) Act 2025, read from legislation.gov.uk''s
  point-in-time versions as of 2026-10-29: a controller notifies the Information Commissioner of a personal data
  breach without undue delay and, where feasible, within the stated hours of becoming aware of it, unless the breach
  is unlikely to result in a risk; it responds to a data subject''s request within one month beginning with the
  relevant time (the latest of receiving the request, any identifying information asked for and any fee), extendable
  by two further months for complex or numerous requests on notice given within the first month; and a child can
  consent to an information society service from the stated age. Article 12A, which holds the response period since
  5 February 2026, is published at a URL ending in ''12A.''. valid_from is the latest start date of the three provisions''
  current versions; earlier versions carried the same figures under different wording. The legislation.gov.uk resource
  carries no licence statement, although the site publishes legislation under the Open Government Licence v3.0,
  so the licence is recorded as unstated and the entry held at license-review.'
