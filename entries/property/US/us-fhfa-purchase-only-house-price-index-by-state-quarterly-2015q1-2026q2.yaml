notes: Seasonally adjusted (_sa) and not seasonally adjusted (_nsa) purchase-only house price index, columns named
  by lower-case state postal code, for each of the 51 states and the District of Columbia, 1991Q1 = 100, from the
  FHFA quarterly state file (served as a workbook despite its .csv name), from 2015-Q1 onward. The headline value
  is the unweighted mean of the state SA indexes, a convenience for plotting rather than an FHFA statistic; the
  state columns are the published figures. Some small states carry FHFA's note that they have fewer than 15,000
  transactions over the latest ten years. The publisher is a US federal body and the resource carries no licence
  statement, so the licence is recorded as unstated and the entry held at license-review.
