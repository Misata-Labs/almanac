notes: 'House price index for 2025 from Eurostat dataflow prc_hpi_a: the annual average rate of change in percent
  and the annual average index level (2015 = 100) for all dwellings, newly built dwellings and existing dwellings
  purchased by households. Rows are keyed by the Eurostat geo code and carry the English country name from the GEO
  codelist; a cell Eurostat does not publish is stored as null. Eurostat''s copyright notice states that its data
  are released under the Creative Commons Attribution 4.0 International licence; the notice page renders dynamically
  and is referenced rather than hashed.'
