notes: The UAE's domestic minimum top-up tax (Cabinet Decision No. 142 of 2024, effective for fiscal years beginning
  on or after 1 January 2025) applies to constituent entities of multinational groups with consolidated revenue
  of EUR 750 million or more in at least two of the four preceding fiscal years. The top-up tax percentage is the
  positive difference between the 15% minimum rate and the group's effective tax rate in the UAE. The full computation
  of the effective tax rate and excess profit is not modelled; the entry holds the thresholds a demo needs to flag
  in-scope groups.
