notes: 'UAE Corporate Tax under Federal Decree-Law No. 47 of 2022, for tax periods starting on or after 1 June 2023:
  taxable income up to AED 375,000 is taxed at 0% and the excess at 9% (Cabinet Decision No. 116 of 2022). A Qualifying
  Free Zone Person pays 0% on its qualifying income. A resident person with revenue of AED 3,000,000 or less in
  the period and all earlier periods ending on or before 31 December 2026 may elect small business relief and be
  treated as having no taxable income; the same AED 3,000,000 revenue figure allows the cash basis of accounting.
  The tax computation vector is the Federal Tax Authority''s own Example 1. The domestic minimum top-up tax for
  large multinational groups is not modelled.'
