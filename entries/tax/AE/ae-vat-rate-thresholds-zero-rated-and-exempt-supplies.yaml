notes: 'UAE VAT under Federal Decree-Law No. 8 of 2017 as amended (consolidated text published November 2025), in
  force from 1 January 2018: a standard rate of 5% on supplies and imports (Article 3), the zero-rated supplies
  of Article 45 and the exempt supplies of Article 46, held as code lists with labels summarising each clause. The
  Executive Regulation sets the mandatory registration threshold at AED 375,000 and the voluntary one at AED 187,500,
  with 30 days to apply once registration is required. The executive regulation conditions on each zero-rated or
  exempt category are not modelled.'
