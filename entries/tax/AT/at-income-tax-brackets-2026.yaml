notes: 'The Austrian income tax scale for the 2026 calendar year as § 33(1) EStG 1988 states it in the RIS consolidated
  text: income slices taxed at 0, 20, 30, 40, 48 and 50 percent and, for the part of income above one million euros,
  55 percent for the calendar years 2016 to 2029. The version in force from 1 January 2026 and the version in force
  from 30 July 2026 to 31 December 2026 carry the same brackets; the later one adds notes with the inflation-adjusted
  amounts for 2027 (BGBl. II Nr. 260/2026). The rule applies the slices to taxable income; deductible credits (Absetzbeträge
  such as the Verkehrsabsetzbetrag and Familienbonus Plus) are deducted from the result under § 33(2) and are not
  modelled, and the sixth-part taxation of 13th and 14th salaries under § 67 is outside this rule. Vectors other
  than the nil slice are computed from the brackets. RIS documents carry no licence statement in the fetched XML,
  so the licence is recorded as unstated and the entry stays at license-review.'
