notes: 'Article 25 of the Swiss Federal Act on Value Added Tax: the standard rate, the reduced rate (tap water,
  foodstuffs other than alcohol, livestock, seeds and plants, animal feed, medication, printed matter and other
  items listed in paragraph 2) and the special rate for accommodation services, which paragraph 4 limits in time
  (see the text). The standard and reduced rates are in force since the date the amending note gives, which sets
  valid_from. The source is the Fedlex XML of the consolidated version of 31 March 2025, the latest English version
  in Fedlex''s SPARQL index when the entry was built; English is not an official language of Swiss law, so the German
  text prevails. Fedlex states no licence in the file, so the licence is unstated and the entry held at license-review.'
