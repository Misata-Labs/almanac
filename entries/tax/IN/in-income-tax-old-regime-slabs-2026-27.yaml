notes: 'Old-regime slabs for the tax year 2026-27 for every individual not covered by the senior-citizen paragraphs,
  Hindu undivided families, associations of persons, bodies of individuals and artificial juridical persons, from
  Paragraph A of Part I-B of the First Schedule to the Finance Bill, 2026: nil up to ₹2,50,000, 5% to ₹5,00,000,
  20% to ₹10,00,000 and 30% above. The regime applies only when the taxpayer opts out of the default regime under
  section 202(4). The Bill''s cumulative amounts (₹12,500 at ₹5,00,000 and ₹1,12,500 at ₹10,00,000) are the source
  test vectors. Surcharge and cess are separate entries. The Finance Bill PDF is cited by PDF page number; printed
  page numbers run eight lower. The income tax e-filing portal''s help page was consulted but is not cited: its
  bytes change between fetches.'
