id: in-income-tax-old-regime-slabs-2026-27
title: India income tax slabs, old regime for individuals below 60 (Paragraph A, Part I-B, First Schedule, Finance
  Bill 2026), tax year 2026-27
kind: rule
domain: tax
region: IN
status: license-review
tier: B
valid_from: '2026-04-01'
valid_to: '2027-03-31'
tags:
- income-tax
- slabs
- payroll
- finance-bill-2026
- old-regime
use_cases:
- payroll-demo
- hr-analytics
- personal-finance
- tax-filing-demo
spec:
  implementation: almanac.rules.income_tax_bands
  parameters:
    tax_year: 2026-27
    regime: optional old regime, Paragraph A(I) of Part I-B of the First Schedule (option under section 202(4))
    applies_to: individuals below sixty, HUF, AOP, BOI and artificial juridical persons
    currency: INR
    personal_allowance: 0
    taper: null
    bands:
    - name: nil
      up_to: 250000
      rate_percent: 0
    - name: slab_5
      up_to: 500000
      rate_percent: 5
    - name: slab_20
      up_to: 1000000
      rate_percent: 20
    - name: slab_30
      up_to: null
      rate_percent: 30
  vectors:
  - input:
      income: 500000
    expected: '12500.00'
    origin: source
    note: 'Finance Bill: ₹ 12500 plus 20% above ₹ 500000'
  - input:
      income: 1000000
    expected: '112500.00'
    origin: source
    note: 'Finance Bill: ₹ 112500 plus 30% above ₹ 1000000'
  - input:
      income: 250000
    expected: '0.00'
    origin: derived
    note: top of the nil slab
  - input:
      income: 1500000
    expected: '262500.00'
    origin: derived
    note: ₹ 112500 plus 30% of ₹ 500000
