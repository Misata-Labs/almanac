  expected: 0
  tolerance: 0
- statistic: rate[slab_20]
  expected: 20
  tolerance: 0
- statistic: rate[slab_30]
  expected: 30
  tolerance: 0
notes: 'Old-regime slabs for resident super senior citizens (eighty or more) for the tax year 2026-27: nil up to
  ₹5,00,000, 20% to ₹10,00,000 and 30% above, from Paragraph A(III) of Part I-B of the First Schedule to the Finance
  Bill, 2026. Surcharge and cess are separate entries.'
