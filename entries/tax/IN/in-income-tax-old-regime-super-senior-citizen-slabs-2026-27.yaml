id: in-income-tax-old-regime-super-senior-citizen-slabs-2026-27
title: India income tax slabs, old regime for resident individuals aged 80 or more (Paragraph A(III), Part I-B,
  Finance Bill 2026), tax year 2026-27
kind: rule
domain: tax
region: IN
status: license-review
tier: B
valid_from: '2026-04-01'
valid_to: '2027-03-31'
tags:
