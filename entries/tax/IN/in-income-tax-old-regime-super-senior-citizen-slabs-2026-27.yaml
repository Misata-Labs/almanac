spec:
  implementation: almanac.rules.income_tax_bands
  parameters:
    tax_year: 2026-27
    regime: optional old regime, Paragraph A(III) of Part I-B of the First Schedule
    applies_to: resident individuals aged eighty or more at any time during the tax year
    currency: INR
    personal_allowance: 0
    taper: null
    bands:
    - name: nil
      up_to: 500000
      rate_percent: 0
    - name: slab_20
      up_to: 1000000
      rate_percent: 20
    - name: slab_30
      up_to: null
      rate_percent: 30
  vectors:
  - input:
      income: 1000000
    expected: '100000.00'
    origin: source
    note: 'Finance Bill: ₹ 100000 plus 30% above ₹ 1000000'
  - input:
      income: 500000
    expected: '0.00'
    origin: derived
    note: top of the nil slab
  - input:
      income: 750000
    expected: '50000.00'
    origin: derived
    note: 20% of ₹ 250000
evidence:
- publisher: Ministry of Finance, Government of India
  title: Finance Bill, 2026 (Bill No. 16 of 2026, as introduced in Lok Sabha)
  url: https://www.indiabudget.gov.in/doc/Finance_Bill.pdf
  accessed_at: '2026-11-01'
  locator: PDF page 120, First Schedule Part I-B Paragraph A item (III)
  value: ₹ 100000 plus 30% of the amount by which the total income exceeds ₹ 1000000.
  unit: text
  snippet: who is of the age of eighty years or more at any time during the tax year
  source_license: unstated
  content_sha256: 5c98701714c4c473bcd097e376124a4c075881836fe92a5fc4615613c09edabf
  role: primary
- publisher: Ministry of Finance, Government of India
