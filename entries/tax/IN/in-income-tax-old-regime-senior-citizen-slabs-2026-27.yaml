spec:
  implementation: almanac.rules.income_tax_bands
  parameters:
    tax_year: 2026-27
    regime: optional old regime, Paragraph A(II) of Part I-B of the First Schedule
    applies_to: resident individuals aged sixty or more but less than eighty at any time during the tax year
    currency: INR
    personal_allowance: 0
    taper: null
    bands:
    - name: nil
      up_to: 300000
      rate_percent: 0
    - name: slab_5
      up_to: 500000
      rate_percent: 5
    - name: slab_20
      up_to: 1000000
      rate_percent: 20
    - name: slab_30
      up_to: null
      rate_percent: 30
  vectors:
  - input:
      income: 500000
    expected: '10000.00'
    origin: source
    note: 'Finance Bill: ₹ 10000 plus 20% above ₹ 500000'
  - input:
      income: 1000000
    expected: '110000.00'
    origin: source
    note: 'Finance Bill: ₹ 110000 plus 30% above ₹ 1000000'
  - input:
      income: 300000
    expected: '0.00'
    origin: derived
    note: top of the nil slab
