notes: 'Old-regime slabs for resident senior citizens (sixty to seventy-nine) for the tax year 2026-27: nil up to
  ₹3,00,000, 5% to ₹5,00,000, 20% to ₹10,00,000 and 30% above, from Paragraph A(II) of Part I-B of the First Schedule
  to the Finance Bill, 2026. Only the basic exemption differs from the general old-regime slabs. Non-residents use
  the general slabs regardless of age. Surcharge and cess are separate entries.'
