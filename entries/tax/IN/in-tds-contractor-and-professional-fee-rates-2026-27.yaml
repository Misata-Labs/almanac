notes: 'Tax deduction at source on payments to resident contractors and for professional or technical fees under
  section 393(1) of the Income-tax Act, 2025, which applies from the tax year 2026-27, as the Memorandum to the
  Finance Bill, 2026 restates them: work contracts 1% where the payee is an individual or Hindu undivided family
  and 2% otherwise (Table Sl. No. 6(i)); fees for technical services, royalty for cinematographic films and payments
  to call-centre businesses 2%, other professional fees 10% (Sl. No. 6(iii)); and 2% where an individual or HUF
  not otherwise required to deduct pays for work, commission or brokerage or professional services (Sl. No. 6(ii)).
  The Bill adds supply of manpower to the meaning of ''work'' from 1 April 2026, so manpower contracts take the
  1%/2% contract rates. Per-payment and annual thresholds, the higher rate without a PAN and the other TDS heads
  (interest, rent, commission, purchase of goods, partner payments) are in the Act''s section 393 tables, which
  could not be fetched, and are not in this entry. The Memorandum states no licence.'
