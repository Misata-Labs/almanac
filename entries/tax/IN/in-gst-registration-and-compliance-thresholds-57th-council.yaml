id: in-gst-registration-and-compliance-thresholds-57th-council
title: India GST registration, late-fee, ARQP and e-invoicing turnover thresholds recommended by the 57th GST Council
  meeting, 8 October 2026
kind: rule
domain: tax
region: IN
status: license-review
tier: B
valid_from: '2026-10-08'
valid_to: null
tags:
- gst
- registration
- e-invoicing
- thresholds
- gst-council-57
use_cases:
- invoicing
- kyb-onboarding
- company-generation
- tax-filing-demo
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    meeting: 57th GST Council, New Delhi, 8 October 2026
    currency: INR
    legal_status: Council recommendations; amendments to the CGST Act, 2017 and Rules are required before they take
      effect
    rows:
      rule_14a_automatic_registration_itc_pass_through_limit:
        amount_inr: 250000
        period: per month
        scope: applicant not intending to pass on ITC above the limit; automatic registration without officer intervention
      rule_14b_eco_small_seller_output_tax_limit:
        amount_inr: 250000
        period: per month
        scope: simplified registration for sellers supplying goods only through e-commerce operators, declaring
          the ECO warehouse as principal place of business; stock transfers excluded
      automatic_cancellation_phase_1_itc_limit:
        amount_inr: 250000
        period: per month
        scope: cancellation applications in FORM GST REG-16 accepted automatically where ITC passed on never exceeded
          the limit
      late_fee_waiver_annual_turnover_limit:
        amount_inr: 50000000
        period: preceding financial year
        scope: late fee on a section 39(1) return waived if filed by the end of the month in which it was due
      arqp_scheme_aggregate_turnover_limit:
        amount_inr: 50000000
        period: preceding financial year
        scope: optional Annual Return Quarterly Payment scheme for taxpayers supplying only unregistered persons
          (B2C); approved in principle
      e_invoicing_rcm_and_import_of_services_turnover_threshold:
        amount_inr: 50000000
        period: aggregate annual turnover
        scope: e-invoicing extended to supplies from unregistered persons under reverse charge and to imports of
          services for taxpayers at or above the threshold
      zero_rated_goods_turnover_cap_multiple:
        amount_inr: null
        multiple: 1.5
        period: refund period
        scope: rule 89(4)(C) restriction of zero-rated goods turnover to 1.5 times the domestic value of like goods
          is removed
  vectors:
  - input:
      key: rule_14b_eco_small_seller_output_tax_limit
      column: amount_inr
    expected: 250000
    origin: source
  - input:
      key: rule_14a_automatic_registration_itc_pass_through_limit
      column: amount_inr
    expected: 250000
    origin: source
  - input:
      key: late_fee_waiver_annual_turnover_limit
      column: amount_inr
    expected: 50000000
    origin: source
  - input:
      key: e_invoicing_rcm_and_import_of_services_turnover_threshold
      column: amount_inr
    expected: 50000000
    origin: source
  - input:
      key: zero_rated_goods_turnover_cap_multiple
      column: multiple
    expected: 1.5
    origin: source
  - input: composition_scheme_turnover_limit
    expected: false
    origin: derived
    note: the 57th meeting did not change the composition or registration thresholds of sections 10 and 22
