notes: 'Turnover and tax-liability thresholds in the process reforms the 57th GST Council meeting of 8 October 2026
  recommended: the ₹2.5 lakh per month input tax credit pass-through limit that defines automatic registration under
  rule 14A, the proposed rule 14B simplified registration for small sellers on e-commerce platforms (ITC passed
  on, or output tax liability to registered persons, not above ₹2.5 lakh a month), Phase 1 automatic cancellation
  of registration, late-fee waiver and the in-principle Annual Return Quarterly Payment scheme for turnover up to
  ₹5 crore, extension of e-invoicing to reverse charge supplies and imports of services for turnover of ₹5 crore
  and above, and removal of the 1.5 times cap on zero-rated goods turnover in refund computations. The meeting changed
  no GST rate slab (the 56th meeting''s structure in in-gst-rate-structure stands) and did not revise the registration
  or composition thresholds of sections 22 and 10, which these documents do not state. valid_from is the meeting
  date; the measures take effect through later amendments and notifications. The Council''s copyright policy permits
  reproduction after permission by email, hence license-review.'
