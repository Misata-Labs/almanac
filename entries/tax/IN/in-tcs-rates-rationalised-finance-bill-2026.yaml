notes: 'The TCS rates the Memorandum to the Finance Bill, 2026 tabulates for section 394(1) of the Income-tax Act,
  2025, before and after the rationalisation proposed with effect from 1 April 2026: liquor, scrap and coal, lignite
  or iron ore move from 1% to 2%; tendu leaves from 5% to 2%; Liberalised Remittance Scheme remittances above ten
  lakh rupees for education or medical treatment from 5% to 2% while other purposes stay at 20%; and overseas tour
  programme packages move from 5% up to ten lakh rupees and 20% above to a flat 2% with no threshold. The rows cover
  only the receipts the Memorandum tabulates, not the whole TCS schedule. The Memorandum describes the Bill as introduced;
  whether the Finance Act, 2026 enacted these rates unchanged is not confirmed by these documents.'
