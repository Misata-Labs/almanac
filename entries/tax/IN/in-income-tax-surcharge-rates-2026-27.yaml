assumed:
- parameter: rows.up_to_50_lakh
  value: 0% in both regimes
  method: derived
  rationale: The Finance Bill lists surcharge only for incomes above ₹50 lakh; the nil row is added so a lookup
    covers every income, as the e-Filing table also shows 'Nil' for that band.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 5
  tolerance: 0
- statistic: value[above_5_crore,old_regime_percent]
  expected: 37
  tolerance: 0
- statistic: value[above_5_crore,new_regime_percent]
  expected: 25
  tolerance: 0
- statistic: max[new_regime_percent]
  expected: 25
  tolerance: 0
notes: 'Surcharge on the income tax of individuals, Hindu undivided families, associations of persons (other than
  those made up only of companies), bodies of individuals and artificial juridical persons for the tax year 2026-27,
  from Paragraph F of Part I-B of the First Schedule to the Finance Bill, 2026: 10% of tax where total income exceeds
  ₹50 lakh up to ₹1 crore, 15% up to ₹2 crore, 25% up to ₹5 crore and 37% above ₹5 crore. Under the default regime
  of section 202 the 37% rate does not apply and the surcharge is capped at 25%, and in both regimes the surcharge
  on dividend income and capital gains under sections 196 to 198 is capped at 15%. Marginal relief applies at each
  threshold. The Health and Education Cess of 4% is charged on tax plus surcharge in all cases. Rows hold band boundaries
  in rupees; the bands are keyed in lakh and crore as the documents express them. The income tax e-filing portal''s
  help page was consulted but is not cited: its bytes change between fetches.'
