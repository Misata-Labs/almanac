id: in-income-tax-surcharge-rates-2026-27
title: India surcharge on income tax by total-income band for individuals, HUFs, AOPs and BOIs, old and new regimes,
  plus 4% cess, tax year 2026-27
kind: rule
domain: tax
region: IN
status: license-review
tier: B
valid_from: '2026-04-01'
valid_to: '2027-03-31'
tags:
- income-tax
- surcharge
- cess
- finance-bill-2026
use_cases:
- payroll-demo
- hr-analytics
- personal-finance
- tax-filing-demo
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    tax_year: 2026-27
    currency: INR
    basis: percentage of income tax, by total income band
    dividend_and_capital_gains_surcharge_cap_percent: 15
    health_and_education_cess_percent: 4
    marginal_relief: true
    rows:
      up_to_50_lakh:
        income_above: 0
        income_up_to: 5000000
        old_regime_percent: 0
        new_regime_percent: 0
      50_lakh_to_1_crore:
        income_above: 5000000
        income_up_to: 10000000
        old_regime_percent: 10
        new_regime_percent: 10
      1_crore_to_2_crore:
        income_above: 10000000
        income_up_to: 20000000
        old_regime_percent: 15
        new_regime_percent: 15
      2_crore_to_5_crore:
        income_above: 20000000
        income_up_to: 50000000
        old_regime_percent: 25
        new_regime_percent: 25
      above_5_crore:
        income_above: 50000000
        income_up_to: null
        old_regime_percent: 37
        new_regime_percent: 25
  vectors:
  - input:
      key: 50_lakh_to_1_crore
      column: old_regime_percent
    expected: 10
    origin: source
  - input:
      key: above_5_crore
      column: old_regime_percent
    expected: 37
    origin: source
  - input:
      key: above_5_crore
      column: new_regime_percent
    expected: 25
    origin: source
    note: 37% surcharge is not applicable under section 202; restricted to 25%
  - input:
      key: 2_crore_to_5_crore
      column: new_regime_percent
    expected: 25
    origin: source
  - input: up_to_50_lakh
    expected: true
    origin: source
