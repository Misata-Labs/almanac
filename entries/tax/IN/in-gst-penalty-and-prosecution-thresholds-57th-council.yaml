id: in-gst-penalty-and-prosecution-thresholds-57th-council
title: India GST prosecution, show cause notice, penalty, pre-deposit and refund thresholds recommended by the 57th
  GST Council meeting, 8 October 2026
kind: rule
domain: tax
region: IN
status: license-review
tier: B
valid_from: '2026-10-08'
valid_to: null
tags:
- gst
- penalties
- prosecution
- thresholds
- gst-council-57
use_cases:
- invoicing
- audit-demo
- tax-filing-demo
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    meeting: 57th GST Council, New Delhi, 8 October 2026
    currency: INR
    legal_status: Council recommendations; amendments to the CGST Act, 2017 and Rules are required before they take
      effect
    rows:
      prosecution_threshold_section_132:
        previous_inr: 10000000
        recommended_inr: 50000000
        basis: tax evaded; arrest provisions in section 69 to be omitted
      general_penalty_maximum_section_125:
        previous_inr: 25000
        recommended_inr: 10000
        basis: maximum general penalty
      show_cause_notice_minimum_tax:
        previous_inr: null
        recommended_inr: 10000
        basis: CGST + SGST + IGST + cess aggregated, sections 73, 74 and 74A; interest, late fee and penalty excluded
      reduced_penalty_non_fraud_percent:
        previous_inr: null
        recommended_inr: null
        percent: 5
        basis: tax plus interest paid within 30 days (section 73) or 60 days (section 74A) of the adjudication order
      minimum_penalty_non_fraud:
        previous_inr: 10000
        recommended_inr: null
        basis: condition of a minimum penalty removed in non-fraud cases
      pre_deposit_cap_penalty_only_appeals:
        previous_inr: null
        recommended_inr: 400000000
        basis: ₹20 crore CGST plus ₹20 crore SGST/UTGST, sections 107(6) and 112(8), orders involving penalty only
      refund_minimum_amount_section_54_14:
        previous_inr: 1000
        recommended_inr: 1000
        basis: applied to the total refund across CGST, SGST/UTGST and IGST together; not applied to exports with
          payment of tax
      imprisonment_maximum_above_10_crore_years:
        previous_inr: null
        recommended_inr: null
        years: 5
        basis: imprisonment or fine or both; minimum six months removed
      imprisonment_maximum_5_to_10_crore_years:
        previous_inr: null
        recommended_inr: null
        years: 2
        basis: imprisonment or fine or both
  vectors:
  - input:
      key: prosecution_threshold_section_132
      column: recommended_inr
    expected: 50000000
    origin: source
  - input:
      key: prosecution_threshold_section_132
      column: previous_inr
    expected: 10000000
    origin: source
  - input:
      key: general_penalty_maximum_section_125
      column: recommended_inr
    expected: 10000
    origin: source
  - input:
      key: show_cause_notice_minimum_tax
      column: recommended_inr
    expected: 10000
    origin: source
  - input:
      key: pre_deposit_cap_penalty_only_appeals
      column: recommended_inr
    expected: 400000000
    origin: source
  - input:
      key: imprisonment_maximum_above_10_crore_years
      column: years
    expected: 5
    origin: source
