notes: 'Monetary thresholds the 57th GST Council meeting of 8 October 2026 recommended for the CGST Act, 2017, from
  the Council Secretariat''s copy of the Ministry of Finance press release and its FAQ: prosecution only where tax
  evaded exceeds ₹5 crore (previously ₹1 crore) with arrest provisions removed and maximum imprisonment of five
  years above ₹10 crore and two years between ₹5 crore and ₹10 crore; a minimum of ₹10,000 of tax (all heads together)
  before a show cause notice under sections 73, 74 or 74A; the maximum general penalty under section 125 cut from
  ₹25,000 to ₹10,000; a 5% reduced penalty in non-fraud cases paid within 30 or 60 days of the order with the ₹10,000
  minimum penalty removed; a ₹40 crore cap on pre-deposits for penalty-only appeals; and the ₹1,000 refund floor
  applied to the combined refund. valid_from is the meeting date; these are recommendations that take legal effect
  only through amending legislation and notifications, which the press release says will follow, so the entry should
  be re-dated when they are enacted. The Council''s copyright policy permits reproduction after permission by email,
  hence license-review.'
