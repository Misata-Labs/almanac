id: in-gst-rate-structure
title: India GST rate structure after the 56th GST Council meeting (merit 5%, standard 18%, de-merit 40%)
kind: rule
domain: tax
region: IN
status: license-review
tier: B
valid_from: 2025-09-22
valid_to: null
spec:
  implementation: almanac.rules.in_gst_rate_structure
  parameters:
    slabs:
      nil: 0
      merit: 5
      standard: 18
      de_merit: 40
    effective_from: "2025-09-22"
    carve_outs:
      - cigarettes
      - chewing tobacco products such as zarda
      - unmanufactured tobacco
      - beedi
    carve_out_treatment: existing GST and compensation cess rates continue until a later notified date
  vectors:
    - {input: 18, expected: true, origin: source}
    - {input: 5, expected: true, origin: source}
    - {input: 40, expected: true, origin: source}
    - {input: 0, expected: true, origin: source, note: NIL rate named in the Council's reductions}
    - {input: 12, expected: false, origin: source, note: former slab merged away by the rationalisation}
    - {input: 28, expected: false, origin: source, note: former slab merged away by the rationalisation}
