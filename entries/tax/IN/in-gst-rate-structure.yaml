    accessed_at: 2026-10-31
    locator: "page 1, rate rationalisation bullet"
    value: "a 2 rate structure with a Standard Rate of 18% and a Merit Rate of 5%; a special de-merit rate of 40%"
    unit: text
    snippet: "Rationalisation of the current 4-tiered tax rate structure"
    source_license: "GST Council copyright policy: reproduction free of charge after permission by email, with acknowledgement"
    content_sha256: 2b596a6fcc583922fb31b4a601e0e905d84fd1edf20e0fcf77dce6ab82585484
  - publisher: GST Council Secretariat (Press Information Bureau release of the Ministry of Finance)
    title: Frequently Asked Questions on the decisions of the 56th GST Council, 3 September 2025
    url: https://gstcouncil.gov.in/sites/default/files/2025-09/faq_0.pdf
    accessed_at: 2026-10-31
    locator: "page 1, question 1"
    value: "effective from 22nd September, 2025"
    unit: text
    snippet: "When will the changes in GST rates come into force?"
    source_license: "GST Council copyright policy: reproduction free of charge after permission by email, with acknowledgement"
    content_sha256: 99cd227a6de7606c9680ef87830abc936d5d7dd78c5c51b9cef72a2a75fa0bb8
  - publisher: GST Council Secretariat (Press Information Bureau release of the Ministry of Finance)
    title: Frequently Asked Questions on the decisions of the 56th GST Council, 3 September 2025
    url: https://gstcouncil.gov.in/sites/default/files/2025-09/faq_0.pdf
