    value: "the existing rates of GST and compensation cess will continue to apply"
    unit: text
    snippet: "cigarettes, chewing tobacco products like zarda, unmanufactured tobacco and beedi"
    source_license: "GST Council copyright policy: reproduction free of charge after permission by email, with acknowledgement"
    content_sha256: 99cd227a6de7606c9680ef87830abc936d5d7dd78c5c51b9cef72a2a75fa0bb8
assumed:
  - parameter: slabs.nil
    value: 0
    method: derived
    rationale: The press release lists reductions "from 5% to NIL" for named goods; NIL is recorded as a 0% slab so generators can represent exempt supplies, although the release does not call it a slab.
tests:
  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: count, expected: 4, tolerance: 0}
  - {statistic: "slab[standard]", expected: 18, tolerance: 0}
  - {statistic: "slab[merit]", expected: 5, tolerance: 0}
  - {statistic: "slab[de_merit]", expected: 40, tolerance: 0}
notes: |
  The 56th GST Council meeting of 3 September 2025 replaced the four-slab structure with a
  standard rate of 18%, a merit rate of 5% and a de-merit rate of 40% for a small set of goods
  and services, effective 22 September 2025 for everything except cigarettes, chewing tobacco
  products, unmanufactured tobacco and beedi, which keep their earlier GST and compensation
  cess rates until a later notified date. Sources are the Council Secretariat's own copies of
  the Ministry of Finance press release and FAQ; the legally operative instruments are the CBIC
  rate notifications the FAQ points to, which should be added as evidence when reachable. The
  Council's copyright policy permits reproduction after permission by email, so the entry stays
  at license-review. This entry describes the slab structure, not the item-level schedule.
