notes: 'Slabs of the default regime for the tax year 1 April 2026 to 31 March 2027 as the Memorandum to the Finance
  Bill, 2026 restates them from section 202 of the Income-tax Act, 2025 (the same rates as section 115BAC(1A) of
  the 1961 Act for assessment year 2026-27): nil up to ₹4,00,000, then 5%, 10%, 15%, 20% and 25% on successive ₹4,00,000
  slices and 30% above ₹24,00,000. The Memorandum states no change from the enacted rates. The rule computes tax
  on total income only; the section 87A-style rebate, standard deduction, surcharge (see in-income-tax-surcharge-rates-2026-27)
  and the 4% Health and Education Cess are outside it. The e-Filing help page, whose bytes were identical on five
  fetches, supplies the cumulative amounts used as test vectors. The budget documents carry no licence statement.
  The income tax e-filing portal''s help page was consulted but is not cited: its bytes change between fetches.'
