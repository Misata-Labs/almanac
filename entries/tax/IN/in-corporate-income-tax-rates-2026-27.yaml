notes: 'Company income tax rates for the tax year 2026-27 from Paragraph E of Part I-B of the First Schedule to
  the Finance Bill, 2026, as explained in the Memorandum: a domestic company pays 25% where its turnover or gross
  receipts in tax year 2024-25 did not exceed ₹400 crore and 30% otherwise, or may opt for 22% under section 200
  of the Income-tax Act, 2025 with a 10% surcharge; a company other than a domestic company pays 35% on income not
  chargeable at special rates. Surcharge under Paragraph F is 7% (total income above ₹1 crore up to ₹10 crore) and
  12% (above ₹10 crore) for domestic companies outside the optional regimes, and 2% and 5% for other companies,
  with marginal relief; the 4% Health and Education Cess applies on tax plus surcharge. The Memorandum records no
  change from the previous year. Section 201''s regime for new manufacturing companies is not tabulated in these
  documents and is omitted.'
