notes: 'The Polish progressive tax scale (skala podatkowa) of article 27(1) of the Act of 26 July 1991 on personal
  income tax, in the consolidated text announced in Dz.U. 2026 poz. 592, which reflects the law as at 1 April 2026:
  12 percent less the tax-reducing amount up to the first threshold and a fixed amount plus 32 percent of the excess
  above it. valid_from is the date of that legal state; the text itself does not say when the scale was first applied.
  Flat-rate, lump-sum and capital income taxes, the solidarity levy and the health contribution are separate and
  not modelled; payroll advances apply the scale monthly with the reducing amount spread by the PIT-2 statement.
  The Dziennik Ustaw PDF carries no licence statement, so the licence is recorded as unstated and the entry stays
  at license-review.'
