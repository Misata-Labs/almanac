notes: 'Norway''s VAT rates for 2026 as the Norwegian Tax Administration lists them on its English rates page, pinned
  to 2026 with the page''s year parameter: the general rate, the rate for foodstuffs, the rate for water and wastewater
  services, and the low rate for passenger transport, accommodation, public broadcasting and entry to cinemas, sporting
  events, amusement parks and activity centres. Supplies that are zero-rated or outside the scope of VAT are not
  listed. The page states no licence, so the entry is held at license-review.'
