assumed:
- parameter: steps
  value: the rate applies to the employee Class A contribution
  method: derived
  rationale: The Department of Finance note attaches the increases to the full rate PRSI contributor of its PAYE
    tables; its 2026 PRSI figure on 50,000 (nine months at the October 2025 rate and three at the October 2026 rate)
    agrees with these steps.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 2
  tolerance: 0
- statistic: value[2026-12-31]
  expected: 4.35
  tolerance: 0
notes: 'The employee rate of Pay Related Social Insurance for full-rate contributors, as the Department of Finance''s
  Budget 2026 tax policy book states the agreed increases in its notes to the PAYE examples: from the prior rate
  to the October 2025 rate, then to the October 2026 rate. The weekly earnings threshold, the PRSI credit, employer
  rates and other classes are not in this entry. Because the figures come from a note to a worked example rather
  than from the Social Welfare Act itself, a reviewer should confirm them against the legislation. The publisher
  states no licence in the document, so the licence is recorded as unstated and the entry stays at license-review.'
