notes: 'The standard rates of the Universal Social Charge on aggregate income for 2026 and later years, as section
  2 of the Finance Act 2025 substitutes Part 1 of the Table to section 531AN of the Taxes Consolidation Act 1997:
  four slices with their rates, which the rule applies in turn (cumulative limits under bands, the enacted slices
  under slices_as_enacted). Individuals whose total income is below the exemption threshold in section 531AM pay
  no USC, reduced rates apply to medical card holders and people aged 70 or over with lower incomes (section 531AN(3)
  and (4)), and a surcharge applies to certain non-PAYE income; none of these is modelled. The source vectors are
  the Department of Finance''s Budget 2026 worked USC figures for a single PAYE employee, which it notes are rounded.
  Neither publisher states a licence in these documents, so the licence is recorded as unstated and the entry stays
  at license-review.'
