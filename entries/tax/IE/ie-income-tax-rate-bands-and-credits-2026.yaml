id: ie-income-tax-rate-bands-and-credits-2026
title: 'Ireland income tax for 2026: 20 and 40 percent rates, standard rate bands by circumstance, basic personal
  and employee tax credits'
kind: rule
domain: tax
region: IE
status: license-review
tier: B
valid_from: '2026-01-01'
valid_to: '2026-12-31'
tags:
- payroll
- tax
- income-tax
- paye
- tax-credits
- tax-bands
use_cases:
- payroll-demo
- hr-demo
- tax-demo
- synthetic-employees
spec:
  implementation: almanac.rules.ie_income_tax_usc
  parameters:
    charge: income_tax
    tax_year: 2026
    currency: EUR
    standard_rate_percent: 20
    higher_rate_percent: 40
    standard_rate_bands:
      single: 44000
      single_child_carer: 48000
      married_one_income: 53000
      married_two_incomes: 53000
    two_income_increase_max: 35000
    tax_credits:
      basic_personal_single: 2000
      basic_personal_married: 4000
      employee: 2000
    employee_credit_cap_percent: 20
  vectors:
  - input:
      income: 30000
      status: single
      credits: &id001
      - basic_personal_single
      - employee
      round: euro
    expected: '2000'
    origin: source
    note: 'Department of Finance Budget 2026, Table 2: single PAYE employee on 30,000, income tax proposed for 2026'
  - input:
      income: 50000
      status: single
      credits: *id001
      round: euro
    expected: '7200'
    origin: source
    note: 'Department of Finance Budget 2026, Table 2: single PAYE employee on 50,000, income tax proposed for 2026'
  - input:
      income: 100000
      status: single
      credits: *id001
      round: euro
    expected: '27200'
    origin: source
    note: 'Department of Finance Budget 2026, Table 2: single PAYE employee on 100,000, income tax proposed for
      2026'
  - input:
      income: 175000
      status: single
      credits: *id001
      round: euro
    expected: '57200'
    origin: source
    note: 'Department of Finance Budget 2026, Table 2: single PAYE employee on 175,000, income tax proposed for
      2026'
  - input:
      income: 60000
      status: married_two_incomes
      second_income: 20000
      credits:
      - basic_personal_married
      - employee
      - employee
    expected: '4000.00'
    origin: derived
    note: band increased by the lower second income
  - input:
      income: 8000
      status: single
      credits: *id001
    expected: '0.00'
    origin: derived
    note: credits cannot make the tax negative
