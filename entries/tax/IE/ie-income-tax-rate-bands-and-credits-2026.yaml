assumed:
- parameter: tax_credits.employee
  value: 2000
  method: derived
  rationale: Revenue's Part 15 notes (Finance Act 2025 edition) state the employee tax credit for 2025; the Department
    of Finance Budget 2026 Table 2 income tax figures for 2026 equal the band calculation less the basic personal
    and employee credits at these amounts, which the source vectors reproduce.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: band[single]
  expected: 44000
  tolerance: 0
- statistic: credit[employee]
  expected: 2000
  tolerance: 0
notes: 'Irish income tax for the 2026 year of assessment: the standard rate of 20 percent up to the standard rate
  band for the taxpayer''s circumstances (single, single person child carer, married couple or civil partners with
  one income, or with two incomes, whose band rises by the lower of the second income and the maximum increase)
  and 40 percent on the balance, as Revenue''s notes for guidance on section 15 of the Taxes Consolidation Act 1997
  (Finance Act 2025 edition, for 2025 and subsequent years) summarise them; then the basic personal tax credit (section
  461) and the employee tax credit (section 472, limited to 20 percent of employment income) are deducted. Other
  credits, such as the home carer or earned income credits, are not in the table. Source vectors are the Department
  of Finance''s Budget 2026 worked figures for a single PAYE employee, which it notes are rounded. Neither publisher
  states a licence in these documents, so the licence is recorded as unstated and the entry stays at license-review.'
