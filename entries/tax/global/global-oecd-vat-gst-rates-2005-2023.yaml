notes: 'Standard VAT/GST rates of the OECD member countries from Annex Table 2.A.1 of OECD Consumption Tax Trends,
  keyed by ISO alpha-3 code: the rate applicable on 1 January of each year from 2005 to 2022 and as at 1 September
  2023, with the reduced rates (including domestic zero rates) and regional rates applicable at 1 September 2023.
  The table does not record changes after 1 September 2023, so valid_to is that date; the table''s country notes
  describe later announced changes, which are not applied here. 2006 is not a column of the table, and its columns
  of temporary standard-rate reductions during 2021 to 2023 are not copied. Rates are percentages. Of the EU member
  states, Bulgaria, Croatia, Cyprus, Malta and Romania are not OECD members and are not covered. No licence statement
  was found in the OECD file or in a byte-stable OECD document, so the licence is recorded as unstated and the entry
  held at license-review.'
