notes: 'The OECD''s survey of interest limitation rules (BEPS Action 4 and, for EU members, article 4 of the Anti-Tax
  Avoidance Directive) for 2026: whether a jurisdiction has a rule, its type (fixed ratio, earnings stripping, thin
  capitalisation), the earnings measure, the ratio, any de minimis threshold, whether it applies to net or gross
  interest, whether a group ratio escape exists and whether disallowed amounts carry over. The cells are free text
  supplied by each jurisdiction and kept as published, whitespace collapsed; some numeric cells are not ratios in
  the form the law states them (Germany''s ratio cell holds a fraction that does not read as 30%), so the statute-level
  entries for the United States, United Kingdom and the Netherlands should be preferred where they exist. 89 jurisdictions
  report a rule. The OECD SDMX response carries no licence statement, so the licence is recorded as unstated and
  the entry held at license-review until a reviewer confirms the OECD terms that apply to the dataset.'
