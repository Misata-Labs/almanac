notes: The withholding tax rate a jurisdiction applies under its domestic law to dividends, interest and royalties
  paid to non-resident companies, as collected for the OECD Corporate Tax Statistics. These are the rates before
  any reduction under a double tax treaty or an EU directive, which commonly lower them to zero for qualifying holdings;
  the OECD publishes treaty rates in a separate dataflow. A column is null where the OECD publishes no rate for
  that payment type. The OECD SDMX response carries no licence statement, so the licence is recorded as unstated
  and the entry held at license-review until a reviewer confirms the OECD terms that apply to the dataset.
