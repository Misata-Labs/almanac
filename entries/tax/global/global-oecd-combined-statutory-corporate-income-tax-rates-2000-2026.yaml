notes: 'The OECD''s combined statutory corporate income tax rate for each jurisdiction in its Corporate Tax Statistics
  database: the central government rate plus the sub-central rate, adjusted where sub-central tax is deductible
  at central level (for the United States an average of state rates, for Germany trade tax at an average multiplier).
  Rows are keyed by the OECD reference area code and carry one column per year; a year is absent where the OECD
  publishes no value. Rates are the statutory headline rates in force for the year and do not reflect preferential
  regimes, small business rates or effective tax burdens. The OECD SDMX response carries no licence statement, so
  the licence is recorded as unstated and the entry held at license-review until a reviewer confirms the OECD terms
  that apply to the dataset.'
