  tolerance: 0
notes: 'Annual turnover thresholds below which domestic businesses need not register for, or collect, VAT/GST, from
  Annex Table 2.5 of OECD Consumption Tax Trends (sheet 2023, position as at 1 September 2023): the national currency,
  whether the threshold governs registration or collection, the general threshold, any other thresholds the table
  lists for special sectors (explained in the table''s country notes), whether voluntary registration is allowed
  and the minimum registration period. 31 of the 37 countries have a numeric general threshold; the rest have none
  or one the table describes only in a country note. The USD columns of the table are formulas and are not copied.
  No licence statement was found in the OECD file or in a byte-stable OECD document, so the licence is recorded
  as unstated and the entry held at license-review.'
