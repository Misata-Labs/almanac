notes: 'OECD Taxing Wages decomposition (dataflow DF_TW_DECOMP) for a single person without children earning 100
  percent of the average wage: the average tax wedge as a percentage of total labour costs, the net personal average
  tax rate as a percentage of gross wage earnings, and employee social security contributions and employer contributions
  plus payroll taxes as percentages of labour costs. Labour costs minus the tax wedge is take-home pay, so the row
  turns a gross-salary value into an employer cost and a net salary. Rows are keyed by ISO 3166-1 alpha-3 code and
  carry the OECD reference-area label; OECD, EU and G7 aggregates are left out. Values are the 2025 observations
  of the dataflow. The OECD terms and conditions page could not be fetched byte-stably in this session, so the licence
  is recorded as unstated and the entry stays at license-review until a reviewer confirms the terms that apply to
  OECD data.'
