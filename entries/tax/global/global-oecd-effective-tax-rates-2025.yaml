notes: 'Forward-looking effective tax rates the OECD computes from each jurisdiction''s statutory rate and capital
  allowance rules for a hypothetical investment: the effective average tax rate (EATR) measures the tax share of
  a profitable project''s pre-tax return and drives location choices; the effective marginal tax rate (EMTR) measures
  the tax wedge on a marginal project and drives investment scale. The figures are the composite asset (a weighted
  mix of buildings, tangibles, software and inventories) under the scenario with common fixed interest and inflation
  rates, as published to several decimal places. They are model outputs, not observed tax payments. The OECD SDMX
  response carries no licence statement, so the licence is recorded as unstated and the entry held at license-review
  until a reviewer confirms the OECD terms that apply to the dataset.'
