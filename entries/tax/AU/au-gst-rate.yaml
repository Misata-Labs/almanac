notes: Section 9-70 of the A New Tax System (Goods and Services Tax) Act 1999 sets the GST on a taxable supply as
  a percentage of its value, and section 9-75 values a supply at the GST-inclusive price times 10/11, so the GST
  inside a GST-inclusive price is one eleventh of it. GST-free and input-taxed supplies carry no GST and are not
  slabs. The text is the authorised compilation in force from the compilation date, which sets valid_from (the rate
  itself is older). The Federal Register of Legislation PDF for a compilation does not change once registered. Its
  licence is not stated in the document, so the licence is unstated and the entry held at license-review.
