notes: 'Singapore''s goods and services tax as the IRAS general guide for businesses states it: the standard rate
  since the date in paragraph 2.1 (valid_from), the zero rate for exports of goods and international services (paragraph
  4.2), and the guide''s own worked example of tax on a tax-exclusive price (paragraph 5.5.2); the guide gives the
  tax fraction for tax-inclusive amounts in paragraph 5.5.4. Exempt and out-of-scope supplies carry no GST and are
  not slabs. The guide''s URL carries IRAS''s document version, so it is pinned to this edition; the HTML rate page
  is not cited because its links carry version suffixes. IRAS states no licence in the guide, so the entry is held
  at license-review.'
