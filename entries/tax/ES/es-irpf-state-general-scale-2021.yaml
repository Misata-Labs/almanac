notes: 'The state general scale (escala general estatal) of the IRPF in article 63.1 of Ley 35/2006, as article
  58 of Ley 11/2020 (the 2021 State Budget Act) rewrote it with effect from 1 January 2021 and indefinite validity;
  the BOE consolidated text of article 63 showed no later version when this entry was built. For each row, the tax
  (cuota íntegra) at the lower bound plus the applicable rate on the rest of the general taxable base. This is only
  the state half: each autonomous community applies its own scale to the same base, and the scale is applied to
  the base and to the personal and family minimum separately, with the result for the minimum subtracted (article
  63.1.2.º); neither step is modelled. The source vectors are the cuota íntegra column; the other vector is computed
  from the scale. The BOE XML carries no licence statement, so the licence is recorded as unstated and the entry
  stays at license-review.'
