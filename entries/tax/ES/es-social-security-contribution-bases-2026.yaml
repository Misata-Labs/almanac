notes: 'Minimum and maximum common-contingency contribution bases of the Spanish General Social Security Scheme
  from 1 January 2026, keyed by contribution group (grupo de cotización) 1 to 11 with its professional categories:
  groups 1 to 7 per month and groups 8 to 11 per day, as article 3 of Orden PJC/297/2026 states them, plus the general
  ceiling (article 2.1, set by Real Decreto-ley 3/2026) and the floor for occupational contingencies (article 2.2).
  A generator assigns an employee a group from the job category and clamps the contribution base between the group''s
  bounds. The order applies until the 2026 State Budget Act is approved. The BOE XML carries no licence statement,
  so the licence is recorded as unstated and the entry stays at license-review.'
