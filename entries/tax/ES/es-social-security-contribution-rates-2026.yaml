notes: 'Percentage contribution rates of the Spanish General Social Security Scheme from 1 January 2026 under Orden
  PJC/297/2026, each with its employer and employee share: common contingencies (article 4), unemployment for open-ended
  and for fixed-term contracts, the wage guarantee fund (employer only) and vocational training (article 33), and
  the intergenerational equity mechanism (article 16). Occupational accident and disease premiums follow a tariff
  by activity and are employer-only; overtime surcharges and the solidarity contribution on pay above the maximum
  base are not in this entry. The BOE XML carries no licence statement, so the licence is recorded as unstated and
  the entry stays at license-review.'
