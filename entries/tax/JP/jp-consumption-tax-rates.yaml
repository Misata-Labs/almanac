notes: 'Japan''s consumption tax as the National Tax Agency''s English guidance states it: from 1 October 2019 a
  standard rate and a reduced rate (food and drink other than alcohol and dining out, and subscription newspapers
  issued at least twice a week), each split into a national consumption tax and a local consumption tax; the combined
  rate before that date is kept for history. A business whose taxable sales in the base period do not exceed the
  stated threshold is in principle exempt. Rounding to whole yen is a convenience for demos, not a rule from the
  source. The NTA page is static HTML and byte-stable; it states no licence, so the entry is held at license-review.'
