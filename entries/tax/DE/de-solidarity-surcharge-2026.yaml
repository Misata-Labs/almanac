notes: 'The Solidaritätszuschlag on assessed income tax: a percentage of the income tax base, levied only when the
  base exceeds the exemption limit (Freigrenze), which applies at the joint figure for spouses assessed under §
  32a(5) and (6) EStG; above the limit the surcharge is capped at the phase-in percentage of the excess over the
  limit, and fractions of a cent are dropped. SolZG § 6(27) applies the § 3(3) limits from the 2026 assessment period.
  The rule takes the income tax base as input; the base for wage tax withholding uses the monthly, weekly and daily
  fractions of the limits in § 3(4) and is not modelled. Tax on capital income under § 32d(3) and (4) EStG is surcharged
  at the full rate regardless of the limit and is outside this rule. Vectors other than the two limits are computed
  from the statutory formula. Gesetze im Internet carries no licence statement, so the licence is recorded as unstated
  and the entry stays at license-review.'
