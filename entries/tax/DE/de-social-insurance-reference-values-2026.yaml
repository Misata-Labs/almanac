notes: 'The Sozialversicherungsrechengrößen-Verordnung 2026 (BGBl. 2025 I Nr. 278): the reference amount (Bezugsgröße)
  of SGB IV § 18, the compulsory health insurance thresholds of SGB V § 6(6) and, for employees already privately
  insured at the end of 2002, § 6(7), the provisional average earnings in the pension insurance for 2026, and the
  pension and unemployment insurance contribution ceilings for the general and miners'' pension insurance, each
  as an annual amount and the monthly amount the ordinance states. Earnings above a ceiling carry no contributions.
  The ordinance has applied a single nationwide set of values since the east-west split ended, and the health and
  long-term care contribution ceiling for 2026 is not among the values it fixes; SGB V § 223 as now consolidated
  only states the 2027 ceiling. Gesetze im Internet carries no licence statement, so the licence is recorded as
  unstated and the entry stays at license-review.'
