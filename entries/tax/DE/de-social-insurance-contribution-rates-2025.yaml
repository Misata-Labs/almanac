notes: 'Percentage contribution rates of the German statutory social insurance read from the consolidated laws on
  Gesetze im Internet: the general pension insurance rate fixed by the Beitragssatzverordnung 2018, the general
  and reduced statutory health insurance rates (SGB V, the reduced rate applies to members without sickness-benefit
  entitlement; a fund-specific supplementary rate under SGB V § 242 comes on top and is not in this entry), the
  long-term care insurance rate set from 1 January 2025 by the PBAV 2025 (surcharges and reductions by number of
  children under SGB XI § 55 are not in this entry), and the unemployment insurance rate (SGB III). SGB V § 249
  states that employee and employer each bear half of the earnings-based health contributions. The pension rate
  of the BSV 2018 was set for 2018 and continues under SGB VI § 158(4) through annual announcements in the Bundesgesetzblatt
  that are not on this site, so a reviewer should confirm no later ordinance changed it. valid_from is the day the
  long-term care rate took effect; the other rates were already in force. Gesetze im Internet carries no licence
  statement, so the licence is recorded as unstated.'
