notes: 'Monthly Kindergeld per child (EStG § 66(1)) and the two annual child allowances deducted in the income tax
  assessment: the Kinderfreibetrag for the child''s material subsistence minimum and the allowance for care, upbringing
  or education (Betreuungs- und Erziehungs- oder Ausbildungsbedarf), both per parent; § 32(6) sentence 2 doubles
  them for spouses assessed jointly when the child is the child of both. In the assessment the tax office compares
  the tax saving from the allowances with the Kindergeld received (Günstigerprüfung, § 31) and the rule does not
  model that comparison. The Kindergeld and Kinderfreibetrag figures were set by Article 2 of the Steuerfortentwicklungsgesetz,
  which entered into force on 1 January 2026; the care allowance is the figure in the consolidated text and was
  already in force on that date. Gesetze im Internet carries no licence statement, so the licence is recorded as
  unstated and the entry stays at license-review.'
