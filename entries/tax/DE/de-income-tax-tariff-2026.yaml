notes: 'The German tariff income tax (tarifliche Einkommensteuer) applicable from the 2026 assessment period as
  § 32a EStG states it: nil up to the basic allowance (Grundfreibetrag), two progressive zones that are quadratic
  in y (one ten-thousandth of the income above the basic allowance) and z (one ten-thousandth of the income above
  the zone 3 offset), then linear zones at 42 and 45 percent less a fixed amount. Taxable income is rounded down
  to full euros before the formula and the tax is rounded down to full euros. Spouses assessed jointly under §§
  26, 26b pay twice the tariff on half their joint taxable income (§ 32a(5)). The statute contains no worked examples;
  the source vectors restate the nil zone and the zone 3 constant, which equals the zone 2 formula at the zone 2
  upper bound, and the other vectors are computed from the statutory formula. Wage tax withheld by employers follows
  the Federal Ministry of Finance''s Programmablaufplan, which also deducts allowances not modelled here. The Steuerfortentwicklungsgesetz
  (BGBl. 2024 I Nr. 449) states that its Article 2, which introduced this tariff, entered into force on 1 January
  2026. Gesetze im Internet carries no licence statement, so the licence is recorded as unstated and the entry stays
  at license-review.'
