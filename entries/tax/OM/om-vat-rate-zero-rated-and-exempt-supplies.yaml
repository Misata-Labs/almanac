assumed:
- parameter: valid_from
  value: '2021-06-01'
  method: derived
  rationale: The law came into force 180 days after its gazette publication, a date the fetched text does not give;
    valid_from is the June 2021 edition date of the Tax Authority's VAT return guide, the earliest date the fetched
    sources confirm the tax in force.
- parameter: rounding
  value: '0.001'
  method: assumed
  rationale: Three decimal places for the Omani rial (ISO 4217); the law does not state a rounding rule.
