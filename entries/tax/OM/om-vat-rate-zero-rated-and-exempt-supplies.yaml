notes: 'Oman VAT under the Value Added Tax Law promulgated by Royal Decree 121/2020 (issued 12 October 2020, in
  force 180 days after publication in the Official Gazette): 5% of the taxable value (Article 36), with prices shown
  inclusive of tax (Article 37). Exempt supplies (Article 47) and zero-rated supplies (Articles 51 and 52) are held
  as code lists. The registration thresholds are set by a Chairman''s decision that the Tax Authority publishes
  only as a scanned image, so they are not included. The Omani rial has three decimal places, used as the rounding
  step.'
