id: om-income-tax-rates
title: 'Oman income tax rates: 15% corporate, 3% small enterprise, 10% withholding on non-residents, 55% petroleum'
kind: rule
domain: tax
region: OM
status: license-review
tier: B
valid_from: '2024-12-16'
valid_to: null
tags:
- gcc
- tax
- corporate-tax
- withholding-tax
- oman
use_cases:
- tax-demo
- invoicing-demo
- invoicing
- tax-filing-demo
- financial-reporting
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    unit: percent
    rows:
      standard:
        rate_percent: 15
        base: taxable income of any establishment, Omani company or permanent establishment
        article: '112'
      non_resident_withholding:
        rate_percent: 10
        base: gross amount of income under Article 52
        article: '113'
      petroleum:
        rate_percent: 55
        base: taxable income from the sale of petroleum
        article: '114'
      small_enterprise:
        rate_percent: 3
        base: taxable income of an enterprise meeting Article 159bis
        article: 159bis 15
    small_enterprise_conditions:
      max_registered_capital_omr: 50000
      max_gross_income_omr: 100000
      max_average_employees: 15
  vectors:
  - input:
      key: standard
      column: rate_percent
    expected: 15
    origin: source
  - input:
      key: small_enterprise
      column: rate_percent
    expected: 3
    origin: source
  - input:
      key: non_resident_withholding
      column: rate_percent
    expected: 10
    origin: source
  - input:
      key: petroleum
      column: rate_percent
    expected: 55
    origin: source
