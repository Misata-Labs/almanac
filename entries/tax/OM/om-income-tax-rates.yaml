notes: 'Income tax rates in Oman from the Tax Authority''s consolidated English text of the Income Tax Law (Royal
  Decree 28/2009 as amended by Royal Decree 118/2020): 15% of the taxable income of establishments, Omani companies
  and permanent establishments (Article 112); 10% of the gross amount withheld on the non-resident income listed
  in Article 52 (Article 113); 55% on petroleum income (Article 114); and 3% for small enterprises with registered
  capital up to OMR 50,000, gross income up to OMR 100,000 and at most 15 employees on average, excluding owner-managed
  enterprises and those employing at least two Omanis (Article 159bis). The English text is a draft translation
  for guidance; the Arabic text prevails.'
