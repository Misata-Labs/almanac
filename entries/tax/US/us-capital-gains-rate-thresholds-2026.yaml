assumed:
- parameter: rates_percent
  value:
  - 0
  - 15
  - 20
  method: derived
  rationale: The revenue procedure names the zero and 15 percent rate amounts; the 20 percent rate above the second
    threshold is the statutory maximum capital gains rate of section 1(h) the section heading refers to.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 5
  tolerance: 0
- statistic: max[maximum_15_percent_rate_amount]
  expected: 613700
  tolerance: 0
notes: 'Maximum zero rate amount and maximum 15 percent rate amount under section 1(j)(5)(B) for 2026: net capital
  gain and qualified dividends fall in the 0% band while taxable income is at or below the first figure, in the
  15% band up to the second, and at 20% above it. Figures as Rev. Proc. 2025-32 adjusts them; ''All Other Individuals''
  covers single filers. The 0, 15 and 20 percent rates themselves are those the section names and are carried for
  context. Works of the US federal government carry no copyright in the United States, but the cited documents state
  no reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
