notes: 'The 2026 Annual Percentage Method tables of IRS Publication 15-T for automated payroll systems, both the
  STANDARD Withholding Rate Schedules (Form W-4 Step 2 not checked, Forms W-4 from 2019 or earlier, and Forms W-4P)
  and the Form W-4 Step 2 Checkbox schedules, with the fixed amounts Worksheet 1A uses: the Step 2 adjustment subtracted
  when the box is not checked, the value of one allowance on a pre-2020 Form W-4, and the pay periods per year.
  The rule implements Worksheet 1A: annualise the period''s wages, add Step 4(a), subtract Step 4(b) and the Step
  2 adjustment, look up the row, divide by the pay periods, subtract Step 3 credits per period and add Step 4(c).
  It returns cents; Publication 15-T allows employers to round withholding to whole dollars if they do so consistently.
  Source vectors are table rows; worksheet vectors are computed from the parsed tables. The cited URL is the current
  edition of the publication, which the IRS replaces with the 2027 edition at the end of 2026. Works of the US federal
  government carry no copyright in the United States, but the cited documents state no reuse terms, so the licence
  is recorded as unstated and the entry held at license-review.'
