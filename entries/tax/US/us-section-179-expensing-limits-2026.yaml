notes: Section 179 lets a business expense the cost of qualifying property in the year it is placed in service instead
  of depreciating it. For taxable years beginning in 2026 the maximum is reduced dollar for dollar by the cost of
  section 179 property placed in service above the phase-out threshold, and the cost of a sport utility vehicle
  counts only up to its own cap. Public Law 119-21 raised the base amounts for property placed in service in taxable
  years beginning after 2024; Rev. Proc. 2025-32 indexes them. Works of the US federal government carry no copyright
  in the United States, but the cited documents state no reuse terms, so the licence is recorded as unstated and
  the entry held at license-review.
