spec:
  implementation: almanac.rules.us_bonus_depreciation
  parameters:
    full_expensing_acquired_after: '2025-01-19'
    full_expensing_percent: 100
    phase_down:
      general:
      - placed_in_service_after: '2017-09-27'
        placed_in_service_before: '2023-01-01'
        percent: 100
      - placed_in_service_after: '2022-12-31'
        placed_in_service_before: '2024-01-01'
        percent: 80
      - placed_in_service_after: '2023-12-31'
        placed_in_service_before: '2025-01-01'
        percent: 60
      - placed_in_service_after: '2024-12-31'
        placed_in_service_before: '2026-01-01'
        percent: 40
      - placed_in_service_after: '2025-12-31'
        placed_in_service_before: '2027-01-01'
        percent: 20
      longer_production_period:
      - placed_in_service_after: '2017-09-27'
        placed_in_service_before: '2024-01-01'
        percent: 100
      - placed_in_service_after: '2023-12-31'
        placed_in_service_before: '2025-01-01'
        percent: 80
      - placed_in_service_after: '2024-12-31'
        placed_in_service_before: '2026-01-01'
        percent: 60
      - placed_in_service_after: '2025-12-31'
        placed_in_service_before: '2027-01-01'
        percent: 40
      - placed_in_service_after: '2026-12-31'
        placed_in_service_before: '2028-01-01'
        percent: 20
    binding_contract_rule: property is not treated as acquired after the date on which a written binding contract
      is entered into for its acquisition (Public Law 119-21 section 70301(c)(4))
    transitional_election: for the first taxable year ending after January 19, 2025 a taxpayer may elect 40 percent
      (60 percent for longer production period property) instead of 100 percent
  vectors:
  - input:
      acquired: '2025-03-01'
      placed_in_service: '2025-04-01'
    expected: 100
    origin: source
    note: 'Public Law 119-21 section 70301: acquired after January 19, 2025'
  - input:
      acquired: '2024-06-01'
      placed_in_service: '2024-07-01'
    expected: 60
    origin: source
    note: section 168(k)(6)(A)(iii)
  - input:
      acquired: '2024-12-01'
      placed_in_service: '2025-06-01'
    expected: 40
    origin: source
    note: 'section 168(k)(6)(A)(iv): acquired before the Act''s effective date'
  - input:
      acquired: '2024-12-01'
      placed_in_service: '2026-03-01'
    expected: 20
    origin: source
    note: section 168(k)(6)(A)(v)
  - input:
      acquired: '2024-12-01'
      placed_in_service: '2026-03-01'
      longer_production_period: true
    expected: 40
    origin: source
    note: section 168(k)(6)(B)(iv)
  - input:
      acquired: '2019-05-01'
      placed_in_service: '2019-05-02'
    expected: 100
    origin: source
    note: section 168(k)(6)(A)(i)
  - input:
      acquired: '2024-12-01'
      placed_in_service: '2027-02-01'
    expected: 0
    origin: derived
    note: after the last phase-down window
  - input:
      acquired: '2026-11-01'
      placed_in_service: '2031-01-01'
    expected: 100
    origin: derived
    note: full expensing has no end date
