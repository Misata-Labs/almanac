notes: Section 168(k) allows a first-year deduction of a percentage of the adjusted basis of qualified property.
  The Tax Cuts and Jobs Act set the percentage at 100 for property placed in service after 27 September 2017 and
  phased it down by 20 points a year from 2023 (one year later for longer production period property). Public Law
  119-21 replaced the applicable percentage with 100 percent and removed the phase-down for property acquired after
  19 January 2025; property acquired on or before that date under a binding contract keeps the phase-down by placed-in-service
  date. The schedule is read from the 2024 edition of the Code and the change from the public law. Specified plants,
  the transitional election of a reduced percentage, elections out and the pre-2017 regime for property acquired
  before 28 September 2017 are outside the rule. Works of the US federal government carry no copyright in the United
  States, but the cited resources state no reuse terms, so the licence is recorded as unstated and the entry held
  at license-review.
