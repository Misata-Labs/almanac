notes: 'Employer payroll figures for 2026 from IRS Publication 15 (Circular E): the social security wage base (wages
  above it are free of the 6.2% OASDI tax; Medicare tax has no wage base), the FUTA tax rate, wage base and maximum
  credit for state unemployment contributions, the flat and mandatory withholding rates on supplemental wages, the
  backup withholding rate, and the cash-pay thresholds for household and election workers. The FUTA rate and wage
  base are cross-checked against 26 U.S.C. 3301 and 3306(b)(1). FICA rates and the Additional Medicare Tax thresholds
  are in us-fica-tax-rates. The Publication 15 URL is the current edition, which the IRS replaces each December.
  Works of the US federal government carry no copyright in the United States, but the cited documents state no reuse
  terms, so the licence is recorded as unstated and the entry held at license-review.'
