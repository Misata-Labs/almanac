id: us-payroll-tax-wage-bases-and-withholding-rates-2026
title: 'US federal payroll tax limits for 2026: social security wage base, FUTA rate and wage base, supplemental
  and backup withholding'
kind: rule
domain: tax
region: US
status: license-review
tier: B
valid_from: '2026-01-01'
valid_to: '2026-12-31'
tags:
- tax
- payroll
- payroll-tax
- social-security
- futa
- supplemental-wages
- limits
- publication-15
use_cases:
- payroll-demo
- hr-demo
- tax-demo
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    tax_year: '2026'
    currency: USD
    rows:
      social_security_wage_base:
        value: 184500
        unit: USD
        description: maximum wages subject to social security (OASDI) tax in 2026, employee and employer each
      futa_rate:
        value: 6.0
        unit: percent
        description: federal unemployment tax rate before the state credit
        statute: 26 U.S.C. 3301
      futa_wage_base:
        value: 7000
        unit: USD
        description: FUTA wages per employee per year
        statute: 26 U.S.C. 3306(b)(1)
      futa_maximum_state_credit:
        value: 5.4
        unit: percent
        description: maximum credit for state unemployment contributions
      futa_rate_after_maximum_credit:
        value: 0.6
        unit: percent
        description: FUTA rate after the maximum state credit (no credit reduction)
      supplemental_wage_flat_rate:
        value: 22.0
        unit: percent
        description: optional flat withholding rate on supplemental wages up to $1 million in the year
      supplemental_wage_rate_over_1_million:
        value: 37.0
        unit: percent
        description: mandatory withholding rate on supplemental wages above $1 million in the year
      supplemental_wage_mandatory_threshold:
        value: 1000000
        unit: USD
        description: supplemental wages in the calendar year above which the mandatory rate applies
      backup_withholding_rate:
        value: 24.0
        unit: percent
        description: backup withholding rate
      household_worker_cash_wage_threshold:
        value: 3000
        unit: USD
        description: cash wages to a household worker in 2026 at which social security and Medicare taxes apply
      election_worker_threshold:
        value: 2500
        unit: USD
        description: pay to an election worker in 2026 at which social security and Medicare taxes apply
  vectors:
  - input:
      key: social_security_wage_base
      column: value
    expected: 184500
    origin: source
  - input:
      key: futa_rate
      column: value
    expected: 6.0
    origin: source
  - input:
      key: futa_wage_base
      column: value
    expected: 7000
    origin: source
  - input:
      key: futa_maximum_state_credit
      column: value
    expected: 5.4
    origin: source
  - input:
      key: futa_rate_after_maximum_credit
      column: value
    expected: 0.6
    origin: source
  - input:
      key: supplemental_wage_flat_rate
      column: value
    expected: 22.0
    origin: source
  - input:
      key: supplemental_wage_rate_over_1_million
      column: value
    expected: 37.0
    origin: source
  - input:
      key: supplemental_wage_mandatory_threshold
      column: value
    expected: 1000000
    origin: source
  - input:
      key: backup_withholding_rate
      column: value
    expected: 24.0
    origin: source
  - input:
      key: household_worker_cash_wage_threshold
      column: value
    expected: 3000
    origin: source
  - input:
      key: election_worker_threshold
      column: value
    expected: 2500
    origin: source
  - input: state_unemployment_wage_base
    expected: false
    origin: derived
    note: not a figure this entry covers
