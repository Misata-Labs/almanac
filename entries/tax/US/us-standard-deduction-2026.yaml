notes: The 2026 basic standard deduction under section 63(c)(2) for each filing status, the limit on a dependent's
  standard deduction under section 63(c)(5), and the additional standard deduction under section 63(f) for a taxpayer
  who is 65 or older or blind (claimed once for each condition), as Rev. Proc. 2025-32 states them for taxable years
  beginning in 2026. Public Law 119-21 raised the base amounts from which these are indexed. A synthetic return
  subtracts the larger of this deduction and itemised deductions from adjusted gross income before applying the
  rate schedule. Works of the US federal government carry no copyright in the United States, but the cited documents
  state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.
