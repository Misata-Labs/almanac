notes: 'Unmarried individuals other than surviving spouses and heads of households: the 2026 tax rate table of section
  1(j)(2) of the Internal Revenue Code as Rev. Proc. 2025-32 adjusts it for inflation, reflecting Public Law 119-21
  (commonly known as the One, Big, Beautiful Bill Act), which made the seven individual rates permanent. The rule
  takes taxable income, so personal_allowance is zero; subtract the standard deduction (us-standard-deduction-2026)
  or itemised deductions first. Each vector at a bracket ceiling reproduces the dollar base the revenue procedure
  prints for the next bracket. The revenue procedure applies to taxable years beginning in 2026; the build checks
  that every printed base equals the cumulative tax of the brackets below it. Works of the US federal government
  carry no copyright in the United States, but the cited documents state no reuse terms, so the licence is recorded
  as unstated and the entry held at license-review.'
