notes: 'The Federal Insurance Contributions Act rates: the old-age, survivors and disability insurance (Social Security)
  and hospital insurance (Medicare) taxes on wages paid by the employee (26 U.S.C. 3101) and by the employer (26
  U.S.C. 3111), and the additional hospital insurance tax on an employee''s wages above a filing-status threshold.
  The statute states no wage base for the Social Security tax; the annual contribution and benefit base is set under
  42 U.S.C. 430 and published by the Social Security Administration, and is not part of this entry. The married-filing-separately
  threshold is stated in the statute as half of the joint-return amount; threshold_rule carries that wording and
  threshold_usd the result. US federal statutes carry no copyright, but the govinfo page states no reuse terms,
  so the licence is recorded as unstated and the entry held at license-review; the HTML form of the source makes
  the entry tier B.'
