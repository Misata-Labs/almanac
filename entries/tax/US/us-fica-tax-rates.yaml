assumed:
- parameter: rows.employee_additional_hospital_insurance_married_filing_separately.threshold_usd
  value: 125000
  method: derived
  rationale: Subparagraph (B) states the threshold as half of the joint-return amount rather than as a figure; threshold_rule
    keeps the statutory wording.
- parameter: valid_from
  value: '2014-12-19'
  method: derived
  rationale: The current wording of the rate subsections dates from the 2014 amendment whose effective date the
    section's notes give; the rates themselves have applied since earlier years, and the additional Medicare tax
    since taxable years beginning after December 31, 2012.
