notes: Section 1061 recharacterises as short-term capital gain the part of a taxpayer's net long-term capital gain
  on an applicable partnership interest (a carried interest received for substantial services in a business of raising
  or returning capital and investing in specified assets) that would not be long-term if the holding period were
  more than three years instead of more than one. Interests held by a corporation and capital interests commensurate
  with capital contributed are excluded. The rule applies to taxable years beginning after 31 December 2017 and
  was not changed by Public Law 119-21. Works of the US federal government carry no copyright in the United States,
  but the cited resources state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.
