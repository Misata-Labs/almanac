id: us-carried-interest-section-1061-holding-period
title: US carried interest three-year holding period for applicable partnership interests (26 U.S.C. 1061)
kind: rule
domain: tax
region: US
status: license-review
tier: B
valid_from: '2018-01-01'
valid_to: null
tags:
- tax
- private-equity
- structuring
- carried-interest
- section-1061
- capital-gains
- fund-manager
use_cases:
- fund-administration-demo
- tax-demo
- lbo-modelling
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    rows:
      applicable_partnership_interest_holding_period:
        value: 3
        unit: years
        comparison: more than
        section: 1061(a)
        description: long-term capital gain on an applicable partnership interest is recharacterised as short-term
          unless the asset was held for more than this period
      general_long_term_holding_period:
        value: 1
        unit: years
        comparison: more than
        section: 1222(3)
        description: the general holding period for long-term capital gain that section 1061 replaces for these
          interests
    applicable_trade_or_business: raising or returning capital and investing in, disposing of or developing specified
      assets (securities, commodities, real estate held for rental or investment, cash, options or derivatives on
      them)
  vectors:
  - input:
      key: applicable_partnership_interest_holding_period
      column: value
    expected: 3
    origin: source
  - input:
      key: general_long_term_holding_period
      column: value
    expected: 1
    origin: derived
    note: section 1222 is cited by section 1061(a)(2) but not fetched
  - input: capital_interest_exception
    expected: false
    origin: derived
    note: the exceptions are described in the notes, not as rows
