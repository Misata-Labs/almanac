notes: 'Optional standard mileage rates from IRS Notice 2026-10 for costs of operating an automobile from January
  1, 2026: business, charitable (set by statute), and medical or qualifying moving use, in cents per mile; the depreciation
  component of the business rate used to reduce basis; the maximum standard automobile cost for a fixed and variable
  rate (FAVR) plan; and the maximum value of an employer-provided automobile first made available in 2026 for the
  fleet-average and vehicle cents-per-mile valuation rules. Unreimbursed employee travel remains non-deductible
  as an itemised deduction except for the groups the notice lists. Reimbursement up to the business rate is the
  usual accountable-plan pattern. Works of the US federal government carry no copyright in the United States, but
  the cited documents state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
