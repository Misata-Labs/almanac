notes: 'The section 32(b) amounts for 2026 by number of qualifying children: the earned income at which the maximum
  credit is reached, the maximum credit, and the adjusted gross income (or earned income, if greater) at which the
  credit starts to phase out and is fully phased out, for joint filers and for all other filing statuses. The credit
  is not allowed when investment income exceeds investment_income_limit. The IRS publishes the credit for each income
  in the Form 1040 instructions; this entry carries the table that drives it. Works of the US federal government
  carry no copyright in the United States, but the cited documents state no reuse terms, so the licence is recorded
  as unstated and the entry held at license-review.'
