notes: 'Alternative minimum tax for 2026: the exemption amount under section 55(d)(1) by filing status, the alternative
  minimum taxable income at which it starts to phase out and the amount at which it is fully phased out (section
  55(d)(2)), and the excess taxable income above which the 28 percent AMT rate applies (section 55(b)(1)), carried
  in rate_28_percent_threshold. Public Law 119-21 made the higher exemption and phase-out amounts permanent and
  held the joint-return threshold of $1,000,000 unindexed until 2027, as section 2.07 of the revenue procedure explains.
  Works of the US federal government carry no copyright in the United States, but the cited documents state no reuse
  terms, so the licence is recorded as unstated and the entry held at license-review.'
