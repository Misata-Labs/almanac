id: us-qsbs-section-1202-gain-exclusion
title: 'US qualified small business stock gain exclusion (26 U.S.C. 1202) before and after Public Law 119-21: percentages,
  holding periods, caps'
kind: rule
domain: tax
region: US
status: license-review
tier: B
valid_from: '1993-08-10'
valid_to: null
tags:
- tax
- private-equity
- structuring
- qsbs
- section-1202
- capital-gains
- exit
- obbba
use_cases:
- lbo-modelling
- valuation-demo
- tax-demo
- pe-portfolio-demo
spec:
  implementation: almanac.rules.us_qsbs_exclusion
  parameters:
    currency: USD
    applicable_date: '2025-07-04'
    acquisition_periods:
    - acquired_after: '1993-08-10'
      acquired_on_or_before: '2009-02-17'
      percent: 50
      more_than_years: 5
      section: 1202(a)(1)(A)
    - acquired_after: '2009-02-17'
      acquired_on_or_before: '2010-09-27'
      percent: 75
      more_than_years: 5
      section: 1202(a)(3)
    - acquired_after: '2010-09-27'
      acquired_on_or_before: '2025-07-04'
      percent: 100
      more_than_years: 5
      section: 1202(a)(4)
    holding_schedule:
    - years_held: 3
      percent: 50
    - years_held: 4
      percent: 75
    - years_held: 5
      percent: 100
    dollar_limit:
      on_or_before_applicable_date: 10000000
      after_applicable_date: 15000000
    married_filing_separately_dollar_limit_on_or_before_applicable_date: 5000000
    basis_multiple: 10
    aggregate_gross_assets_limit:
      stock_issued_on_or_before_applicable_date: 50000000
      stock_issued_after_applicable_date: 75000000
    inflation_adjustment:
      amounts:
      - dollar_limit.after_applicable_date
      - aggregate_gross_assets_limit.stock_issued_after_applicable_date
      taxable_years_beginning_after: 2026
      base_year: 2025
      rounding_multiple: 10000
  vectors:
  - input:
      acquired: '2025-08-01'
      sold: '2028-08-01'
    expected: 50
    origin: source
    note: 'new section 1202(a)(5): 3 years held'
  - input:
      acquired: '2025-08-01'
      sold: '2029-08-01'
    expected: 75
    origin: source
    note: 'new section 1202(a)(5): 4 years held'
  - input:
      acquired: '2025-08-01'
      sold: '2030-08-01'
    expected: 100
    origin: source
    note: 'new section 1202(a)(5): 5 years or more'
  - input:
      acquired: '2015-01-15'
      sold: '2020-01-16'
    expected: 100
    origin: source
    note: 'section 1202(a)(4): acquired after the 2010 Act, held more than 5 years'
  - input:
      acquired: '2009-06-01'
      sold: '2015-06-02'
    expected: 75
    origin: source
    note: section 1202(a)(3)
  - input:
      acquired: '2005-03-01'
      sold: '2012-03-02'
    expected: 50
    origin: source
    note: section 1202(a)(1)
  - input:
      acquired: '2025-08-01'
      sold: '2028-07-31'
    expected: 0
    origin: derived
    note: one day short of 3 years
  - input:
      acquired: '2015-01-15'
      sold: '2020-01-15'
    expected: 0
    origin: derived
    note: exactly 5 years is not more than 5 years
  - input:
      acquired: '2026-01-02'
      sold: '2031-01-02'
      gain: 20000000
      adjusted_basis: 1000000
    expected: 15000000
    origin: derived
    note: capped at the dollar limit, which exceeds 10 times basis
  - input:
      acquired: '2026-01-02'
      sold: '2031-01-02'
      gain: 20000000
      adjusted_basis: 2500000
    expected: 20000000
    origin: derived
    note: 10 times basis exceeds the gain
  - input:
      acquired: '2026-01-02'
      sold: '2030-01-02'
      gain: 8000000
      adjusted_basis: 100000
    expected: 6000000
    origin: derived
    note: '4 years held: 75% of the gain'
  - input:
      acquired: '2014-03-01'
      sold: '2024-03-01'
      gain: 12000000
      adjusted_basis: 500000
      prior_eligible_gain: 4000000
    expected: 6000000
    origin: derived
    note: dollar limit reduced by prior eligible gain from the same issuer
