notes: 'Section 1202 lets a non-corporate holder exclude part of the gain on stock of a qualified small business
  (a C corporation with aggregate gross assets within the limit when the stock is issued) acquired at original issue.
  Stock acquired on or before the applicable date (the date Public Law 119-21 was enacted) keeps the earlier regime:
  50, 75 or 100 percent depending on the acquisition window, only if held for more than five years, with a per-issuer
  cap of the greater of the dollar limit (reduced by earlier eligible gain from the issuer) and ten times the adjusted
  basis of the stock sold. Stock acquired after that date qualifies after three years, with the exclusion stepping
  up by whole years held, a higher dollar limit and, for stock issued after that date, a higher gross assets limit;
  both new amounts are indexed for taxable years beginning after 2026. The pre-enactment text is read from the 2024
  edition of the Code and the changes from the public law itself, since no edition of the Code yet incorporates
  them. The rule does not model the empowerment-zone percentage, the AMT preference, the qualified trade or business
  tests, or the reduction of the post-enactment dollar limit for same-year gain on older stock of the same issuer.
  Works of the US federal government carry no copyright in the United States, but the cited resources state no reuse
  terms, so the licence is recorded as unstated and the entry held at license-review.'
