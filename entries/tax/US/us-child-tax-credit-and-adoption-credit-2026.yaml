notes: 'Credit amounts for 2026 from Rev. Proc. 2025-32: the maximum child tax credit per qualifying child under
  section 24(a) and the part that may be refundable under section 24(d)(1)(A); the adoption credit for a child with
  special needs and the cap on qualified adoption expenses for other adoptions under section 23, its modified adjusted
  gross income phase-out range, and the refundable portion that Public Law 119-21 introduced in section 23(a)(4).
  The child tax credit''s own income phase-out thresholds are statutory and not part of this entry. Works of the
  US federal government carry no copyright in the United States, but the cited documents state no reuse terms, so
  the licence is recorded as unstated and the entry held at license-review.'
