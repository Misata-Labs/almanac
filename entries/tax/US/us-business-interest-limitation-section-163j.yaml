id: us-business-interest-limitation-section-163j
title: 'US business interest limitation (26 U.S.C. 163(j)): 30% of adjusted taxable income, EBITDA add-back by year,
  2026 small business test'
kind: rule
domain: tax
region: US
status: license-review
tier: B
valid_from: '2018-01-01'
valid_to: null
tags:
- tax
