spec:
  implementation: almanac.rules.interest_limitation
  parameters:
    currency: USD
    ratio_percent: 30
    base: adjusted taxable income (section 163(j)(8))
    allowance_floor: null
    exemption_threshold: null
    gross_receipts_limit: 32000000
    gross_receipts_limit_tax_year: 2026
    gross_receipts_limit_statutory_base: 25000000
    depreciation_addback:
    - from: '2018-01-01'
      value: true
    - from: '2022-01-01'
      value: false
    - from: '2025-01-01'
      value: true
    carryforward: disallowed business interest is carried forward indefinitely (section 163(j)(2))
  vectors:
  - input:
      tax_year_start: '2021-01-01'
      earnings: 100
      interest_expense: 50
      floor_plan_interest: 10
      interest_income: 20
      output: limit
    expected: 60
    origin: source
    note: 26 CFR 1.163(j)-2(h)(1), Example 1, amounts in units of x
  - input:
      tax_year_start: '2021-01-01'
      earnings: 100
      interest_expense: 50
      floor_plan_interest: 10
      interest_income: 20
    expected: 50
    origin: source
    note: 'Example 1: business interest expense within the limitation is deductible in full'
  - input:
      tax_year_start: '2021-01-01'
      earnings: 100
      interest_expense: 80
      floor_plan_interest: 10
      interest_income: 20
    expected: 60
    origin: source
    note: 26 CFR 1.163(j)-2(h)(2), Example 2
  - input:
      tax_year_start: '2021-01-01'
      earnings: 100
      interest_expense: 80
      floor_plan_interest: 10
      interest_income: 20
      output: disallowed
    expected: 20
    origin: source
    note: 'Example 2: carried forward'
  - input:
      tax_year_start: '2023-01-01'
      earnings: 70
      depreciation: 30
      interest_expense: 40
    expected: 21
    origin: derived
    note: '2022 to 2024: no depreciation add-back, 30% of 70'
  - input:
      tax_year_start: '2026-01-01'
      earnings: 70
      depreciation: 30
      interest_expense: 40
    expected: 30
    origin: derived
    note: 'from 2025: depreciation added back, 30% of 100'
  - input:
      tax_year_start: '2026-01-01'
      earnings: 70
      depreciation: 30
      interest_expense: 40
      average_gross_receipts: 32000000
    expected: 40
    origin: derived
    note: small business exemption at the 2026 gross receipts limit
