notes: Section 163(j) caps the deduction for business interest at the sum of business interest income, 30 percent
  of adjusted taxable income (ATI) and floor plan financing interest; the excess carries forward without time limit.
  ATI added back depreciation, amortisation and depletion (an EBITDA measure) for taxable years beginning before
  2022 and, after Public Law 119-21 struck the time limit, again for taxable years beginning after 31 December 2024;
  for 2022 to 2024 it was an EBIT measure. Taxpayers other than tax shelters that meet the section 448(c) gross
  receipts test (average annual gross receipts for the three prior years not above the indexed amount, here the
  amount for taxable years beginning in 2026) are exempt. From 2026 the same Act also removes subpart F and GILTI
  inclusions from ATI (section 70342), which this rule does not model, nor does it model the partnership rules or
  the real property and farming elections. The worked examples are the Treasury regulation's, in units of x. Works
  of the US federal government carry no copyright in the United States, but the cited resources state no reuse terms,
  so the licence is recorded as unstated and the entry held at license-review.
