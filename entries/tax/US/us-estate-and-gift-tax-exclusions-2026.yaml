notes: Federal transfer tax amounts for calendar year 2026. Public Law 119-21 set the basic exclusion amount used
  for the estate and gift tax applicable credit, and with it the generation-skipping transfer exemption, for 2026
  (section 2.14 of Rev. Proc. 2025-32); the annual per-donee gift exclusion, the higher annual exclusion for gifts
  to a non-citizen spouse, the special use valuation cap and the section 6166 '2-percent portion' amount are the
  indexed figures of sections 4.41, 4.42 and 4.51. Works of the US federal government carry no copyright in the
  United States, but the cited documents state no reuse terms, so the licence is recorded as unstated and the entry
  held at license-review.
