notes: Section 199A lets individuals and other non-corporate owners of pass-through businesses deduct 20 percent
  of qualified business income, subject above a taxable-income threshold to wage and capital limits and the exclusion
  of specified service businesses, phased in over a range above the threshold. Public Law 119-21 made the deduction
  permanent (it was to end after 2025), widened the phase-in ranges and added a minimum deduction for taxpayers
  with at least the stated amount of active qualified business income, effective for taxable years beginning after
  2025. The 2026 thresholds and phase-in end points are those Rev. Proc. 2025-32 publishes; the phase-in end equals
  the threshold plus the range. Works of the US federal government carry no copyright in the United States, but
  the cited resources state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.
