notes: 'Table A-1 of IRS Publication 946: the percentage of unadjusted basis deducted in each recovery year for
  3-, 5-, 7-, 10-, 15- and 20-year property under the General Depreciation System with the half-year convention,
  which applies when no more than 40% of the year''s depreciable basis is placed in service in the last quarter.
  A recovery period of n years spans n+1 tax years because of the half-year convention. Multiply the unadjusted
  basis (after any section 179 deduction and special allowance) by the year''s percentage; the publication''s examples
  round the result to whole dollars. Mid-quarter and real property tables are separate. The cited URL is the current
  (2025) edition of the publication; the percentages apply to property placed in service after 1986. Works of the
  US federal government carry no copyright in the United States, but the cited documents state no reuse terms, so
  the licence is recorded as unstated and the entry held at license-review.'
