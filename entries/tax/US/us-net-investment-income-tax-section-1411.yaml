notes: Section 1411 imposes a tax on individuals equal to 3.8 percent of the lesser of net investment income and
  the excess of modified adjusted gross income over a threshold that depends on filing status. Net investment income
  covers interest, dividends, rents, royalties, passive trade or business income and net gains on property not held
  in an active trade or business, so it reaches most fund distributions and exit gains of passive investors. The
  thresholds are fixed in the statute and are not indexed for inflation. Estates and trusts use the start of the
  top bracket instead. Works of the US federal government carry no copyright in the United States, but the cited
  resources state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.
