notes: 'The progressive income tax scale of CGI article 197 I-1 for income earned in 2025 and taxed in 2026, as
  the BOFiP-Impôts (DGFiP''s official tax doctrine) publishes it after the loi n° 2026-103 du 19 février 2026 de
  finances pour 2026 indexed the slice limits by 0.9 percent. The scale applies to taxable income for one part of
  the quotient familial: the household''s net taxable income is divided by its number of parts, the scale applied,
  and the result multiplied back by the parts (CGI article 193); the cap on the benefit of the quotient familial,
  the décote and the tax reductions are not modelled. valid_from and valid_to give the income year the scale taxes.
  The BOFiP page states that its content is under the Licence Ouverte (etalab-2.0); the verifier does not list that
  licence as permissive, so the entry stays at license-review. The page is HTML (tier B) and lists the document''s
  versions, so it may change when the next version is published.'
