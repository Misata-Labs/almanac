notes: Business Asset Disposal Relief (formerly Entrepreneurs' Relief) charges qualifying gains on disposals of
  all or part of a business, or of shares in a personal trading company in which the individual has held at least
  5% of the shares and votes and been an officer or employee for two years, at a reduced Capital Gains Tax rate,
  up to a lifetime limit of qualifying gains. The rate was 10% for disposals on or before 5 April 2025 (kept as
  rate_on_or_before_first_step because the source gives no start date for it), 14% in 2025-26 and 18% from 6 April
  2026. A reduction of the lifetime limit for disposals from 6 April 2027 was announced at Budget 2026 and is recorded
  as announced, not enacted. The guide and the tax information and impact note are published under the Open Government
  Licence.
