notes: A gain (or loss) of a company on a disposal of shares in another company is exempt from corporation tax on
  chargeable gains if the investing company held a substantial shareholding (at least 10% of the ordinary share
  capital and entitlement to at least 10% of distributable profits and of assets on a winding up) throughout a twelve-month
  period beginning no more than six years before the disposal, and the company invested in meets the trading conditions.
  It is the UK participation exemption that makes share sales by UK holding companies tax-free at exit. The text
  is the version in force on the pinned point-in-time date, which is also used as valid_from because the schedule's
  provisions take effect on different dates; the HTML form is cited because the XML lists unapplied effects for
  the Act. legislation.gov.uk publishes Crown copyright legislation for reuse, but the cited resource carries no
  licence statement of its own, so the licence is recorded as unstated and the entry held at license-review.
