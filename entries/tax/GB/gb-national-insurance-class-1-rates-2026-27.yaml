notes: 'Class 1 National Insurance contribution rates for the 2026 to 2027 tax year by category letter, as HMRC''s
  ''Rates and thresholds for employers'' guidance publishes them: employee (primary) rates for earnings between
  the lower earnings limit and primary threshold, between the primary threshold and upper earnings limit, and above
  the upper earnings limit; employer (secondary) rates for earnings between the secondary threshold and lower earnings
  limit, up to the Freeport and Investment Zone upper secondary thresholds, up to the upper earnings limit and above
  it. Each row carries the employee group GOV.UK gives for the letter. Letter X (no contributions) has no rates
  row. The weekly thresholds that delimit the bands are kept beside the rows; the full threshold table is the entry
  gb-national-insurance-class-1-thresholds-2026-27. Source is the GOV.UK content API''s JSON for the page, which
  is stable between editorial updates; GOV.UK publishes its content under the Open Government Licence v3.0.'
