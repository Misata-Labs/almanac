assumed:
- parameter: rows[marriage_allowance_*] and rows[personal_savings_allowance_*, starting_rate_for_savings*]
  value: attributed to the 2026 to 2027 tax year
  method: derived
  rationale: The Marriage Allowance and savings interest pages state current figures without naming the tax year;
    they were fetched during the 2026 to 2027 tax year, and the Personal Allowance they quote matches the 2026 to
    2027 figure HMRC dates.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 13
  tolerance: 0
- statistic: value[personal_allowance,value]
  expected: 12570
  tolerance: 0
- statistic: value[isa_annual_allowance,value]
  expected: 20000
  tolerance: 0
- statistic: max[value]
  expected: 20000
  tolerance: 0
notes: 'The tax-free allowances an individual has for the 2026 to 2027 tax year, gathered from the GOV.UK pages
  that state each one: the £12,570 Personal Allowance, the £1,260 Marriage Allowance transfer worth up to £252,
  the Personal Savings Allowance by band, the £5,000 starting rate for savings, the £500 dividend allowance, the
  Capital Gains Annual Exempt Amount and the £20,000 ISA allowance with the £4,000 Lifetime ISA limit. Each row
  names its basis. The tapering of the Personal Allowance above £100,000 is in gb-income-tax-bands-2026-27. Source
  is the GOV.UK content API''s JSON for the page, which is stable between editorial updates; GOV.UK publishes its
  content under the Open Government Licence v3.0.'
