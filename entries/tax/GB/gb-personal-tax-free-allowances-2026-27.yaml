id: gb-personal-tax-free-allowances-2026-27
title: 'United Kingdom personal tax-free allowances for 2026 to 2027: Personal, Marriage, savings, dividend, capital
  gains and ISA allowances'
kind: rule
domain: tax
region: GB
status: verified
tier: A
valid_from: '2026-04-06'
valid_to: '2027-04-05'
tags:
- allowances
- income-tax
- savings
- isa
- dividends
- capital-gains-tax
use_cases:
- personal-finance
- financial-planning
- tax-filing-demo
- banking-demo
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    tax_year: 2026-27
    currency: GBP
    rows:
      personal_allowance:
        value: 12570
        unit: GBP per year
        basis: standard Personal Allowance
      marriage_allowance_transferable:
        value: 1260
        unit: GBP per year
        basis: Personal Allowance a lower-earning spouse or civil partner can transfer
      marriage_allowance_max_tax_reduction:
        value: 252
        unit: GBP per year
        basis: largest tax saving from the transfer
      personal_savings_allowance_basic_rate:
        value: 1000
        unit: GBP per year
        basis: basic rate taxpayer
      personal_savings_allowance_higher_rate:
        value: 500
        unit: GBP per year
        basis: higher rate taxpayer
      personal_savings_allowance_additional_rate:
        value: 0
        unit: GBP per year
        basis: additional rate taxpayer
      starting_rate_for_savings:
        value: 5000
        unit: GBP per year
        basis: reduced by £1 for every £1 of other income above the Personal Allowance
      starting_rate_for_savings_other_income_limit:
        value: 17570
        unit: GBP per year
        basis: other taxable income below which the starting rate applies
      dividend_allowance:
        value: 500
        unit: GBP per year
        basis: dividend income taxed at 0%
      capital_gains_annual_exempt_amount:
        value: 3000
        unit: GBP per year
        basis: individuals
      capital_gains_annual_exempt_amount_trusts:
        value: 1500
        unit: GBP per year
        basis: trusts
      isa_annual_allowance:
        value: 20000
        unit: GBP per tax year
        basis: all ISAs combined
      lifetime_isa_annual_limit:
        value: 4000
        unit: GBP per tax year
        basis: counts towards the ISA allowance
  vectors:
  - input:
      key: isa_annual_allowance
      column: value
    expected: 20000
    origin: source
  - input:
      key: personal_allowance
      column: value
    expected: 12570
    origin: source
  - input:
      key: dividend_allowance
      column: value
    expected: 500
    origin: source
  - input:
      key: personal_savings_allowance_additional_rate
      column: value
    expected: 0
    origin: source
  - input: blind_persons_allowance
    expected: false
    origin: derived
    note: not covered by this table
