assumed:
- parameter: personal_allowance and bands[main].up_to
  value: 12570 and 37700
  method: derived
  rationale: GOV.UK states Class 4 as 6% on profits over £12,570 up to £50,270 and 2% above; the rule applies bands
    to profits above a threshold, so the lower profits limit is carried in personal_allowance and the main band
    ends at £50,270 minus £12,570.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 2
  tolerance: 0
- statistic: rate[main]
  expected: 6
  tolerance: 0
- statistic: rate[upper]
  expected: 2
  tolerance: 0
notes: 'Self-employed National Insurance for the 2026 to 2027 tax year as GOV.UK states it: Class 4 at 6% on profits
  over £12,570 up to £50,270 and 2% above, computed by the income_tax_bands rule with the lower profits limit in
  the allowance slot; Class 2 is £3.65 a week and voluntary, and profits of £7,105 or more earn Class 2 credit without
  payment (small profits threshold). The vectors are arithmetic on the published rates. Source is the GOV.UK content
  API''s JSON for the page, which is stable between editorial updates; GOV.UK publishes its content under the Open
  Government Licence v3.0.'
