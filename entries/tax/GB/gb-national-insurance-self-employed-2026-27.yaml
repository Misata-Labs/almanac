id: gb-national-insurance-self-employed-2026-27
title: 'United Kingdom self-employed National Insurance: Class 4 rates on profits and the Class 2 weekly rate, 2026
  to 2027'
kind: rule
domain: tax
region: GB
status: verified
tier: A
valid_from: '2026-04-06'
valid_to: '2027-04-05'
tags:
- national-insurance
- self-employed
- class-4
- class-2
- self-assessment
use_cases:
- tax-filing-demo
- personal-finance
- financial-planning
spec:
  implementation: almanac.rules.income_tax_bands
  parameters:
    tax_year: 2026-27
    currency: GBP
    personal_allowance: 12570
    bands:
    - name: main
      up_to: 37700
      rate_percent: 6
      profits_range: over £12,570 up to £50,270
    - name: upper
      up_to: null
      rate_percent: 2
      profits_range: over £50,270
    class_2_weekly_rate: 3.65
    small_profits_threshold: 7105
  vectors:
  - input:
      income: 12570
    expected: '0.00'
    origin: source
    note: 'GOV.UK: Class 4 is due only on profits of more than £12,570, so nothing is due at the limit'
  - input:
      income: 20000
    expected: '445.80'
    origin: derived
  - input:
      income: 50270
    expected: '2262.00'
    origin: derived
    note: top of the main rate band
  - input:
      income: 60000
    expected: '2456.60'
    origin: derived
  - input:
      allowance_for: 150000
    expected: '12570'
    origin: derived
    note: the lower profits limit does not taper
