notes: 'Tax on dividend income above the £500 dividend allowance for the 2026 to 2027 tax year: basic rate 10.75%,
  higher rate 35.75%, additional rate 39.35%, the band being found by adding dividend income to other income. Dividends
  within the Personal Allowance or held in an ISA are untaxed. GOV.UK''s worked example is kept in the parameters.
