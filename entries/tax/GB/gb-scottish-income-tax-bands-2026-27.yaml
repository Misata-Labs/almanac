notes: 'Scottish Income Tax for the 2026 to 2027 tax year: six bands from the 19% starter rate to the 48% top rate,
  with the band limits above the standard Personal Allowance taken from HMRC''s ''Rates and thresholds for employers''
  PAYE table for Scotland and the income ranges as GOV.UK''s Scottish Income Tax page prints them; the builder checks
  each limit up to the higher rate equals the printed range minus £12,570 (the advanced rate ends at £125,140 of
  taxable income, where the allowance is fully tapered). Dividends and savings interest are taxed at UK rates and
  are out of scope. Source is the GOV.UK content API''s JSON for the page, which is stable between editorial updates;
  GOV.UK publishes its content under the Open Government Licence v3.0.'
