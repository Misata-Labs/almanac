assumed:
- parameter: taper
  value: '{above: 100000, ratio: 2}'
  method: derived
  rationale: The Scottish page states only that no Personal Allowance is due above £125,140; the taper of £1 for
    every £2 above £100,000 is the UK-wide rule GOV.UK states on the Income Tax rates page, cited here.
- parameter: bands[advanced].up_to
  value: 125140
  method: derived
  rationale: HMRC's PAYE table ends the advanced rate at £125,140 of earnings above the threshold, the point at
    which the tapered Personal Allowance reaches zero and taxable income equals total income; the GOV.UK range '£75,001
    to £125,140' assumes a standard allowance that no longer exists at that level, so the two agree only at the
    lower end.
