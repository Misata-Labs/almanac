assumed:
- parameter: valid_from
  value: '2025-04-01'
  method: derived
  rationale: The Stamp Duty Land Tax guide does not date its table; HMRC dates the higher rates (these rates plus
    5%) from 1 April 2025 and states that different first-time buyer relief applied before 1 April 2025, so the
    standard table is taken to apply from that date.
