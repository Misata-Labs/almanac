      rate_percent: 12
      portion: The remaining amount (the portion above £1.5 million)
    first_time_buyer_relief:
      no_sdlt_up_to: 300000
      rate_percent_to_500000: 5
      max_purchase_price: 500000
      example:
        price: 500000
        sdlt: 10000
    additional_property_surcharge_percent: 5
    non_uk_resident_surcharge_percent: 2
