notes: 'Stamp Duty Land Tax on a residential property that will be the buyer''s only home, in England and Northern
  Ireland: 0% up to £125,000, 2% to £250,000, 5% to £925,000, 10% to £1.5 million and 12% above, charged on each
  portion of the price. The income_tax_bands rule computes the duty with a zero allowance; GOV.UK''s worked examples
  are the test vectors. First-time buyer relief (0% to £300,000, 5% to £500,000, unavailable above £500,000), the
  5% additional-property surcharge and the 2% non-UK-resident surcharge are kept as parameters and are not applied
  by the rule. Scotland and Wales levy their own taxes. Source is the GOV.UK content API''s JSON for the page, which
  is stable between editorial updates; GOV.UK publishes its content under the Open Government Licence v3.0.'
