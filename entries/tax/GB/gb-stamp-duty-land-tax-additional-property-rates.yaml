spec:
  implementation: almanac.rules.income_tax_bands
  parameters:
    currency: GBP
    applies_to: England and Northern Ireland
    personal_allowance: 0
    bands:
    - name: up_to_125000
      up_to: 125000
      rate_percent: 5
      portion: Up to £125,000
    - name: 125001_to_250000
      up_to: 250000
      rate_percent: 7
      portion: The next £125,000 (the portion from £125,001 to £250,000)
    - name: 250001_to_925000
      up_to: 925000
      rate_percent: 10
      portion: The next £675,000 (the portion from £250,001 to £925,000)
    - name: 925001_to_1500000
      up_to: 1500000
      rate_percent: 15
      portion: The next £575,000 (the portion from £925,001 to £1.5 million)
    - name: above_1500000
      up_to: null
      rate_percent: 17
      portion: The remaining amount (the portion above £1.5 million)
    exempt_below: 40000
    surcharge_over_standard_rates_percent: 5
  vectors:
  - input:
      income: 300000
    expected: '20000.00'
    origin: source
    note: 'HMRC example: an additional property bought for £300,000 on 1 April 2025'
  - input:
      income: 125000
    expected: '6250.00'
    origin: derived
    note: 5% on the whole first band
  - input:
      income: 1000000
    expected: '93750.00'
    origin: derived
