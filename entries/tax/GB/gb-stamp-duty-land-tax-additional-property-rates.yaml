notes: 'The higher rates of Stamp Duty Land Tax that apply when buying a residential property in England or Northern
  Ireland leaves the buyer owning more than one: 5% up to £125,000, 7% to £250,000, 10% to £925,000, 15% to £1.5
  million and 17% above, each the standard rate plus 5 percentage points, in force from 1 April 2025 as HMRC dates
  them. Properties worth less than £40,000 are outside the higher rates. HMRC''s worked example is the source vector.
  Source is the GOV.UK content API''s JSON for the page, which is stable between editorial updates; GOV.UK publishes
  its content under the Open Government Licence v3.0.'
