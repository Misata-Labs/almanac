id: gb-stamp-duty-land-tax-additional-property-rates
title: England and Northern Ireland Stamp Duty Land Tax higher rates for additional residential properties from
  1 April 2025
kind: rule
domain: tax
valid_from: '2025-04-01'
valid_to: null
