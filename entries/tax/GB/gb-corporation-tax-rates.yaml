notes: 'Corporation Tax as GOV.UK states it: the main rate of 25% on profits over £250,000, the small profits rate
  of 19% on profits of £50,000 or less, and Marginal Relief between those thresholds, which are reduced for short
  accounting periods and shared between associated companies. The structure has applied since 1 April 2023; valid_to
  is open. Source is the GOV.UK content API''s JSON for the page, which is stable between editorial updates; GOV.UK
  publishes its content under the Open Government Licence v3.0.'
