assumed:
  - parameter: bands[*].up_to
    value: "37700, 112570, null (taxable income after the allowance)"
    method: derived
    rationale: GOV.UK states the bands as ranges of income assuming the standard Personal Allowance; the rule applies bands to taxable income, so each upper limit is the published income limit minus the £12,570 allowance. The published ranges are kept beside each band.
tests:
  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: count, expected: 3, tolerance: 0}
  - {statistic: "rate[basic]", expected: 20, tolerance: 0}
  - {statistic: "rate[higher]", expected: 40, tolerance: 0}
  - {statistic: "rate[additional]", expected: 45, tolerance: 0}
notes: |
  Income Tax for the 2026 to 2027 tax year as GOV.UK states it: standard Personal Allowance
  £12,570, tapered by £1 for every £2 of adjusted net income above £100,000 and gone at
  £125,140; basic rate 20% on income from £12,571 to £50,270, higher rate 40% to £125,140,
  additional rate 45% above. Scotland sets its own bands and is not covered. The rule
  computes the allowance and the tax due for an annual income and ignores other allowances
  and reliefs. Source is the GOV.UK content API's JSON for the page, which is stable between
  editorial updates; GOV.UK publishes its content under the Open Government Licence v3.0.
