assumed:
  - parameter: bands[*].up_to
    value: "37700, 125140, null (taxable income after the allowance)"
    method: derived
    rationale: The bands are applied to taxable income. The limits of £37,700 and £125,140 are the taxable-income thresholds HMRC publishes in its PAYE rates table for England and Northern Ireland; the GOV.UK guide's income ranges assume the standard Personal Allowance and are kept beside each band for reference. The two agree at the basic-rate boundary (£50,270 minus £12,570) and at the additional-rate boundary, where the allowance has tapered to nothing.
tests:
  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: count, expected: 3, tolerance: 0}
  - {statistic: "rate[basic]", expected: 20, tolerance: 0}
  - {statistic: "rate[higher]", expected: 40, tolerance: 0}
  - {statistic: "rate[additional]", expected: 45, tolerance: 0}
notes: |
  Income Tax for the 2026 to 2027 tax year as GOV.UK states it: standard Personal Allowance
  £12,570, tapered by £1 for every £2 of adjusted net income above £100,000 and gone at
  £125,140; basic rate 20% on the first £37,700 of taxable income, higher rate 40% up to
  £125,140 of taxable income, additional rate 45% above, as HMRC's PAYE rates table states.
  Scotland sets its own bands and is covered by gb-scottish-income-tax-bands-2026-27. The rule
  computes the allowance and the tax due for an annual income and ignores other allowances
  and reliefs. Source is the GOV.UK content API's JSON for the page, which is stable between
  editorial updates; GOV.UK publishes its content under the Open Government Licence v3.0.
