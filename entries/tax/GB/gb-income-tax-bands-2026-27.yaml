id: gb-income-tax-bands-2026-27
title: United Kingdom Income Tax rates, bands and Personal Allowance for the 2026 to 2027 tax year (England, Wales and Northern Ireland)
kind: rule
domain: tax
region: GB
status: verified
tier: A
valid_from: 2026-04-06
valid_to: 2027-04-05
tags: [income-tax, payroll, paye, personal-allowance]
use_cases: [payroll-demo, hr-analytics, personal-finance, financial-planning]
spec:
  implementation: almanac.rules.income_tax_bands
  parameters:
    tax_year: "2026-27"
    currency: GBP
    personal_allowance: 12570
    taper: {above: 100000, ratio: 2}
    bands:
      - {name: basic, up_to: 37700, rate_percent: 20, income_range_with_standard_allowance: "£12,571 to £50,270"}
      - {name: higher, up_to: 112570, rate_percent: 40, income_range_with_standard_allowance: "£50,271 to £125,140"}
      - {name: additional, up_to: null, rate_percent: 45, income_range_with_standard_allowance: "over £125,140"}
  vectors:
    - {input: {income: 35000}, expected: "4486.00", origin: source, note: "GOV.UK example: basic rate on £22,430 (£35,000 minus £12,570); thresholds unchanged from the year the example describes"}
    - {input: {income: 12570}, expected: "0.00", origin: derived, note: income equal to the Personal Allowance}
    - {input: {income: 50270}, expected: "7540.00", origin: derived, note: top of the basic rate band}
    - {input: {allowance_for: 100000}, expected: "12570", origin: source, note: "taper starts above £100,000"}
    - {input: {allowance_for: 125140}, expected: "0", origin: source, note: "allowance is zero at £125,140"}
    - {input: {allowance_for: 110000}, expected: "7570", origin: derived, note: "£1 off for every £2 above £100,000"}
