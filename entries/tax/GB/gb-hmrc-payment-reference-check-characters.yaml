id: gb-hmrc-payment-reference-check-characters
title: HM Revenue & Customs payment reference check characters (PAYE Accounts Office, other taxes, SDLT)
kind: rule
domain: tax
region: GB
status: verified
tier: A
valid_from: 2025-08-11
valid_to: null
spec:
  implementation: almanac.rules.gb_hmrc_reference
  parameters:
    modulus: 23
    check_alphabet: "ABCDEFGHXJKLMNYPQRSTZVW"
    families:
      epaye:
        description: 13-character Accounts Office reference for PAYE payments
        pattern: '^\d{3}P[A-Z]\d{6}[A-Z_0-9]{2}$'
        check_index: 4
        weights: [9, 10, 11, 12, 0, 8, 7, 6, 5, 4, 3, 2, 1]
        letter_values: {A: 33, B: 34, C: 35, D: 36, E: 37, F: 38, G: 39, H: 40, J: 42, K: 43, L: 44, M: 45, N: 46, P: 48, Q: 49, R: 50, S: 51, T: 52, U: 56, V: 54, W: 55, X: 41, Y: 47, Z: 53}
        special_prefix: "961"
        special_prefix_pattern: '^961P[A-Z]\d{8}$'
      other_tax:
        description: 14- or 15-character X-prefixed reference for other taxes
        pattern: '^X[A-Z](([0-9A-Z]{13})|([0-9A-Z]\d{11}))$'
        check_index: 1
        weights: [0, 0, 9, 10, 11, 12, 13, 8, 7, 6, 5, 4, 3, 2, 1]
        letter_values: {A: 33, B: 34, C: 35, D: 36, E: 37, F: 38, G: 39, H: 40, I: 41, J: 42, K: 43, L: 44, M: 45, N: 46, O: 47, P: 48, Q: 49, R: 50, S: 51, T: 52, U: 53, V: 54, W: 55, X: 56, Y: 57, Z: 58}
      sdlt:
        description: 11-character Stamp Duty Land Tax unique transaction reference
        pattern: '^\d{9}M[A-Z]$'
        check_index: 10
        weights: [6, 7, 8, 9, 10, 5, 4, 3, 2]
        letter_values: {A: 0, B: 1, C: 2, D: 3, E: 4, F: 5, G: 6, H: 7, X: 8, J: 9, K: 10, L: 11, M: 12, N: 13, Y: 14, P: 15, Q: 16, R: 17, S: 18, T: 19, Z: 20, V: 21, W: 22}
