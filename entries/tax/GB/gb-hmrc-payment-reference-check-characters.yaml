assumed:
  - parameter: character values outside letter_values
    value: base-36 digit value, or -1 for other characters
    method: derived
    rationale: The source falls back to Scala's Char.asDigit for characters absent from a family's letter table, which is the base-36 digit value for ASCII letters and digits and -1 otherwise; the rule reproduces that fallback so references containing such characters are judged identically.
tests:
  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: vector_count, expected: 86, tolerance: 0}
notes: |
  One modulus-23 scheme with three parameterisations. The weighted sum of the reference's
  characters (digits by value, letters by the family's table) modulo 23 indexes the alphabet
  ABCDEFGHXJKLMNYPQRSTZVW, and the selected letter must appear at the family's check position:
  position 4 of the 13-character PAYE Accounts Office reference, position 1 of the X-prefixed
  other-taxes reference, and position 10 of the SDLT reference. References starting 961 in the
  PAYE family carry two extra constraints that the source states explicitly. Input is upper-cased
  before checking. Source is the reference checker HM Revenue & Customs publishes in hmrc/domain
  (v13.0.0, commit bc4a37fe); all 86 vectors are the library's own. valid_from is the date of
  the pinned revision; valid_to is open.
