notes: 'The National Insurance category letters employers put on payroll, grouped as GOV.UK groups them: the standard
  letters (A, B, C, H, J, M, V, Z and X for employees who pay nothing), the Freeport special tax site letters (F,
  I, L, S) and the Investment Zone special tax site letters (N, E, D, K), each with GOV.UK''s description of the
  employee group. The validity window is the 2026 to 2027 tax year whose rate tables list these letters; the letters
  themselves are not dated on the page. Source is the GOV.UK content API''s JSON for the page, which is stable between
  editorial updates; GOV.UK publishes its content under the Open Government Licence v3.0.'
