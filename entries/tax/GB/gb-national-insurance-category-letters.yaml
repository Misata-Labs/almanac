id: gb-national-insurance-category-letters
title: United Kingdom National Insurance category letters and the employee groups they denote (standard, Freeport
  and Investment Zone)
kind: rule
domain: tax
region: GB
status: verified
tier: A
valid_from: '2026-04-06'
valid_to: '2027-04-05'
tags:
- national-insurance
- payroll
- category-letter
- code-list
use_cases:
- payroll-demo
- hr-analytics
- person-generation
spec:
  implementation: almanac.rules.enumeration
  parameters:
    sets:
      standard:
        A: All employees apart from those in groups B, C, H, J, M, V and Z in this table
        B: Married women and widows who have a certificate of election form showing they’re entitled to pay reduced
          National Insurance
        C: Employees over the State Pension age
        H: Apprentices under 25
        J: Employees who can defer National Insurance because they’re already paying it in another job
        M: Employees under 21
        V: Employees who are working in their first job since leaving the armed forces (veterans)
        Z: Employees under 21 who can defer National Insurance because they’re already paying it in another job
        X: Employees who do not have to pay National Insurance, for example because they’re under 16
      freeport:
        F: All employees who work in a special tax site within a Freeport, apart from those in groups I, L, and
          S in this table
        I: Married women and widows working in a special tax site within a Freeport who have a certificate of election
          form showing they’re entitled to pay reduced National Insurance
        L: Employees who work in a special tax site within a Freeport and can defer National Insurance because they’re
          already paying it in another job
        S: Employees who work in a special tax site within a Freeport and are over the State Pension age
      investment_zone:
        N: All employees who work in a special tax site within an Investment Zone, apart from those in groups E,
          D and K in this table
        E: Married women and widows working in a special tax site within an Investment Zone who have a certificate
          of election form showing they’re entitled to pay reduced National Insurance
        D: Employees who work in a special tax site within an Investment Zone and can defer National Insurance because
          they’re already paying it in another job
        K: Employees who work in a special tax site within an Investment Zone and are over State Pension age
    default_letter: A
  vectors:
  - input:
      set: standard
      value: A
    expected: true
    origin: source
  - input:
      set: standard
      value: X
    expected: true
    origin: source
  - input:
      set: standard
      value: M
    expected: true
    origin: source
  - input:
      set: freeport
      value: F
    expected: true
    origin: source
  - input:
      set: investment_zone
      value: N
    expected: true
    origin: source
  - input:
      set: standard
      value: F
    expected: false
    origin: derived
    note: F is a Freeport letter
  - input:
      set: freeport
      value: f
    expected: false
    origin: derived
    note: letters are upper case
  - input:
      set: standard
      value: G
    expected: false
    origin: derived
