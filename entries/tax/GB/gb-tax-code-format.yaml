  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: vector_count, expected: 26, tolerance: 0}
notes: |
  The pattern is the one HM Revenue & Customs applies when it parses a tax code in its own
  services (hmrc/domain v13.0.0, commit bc4a37fe): an optional K prefix, a number without a
  leading zero (or 0 alone), an optional suffix from T, L, P or Y, or one of the fixed codes
  BR, NT, D0 and D1. The pattern is permissive about repetition of K and of the suffix letter,
  which the library's own tests do not exercise; generators should emit at most one of each.
  Week-1/month-1 markers (W1, M1, X) are not part of the code under this rule. valid_from is
  the date of the pinned revision; valid_to is open.
