id: gb-tax-code-format
title: United Kingdom PAYE tax code format
kind: rule
domain: tax
region: GB
status: verified
tier: A
valid_from: 2025-08-11
valid_to: null
spec:
  implementation: almanac.rules.gb_tax_code
  parameters:
    pattern: '^([K]*([1-9][0-9]{0,5}|0)[TLPY]*|BR|NT|D[01])$'
  vectors:
    - {input: "0T", expected: true, origin: source}
    - {input: "D0", expected: true, origin: source}
    - {input: "D1", expected: true, origin: source}
    - {input: "123456L", expected: true, origin: source}
    - {input: "100P", expected: true, origin: source}
    - {input: "100Y", expected: true, origin: source}
    - {input: "K500", expected: true, origin: source}
    - {input: "BR", expected: true, origin: source}
    - {input: "NT", expected: true, origin: source}
    - {input: "1234567", expected: false, origin: source, note: seven digits}
    - {input: "1A3456P", expected: false, origin: source}
    - {input: "123456H", expected: false, origin: source, note: H is not a suffix letter}
    - {input: "123456A", expected: false, origin: source}
    - {input: "NI", expected: false, origin: source}
    - {input: "69 L", expected: false, origin: source}
    - {input: " 69L", expected: false, origin: source}
    - {input: "K0500", expected: false, origin: source, note: leading zero}
    - {input: "6O9L", expected: false, origin: source, note: letter O in the digits}
    - {input: "OT", expected: false, origin: source, note: letter O instead of zero}
    - {input: "69LM1", expected: false, origin: source}
    - {input: "69LW1", expected: false, origin: source}
    - {input: "500K", expected: false, origin: source, note: K must lead}
    - {input: "474Lwk1/mth1", expected: false, origin: source}
    - {input: "474L/X", expected: false, origin: source}
    - {input: "474L/1", expected: false, origin: source}
    - {input: "D", expected: false, origin: source}
