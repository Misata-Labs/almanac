notes: The Inheritance Tax nil-rate band (tax-free threshold) for every period from 18 March 1986, when the tax
  replaced Capital Transfer Tax, to 5 April 2031, as HMRC's 'Inheritance Tax thresholds and interest rates' table
  lists it; the step_schedule rule answers the threshold in force on a date. The residence nil-rate band steps from
  6 April 2017, the 40% standard and 36% charity-reduced rates, the gift taper relief scale and the £3,000 annual
  exemption are kept as parameters from GOV.UK's Inheritance Tax guide. Source is the GOV.UK content API's JSON
  for the page, which is stable between editorial updates; GOV.UK publishes its content under the Open Government
  Licence v3.0.
