notes: 'The nine Class 1 National Insurance earnings thresholds for the 2026 to 2027 tax year as HMRC''s ''Rates
  and thresholds for employers'' guidance states them, each with its weekly, monthly and annual figure: lower earnings
  limit, primary threshold, secondary threshold, the Freeport and Investment Zone upper secondary thresholds, the
  upper secondary thresholds for under-21s, apprentices and veterans, and the upper earnings limit. The thresholds
  delimit the bands whose rates are in gb-national-insurance-class-1-rates-2026-27. Source is the GOV.UK content
  API''s JSON for the page, which is stable between editorial updates; GOV.UK publishes its content under the Open
  Government Licence v3.0.'
