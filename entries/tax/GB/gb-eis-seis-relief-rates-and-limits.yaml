notes: The Enterprise Investment Scheme gives individual investors an income tax reduction at the EIS rate on subscriptions
  for shares in qualifying unquoted trading companies up to an annual limit (higher where the excess is in knowledge-intensive
  companies); the Seed EIS gives a higher rate on a smaller annual amount. Issuing companies are limited in how
  much risk finance they can raise in any year and in their lifetime (higher for knowledge-intensive companies)
  and must be below gross asset ceilings before and after the issue. Finance Act 2026 raised the EIS company limits
  and gross asset ceilings with effect from 6 April 2026, the date the table takes as valid_from. Shares must be
  held for at least three years. The HTML form of each section is cited because the XML lists unapplied effects
  for the Act. legislation.gov.uk publishes Crown copyright legislation for reuse, but the cited resource carries
  no licence statement of its own, so the licence is recorded as unstated and the entry held at license-review.
