id: gb-corporate-interest-restriction
title: 'UK Corporate Interest Restriction (TIOPA 2010 Part 10): 30% of tax-EBITDA fixed ratio, £2 million de minimis'
kind: rule
domain: tax
region: GB
status: license-review
tier: B
valid_from: '2017-04-01'
valid_to: null
tags:
- tax
- private-equity
- structuring
- interest-limitation
- corporate-interest-restriction
- leverage
- ebitda
- atad
use_cases:
- lbo-modelling
- private-credit-demo
- tax-demo
- valuation-demo
spec:
  implementation: almanac.rules.interest_limitation
  parameters:
    currency: GBP
    ratio_percent: 30
    base: aggregate tax-EBITDA of the worldwide group's UK members (fixed ratio method)
    allowance_floor: 2000000
    exemption_threshold: null
    gross_receipts_limit: null
    fixed_ratio_debt_cap: the basic interest allowance is the lower of the ratio amount and the fixed ratio debt
      cap (s. 397(1)(b)); not modelled
    group_ratio_election: a group ratio based on the group's net third-party interest to EBITDA may be elected instead
      (s. 398); not modelled
    unused_allowance_carry_forward_years: 5
  vectors:
  - input:
      earnings: 10000000
      interest_expense: 4000000
    expected: 3000000
    origin: derived
    note: 30% of tax-EBITDA exceeds the de minimis amount
  - input:
      earnings: 1000000
      interest_expense: 2500000
    expected: 2000000
    origin: derived
    note: the de minimis amount is the floor of interest capacity
  - input:
      earnings: 0
      interest_expense: 2000000
    expected: 2000000
    origin: source
    note: the de minimis amount stated in s. 392(3)(a) is deductible whatever the tax-EBITDA
  - input:
      earnings: 1000000
      interest_expense: 1800000
    expected: 1800000
    origin: derived
    note: net interest below the de minimis amount is not restricted
  - input:
      earnings: 10000000
      interest_expense: 4000000
      output: disallowed
    expected: 1000000
    origin: derived
    note: carried forward indefinitely
