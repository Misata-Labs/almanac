notes: 'The Corporate Interest Restriction limits a worldwide group''s UK net tax-interest expense to its interest
  capacity: the interest allowance for the period (30% of the aggregate tax-EBITDA of its UK companies under the
  fixed ratio method, capped by the fixed ratio debt cap, or a group ratio if elected) plus unused allowance brought
  forward, but never less than the £2 million de minimis amount, pro-rated for periods other than a year. Disallowed
  interest is carried forward without time limit and unused allowance for five years. The rule models the fixed
  ratio method with the de minimis floor; the debt cap, group ratio and public infrastructure options are described
  but not computed. legislation.gov.uk publishes Crown copyright legislation for reuse, but the cited resource carries
  no licence statement of its own, so the licence is recorded as unstated and the entry held at license-review.'
