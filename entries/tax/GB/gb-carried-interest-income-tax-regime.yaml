notes: From the 2026-27 tax year carried interest arising to an individual who performs investment management services
  is taxed as the profits of a deemed trade (income tax and Class 4 National Insurance) instead of as a capital
  gain. Qualifying carried interest enters the profits at 72.5% of its amount; the qualifying share of each sum
  depends on the investment scheme's average holding period, from none below 36 months rising by 20 points a month
  to all of it at 40 months or more. Before the regime, carried interest gains were charged to Capital Gains Tax
  at 18% or 28% and, for carried interest arising on or after 6 April 2025, at a single 32% rate. The rule does
  not model the exceptions treating carried interest as wholly qualifying, the territorial scope or the holding
  period averaging adjustments. legislation.gov.uk publishes Crown copyright legislation for reuse, but the cited
  resource carries no licence statement of its own, so the licence is recorded as unstated and the entry held at
  license-review.
