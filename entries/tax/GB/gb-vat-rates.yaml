  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: count, expected: 3, tolerance: 0}
  - {statistic: "slab[standard]", expected: 20, tolerance: 0}
  - {statistic: "slab[reduced]", expected: 5, tolerance: 0}
notes: |
  The three UK VAT rates as GOV.UK states them: standard 20%, reduced 5% and zero 0%, with the
  standard rate at 20% since 4 January 2011, which sets valid_from. Exempt supplies carry no
  rate and are not a slab. The source is the GOV.UK content API's JSON for the page, which is
  stable between editorial updates; the rendered HTML page carries per-request tokens and is
  not cited. GOV.UK publishes its content under the Open Government Licence v3.0, stated in the
  footer of every GOV.UK page.
