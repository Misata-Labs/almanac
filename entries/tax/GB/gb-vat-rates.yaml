  implementation: almanac.rules.rate_schedule
  parameters:
    slabs:
      standard: 20
      reduced: 5
      zero: 0
    standard_rate_effective_from: "2011-01-04"
    previous_standard_rate: 17.5
    exempt_examples: [postage stamps, financial transactions, property transactions]
  vectors:
