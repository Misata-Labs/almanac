notes: 'The tax on taxable income from work and home (box 1) under article 2.10 of the Wet inkomstenbelasting 2001
  in the version in force from 1 January 2026 (Staatscourant 2025, 40487): for each row, the tax is the column III
  amount plus the column IV percentage of the income above the column I amount. Article 2.10 sets the tax only:
  national insurance contributions (premie volksverzekeringen) are levied on the first bracket under separate legislation
  and are not included, and taxpayers born before 1 January 1946 use article 2.10a. Article 2.10(2) adds a further
  charge on certain deductions in the top bracket, and the general tax credit and labour tax credit (articles 8.10
  and 8.11) are deducted from tax and premiums together; neither is modelled. The column III amounts are whole euros,
  so the tax just below a bracket limit can exceed the column III amount of the next row by a few cents; the rule
  follows the table row that applies. The source vectors restate the column IV rates; the others are computed from
  the table. Dutch statutes carry no copyright under the Auteurswet, but the BWB XML carries no licence statement,
  so the licence is recorded as unstated and the entry stays at license-review.'
