id: nl-earnings-stripping-rule-article-15b
title: 'Netherlands earnings-stripping rule (art. 15b Wet Vpb 1969, ATAD art. 4): net interest capped at 24.5% of
  tax EBITDA or EUR 1 million'
kind: rule
domain: tax
region: NL
