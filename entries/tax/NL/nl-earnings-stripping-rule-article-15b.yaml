notes: Article 15b of the Dutch Corporate Income Tax Act, which implements the interest limitation rule of the EU
  Anti-Tax Avoidance Directive, denies a deduction for a company's net interest balance on loans to the extent it
  exceeds the higher of a percentage of its adjusted profit (a tax EBITDA) and a fixed amount. The percentage has
  been 24.5% for years from 2025 (the article's current text took effect on the inwerking date the XML records);
  disallowed interest carries forward to later years. Dutch statutes carry no copyright under the Auteurswet, but
  the BWB XML carries no licence statement, so the licence is recorded as unstated and the entry stays at license-review.
