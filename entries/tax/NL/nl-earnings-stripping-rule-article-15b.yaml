spec:
  implementation: almanac.rules.interest_limitation
  parameters:
    currency: EUR
    ratio_percent: 24.5
    base: 'gecorrigeerde winst: taxable profit before the limitation plus depreciation, impairments and the net
      interest balance (a tax EBITDA)'
    allowance_floor: 1000000
    exemption_threshold: null
    gross_receipts_limit: null
    carryforward: non-deductible net interest is carried forward without time limit
  vectors:
  - input:
      earnings: 0
      interest_expense: 1000000
    expected: 1000000
    origin: source
    note: the EUR 1,000,000 amount of art. 15b(1)(b) is deductible whatever the profit
  - input:
      earnings: 10000000
      interest_expense: 4000000
      interest_income: 500000
    expected: 2950000
    origin: derived
    note: interest income plus 24.5% of tax EBITDA
  - input:
      earnings: 10000000
      interest_expense: 4000000
      interest_income: 500000
      output: disallowed
    expected: 1050000
    origin: derived
    note: carried forward
  - input:
      earnings: 2000000
      interest_expense: 900000
    expected: 900000
    origin: derived
    note: below the EUR 1 million floor
