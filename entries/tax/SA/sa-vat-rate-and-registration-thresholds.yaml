id: sa-vat-rate-and-registration-thresholds
title: 'Saudi Arabia VAT: 15% basic rate, tax computation and the SAR 375,000 and SAR 187,500 registration thresholds'
kind: rule
domain: tax
region: SA
status: license-review
tier: B
valid_from: '2020-07-01'
valid_to: null
tags:
- gcc
- tax
- vat
- saudi-arabia
- invoicing
- registration-threshold
use_cases:
- tax-demo
- invoicing-demo
- invoicing
- tax-filing-demo
spec:
  implementation: almanac.rules.consumption_tax
  parameters:
    currency: SAR
    slabs:
      standard: 15
      zero: 0
    rounding: '0.01'
    mandatory_registration_threshold: 375000
    voluntary_registration_threshold: 187500
    threshold_period: twelve months
  vectors:
  - input: 15
    expected: true
    origin: source
    note: basic rate of 15%
  - input:
      net: 90
      slab: standard
    expected: '13.50'
    origin: source
    note: 'Example (7): SAR 90 of food plus VAT of SAR 13.50'
  - input:
      net: 10000
      slab: standard
    expected: '1500.00'
    origin: source
    note: 'Example (1): VAT of SAR 1,500, 15% of the SAR 10,000 cost price'
  - input:
      gross: '103.50'
      slab: standard
    expected: '13.50'
    origin: source
    note: 'Example (7): total consideration SAR 103.50 includes VAT of SAR 13.50'
  - input: 5
    expected: false
    origin: derived
    note: 5% was the basic rate before 1 July 2020 and is not a current slab
