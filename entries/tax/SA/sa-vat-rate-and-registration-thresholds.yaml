notes: 'Saudi VAT as an invoicing system applies it: the basic rate of 15% (zero rate for exports, international
  transport, qualifying medicines and other listed supplies; reasons are in the ZATCA e-invoicing code lists), tax
  on a net amount and the tax contained in a VAT-inclusive amount, and the registration thresholds measured on taxable
  supplies over twelve months: SAR 375,000 mandatory and SAR 187,500 voluntary. The worked examples are ZATCA''s
  own. The 15% rate applies from 1 July 2020 (see sa-vat-standard-rate-history for the 5% period).'
