notes: Rates at which a resident payer withholds Saudi income tax from payments to a non-resident with no permanent
  establishment, by type of payment, as tabulated in ZATCA's withholding tax guideline under Article 68 of the Income
  Tax Law and Article 63 of its Implementing Regulations. Double taxation agreements can reduce these rates, and
  the guideline marks technical and consulting services with an asterisk for a treaty note. Related-party royalties
  and special zones carry their own treatments that are not modelled.
