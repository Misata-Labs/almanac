notes: 'The basic (standard) VAT rate in Saudi Arabia: 5% from the introduction of VAT at the start of 2018, raised
  to 15% for supplies made on or after 1 July 2020 under the measures announced by the Ministry of Finance on 11
  May 2020. ZATCA''s guideline on the rate change states both rates and the changeover; transitional rules for contracts
  and invoices dated before 11 May 2020 are in the same guideline and are not modelled here. The guideline is published
  in Arabic; the snippets are its extracted text, which pypdf returns in visual order with digits and Arabic words
  interleaved.'
