assumed:
- parameter: distribution.parameters.shares
  value: count / total
  method: derived
  rationale: Shares are the four published nationality and sex totals divided by the published total population.
- parameter: observed_period
  value: '2024-07-01'
  method: assumed
  rationale: GASTAT describes the estimates as the population in mid-2024 without naming a day; 1 July 2024 is used
    as the reference date.
tests:
- statistic: share["non-saudi|male"]
  expected: 0.34245
  tolerance: 0.004
- statistic: share["saudi|female"]
  expected: 0.277835
  tolerance: 0.004
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: Mid-2024 population of Saudi Arabia split by nationality (Saudi, non-Saudi) and sex, from the totals row
  of GASTAT's Population Estimates Statistics 2024 workbook. Categories are 'nationality|sex'. The non-Saudi population
  is strongly male because of the migrant workforce, so draw nationality and sex jointly rather than independently.
  Neither file carries a licence statement, so the entry stays at license-review; GASTAT's website use policy permits
  reuse, including commercial reuse, with GASTAT acknowledged as the source and changes indicated.
