assumed:
- parameter: distributions.*.parameters.shares
  value: count / group total
  method: derived
  rationale: Shares are the published counts divided by the group's published total, rounded to 6 decimals; the
    builder checks the age groups add up to the total.
- parameter: observed_period
  value: '2024-07-01'
  method: assumed
  rationale: GASTAT describes the estimates as the population in mid-2024 without naming a day; 1 July 2024 is used
    as the reference date.
tests:
- statistic: share["non-saudi-male","30-34"]
  expected: 0.168716
  tolerance: 0.004
- statistic: share["saudi-female","0-4"]
  expected: 0.10673
  tolerance: 0.004
- statistic: share["total-total","80+"]
  expected: 0.004759
  tolerance: 0.004
- statistic: sum_of_shares["saudi-male"]
  expected: 1
  tolerance: 0.002
- statistic: sum_of_shares["saudi-female"]
  expected: 1
  tolerance: 0.002
- statistic: sum_of_shares["saudi-total"]
  expected: 1
  tolerance: 0.002
notes: Mid-2024 population estimates by five-year age group (open-ended 80+) for each nationality and sex group,
  from the 'Population Estimates Statistics 2024' workbook GASTAT publishes beside its estimates release; the 2023
  columns of the same sheet are ignored. Groups are nationality (saudi, non-saudi, total) by sex (male, female,
  total), keyed as saudi-male, saudi-female, saudi-total, non-saudi-male and so on, matching the publication's nine
  columns. The estimates are projected from the May 2022 census base. Counts sit beside the shares. Neither file
  carries a licence statement, so the entry stays at license-review; GASTAT's website use policy permits reuse,
  including commercial reuse, with GASTAT acknowledged as the source and changes indicated.
