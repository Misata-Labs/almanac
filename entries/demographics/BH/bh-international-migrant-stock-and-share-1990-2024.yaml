notes: International migrants in Bahrain as a percentage of the total population (the series value, Table 3, both
  sexes) at 1 July of 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2024, with the migrant stock for both sexes, males
  and females (Table 1), the total population in thousands by sex (Table 2), the migrant share among males and among
  females (Table 3) and female migrants as a percentage of all migrants (Table 4), from the UN DESA International
  Migrant Stock 2024 destination workbook. Values are copied unchanged. Observations are five years apart up to
  2020 and four years apart after that; frequency 'annual' means one point per listed year. Use the latest value
  to split a synthetic population into nationals and foreign residents, and the male and female shares to reproduce
  the sex imbalance among migrants. The workbook states that it is made available under CC BY 3.0 IGO. That licence
  permits reuse with attribution but is not on the verifier's permissive list, so the entry stays at license-review
  until a reviewer accepts it.
