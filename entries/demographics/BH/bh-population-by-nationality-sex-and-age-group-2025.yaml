notes: Mid-year (June) 2025 population estimate of the Kingdom of Bahrain by nationality (Bahraini, Non-Bahraini),
  sex and five-year age group (0-4 to 85+), published by the Information & eGovernment Authority. Each group keeps
  the published counts beside the shares, so the four groups together form the population pyramid; group totals
  give the nationality-by-sex split. The Bahrain open data portal publishes no licence for this dataset (its catalogue
  licence field is empty), so the entry stays at license-review until the Information & eGovernment Authority's
  reuse terms are confirmed.
