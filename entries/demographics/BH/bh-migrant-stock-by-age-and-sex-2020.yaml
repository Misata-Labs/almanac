notes: Age distribution of the international migrants living in Bahrain at 1 July 2020, for both sexes ('total'),
  males and females, in sixteen five-year groups from 0-4 to 75+, from UN DESA International Migrant Stock 2020
  (age, sex and destination workbook, Table 1). The 2024 revision's downloads carry no age breakdown, so 2020 is
  the latest age structure for migrants. Combined with the 2024 migrant share and the population pyramid it lets
  a generator give foreign residents their own age profile. The workbook states that it is made available under
  CC BY 3.0 IGO. That licence permits reuse with attribution but is not on the verifier's permissive list, so the
  entry stays at license-review until a reviewer accepts it.
