assumed:
- parameter: distributions[*].parameters.shares
  value: count / total
  method: derived
  rationale: Migrants in each five-year age group (0-4 to 75+) divided by the sum over the groups for that sex;
    the published total is kept beside the counts and differs from the sum only by rounding.
