notes: 'Net migration for 2024 from the World Development Indicators API (indicator SM.POP.NETM, data last updated
  2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income aggregates removed.
  2024 is the most recent year whose coverage is close to the series'' best recent year. Source note from the World
  Bank: Net migration is the net total of migrants during the period, that is, the number of immigrants minus the
  number of emigrants, including both citizens and noncitizens. The World Bank licenses its datasets under CC BY
  4.0.'
