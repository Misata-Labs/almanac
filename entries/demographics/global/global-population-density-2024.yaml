notes: 'Population density (people per sq. km of land area) for 2024 from the World Development Indicators API (indicator
  EN.POP.DNST, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional
  and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best recent
  year. Source note from the World Bank: Population density is midyear population divided by land area in square
  kilometers. Population is based on the de facto definition of population, which counts all residents regardless
  of legal status or citizenship--except for refugees not permanently settled in the country of asylum, who are
  generally considered part of the population of their country of origin. Land area is a country''s total are The
  World Bank licenses its datasets under CC BY 4.0.'
