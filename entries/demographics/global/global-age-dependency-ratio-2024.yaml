notes: 'Age dependency ratio (% of working-age population) for 2024 from the World Development Indicators API (indicator
  SP.POP.DPND, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional
  and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best recent
  year. Source note from the World Bank: Age dependency ratio is the ratio of dependents--people younger than 15
  or older than 64--to the working-age population--those ages 15-64. Data are shown as the proportion of dependents
  per 100 working-age population. The World Bank licenses its datasets under CC BY 4.0.'
