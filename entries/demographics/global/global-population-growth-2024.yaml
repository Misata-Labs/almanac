notes: 'Population growth (annual %) for 2024 from the World Development Indicators API (indicator SP.POP.GROW,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best recent year. Source
  note from the World Bank: Annual population growth rate for year t is the exponential rate of growth of midyear
  population from year t-1 to t, expressed as a percentage. Population is based on the de facto definition of population,
  which counts all residents regardless of legal status or citizenship. The World Bank licenses its datasets under
  CC BY 4.0.'
