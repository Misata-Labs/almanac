assumed:
- parameter: shares
  value: count / sum of counts over the listed names
  method: derived
  rationale: The source publishes counts; the shares are each count over the total of the top 100 names of that
    sex, so they sum to one and a generator can draw from them directly.
- parameter: coverage
  value: sum of the listed counts / full_list_total
  method: derived
  rationale: full_list_total is the sum of the published counts over every name with a value for 2025 (names with
    three or more occurrences), so coverage is the share of those births given one of the listed names.
tests:
- statistic: share["male","Rían"]
  expected: 0.03519356
  tolerance: 0.005
- statistic: sum_of_shares["male"]
  expected: 1
  tolerance: 0.0001
- statistic: share["female","Lily"]
  expected: 0.02618346
  tolerance: 0.005
- statistic: sum_of_shares["female"]
  expected: 1
  tolerance: 0.0001
notes: The 100 most common first names registered for boys (table VSA50) and girls (table VSA60) in Ireland in 2025,
  with the published counts and shares renormalised within each list. The CSO publishes names with three or more
  occurrences; the whole PxStat cube from 1964 is the cited resource because the API serves no per-year slice at
  a stable URL. The data.gov.ie catalogue record for the table states the CC BY 4.0 licence.
