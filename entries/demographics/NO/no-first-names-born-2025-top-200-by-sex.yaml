assumed:
- parameter: shares
  value: count / sum of counts over the listed names
  method: derived
  rationale: The source publishes counts; the shares are each count over the total of the top 200 names of that
    sex with a published count, so they sum to one and a generator can draw from them directly.
- parameter: published_total
  value: sum of counts over names with a published figure
  method: derived
  rationale: Statistics Norway suppresses counts under four and lists only names used by at least 200 persons the
    previous year, so published_total covers the published names only.
tests:
- statistic: share["female","Emma"]
  expected: 0.02087163
  tolerance: 0.005
- statistic: sum_of_shares["female"]
  expected: 1
  tolerance: 0.0001
- statistic: share["male","Noah"]
