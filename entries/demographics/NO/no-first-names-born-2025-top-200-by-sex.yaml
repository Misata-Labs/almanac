- statistic: sum_of_shares["male"]
  expected: 1
  tolerance: 0.0001
notes: The 200 most common first names given to girls and to boys named in Norway in 2025, from the girls' and boys'
  value sets of Statistics Norway table 10467, with the published count, the published percentage of born persons
  (published_percent) and shares renormalised within each list. Statistics Norway's licence page, which the PxWeb
  API configuration names as the licence for its data, states that it uses the Creative Commons Attribution 4.0
  International licence; the page renders with session-specific markup and is referenced rather than hashed, so
  the API configuration is cited as supporting evidence instead.
