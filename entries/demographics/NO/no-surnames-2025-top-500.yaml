assumed:
- parameter: shares
  value: count / sum of counts over the listed names
  method: derived
  rationale: The source publishes counts; the shares are each count over the total of the top 500 surnames, so they
    sum to one and a generator can draw from them directly.
- parameter: coverage
  value: sum of the listed counts / published_total
  method: derived
  rationale: published_total is the sum of counts over every surname in the table (those used by 200 persons or
    more), so coverage is the share of those persons carrying one of the listed surnames.
