assumed:
- parameter: shares
  value: count / sum of counts over the listed names
  method: derived
  rationale: The source publishes counts; the shares are each count over the total of the top 50 names for the province
    or region, so they sum to one and a generator can draw from them directly.
- parameter: observed_period
  value: '2026-01-01'
  method: assumed
  rationale: The workbook is labelled 2026 without a day; Statbel's population tables refer to 1 January of the
    year, so the reference date is taken as 1 January 2026.
