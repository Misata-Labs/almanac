assumed:
- parameter: distributions[*].parameters.shares
  value: count / total
  method: derived
  rationale: Thousands of foreign citizens of each listed country divided by the sum over the listed countries and
    'Other countries' (OTHER); the sum is checked against the published total.
tests:
- statistic: share[working_age_population:total,BGD]
  expected: 0.318119
  tolerance: 0.005
- statistic: share[working_age_population:women,PHL]
  expected: 0.083717
  tolerance: 0.005
- statistic: share[employed:men,IND]
  expected: 0.294461
  tolerance: 0.005
- statistic: share[employed:total,OTHER]
  expected: 0.142082
  tolerance: 0.005
- statistic: sum_of_shares[working_age_population:total]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[working_age_population:women]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[employed:men]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[employed:total]
  expected: 1
  tolerance: 0.0001
notes: Foreign citizens in Oman in 2024 by country of citizenship, for the working-age population (ILOSTAT indicator
  POP_MFRC_SEX_CCT_NB) and for employed persons (EMP_MFRC_SEX_CCT_NB), each for all persons, men and women, from
  ILOSTAT's international labour migration statistics. ILOSTAT lists the main countries of citizenship separately
  and pools the rest as 'Other countries' (OTHER here). This is a citizenship-based count from national sources,
  complementing the UN DESA origin estimates for Oman. Conditioning keys are '<population>:<sex>'. The ILOSTAT terms-of-use
  page could not be fetched byte-stably in this session, so the licence is recorded as unstated and the entry stays
  at license-review until a reviewer confirms the terms that apply to ILOSTAT data.
