notes: Population registered in Oman at the end of September 2026 by governorate (11 governorates) for Omanis and
  expatriates, from Table 1 of the NCSI Monthly Statistical Bulletin (October 2026 issue). Group totals give the
  nationality split (Omani 3,078,233, expatriate 2,376,119). Governorate names are normalised; the bulletin spells
  some differently (AdDakhliyah, Al BatinahNorth, Ash Sharqiah). NCSI data are published under the Open Government
  License of the Sultanate of Oman, whose general provisions say it is compatible with Creative Commons Attribution
  4.0; it is not itself an SPDX licence, so the entry stays at license-review.
