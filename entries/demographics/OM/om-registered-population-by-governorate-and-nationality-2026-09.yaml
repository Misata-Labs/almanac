assumed:
- parameter: distributions.*.parameters.shares
  value: count / sum of counts within each group
  method: derived
  rationale: The publisher gives counts; shares are each count over the group total.
- parameter: column order
  value: change %, Sep 2025 total, Sep 2026 total, Sep 2026 expatriate, Sep 2026 Omani, Aug 2026 total, Aug 2026
    expatriate, Aug 2026 Omani, end-2025 total
  method: derived
  rationale: The PDF's bilingual header extracts out of order. The September 2026 total equals the September 2025
    total grown by the printed change; expatriate plus Omani equals the total; and the Omani column gives Muscat
    the 39.0% Omani share and the country the 56.44% Omani share that the bulletin prints beside the table.
