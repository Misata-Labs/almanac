assumed:
- parameter: distributions[*].parameters.shares
  value: thousand households of a type / sum over the six types
  method: derived
  rationale: Eurostat publishes household counts in thousands per composition type; shares are each type over the
    sum of the six mutually exclusive types, so the published TOTAL (which also covers households of unknown type)
    is not used as the denominator.
tests:
- statistic: share[DE,couple_with_children]
  expected: 0.133649
  tolerance: 0.005
- statistic: share[FR,one_adult_without_children]
  expected: 0.422439
  tolerance: 0.005
- statistic: sum_of_shares[DE]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[IE]
  expected: 1
  tolerance: 0.0001
notes: 'Private households in 2025 by composition for ten member states from Eurostat dataflow lfst_hhnhtych (EU
  Labour Force Survey, all ages of children, any number of children, thousands of households). Six mutually exclusive
  types are kept: one adult, couple, or other household, each with or without children (Eurostat codes A1_CH, A1_NCH,
  CPL_CH, CPL_NCH, OTH_CH, OTH_NCH). Each distribution keeps the published thousands beside the derived shares.
  Eurostat''s copyright notice states that its data are released under the Creative Commons Attribution 4.0 International
  licence; the notice page renders dynamically and is referenced rather than hashed.'
