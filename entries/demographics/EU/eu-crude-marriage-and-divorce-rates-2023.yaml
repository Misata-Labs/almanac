notes: 'Crude marriage rate (marriages per 1 000 persons) for 2023 from Eurostat dataflow demo_nind, with the crude
  divorce rate (divorces per 1 000 persons) for the same year from dataflow demo_ndivind carried as a second column
  where Eurostat reports it. Countries without a published 2023 marriage rate are omitted and a missing divorce
  rate is stored as null. Rows are keyed by the Eurostat geo code and carry the English country name from the GEO
  codelist. Observation flags published with the data: DE marriages_per_1000 break in time series; FR marriages_per_1000
  provisional; PL marriages_per_1000 estimated, provisional; PL divorces_per_1000 estimated, provisional. Eurostat''s
  copyright notice states that its data are released under the Creative Commons Attribution 4.0 International licence;
  the notice page renders dynamically and is referenced rather than hashed.'
