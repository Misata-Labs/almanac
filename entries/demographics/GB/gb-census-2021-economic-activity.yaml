assumed:
- parameter: distribution.parameters.shares
  value: count / total over England and Wales
  method: derived
  rationale: The API publishes counts per country; England and Wales are summed and each share is the summed count
    divided by the total. Any 'Does not apply' category is kept so shares describe the full population base.
tests:
- statistic: 'share["Economically active (excluding full-time students): In employment: Employee"]'
  expected: 0.375203
  tolerance: 0.002
- statistic: 'share["Economically active and a full-time student: Unemployed: Seeking work or waiting to start a
    job already obtained: Available to start working within 2 weeks"]'
  expected: 0.005014
  tolerance: 0.002
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: Census 2021 usual residents of England and Wales by economic activity status from the ONS census observations
  API (population type UR, dimension economic_activity_status_12a, area type country), summed over England and Wales.
  Category labels are the ONS labels and option_ids keep the ONS codes. Counts sit beside the shares so they can
  be re-derived. Reference date is Census Day, 21 March 2021. ONS publishes its datasets under the Open Government
  Licence v3.0, as the licence field of its dataset metadata states; the census observations endpoint itself carries
  no licence field.
