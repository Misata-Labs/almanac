assumed:
- parameter: shares
  value: count / sum of counts over the listed names
  method: derived
  rationale: The source publishes counts; the shares are each count over the total of the top 100 names of that
    sex, so they sum to one and a generator can draw from them directly.
- parameter: coverage
  value: sum of the listed counts / full_list_total
  method: derived
  rationale: full_list_total is the sum of counts over every name on the sheet (names with three or more babies),
    so coverage is the share of those births given one of the listed names.
tests:
- statistic: share["male","Noah"]
  expected: 0.0316308
  tolerance: 0.005
- statistic: sum_of_shares["male"]
  expected: 1
  tolerance: 0.0001
- statistic: share["female","Olivia"]
  expected: 0.02680371
  tolerance: 0.005
- statistic: sum_of_shares["female"]
  expected: 1
  tolerance: 0.0001
notes: The 100 most common first names registered for boys and for girls born in Scotland in 2024, from the National
  Records of Scotland full list of baby names, with published counts and shares renormalised within each list. Names
  with a count of two or fewer are suppressed by NRS. The spreadsheet states that its content is Crown copyright
  and may be re-used under the terms of the Open Government Licence; the licence line is cited as supporting evidence.
  Licence identifier OGL-UK-3.0 assumes the current (third) version linked from the sheet.
