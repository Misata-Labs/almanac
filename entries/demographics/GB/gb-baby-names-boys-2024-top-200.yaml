assumed:
- parameter: shares
  value: count / sum of counts over the listed names
  method: derived
  rationale: The source publishes counts; the shares are each count over the total of the top 200 names, so they
    sum to one and a generator can draw from them directly.
- parameter: coverage
  value: sum of the listed counts / full_list_total
  method: derived
  rationale: full_list_total is the sum of counts over every name in Table_6 (names with three or more occurrences),
    so coverage is the share of those births given one of the listed names.
tests:
- statistic: share["Muhammad"]
  expected: 0.03387954
  tolerance: 0.005
- statistic: share["Ayan"]
  expected: 0.00148641
  tolerance: 0.005
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: The 200 most common first names given to boys born in England and Wales in 2024, from Table_6 (the full list
  of names with three or more occurrences) of the ONS baby names dataset, with published counts and shares renormalised
  within the list. Baby name statistics are compiled by the Office for National Statistics from first names recorded
  at birth registration in England and Wales for live births in the calendar year, counting each exact spelling
  separately. ONS publishes its datasets under the Open Government Licence v3.0.
