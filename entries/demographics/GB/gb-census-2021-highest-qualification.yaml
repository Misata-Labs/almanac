assumed:
- parameter: distribution.parameters.shares
  value: count / total over England and Wales
  method: derived
  rationale: The API publishes counts per country; England and Wales are summed and each share is the summed count
    divided by the total. Any 'Does not apply' category is kept so shares describe the full population base.
tests:
- statistic: 'share["Level 4 qualifications or above: degree (BA, BSc), higher degree (MA, PhD, PGCE), NVQ level
    4 to 5, HNC, HND, RSA Higher Diploma, BTEC Higher level, professional qualifications (for example, teaching,
    nursing, accountancy)"]'
  expected: 0.275401
  tolerance: 0.002
- statistic: 'share["Other: vocational or work-related qualifications, other qualifications achieved in England
    or Wales, qualifications achieved outside England or Wales (equivalent not stated or unknown)"]'
  expected: 0.022435
  tolerance: 0.002
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: Census 2021 usual residents of England and Wales by highest qualification from the ONS census observations
  API (population type UR, dimension highest_qualification, area type country), summed over England and Wales. Category
  labels are the ONS labels and option_ids keep the ONS codes. Counts sit beside the shares so they can be re-derived.
  Reference date is Census Day, 21 March 2021. ONS publishes its datasets under the Open Government Licence v3.0,
  as the licence field of its dataset metadata states; the census observations endpoint itself carries no licence
  field.
