assumed:
- parameter: distribution.parameters.shares
  value: count / total over England and Wales
  method: derived
  rationale: The API publishes counts per country; England and Wales are summed and each share is the summed count
    divided by the total. Any 'Does not apply' category is kept so shares describe the full population base.
tests:
- statistic: share["2 people in household"]
  expected: 0.341013
  tolerance: 0.002
- statistic: share["0 people in household"]
  expected: 0.0
  tolerance: 0.002
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: Census 2021 households of England and Wales by household size from the ONS census observations API (population
  type HH, dimension hh_size_9a, area type country), summed over England and Wales. Category labels are the ONS
  labels and option_ids keep the ONS codes. Counts sit beside the shares so they can be re-derived. Reference date
  is Census Day, 21 March 2021. ONS publishes its datasets under the Open Government Licence v3.0, as the licence
  field of its dataset metadata states; the census observations endpoint itself carries no licence field.
