assumed:
- parameter: shares
  value: count / sum of counts over the listed names
  method: derived
  rationale: The source publishes counts; the shares are each count over the total of the ten names listed for the
    region, so they sum to one and a generator can draw from them directly.
- parameter: coverage
  value: sum of the ten counts / all_names_total
  method: derived
  rationale: Table_4 gives the count of all named births in the region on its 'All ranks' row; coverage is the share
    of those births given one of the ten listed names.
