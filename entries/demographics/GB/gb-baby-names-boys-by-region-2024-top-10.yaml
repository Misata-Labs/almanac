notes: The ten most common first names given to boys born in 2024 in each English region and in Wales, by the mother's
  usual residence, from Table_4 of the ONS baby names dataset. Keys are the ONS region names; region_code holds
  the ONS geography code and all_names_total the region's count of named births. Baby name statistics are compiled
  by the Office for National Statistics from first names recorded at birth registration in England and Wales for
  live births in the calendar year, counting each exact spelling separately. ONS publishes its datasets under the
  Open Government Licence v3.0.
