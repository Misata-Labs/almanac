assumed:
- parameter: distributions[*].parameters.shares
  value: count / total
  method: derived
  rationale: Persons in each five-year age group divided by the sum of the seventeen groups (0-4 to 80+) for that
    sex.
tests:
- statistic: share[male,35-39]
  expected: 0.133756
  tolerance: 0.005
- statistic: share[female,35-39]
  expected: 0.111725
  tolerance: 0.005
- statistic: share[female,0-4]
  expected: 0.0677
  tolerance: 0.005
