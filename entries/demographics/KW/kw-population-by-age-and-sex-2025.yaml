- statistic: sum_of_shares[female]
  expected: 1
  tolerance: 0.0001
notes: Mid-year 2025 population of Kuwait in seventeen five-year age groups (0-4 to 80+) for males and females,
  from the World Bank Population estimates and projections database (API source 40, indicators SP.POP.0004.MA to
  SP.POP.80UP.FE). The World Bank derives these from its total population and the age and sex distributions of the
  UN World Population Prospects. Counts ride beside the shares, so a generator can reproduce both the shape of each
  pyramid and the ratio of men to women at each age, which migrant labour skews in the GCC. Data last updated 2026-07-01.
  The World Bank licenses its data under CC BY 4.0.
