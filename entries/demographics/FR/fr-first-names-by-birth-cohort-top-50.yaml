assumed:
- parameter: shares
  value: count / sum of counts over the listed names
  method: derived
  rationale: The source publishes counts; the shares are each count over the total of the top 50 names of that sex
    and birth year, so they sum to one and a generator can draw from them directly.
- parameter: coverage
  value: sum of the listed counts / full_list_total
  method: derived
  rationale: full_list_total is the sum of valeur over every name of that sex and year in the national file, so
    coverage is the share of those births given one of the listed names.
