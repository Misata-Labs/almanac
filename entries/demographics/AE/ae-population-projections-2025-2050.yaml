notes: 'Total, male and female mid-year population of United Arab Emirates for every year from 2025 to 2050, from
  the World Bank Population estimates and projections database (API source 40: SP.POP.TOTL, SP.POP.TOTL.MA.IN, SP.POP.TOTL.FE.IN),
  which builds on the UN World Population Prospects. Years after the latest estimate are projections, not observations,
  so the table is a reference keyed by year (valid_to is the end of the projection horizon) rather than an observed
  series. Data last updated 2026-07-01. The World Bank licenses its data under CC BY 4.0.'
