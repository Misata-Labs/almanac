assumed:
- parameter: distributions[*].parameters.shares
  value: count / total
  method: derived
  rationale: Each origin's 2024 migrant stock for the sex in question divided by the total migrant stock of that
    sex (origin 'World'); at most the 30 largest listed origins are kept and the rest of the total, including the
    workbook's 'Others' row, is pooled as OTHER.
- parameter: categories
  value: ISO 3166-1 alpha-3
  method: derived
  rationale: The workbook identifies origins by M49 code; codes are mapped to ISO alpha-3 with the UN Population
    Division location list. A code without an ISO mapping would be kept as M49-<code>.
