  tolerance: 0.0001
notes: 'Country-of-origin mix of the international migrants living in United Arab Emirates at 1 July 2024, for both
  sexes (''total''), males and females, from UN DESA International Migrant Stock 2024 (destination and origin workbook,
  Table 1). The type of data for United Arab Emirates is ''C'': C means the estimates are derived from data on foreign
  citizens, so ''origin'' is effectively the country of citizenship and the distribution can drive nationality for
  synthetic residents. The workbook lists 30 origin countries for United Arab Emirates; at most the 30 largest per
  sex are kept, with the remainder (including the workbook''s ''Others'' row) pooled as OTHER. The origin mix of
  female migrants differs from that of male migrants, so draw nationality after sex. Counts (persons), the sex-specific
  total and the origin names ride alongside the shares; origins are keyed by ISO 3166-1 alpha-3 code. The workbook
  states that it is made available under CC BY 3.0 IGO. That licence permits reuse with attribution but is not on
  the verifier''s permissive list, so the entry stays at license-review until a reviewer accepts it.'
