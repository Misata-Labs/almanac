assumed:
- parameter: distributions[*].parameters.shares
  value: count / sum of the four citizenship and sex counts
  method: derived
  rationale: SCAD publishes counts; each share is the count divided by the sum of the counts in its distribution.
tests:
- statistic: share["Abu Dhabi Region","Non-Emirati male"]
  expected: 0.332345
  tolerance: 0.005
- statistic: share["Al Dhafra Region","Emirati female"]
  expected: 0.146754
  tolerance: 0.005
- statistic: sum_of_shares["Al Ain Region"]
  expected: 1
  tolerance: 0.0001
notes: Live births in 2025 in each of the three regions of the Emirate of Abu Dhabi (Abu Dhabi, Al Ain, Al Dhafra)
  split by citizenship and sex, from Table 1 of SCAD's Birth Statistics 2025. Births abroad, births with region
  not stated, and births with citizenship or sex not stated are left out. The Emirati share differs by region, which
  makes the table a compact prior for the citizenship of a synthetic resident given their region. SCAD's terms of
  use (https://www.scad.gov.ae/terms-of-use) state that its publications and tables may be reproduced without further
  permission provided SCAD is acknowledged as the source; the page is rendered per request and is referenced rather
  than hashed, so the entry stays at licence review.
