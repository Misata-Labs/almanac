assumed:
- parameter: shares
  value: count / sum of counts over the listed names
  method: derived
  rationale: The source publishes counts; the shares are each count over the total of the top 300 names of that
    sex, so they sum to one and a generator can draw from them directly.
- parameter: coverage
  value: sum of the listed counts / full_list_total
  method: derived
  rationale: full_list_total is the sum of Frecuencia over every name on the sheet (names held by 20 or more residents),
    so coverage is the share of those residents carrying one of the listed names.
