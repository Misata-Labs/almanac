notes: 'MOT test outcomes for the financial year 2024 to 2025 (rows with Period Total) by test class from DVSA table
  01: tests conducted, passes after rectification at the test station, fails, the initial and final fail rates in
  percent, and the tests failed with at least one dangerous item. The table also carries 2025 to 2026, but its Total
  rows there do not reconcile with the sum of its quarters and its dangerous-item columns exceed the test counts
  for some classes, so the last internally consistent financial year is used. Rows are keyed by the class label
  (Classes 1 & 2, Classes 3 & 4, Class 5, Class 7) and carry the full class description. Published under the Open
  Government Licence v3.0 (GOV.UK). '
