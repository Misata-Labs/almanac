assumed:
- parameter: distribution.parameters.counts
  value: sum over colours of each vehicle type
  method: derived
  rationale: The Ministry publishes registrations by type and colour; type totals are the sum of the type's rows,
    and shares are totals over the grand total.
- parameter: vehicle type labels
  value:
    شحن ثقيل 12 طن فاكثر: شحن ثقيل 12 طن فأكثر
  method: derived
  rationale: The source spells the heavy cargo 12 tonnes and over type two ways; rows under the variant spelling
    are counted under the common one.
tests:
- statistic: share["مركبة خفيفة"]
  expected: 0.82762
  tolerance: 0.005
- statistic: share["دراجة نارية"]
  expected: 0.074019
  tolerance: 0.005
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: Vehicles registered in the UAE in 2025 by vehicle type, from the Ministry of Interior's federal traffic system
  dataset 'Registered vehicles 2025'. Labels are kept in Arabic exactly as the Ministry publishes them (the dataset
  gives no English labels). Rows repeated for the same type and colour in the source are summed. Bayanat, the UAE
  federal open data portal run by the Federal Competitiveness and Statistics Centre, states on its Copyright and
  Data Licensing page that datasets on the portal are available under the Creative Commons Attribution 4.0 International
  licence unless otherwise stated; that page is rendered per request and is referenced rather than hashed. Bayanat
  download links carry an opaque resource token issued by the portal.
