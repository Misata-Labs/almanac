assumed:
- parameter: distributions[*].parameters.shares
  value: count / type total
  method: derived
  rationale: Shares are each colour's registrations over the type's registrations; duplicate type and colour rows
    are summed first.
- parameter: vehicle type labels
  value:
    شحن ثقيل 12 طن فاكثر: شحن ثقيل 12 طن فأكثر
  method: derived
  rationale: The source spells the heavy cargo 12 tonnes and over type two ways; rows under the variant spelling
    are counted under the common one.
tests:
- statistic: share["مركبة خفيفة","أبيض"]
  expected: 0.415233
  tolerance: 0.005
- statistic: sum_of_shares["مركبة خفيفة"]
  expected: 1
  tolerance: 0.0001
notes: Colour of vehicles registered in the UAE in 2025, conditioned on vehicle type, from the Ministry of Interior
  dataset 'Registered vehicles 2025'. Draw a type from ae-registered-vehicles-by-type-2025, then a colour from this
  table. Labels are kept in Arabic exactly as the Ministry publishes them (the dataset gives no English labels).
  Rows repeated for the same type and colour in the source are summed. Bayanat, the UAE federal open data portal
  run by the Federal Competitiveness and Statistics Centre, states on its Copyright and Data Licensing page that
  datasets on the portal are available under the Creative Commons Attribution 4.0 International licence unless otherwise
  stated; that page is rendered per request and is referenced rather than hashed. Bayanat download links carry an
  opaque resource token issued by the portal.
