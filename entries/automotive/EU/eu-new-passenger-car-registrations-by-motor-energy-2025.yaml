  agencies; PL plug_in_hybrid_petrol value imputed by Eurostat or other receiving agencies; FR natural_gas break
  in time series; PL natural_gas value imputed by Eurostat or other receiving agencies; IE hydrogen_fuel_cell value
  imputed by Eurostat or other receiving agencies; IT hydrogen_fuel_cell value imputed by Eurostat or other receiving
  agencies; PL hydrogen_fuel_cell value imputed by Eurostat or other receiving agencies; PL lpg value imputed by
