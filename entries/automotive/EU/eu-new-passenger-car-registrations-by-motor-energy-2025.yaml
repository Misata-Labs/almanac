notes: 'New registrations of passenger cars in 2025 for ten member states from Eurostat dataflow road_eqr_carpda,
  in number of vehicles: the total and the Eurostat motor energy categories petrol excluding hybrids, diesel excluding
  hybrids, electricity (battery electric), hybrid electric-petrol, plug-in hybrid petrol-electric, hybrid diesel-electric,
  plug-in hybrid diesel-electric, LPG, natural gas, hydrogen and fuel cells, and other. The categories kept do not
  necessarily sum to the total because Eurostat also publishes aggregates and categories not carried here. Rows
  are keyed by the Eurostat geo code and carry the English country name from the GEO codelist. Observation flags
  published with the data: IE diesel_excluding_hybrids value imputed by Eurostat or other receiving agencies; PL
  diesel_excluding_hybrids value imputed by Eurostat or other receiving agencies; IE battery_electric value imputed
  by Eurostat or other receiving agencies; PL battery_electric value imputed by Eurostat or other receiving agencies;
  IE hybrid_diesel value imputed by Eurostat or other receiving agencies; IT hybrid_diesel value imputed by Eurostat
  or other receiving agencies; PL hybrid_diesel value imputed by Eurostat or other receiving agencies; IE plug_in_hybrid_diesel
  value imputed by Eurostat or other receiving agencies; IT plug_in_hybrid_diesel value imputed by Eurostat or other
  receiving agencies; NL plug_in_hybrid_diesel value imputed by Eurostat or other receiving agencies; PL plug_in_hybrid_diesel
  value imputed by Eurostat or other receiving agencies; IE hybrid_petrol value imputed by Eurostat or other receiving
  agencies; IT hybrid_petrol value imputed by Eurostat or other receiving agencies; NL hybrid_petrol value imputed
  by Eurostat or other receiving agencies; PL hybrid_petrol value imputed by Eurostat or other receiving agencies;
  IE plug_in_hybrid_petrol value imputed by Eurostat or other receiving agencies; IT plug_in_hybrid_petrol value
