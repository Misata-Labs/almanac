assumed:
- parameter: distributions[*].parameters.shares
  value: count of an age band / sum over the published age bands
  method: derived
  rationale: Eurostat publishes the number of cars per age band and a total; shares divide by the sum of the bands
    actually published for the country, which can differ from the total when a band is missing.
