notes: 'Stock of passenger cars at the end of 2024 by age of vehicle for the ten member states in the Almanac''s
  Eurostat set that report the breakdown, from dataflow road_eqs_carage. Age bands carry the English labels of the
  AGE codelist; each distribution also carries the country name and the published_total. Observation flags published
  with the data: BE TOTAL value imputed by Eurostat or other receiving agencies; PL TOTAL break in time series;
  PL Y_GT20 break in time series. Eurostat''s copyright notice states that its data are released under the Creative
  Commons Attribution 4.0 International licence; the notice page renders dynamically and is referenced rather than
  hashed.'
