notes: Vehicles registered and in use in Bahrain in 2025 by registration type (private, private hire, goods vehicles,
  motorcycles, taxis, diplomatic and so on), as published by the General Directorate of Traffic, with Arabic type
  names from the same export. The Bahrain open data portal publishes no licence for this dataset (its catalogue
  licence field is empty), so the entry stays at license-review until the Information & eGovernment Authority's
  reuse terms are confirmed.
