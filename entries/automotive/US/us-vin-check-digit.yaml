assumed:
- parameter: vectors[0].input
  value: 1G4AH59H45G118341
  method: derived
  rationale: Table VI prints the sample VIN with position nine blank and shows the products for all seventeen positions;
    the characters are read from the table and the resulting check digit 4 inserted, which reproduces the table's
    products and total of 411.
