notes: 'The check digit in position nine of a seventeen-character VIN, as 49 CFR 565.15(c) prescribes: each character
  takes its numeric value or the letter value of Table III, is multiplied by the position weight of Table IV, the
  products are summed and divided by 11, and the remainder is the check digit, written X for 10. Letters I, O and
  Q are not permitted (565.13(g)). The regulation''s own Table VI calculation and two decoder results from NHTSA''s
  vPIC service supply the vectors. valid_from is the date from which subpart B applies to all vehicles (565.11).
  US government works carry no copyright, but neither source states terms, so the entry is held at license-review.'
