assumed:
- parameter: rows[*].combined_mpg_*
  value: mean, median, min and max of comb08 over the class's rows with fuelType other than Electricity
  method: derived
  rationale: comb08 is the combined label fuel economy of each configuration; the conventional group includes hybrids
    and plug-in hybrids, which raise the class maxima. Battery electric vehicles report MPG-equivalent and are summarised
    separately as electric_combined_mpge_mean.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 20
  tolerance: 0
- statistic: max[combined_mpg_mean]
  expected: 29.98
  tolerance: 1.0e-09
notes: Model year 2025 vehicles listed in the EPA fuel economy dataset (vehicles.csv, one row per vehicle configuration
  tested for the fuel economy label). Counts are rows, not sales, so the shares describe the model line-up rather
  than the fleet. Rows are keyed by the EPA VClass text and summarise the comb08 (combined) rating of the class's
  configurations. The publisher states no licence on the file itself, so the licence is recorded as unstated and
  the entry held at license-review even though US federal publications are normally free to reuse.
