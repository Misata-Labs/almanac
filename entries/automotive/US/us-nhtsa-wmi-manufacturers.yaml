assumed:
- parameter: rows
  value: a hand-picked subset of identifiers
  method: assumed
  rationale: The identifiers were chosen as widely seen prefixes of passenger car and light truck VINs; the decoded
    values are copied from the vPIC responses, but the selection is the builder's and is not a complete list of
    any kind.
- parameter: valid_from
  value: '2026-10-31'
  method: assumed
  rationale: The decode responses carry creation dates for each record but no effective date for the assignment;
    valid_from is the fetch date.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 20
  tolerance: 0
- statistic: value[JHM,make]
  expected: HONDA
  tolerance: 0
notes: The make, manufacturer and vehicle type NHTSA's vPIC service decodes for a set of common world manufacturer
  identifiers, the first three characters of a VIN, one API call per identifier. The table lets a generator pair
  a plausible VIN prefix with the make and vehicle type a decoder would report, while us-vin-check-digit supplies
  the check digit. Where the vPIC Make field lists several brands the value is kept as published. US federal government
  works carry no copyright, but the vPIC API states no reuse terms, so the licence is recorded as unstated and the
  entry held at license-review.
