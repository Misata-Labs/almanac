- statistic: count
  expected: 37
  tolerance: 0
- statistic: max[recalls]
  expected: 203.0
  tolerance: 1.0e-09
notes: Vehicle recall campaigns (recall_type Vehicle) whose Part 573 report NHTSA received in 2024, grouped by the
  affected component, with the number of campaigns and the sum of units potentially affected, from a SoQL aggregate
  query on the NHTSA Recalls Data dataset. A campaign naming several components is counted under each. Rows are
  keyed by the component text exactly as the dataset spells it. The dataset's Socrata metadata declares the licence
  as Public Domain, which has no SPDX identifier in this repository, so the licence is recorded as unstated and
  the entry held at license-review.
