notes: The closed value lists NHTSA's Product Information Catalog and Vehicle Listing (vPIC) uses for four attributes
  of a decoded VIN, keyed by the vPIC numeric Id with the published Name as the label. They give a generator the
  exact vocabulary a vPIC decode returns for vehicle type, body class, primary fuel type and drive type, so synthetic
  fleet and policy records match what a VIN lookup would produce. US federal government works carry no copyright,
  but the vPIC API states no reuse terms, so the licence is recorded as unstated and the entry held at license-review.
