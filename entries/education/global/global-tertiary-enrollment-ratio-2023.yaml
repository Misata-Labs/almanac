notes: 'School enrollment, tertiary (% gross) for 2023 from the World Development Indicators API (indicator SE.TER.ENRR,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. 2023 is the most recent year whose coverage is close to the series'' best recent year. Source
  note from the World Bank: Gross enrollment ratio is the ratio of total enrollment, regardless of age, to the population
  of the age group that officially corresponds to the level of education shown. Tertiary education, whether or not
  to an advanced research qualification, normally requires, as a minimum condition of admission, the successful
  completion of education at the secondary level. The World Bank licenses its datasets under CC BY 4.0.'
