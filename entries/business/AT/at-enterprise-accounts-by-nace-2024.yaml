assumed:
- parameter: rows[*].gross_operating_surplus_to_turnover
  value: gross_operating_surplus_meur / net_turnover_meur
  method: derived
  rationale: 'An operating-margin proxy: the ratio of the published gross operating surplus to the published net
    turnover. Eurostat''s own gross_operating_rate_percent is the same ratio in percent and is kept beside it.'
- parameter: rows[*].employee_benefits_share_of_turnover
  value: employee_benefits_expense_meur / net_turnover_meur
  method: derived
  rationale: Personnel costs as a share of turnover, from the two published aggregates.
- parameter: rows[*].value_added_per_person_employed_teur
  value: value_added_meur * 1000 / persons_employed
  method: derived
  rationale: Apparent labour productivity in thousand euro per person employed, from the published value added and
    headcount.
- parameter: rows[*].net_turnover_per_enterprise_teur
  value: net_turnover_meur * 1000 / enterprises
  method: derived
  rationale: Average enterprise size in thousand euro of turnover, from the published turnover and enterprise count.
