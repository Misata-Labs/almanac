assumed:
- parameter: rows[*].share_of_active_enterprises
  value: active_enterprises / active_enterprises of the country's TOTAL row
  method: derived
  rationale: Legal-form mix of the active enterprise population, for assigning a legal form to a synthetic company;
    share_of_persons_employed does the same for employment. The three forms need not add up to the total, which
    also covers other legal forms.
- parameter: rows[*].persons_employed_per_enterprise
