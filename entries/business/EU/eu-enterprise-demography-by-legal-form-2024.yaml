notes: 'Business demography by legal form for 2024 from Eurostat dataflow bd_l_form for the business economy aggregate
  B-S_X_O_S94, one row per country and legal form keyed geo|leg_form for the EU27 and DE, FR, IT, ES, NL, PL, SE,
  BE, AT and IE: TOTAL (Total), ENT_LL (Limited liability enterprise), ENT_PA (Partnership, co-operatives, associations,
  etc.), ENT_SOLE (Sole proprietorship). Published columns: active enterprises, enterprise births and deaths, the
  birth and death rates (births or deaths over active enterprises, in percent), persons employed and employees;
  derived columns give the legal form''s share of active enterprises and persons employed and its average headcount.
  Observation flags published with the data: break in time series (b) on DE|ENT_LL, DE|ENT_PA, DE|ENT_SOLE, DE|TOTAL;
  estimated (e) on DE|ENT_LL, DE|ENT_PA, DE|ENT_SOLE, DE|TOTAL, ES|ENT_LL, ES|ENT_PA, ES|ENT_SOLE, ES|TOTAL, IT|ENT_LL,
  IT|ENT_PA, IT|ENT_SOLE, IT|TOTAL and 4 more; provisional (p) on AT|ENT_LL, AT|ENT_PA, AT|ENT_SOLE, AT|TOTAL, BE|ENT_LL,
  BE|ENT_PA, BE|ENT_SOLE, BE|TOTAL, DE|ENT_LL, DE|ENT_PA, DE|ENT_SOLE, DE|TOTAL and 32 more. Eurostat''s copyright
