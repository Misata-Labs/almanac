assumed:
- parameter: rows[*].net_turnover_per_enterprise_teur
  value: net_turnover_meur * 1000 / enterprises
  method: derived
  rationale: Average turnover per enterprise of the size class in thousand euro.
- parameter: rows[*].net_turnover_per_person_employed_teur
  value: net_turnover_meur * 1000 / persons_employed
  method: derived
  rationale: Turnover per person employed in thousand euro, the revenue-per-head benchmark for the size class.
- parameter: rows[*].value_added_per_person_employed_teur
  value: value_added_meur * 1000 / persons_employed
  method: derived
  rationale: Apparent labour productivity in thousand euro per person employed.
- parameter: rows[*].gross_operating_surplus_to_turnover
  value: gross_operating_surplus_meur / net_turnover_meur
  method: derived
  rationale: Operating margin proxy as a ratio; Eurostat's gross_operating_rate_percent is the published percentage
    and is kept beside it.
- parameter: rows[*].employee_benefits_share_of_turnover
  value: employee_benefits_expense_meur / net_turnover_meur
  method: derived
  rationale: Personnel costs as a share of turnover.
- parameter: rows[*].enterprise_share_of_activity
  value: enterprises / enterprises of the TOTAL size class of the same activity
  method: derived
  rationale: Share of the activity's enterprises in the size class, for sampling a size class given an activity;
    the other *_share_of_activity columns do the same for persons employed and turnover.
