notes: 'Structural business statistics for European Union - 27 countries (from 2020) in 2024 from Eurostat dataflow
  sbs_sc_ovw, one row per NACE Rev. 2 activity and size class of persons employed, keyed activity|size_class: the
  aggregate B-S_X_O_S94 (Industry, construction and market services (except public administration and defence; compulsory
  social security; activities of membership organisations)), sections B to R except O, and divisions S95 and S96,
  each for the classes 0_1, 2-9, 10-19, 20-49, 50-249, GE250 and TOTAL; classes are by persons employed, not employees,
  and a class the country does not publish has no row. Published columns, with their INDIC_SBS labels: enterprises
  (Enterprises - number); persons_employed (Persons employed - number); net_turnover_meur (Net turnover - million
  euro); value_added_meur (Value added - million euro); gross_operating_surplus_meur (Gross operating surplus -
  million euro); employee_benefits_expense_meur (Employee benefits expense - million euro); gross_operating_rate_percent
  (Gross operating rate - percentage). Derived columns give turnover per enterprise and per person employed, value
  added per person employed, the operating-surplus and personnel-cost shares of turnover, and each class''s share
  of the activity''s enterprises, persons employed and turnover; every derived column is null where an input is
  missing. This complements the by-NACE enterprise accounts entries, which have no size dimension. Cells Eurostat
  withholds as confidential (no value) occur in: B-S_X_O_S94|50-249, B-S_X_O_S94|GE250, C|50-249, D|20-49, D|50-249,
  E|10-19, E|GE250, F|10-19, F|20-49, F|50-249, F|GE250, K|10-19, K|50-249, K|GE250, L|GE250, M|GE250, P|10-19,
  P|50-249, P|GE250, Q|10-19 and more. Observation flags published with the data: estimated (e) on B-S_X_O_S94|GE250,
  B|10-19, B|20-49, B|TOTAL, C|10-19, C|20-49, D|10-19, D|20-49, D|GE250, D|TOTAL, E|10-19, E|20-49 and 38 more.
  Eurostat''s copyright notice states that its data are released under the Creative Commons Attribution 4.0 International
  licence; the notice page renders dynamically and is referenced rather than hashed.'
