notes: 'High-growth enterprises in 2024 by country for the business economy excluding public administration and
  membership organisations, from Eurostat dataflow bd_hg. High growth is measured in employment. Columns give the
  count of high-growth enterprises, their number divided by active enterprises with at least 10 employees, their
  employees, those employees divided by employees in active enterprises with at least 10 employees, and the same
  count and share for young high-growth enterprises; parameters.indicator_labels carries Eurostat''s label for each
  indicator. Flagged observations: DE ENT_HGRWR_PC (b), IE ENT_HGRWR_PC (e), IS ENT_HGRWR_PC (e), PT ENT_HGRWR_PC
  (b), DE ENT_HGRWR_YNG_PC (b), IE ENT_HGRWR_YNG_PC (e), IS ENT_HGRWR_YNG_PC (e), PT ENT_HGRWR_YNG_PC (b), IE ENT_HGRW_NR
  (e), IS ENT_HGRW_NR (e), PT ENT_HGRW_NR (b), IE ENT_HGRW_YNG_NR (e), IS ENT_HGRW_YNG_NR (e), PT ENT_HGRW_YNG_NR
  (b), DE SAL_HGRWR_PC (b), EU27_2020 SAL_HGRWR_PC (e), IS SAL_HGRWR_PC (e), PT SAL_HGRWR_PC (b), IE SAL_HGRW_NR
  (e), IS SAL_HGRW_NR (e), PT SAL_HGRW_NR (b). Eurostat flags: b break in series, e estimated, p provisional. Eurostat''s
  copyright notice states that its data are released under the Creative Commons Attribution 4.0 International licence;
  the notice page renders dynamically and is referenced rather than hashed.'
