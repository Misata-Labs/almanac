notes: 'Business demography for 2024 from Eurostat dataflow bd_size for the business economy aggregate B-S_X_O_S94:
  the population of active enterprises, enterprise births and deaths, the birth rate, death rate and churn rate
  (births plus deaths over active enterprises, in percent), the survival rates of enterprises born one, two and
  three years earlier (survivors over the births of the birth year, in percent; Eurostat publishes no four- or five-year
  survival in this flow), and the birth rate, death rate and active population for the four employee size classes
  zero, 1 to 4, 5 to 9 and 10 or more. Size-class birth and death rates relate the births or deaths in a class to
  the active enterprises of the same class, so the class counts, not the rates, add up to the totals. Rows are keyed
  by the Eurostat geo code and carry the English country name from the GEO codelist; a cell Eurostat does not publish
  is stored as null. Observation flags published with the data: break in time series (b): DE (birth_rate_percent,
  enterprise_births, active_enterprises, survival_rate_1_year_percent, survival_rate_2_year_percent, survival_rate_3_year_percent,
  birth_rate_percent_0_employees, active_enterprises_0_employees, birth_rate_percent_1_4_employees, active_enterprises_1_4_employees,
  birth_rate_percent_5_9_employees, active_enterprises_5_9_employees, birth_rate_percent_10_plus_employees, active_enterprises_10_plus_employees);
  ES (survival_rate_3_year_percent); FR (survival_rate_2_year_percent, survival_rate_3_year_percent); IT (survival_rate_3_year_percent);
  SE (survival_rate_2_year_percent). break in time series, provisional (bp): DE (churn_rate_percent, death_rate_percent,
  enterprise_deaths, death_rate_percent_0_employees, death_rate_percent_1_4_employees, death_rate_percent_5_9_employees,
  death_rate_percent_10_plus_employees). estimated (e): IE (survival_rate_1_year_percent, survival_rate_2_year_percent,
  survival_rate_3_year_percent). estimated, provisional (ep): ES (churn_rate_percent, death_rate_percent, enterprise_deaths,
  death_rate_percent_0_employees, death_rate_percent_1_4_employees, death_rate_percent_5_9_employees, death_rate_percent_10_plus_employees);
  IT (churn_rate_percent, death_rate_percent, enterprise_deaths, death_rate_percent_0_employees, death_rate_percent_1_4_employees,
  death_rate_percent_5_9_employees, death_rate_percent_10_plus_employees); PL (churn_rate_percent, death_rate_percent,
  enterprise_deaths, death_rate_percent_0_employees, death_rate_percent_1_4_employees, death_rate_percent_5_9_employees,
  death_rate_percent_10_plus_employees). provisional (p): AT (churn_rate_percent, death_rate_percent, enterprise_deaths,
  death_rate_percent_0_employees, death_rate_percent_1_4_employees, death_rate_percent_5_9_employees, death_rate_percent_10_plus_employees);
  BE (churn_rate_percent, death_rate_percent, enterprise_deaths, death_rate_percent_0_employees, death_rate_percent_1_4_employees,
  death_rate_percent_5_9_employees, death_rate_percent_10_plus_employees); FR (churn_rate_percent, death_rate_percent,
  enterprise_deaths, death_rate_percent_0_employees, death_rate_percent_1_4_employees, death_rate_percent_5_9_employees,
  death_rate_percent_10_plus_employees); IE (churn_rate_percent, death_rate_percent, enterprise_deaths, death_rate_percent_0_employees,
  death_rate_percent_1_4_employees, death_rate_percent_5_9_employees, death_rate_percent_10_plus_employees); NL
  (churn_rate_percent, death_rate_percent, enterprise_deaths, death_rate_percent_0_employees, death_rate_percent_1_4_employees,
  death_rate_percent_5_9_employees, death_rate_percent_10_plus_employees); SE (churn_rate_percent, death_rate_percent,
  enterprise_deaths, death_rate_percent_0_employees, death_rate_percent_1_4_employees, death_rate_percent_5_9_employees,
  death_rate_percent_10_plus_employees). Eurostat''s copyright notice states that its data are released under the
  Creative Commons Attribution 4.0 International licence; the notice page renders dynamically and is referenced
  rather than hashed.'
