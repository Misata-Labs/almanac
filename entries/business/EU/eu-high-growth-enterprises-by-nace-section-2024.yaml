notes: 'High-growth enterprises measured in employment for 2024 from Eurostat dataflow bd_hg, one row per country
  and activity keyed geo|nace for the EU27 and DE, FR, IT, ES, NL, PL, SE, BE, AT and IE, over NACE sections B to
  R except O and divisions S95 and S96 (the business-economy total is not included, so the table carries the industry
  split only). Column definitions from Eurostat''s INDIC_SBS codelist: high_growth_enterprises: High-growth enterprises
  measured in employment - number; high_growth_share_of_enterprises_10_plus_percent: Share of high growth enterprises,
  measured in employment - high growth enterprises divided by active enterprises with at least 10 employees - percentage;
  employees_in_high_growth_enterprises: Employees in high-growth enterprises measured in employment - number; high_growth_share_of_employees_10_plus_percent:
  Employment share of high growth enterprises, measured in employment - employees in high growth enterprises divided
  by employees in active enterprises with at least 10 employees - percentage; employees_per_high_growth_enterprise:
  Size of high growth enterprises, measured in employment - employees in high growth enterprises divided by high
  growth enterprises - average number; young_high_growth_enterprises: Young high-growth enterprises measured in
  employment - number; young_high_growth_share_of_enterprises_10_plus_percent: Share of young high growth enterprises,
  measured in employment, in the population of active enterprises - young high growth enterprises divided by active
  enterprises with at least 10 employees - percentage; employees_in_young_high_growth_enterprises: Employees in
  young high-growth enterprises measured in employment - number. Shares relate to the population of active enterprises
  with at least 10 employees, so they cannot be read as shares of all enterprises. Use the rate to flag a fraction
  of synthetic 10-plus-employee portfolio companies as high-growth. Observation flags published with the data: break
  in time series (b) on DE|B, DE|C, DE|D, DE|E, DE|F, DE|G, DE|H, DE|I, DE|J, DE|K, DE|L, DE|M and 6 more; estimated
  (e) on EU27_2020|B, EU27_2020|C, EU27_2020|E, EU27_2020|F, EU27_2020|H, EU27_2020|J, EU27_2020|K, EU27_2020|R,
  EU27_2020|S95, EU27_2020|S96, IE|B, IE|C and 16 more. Eurostat''s copyright notice states that its data are released
  under the Creative Commons Attribution 4.0 International licence; the notice page renders dynamically and is referenced
  rather than hashed.'
