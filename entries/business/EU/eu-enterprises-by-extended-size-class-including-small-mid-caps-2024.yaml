notes: 'Business economy (B-S_X_O_S94) statistics for 2024 by extended size class of persons employed from Eurostat
  dataflow sbs_ovw_smc, which splits the large-enterprise class into 250-749 and 750 or more persons employed to
  identify small mid-caps; one row per country and size class keyed geo|size_class. Eurostat publishes this flow
  for 10 countries: BG, DE, ES, FI, HR, IT, LT, MT, PL, PT, of which DE, ES, IT, PL are among the ten member states
  covered elsewhere in the Almanac. Countries without a 250-749 row publish no small mid-cap split. Size classes:
  0-9 (From 0 to 9 persons employed), 10-19 (From 10 to 19 persons employed), 20-49 (From 20 to 49 persons employed),
  50-249 (From 50 to 249 persons employed), 250-749 (From 250 to 749 persons employed), GE750 (750 persons employed
  or more), TOTAL (Total). Published columns: enterprises, persons employed, net turnover and value added in million
  euro, net turnover per person employed and apparent labour productivity in thousand euro; derived columns give
  turnover per enterprise and the class''s share of enterprises and turnover. Eurostat''s copyright notice states
  that its data are released under the Creative Commons Attribution 4.0 International licence; the notice page renders
  dynamically and is referenced rather than hashed.'
