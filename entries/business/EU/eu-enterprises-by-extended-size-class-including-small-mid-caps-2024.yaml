assumed:
- parameter: rows[*].net_turnover_per_enterprise_teur
  value: net_turnover_meur * 1000 / enterprises
  method: derived
  rationale: Average turnover per enterprise of the size class in thousand euro, the revenue anchor for a synthetic
    mid-cap.
- parameter: rows[*].enterprise_share_of_total
  value: enterprises / enterprises of the country's TOTAL row
  method: derived
  rationale: Share of the country's business-economy enterprises in the size class; net_turnover_share_of_total
    does the same for turnover. The classes 0-9, 10-19, 20-49, 50-249, 250-749 and 750 or more partition the total,
    up to rounding, where all are published.
