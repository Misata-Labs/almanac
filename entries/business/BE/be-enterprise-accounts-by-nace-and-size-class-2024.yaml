notes: 'Structural business statistics for Belgium in 2024 from Eurostat dataflow sbs_sc_ovw, one row per NACE Rev.
  2 activity and size class of persons employed, keyed activity|size_class: the aggregate B-S_X_O_S94 (Industry,
  construction and market services (except public administration and defence; compulsory social security; activities
  of membership organisations)), sections B to R except O, and divisions S95 and S96, each for the classes 0_1,
  2-9, 10-19, 20-49, 50-249, GE250 and TOTAL; classes are by persons employed, not employees, and a class the country
  does not publish has no row. Published columns, with their INDIC_SBS labels: enterprises (Enterprises - number);
  persons_employed (Persons employed - number); net_turnover_meur (Net turnover - million euro); value_added_meur
  (Value added - million euro); gross_operating_surplus_meur (Gross operating surplus - million euro); employee_benefits_expense_meur
  (Employee benefits expense - million euro); gross_operating_rate_percent (Gross operating rate - percentage).
  Derived columns give turnover per enterprise and per person employed, value added per person employed, the operating-surplus
  and personnel-cost shares of turnover, and each class''s share of the activity''s enterprises, persons employed
  and turnover; every derived column is null where an input is missing. This complements the by-NACE enterprise
  accounts entries, which have no size dimension. Cells Eurostat withholds as confidential (no value) occur in:
  B|50-249, B|GE250, D|10-19, D|20-49, S95|10-19, S95|20-49, S95|50-249, S95|GE250. Eurostat''s copyright notice
  states that its data are released under the Creative Commons Attribution 4.0 International licence; the notice
  page renders dynamically and is referenced rather than hashed.'
