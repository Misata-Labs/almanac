notes: 'Structural business statistics for Ireland in 2024 from Eurostat dataflow sbs_ovw_act, one row per NACE
  Rev. 2 section (B to R, excluding O) and division (B05 to S96) plus the business economy aggregate B-S_X_O_S94
  (industry, construction and market services except public administration, defence, compulsory social security
  and membership organisations). Published columns: number of enterprises, persons employed, net turnover, value
  added, gross operating surplus and employee benefits expense (Eurostat''s personnel-costs concept) in million
  euro, and the gross operating rate in percent. Derived columns give the operating-surplus and personnel-cost shares
  of turnover, value added per person employed and turnover per enterprise; every derived column is null where an
  input is missing. Each row carries the English NACE label and its level (aggregate, section or division). Cells
  Eurostat withholds as confidential (no value) occur in: B, B05, B06, B07, B09, C11, C12, C14, C15, C18, C19, C21,
  C23, C24, C26, C27, C29, C30, C31, C32, D, D35, E36, E37, E39, H50, H51, J58, J59, J60, J61, J63, R90, R91, R92,
  R93. Eurostat''s copyright notice states that its data are released under the Creative Commons Attribution 4.0
  International licence; the notice page renders dynamically and is referenced rather than hashed.'
