- parameter: rows[*].value_added_per_person_employed_teur
  value: value_added_meur * 1000 / persons_employed
  method: derived
  rationale: Apparent labour productivity in thousand euro per person employed.
- parameter: rows[*].gross_operating_surplus_to_turnover
  value: gross_operating_surplus_meur / net_turnover_meur
  method: derived
  rationale: Operating margin proxy as a ratio; Eurostat's gross_operating_rate_percent is the published percentage
    and is kept beside it.
- parameter: rows[*].employee_benefits_share_of_turnover
  value: employee_benefits_expense_meur / net_turnover_meur
  method: derived
  rationale: Personnel costs as a share of turnover.
- parameter: rows[*].enterprise_share_of_activity
  value: enterprises / enterprises of the TOTAL size class of the same activity
  method: derived
  rationale: Share of the activity's enterprises in the size class, for sampling a size class given an activity;
    the other *_share_of_activity columns do the same for persons employed and turnover.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 114
  tolerance: 0
- statistic: value[B-S_X_O_S94|TOTAL,enterprises]
  expected: 410205
  tolerance: 0
- statistic: max[net_turnover_per_person_employed_teur]
  expected: 4810.677
  tolerance: 0
notes: 'Structural business statistics for Ireland in 2024 from Eurostat dataflow sbs_sc_ovw, one row per NACE Rev.
  2 activity and size class of persons employed, keyed activity|size_class: the aggregate B-S_X_O_S94 (Industry,
  construction and market services (except public administration and defence; compulsory social security; activities
  of membership organisations)), sections B to R except O, and divisions S95 and S96, each for the classes 0_1,
  2-9, 10-19, 20-49, 50-249, GE250 and TOTAL; classes are by persons employed, not employees, and a class the country
  does not publish has no row. Published columns, with their INDIC_SBS labels: enterprises (Enterprises - number);
  persons_employed (Persons employed - number); net_turnover_meur (Net turnover - million euro); value_added_meur
  (Value added - million euro); gross_operating_surplus_meur (Gross operating surplus - million euro); employee_benefits_expense_meur
  (Employee benefits expense - million euro); gross_operating_rate_percent (Gross operating rate - percentage).
  Derived columns give turnover per enterprise and per person employed, value added per person employed, the operating-surplus
  and personnel-cost shares of turnover, and each class''s share of the activity''s enterprises, persons employed
  and turnover; every derived column is null where an input is missing. This complements the by-NACE enterprise
  accounts entries, which have no size dimension. Cells Eurostat withholds as confidential (no value) occur in:
  B|10-19, B|20-49, B|50-249, B|GE250, B|TOTAL, C|10-19, C|20-49, C|50-249, D|10-19, D|20-49, D|50-249, D|GE250,
  D|TOTAL, E|50-249, E|GE250, F|10-19, F|20-49, L|20-49, L|50-249, S95|20-49 and more. Eurostat''s copyright notice
  states that its data are released under the Creative Commons Attribution 4.0 International licence; the notice
  page renders dynamically and is referenced rather than hashed.'
