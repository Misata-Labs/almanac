  expected: 21.67
  tolerance: 0
notes: 'Counts of Australian businesses for 2025-26 by ANZSIC 2006 industry division (plus Currently Unknown and
  All Industries) from Tables 1 and 2 of data cube 1, keyed by division name. Each row carries businesses operating
  at the start and end of the year, entries and exits, derived entry, birth and exit rates, the division''s share
  of all businesses, and survival of the June 2022 population to June 2026. Source: ABS release 8165.0, data cube
  1, released 18 August 2026; flow columns come from the 2025-26 block of the flow table. Entries split into births
  and other entries and exits into cancellations and other exits as the ABS publishes them. Survival columns follow
  the businesses operating in June 2022 to June 2023, 2024, 2025 and 2026. The ABS website copyright page states
