assumed:
- parameter: rows[*].entry_rate_percent
  value: entries_total / operating_at_start * 100
  method: derived
  rationale: Entries during 2025-26 relative to businesses operating at its start; exit_rate_percent and birth_rate_percent
    do the same for total exits and for births.
- parameter: rows[*].share_of_businesses_at_end
  value: operating_at_end / operating_at_end of All Industries
  method: derived
  rationale: Share of all businesses operating at the end of the year, for sampling a category.
- parameter: valid_from, valid_to
  value: 2025-07-01 to 2026-06-30
  method: assumed
  rationale: The 2025-26 financial year is taken as July 2025 to June 2026, consistent with the June reference points
    of the cube's title and survival tables.
