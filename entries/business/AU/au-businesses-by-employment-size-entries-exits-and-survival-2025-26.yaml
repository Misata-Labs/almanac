assumed:
- parameter: rows[*].entry_rate_percent
  value: entries_total / operating_at_start * 100
  method: derived
  rationale: Entries during 2025-26 relative to businesses operating at its start; exit_rate_percent and birth_rate_percent
    do the same for total exits and for births.
- parameter: rows[*].share_of_businesses_at_end
  value: operating_at_end / operating_at_end of Total
  method: derived
  rationale: Share of all businesses operating at the end of the year, for sampling a category.
- parameter: valid_from, valid_to
  value: 2025-07-01 to 2026-06-30
  method: assumed
  rationale: The 2025-26 financial year is taken as July 2025 to June 2026, consistent with the June reference points
    of the cube's title and survival tables.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 7
  tolerance: 0
- statistic: value[Total,operating_at_end]
  expected: 2814778
  tolerance: 0
- statistic: max[exit_rate_percent]
  expected: 17.24
  tolerance: 0
notes: 'Counts of Australian businesses for 2025-26 by employment size range (non-employing, 1-4, 5-19, 20-199 and
  200 or more employees, plus the employing and grand totals) from Tables 13 and 15 of data cube 1, keyed by the
  published range with en dashes written as hyphens. Each row carries businesses operating at the start and end
  of the year, entries and exits, derived entry, birth and exit rates, the category''s share of all businesses,
  and survival of the June 2022 population to June 2026. Size ranges are by employment, not turnover; this release
  publishes no turnover size ranges. Source: ABS release 8165.0, data cube 1, released 18 August 2026; flow columns
  come from the 2025-26 block of the flow table. Entries split into births and other entries and exits into cancellations
  and other exits as the ABS publishes them. Survival columns follow the businesses operating in June 2022 to June
  2023, 2024, 2025 and 2026. The ABS website copyright page states that, unless otherwise noted, its content is
  licensed under Creative Commons Attribution 4.0 International; that page renders with varying bytes between fetches,
  so it is referenced rather than hashed and the entry is held at license-review until the licence of this file
  is confirmed.'
