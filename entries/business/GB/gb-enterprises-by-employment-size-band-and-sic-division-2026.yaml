notes: 'Distribution of UK enterprises over employment size bands (0-4, 5-9, 10-19, 20-49, 50-99, 100-249, 250+,
  in persons employed) for each two-digit SIC 2007 division, from the United Kingdom block of Table 3 of the ONS
  workbook. Each distribution carries the published counts by band, the published total and the division name. Divisions
  whose published counts are all zero are omitted: 05, 07, 12, 97, 98, 99. Counts are VAT and/or PAYE based enterprises
  (or local units, the individual sites of an enterprise) from a 2026 snapshot of the Inter-Departmental Business
  Register, published on 24 September 2026. The workbook notes say that counts are rounded to base 5 to avoid disclosure
  (so a zero is not necessarily a true zero and totals can differ slightly from the sum of their parts), that employment
  comes mainly from the Business Register Employment Survey with PAYE jobs or VAT-imputed employment for the smallest
  units, that turnover is mainly from VAT returns for a twelve-month period covering the 2024/2025 financial year
  and is stated in thousand pounds, and that a new SIC coding tool introduced in late 2025 changed some detailed
  industry assignments. Unlike the Business Population Estimates, these counts exclude unregistered businesses and
  cover public-sector and non-profit bodies as well as private businesses. ONS publishes under the Open Government
  Licence v3.0.'
