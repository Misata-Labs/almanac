notes: 'One row per area keyed by GSS code (United Kingdom, Great Britain, England and Wales, England, the nine
  English regions, Wales, Scotland and Northern Ireland) from the total blocks of Tables 14, 15 and 24 of the ONS
  workbook: enterprises by employment size band (0-4, 5-9, 10-19, 20-49, 50-99, 100-249, 250+ persons), enterprises
  by turnover size band (0-49, 50-99, 100-249, 250-499, 500-999, 1000-1999, 2000-4999, 5000-9999, 10000-49999, 50000+
  thousand pounds), enterprises by legal status (company including building society, sole proprietor, partnership,
  public corporation or nationalised body, central government, local authority, non-profit body or mutual association),
  and local units by employment size band. An enterprise is placed at its main operating site or head office, so
  an area''s local units can outnumber its enterprises. Counts are VAT and/or PAYE based enterprises (or local units,
  the individual sites of an enterprise) from a 2026 snapshot of the Inter-Departmental Business Register, published
  on 24 September 2026. The workbook notes say that counts are rounded to base 5 to avoid disclosure (so a zero
  is not necessarily a true zero and totals can differ slightly from the sum of their parts), that employment comes
  mainly from the Business Register Employment Survey with PAYE jobs or VAT-imputed employment for the smallest
  units, that turnover is mainly from VAT returns for a twelve-month period covering the 2024/2025 financial year
  and is stated in thousand pounds, and that a new SIC coding tool introduced in late 2025 changed some detailed
  industry assignments. Unlike the Business Population Estimates, these counts exclude unregistered businesses and
  cover public-sector and non-profit bodies as well as private businesses. ONS publishes under the Open Government
  Licence v3.0.'
