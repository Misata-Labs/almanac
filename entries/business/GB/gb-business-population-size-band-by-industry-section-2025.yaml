assumed:
- parameter: distributions[*].parameters.shares
  value: businesses in a band / sum of businesses over the bands
  method: derived
  rationale: Shares are taken over the published size bands (the all-businesses and all-employers totals are kept
    out); because the counts are rounded, the band sum can differ slightly from the published all-businesses figure,
    which is kept as all_businesses.
- parameter: distributions[*].parameters.turnover_per_employment_gbp_thousand
  value: turnover_gbp_million / employment_thousands
  method: derived
  rationale: Turnover per person employed in thousand pounds for the band; null where either input is suppressed
    or not available.
tests:
- statistic: share[C,10-19]
  expected: 0.042819
  tolerance: 0.005
- statistic: share[F,0-unregistered]
  expected: 0.565029
  tolerance: 0.01
- statistic: sum_of_shares[C]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[ALL]
  expected: 1
  tolerance: 0.0001
notes: Size-band distribution of UK private-sector businesses at the start of 2025 for each SIC 2007 section, from
  Table 5 of the Business Population Estimates detailed tables, keyed by section letter (B+D+E is the combined mining,
  energy and water block the table publishes; ALL is all industries). Each distribution is over twelve employee
  size bands (zero employees unregistered and registered, 1, 2-4, 5-9, 10-19, 20-49, 50-99, 100-199, 200-249, 250-499
  and 500 or more) and carries the published business counts, employment in thousands, turnover in million pounds,
  derived turnover per person employed, the section name and the published all-businesses total. Sample a band from
  the shares, then size the firm's revenue from turnover_per_employment_gbp_thousand of the same band. The Business
  Population Estimates count private-sector businesses at the start of 2025, combining businesses registered for
  VAT or PAYE on the Inter-Departmental Business Register with estimates of unregistered businesses. The release
  notes say that companies with a single PAYE employee are counted with no employees (the employee is treated as
  a working proprietor), that the turnover of unregistered businesses is imputed from registered zero-employee businesses
  in the same sector, that all-industry turnover totals leave out section K (financial and insurance activities)
  because its turnover is not available on a comparable basis, and that business counts are rounded so totals may
  differ slightly from the sum of the bands; [c] marks a disclosive cell and [x] a cell that is not available, both
  stored as null. Employment counts working proprietors and employees, in thousands; turnover is in million pounds
  excluding VAT. GOV.UK content is published under the Open Government Licence v3.0.
