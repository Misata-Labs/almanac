notes: 'Distribution of UK enterprises over turnover size bands (0-49, 50-99, 100-249, 250-499, 500-999, 1000-4999,
  5000+, in thousand pounds of annual turnover) for each two-digit SIC 2007 division, from the United Kingdom block
  of Table 8 of the ONS workbook. Each distribution carries the published counts by band, the published total and
  the division name. Divisions whose published counts are all zero are omitted: 05, 07, 12, 97, 98, 99. Counts are
  VAT and/or PAYE based enterprises (or local units, the individual sites of an enterprise) from a 2026 snapshot
  of the Inter-Departmental Business Register, published on 24 September 2026. The workbook notes say that counts
  are rounded to base 5 to avoid disclosure (so a zero is not necessarily a true zero and totals can differ slightly
  from the sum of their parts), that employment comes mainly from the Business Register Employment Survey with PAYE
  jobs or VAT-imputed employment for the smallest units, that turnover is mainly from VAT returns for a twelve-month
  period covering the 2024/2025 financial year and is stated in thousand pounds, and that a new SIC coding tool
  introduced in late 2025 changed some detailed industry assignments. Unlike the Business Population Estimates,
  these counts exclude unregistered businesses and cover public-sector and non-profit bodies as well as private
  businesses. ONS publishes under the Open Government Licence v3.0.'
