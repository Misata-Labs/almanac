assumed:
- parameter: rows[*].turnover_per_employment_gbp_thousand
  value: turnover_gbp_million / employment_thousands
  method: derived
  rationale: Turnover per person employed (working proprietors plus employees) in thousand pounds, from the published
    turnover and employment of the band.
- parameter: rows[*].turnover_per_business_gbp_thousand
  value: turnover_gbp_million * 1000 / businesses
  method: derived
  rationale: Average turnover per business of the band in thousand pounds.
- parameter: rows[*].employment_per_business
  value: employment_thousands * 1000 / businesses
  method: derived
  rationale: Average headcount (working proprietors plus employees) per business of the band.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 15
  tolerance: 0
- statistic: value[all,businesses]
  expected: 5690265
  tolerance: 0
- statistic: max[turnover_per_employment_gbp_thousand]
  expected: 365.371
  tolerance: 0
notes: UK private-sector business population at the start of 2025 from Table 1 of the Business Population Estimates
  detailed tables, one row per employee size band (zero-employee businesses split into unregistered and VAT or PAYE
  registered, then 1, 2-4, 5-9, 10-19, 20-49, 50-99, 100-199, 200-249, 250-499, 500-999 and 1000 or more) plus the
  all-businesses and all-employers totals. Each row carries the number of businesses, employment, employees and
  working proprietors in thousands, turnover in million pounds, the published percentages, and derived turnover
  per person employed, turnover per business and headcount per business. The Business Population Estimates count
  private-sector businesses at the start of 2025, combining businesses registered for VAT or PAYE on the Inter-Departmental
  Business Register with estimates of unregistered businesses. The release notes say that companies with a single
  PAYE employee are counted with no employees (the employee is treated as a working proprietor), that the turnover
  of unregistered businesses is imputed from registered zero-employee businesses in the same sector, that all-industry
  turnover totals leave out section K (financial and insurance activities) because its turnover is not available
  on a comparable basis, and that business counts are rounded so totals may differ slightly from the sum of the
  bands; [c] marks a disclosive cell and [x] a cell that is not available, both stored as null. Employment counts
  working proprietors and employees, in thousands; turnover is in million pounds excluding VAT. GOV.UK content is
  published under the Open Government Licence v3.0.
