notes: 'Structural business statistics for Spain in 2024 from Eurostat dataflow sbs_ovw_act, one row per NACE Rev.
  2 section (B to R, excluding O) and division (B05 to S96) plus the business economy aggregate B-S_X_O_S94 (industry,
  construction and market services except public administration, defence, compulsory social security and membership
  organisations). Published columns: number of enterprises, persons employed, net turnover, value added, gross operating
  surplus and employee benefits expense (Eurostat''s personnel-costs concept) in million euro, and the gross operating
  rate in percent. Derived columns give the operating-surplus and personnel-cost shares of turnover, value added
  per person employed and turnover per enterprise; every derived column is null where an input is missing. Each
  row carries the English NACE label and its level (aggregate, section or division). Eurostat''s copyright notice
  states that its data are released under the Creative Commons Attribution 4.0 International licence; the notice
  page renders dynamically and is referenced rather than hashed.'
