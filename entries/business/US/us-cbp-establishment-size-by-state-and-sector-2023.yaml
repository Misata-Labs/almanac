notes: Establishment counts by establishment employment size class (<5, 5-9, 10-19, 20-49, 50-99, 100-249, 250-499,
  500-999, 1,000+) and in total for every state and NAICS sector, keyed 'FIPS|sector' (for example '48|23' is construction
  in Texas; sector codes follow SUSB, so manufacturing is '31-33'). The counts are the published establishment counts,
  which carry no noise. Use it to place a synthetic establishment in a state, sector and size class at once. CBP
  counts establishments with paid employees; its size classes (columns n<5 to n1000) are the establishment's own
  employment, not the firm's. Employment, payroll and first-quarter payroll carry noise flags (G low, H medium,
  J high, N not available); establishment counts carry none. Size classes whose count the source prints as N are
  null and left out of the shares, so the published classes can add to slightly less than the total. The Census
  Bureau publishes these files without a licence statement, so the licence is recorded as unstated and the entry
  held at license-review.
