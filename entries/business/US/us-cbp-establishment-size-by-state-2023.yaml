notes: For each state and the District of Columbia (keyed by name, with the FIPS code), the share of establishments
  in each establishment employment size class (<5 to 1,000+) across all sectors, with establishment counts, employment,
  annual payroll ($1,000) and derived payroll per employee by class. CBP counts establishments with paid employees;
  its size classes (columns n<5 to n1000) are the establishment's own employment, not the firm's. Employment, payroll
  and first-quarter payroll carry noise flags (G low, H medium, J high, N not available); establishment counts carry
  none. Size classes whose count the source prints as N are null and left out of the shares, so the published classes
  can add to slightly less than the total. The Census Bureau publishes these files without a licence statement,
  so the licence is recorded as unstated and the entry held at license-review.
