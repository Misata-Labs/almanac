notes: For each NAICS sector (keyed by its code, with 'all' for all sectors), the share of US employer firms by
  legal form of organization (Corporation, S-Corporation, Partnership, Sole Propietorship as the source spells it,
  Nonprofit, Government, Other), with the published firms, establishments, employment, annual payroll and receipts
  and derived receipts and payroll per employee. Useful for assigning a plausible entity type to a synthetic company
  in a KYB or deal-sourcing demo. SUSB applies noise to employment, payroll and receipts (flags G, H and J mark
  low, medium and high noise); firm and establishment counts carry no noise flag. The tables credit the 2022 County
  Business Patterns and Economic Census as their source. The Census Bureau publishes these files without a licence
  statement, so the licence is recorded as unstated and the entry held at license-review.
