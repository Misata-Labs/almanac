notes: 'Return and balance-sheet ratios for the five quarters 2Q 2025 to 2Q 2026 from the Census Bureau Quarterly
  Financial Report, second quarter 2026. Coverage: manufacturing corporations of all asset sizes. Published ratios:
  annual rate of profit on stockholders'' equity and on total assets, before and after income taxes (percent); current
  ratio, cash and securities to current liabilities, and stockholders'' equity to total debt (times); short-term
  debt, long-term debt, total liabilities and stockholders'' equity as percent of total assets. Derived: total liabilities
  to equity and interest coverage (income from operations over interest expense). After-tax margins on sales are
  in the existing QFR margin entries. The pinned quarterly workbook under /econ/qfr/xls/ does not change after release,
  but later releases revise these quarters. The Census Bureau publishes these files without a licence statement,
  so the licence is recorded as unstated and the entry held at license-review.'
