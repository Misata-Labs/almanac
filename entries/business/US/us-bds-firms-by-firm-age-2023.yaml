notes: US employer firms in 2023 by firm age in years (0, 1, 2, 3, 4, 5, 6 to 10, 11 to 15, 16 to 20, 21 to 25,
  26+ and the source's Left Censored class of firms whose age the data cannot establish), with the share of firms,
  establishments, employment, establishment entry and exit rates, job creation, destruction, net and reallocation
  rates and firm deaths. Age 0 firms are start-ups; the source publishes their entry and job creation rates as 200.
  Entry, exit and job flow measures cover the twelve months before the reference date ('during the last 12 months'
  in the Census variable labels), and rates are percentages of the published denominator (the 'denom' column). Cells
  the source marks X (not applicable), D (withheld to avoid disclosing data of individual companies), N or S are
  omitted or null. The Census Bureau publishes these files without a licence statement, so the licence is recorded
  as unstated and the entry held at license-review.
