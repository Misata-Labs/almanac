assumed:
- parameter: shares
  value: published percent / 100
  method: derived
  rationale: The published percentages of employer firms restated as fractions; they add to one up to the source's
    rounding.
tests:
- statistic: share["Total","Yes, this business applied for credit"]
  expected: 0.132
  tolerance: 0.005
- statistic: sum_of_shares["Total"]
  expected: 1
  tolerance: 0.002
- statistic: share["Female","No, this business did not apply for credit"]
  expected: 0.784
  tolerance: 0.005
notes: 'For each owner group (Total, sex, race, ethnicity, minority and veteran status), the shares of employer
  firms that applied for new credit in 2024, did not apply, or did not know, with the published percentages and
  standard errors. Percentages of employer firms classifiable by owner sex, ethnicity, race and veteran status,
  from the 2025 Annual Business Survey (reference year 2024); the source marks these data preliminary. Groups overlap:
  a firm can count in more than one race group and in the minority and sex rows at once. Estimates the source marks
  S are null. The Census Bureau publishes these files without a licence statement, so the licence is recorded as
  unstated and the entry held at license-review.'
