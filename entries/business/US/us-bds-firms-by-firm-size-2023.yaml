notes: US employer firms in 2023 by firm employment size (1 to 4, 5 to 9, 10 to 19, 20 to 99, 100 to 499, 500 to
  999, 1000 to 2499, 2500 to 4999, 5000 to 9999, 10000+), with the share of firms, establishments, employment, establishment
  entry and exit rates, job creation, destruction, net and reallocation rates and firm deaths. BDS counts firms
  and establishments in March of each year; entry, exit and job flow measures cover the twelve months before, and
  rates are percentages of the average of the current and prior year's figure (the 'denom' column). Cells the source
  marks X (not applicable), D (withheld to avoid disclosing data of individual companies), N or S are omitted or
  null. The Census Bureau publishes these files without a licence statement, so the licence is recorded as unstated
  and the entry held at license-review.
