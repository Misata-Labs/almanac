assumed:
- parameter: receipts_per_employee_usd
  value: 1000 * receipts_usd_thousands / employment
  method: derived
  rationale: Receipts per employee in whole dollars from the published receipts ($1,000) and mid-March employment
    of the same cell.
- parameter: annual_payroll_per_employee_usd
  value: 1000 * annual_payroll_usd_thousands / employment
  method: derived
  rationale: Annual payroll per employee in whole dollars from the published payroll ($1,000) and mid-March employment
    of the same cell.
- parameter: shares
  value: firms in the class / firms in all mutually exclusive classes
  method: derived
  rationale: Shares are computed from the published firm counts; subtotal classes such as <20 and <500 are kept
    in the measures but excluded from the shares.
- parameter: classes
  value: <100 to 75,000-99,999 from the 6-digit workbook; 100,000-249,999 to 2,500,000+ from the large-size workbook
  method: derived
  rationale: The 6-digit workbook stops at 100,000+ ($100 million and over); the large-size workbook splits that
    band, so the two are joined at $100 million to give mutually exclusive bands. The 100,000+ band is kept in the
    measures as a subtotal.
