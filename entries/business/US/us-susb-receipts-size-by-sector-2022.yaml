notes: 'For each NAICS sector (keyed by its code, with ''all'' for all sectors), the share of US employer firms
  in each enterprise receipts band, with the published firms, establishments, employment, annual payroll and receipts
  and derived receipts and payroll per employee for every band. Band labels are as published, in thousands of dollars:
  ''10,000-14,999'' is $10 million to just under $15 million of annual receipts, ''<100'' is under $100,000. The
  bands from $10 million to $100 million are the lower middle market most private equity sourcing targets. Firms
  without receipts in 2022 fall in the lowest band. SUSB applies noise to employment, payroll and receipts (flags
  G, H and J mark low, medium and high noise); firm and establishment counts are published without noise. Receipts
  come from the 2022 Economic Census. The Census Bureau publishes these files without a licence statement, so the
  licence is recorded as unstated and the entry held at license-review.'
