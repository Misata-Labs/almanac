notes: 'After-tax profit per dollar of sales (income after income taxes as a percent of net sales, receipts and
  operating revenues) for the five quarters from 2Q 2025 to 2Q 2026, with the latest quarter''s net sales and after-tax
  income in millions of dollars, from the income-statement tables of the Census Bureau Quarterly Financial Report
  workbook for the second quarter of 2026. Coverage: mining, wholesale trade, retail trade, information and professional
  and technical services corporations with total assets of $50 million and over. The workbook sits at a ''current''
  URL that the Census Bureau overwrites each quarter, so the content hash is expected to change at the next release;
  figures for earlier quarters are also revised. The publisher is a US federal body and the resource carries no
  licence statement, so the licence is recorded as unstated and the entry held at license-review.'
