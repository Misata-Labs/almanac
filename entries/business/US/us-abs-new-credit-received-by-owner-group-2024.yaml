assumed:
- parameter: shares
  value: published percent / 100
  method: derived
  rationale: The published percentages of employer firms restated as fractions; they add to one up to the source's
    rounding.
tests:
- statistic: share["Total","None of the credit requested was received"]
  expected: 0.074
  tolerance: 0.005
- statistic: sum_of_shares["Total"]
  expected: 1
  tolerance: 0.002
- statistic: share["Female","Some of the credit requested was received"]
  expected: 0.276
  tolerance: 0.005
notes: 'For each owner group, the shares of employer firms that received none, some or all of the new credit they
  requested in 2024, or did not know, with the published percentages and standard errors. Answer labels keep the
  source''s spelling. Percentages of employer firms classifiable by owner sex, ethnicity, race and veteran status,
  from the 2025 Annual Business Survey (reference year 2024); the source marks these data preliminary. Groups overlap:
  a firm can count in more than one race group and in the minority and sex rows at once. Estimates the source marks
  S are null. The Census Bureau publishes these files without a licence statement, so the licence is recorded as
  unstated and the entry held at license-review.'
