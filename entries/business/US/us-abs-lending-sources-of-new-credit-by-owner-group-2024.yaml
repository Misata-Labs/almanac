notes: 'For each owner group (Total, sex, race, ethnicity, minority and veteran status), the percentage of employer
  firms that used each lending source (bank, credit union, fintech or online lender, finance company, Community
  Development Financial Institution, other) for new credit in 2024, with standard errors. A firm can name several
  sources, so a row adds to more than 100. Keys are the source''s row labels with whitespace collapsed. Percentages
  of employer firms classifiable by owner sex, ethnicity, race and veteran status, from the 2025 Annual Business
  Survey (reference year 2024); the source marks these data preliminary. Groups overlap: a firm can count in more
  than one race group and in the minority and sex rows at once. Estimates the source marks S are null. The Census
  Bureau publishes these files without a licence statement, so the licence is recorded as unstated and the entry
  held at license-review.'
