notes: For each state and the District of Columbia (keyed by the name the source prints, with its FIPS code), the
  share of employer firms with establishments in the state by enterprise employment size (<5, 5-9, 10-19, 20-99,
  100-499, 500+), with firms, establishments, employment, annual payroll and receipts in the state and derived receipts
  and payroll per employee. Size is the firm's national employment, so a large multi-state firm counts in the 500+
  class of every state where it operates; state firm counts therefore add to more than the national count. SUSB
  applies noise to employment, payroll and receipts (flags G, H and J mark low, medium and high noise); firm and
  establishment counts are published without noise. Receipts come from the 2022 Economic Census. The Census Bureau
  publishes these files without a licence statement, so the licence is recorded as unstated and the entry held at
  license-review.
