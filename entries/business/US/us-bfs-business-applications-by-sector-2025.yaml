assumed:
- parameter: annual totals
  value: sum of the twelve unadjusted monthly figures
  method: derived
  rationale: The file publishes months only; annual totals add the unadjusted months.
- parameter: shares
  value: annual business applications / sum over all categories
  method: derived
  rationale: Shares of the derived annual totals of all business applications.
- parameter: high_propensity_share
  value: high_propensity_applications / business_applications
  method: derived
  rationale: Fraction of the year's applications that are high-propensity, four decimals.
- parameter: NAICSMNF, NAICSRET, NAICSTW
  value: stand for sectors 31-33, 44-45 and 48-49
  method: derived
  rationale: The file lists every other sector by its two-digit code and omits these three multi-code sectors, which
    these three codes fill.
