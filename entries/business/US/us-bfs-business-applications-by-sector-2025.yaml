notes: 'US business applications filed in 2025 by NAICS sector, keyed by the codes the file uses (NAICS11 to NAICS81,
  NAICSMNF, NAICSRET, NAICSTW and NONAICS for applications without a sector): the share of all applications, annual
  totals of all, high-propensity, planned-wage and corporate applications, the high-propensity share, and unadjusted
  monthly figures for the first three series. Business applications are applications for an Employer Identification
  Number on IRS Form SS-4; the Census Bureau classes as high-propensity those whose characteristics are associated
  with a high rate of becoming a business with payroll, and as applications with planned wages the high-propensity
  ones that state a first wages-paid date. The file at this URL is replaced with each monthly release and recent
  months are revised, so the content hash is expected to change at the next release. The Census Bureau publishes
  these files without a licence statement, so the licence is recorded as unstated and the entry held at license-review.'
