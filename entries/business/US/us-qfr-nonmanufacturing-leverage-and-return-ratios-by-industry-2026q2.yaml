assumed:
- parameter: total_liabilities_to_equity
  value: Total liabilities / Stockholders' equity (balance sheet, million dollars)
  method: derived
  rationale: Leverage ratio from the two balance-sheet totals of the same quarter and industry, two decimals.
- parameter: interest_coverage
  value: Income (loss) from operations / Interest expense (income statement, million dollars)
  method: derived
  rationale: Operating income over interest expense for the quarter, two decimals; an EBIT-style coverage, as the
    QFR does not publish EBITDA.
- parameter: rows
  value: one row per column heading
  method: derived
  rationale: Row keys are the Census column headings; each row's NAICS scope comes from its table title.
