notes: For each NAICS sector (keyed by its code, with 'all' for all sectors), the share of US employer firms in
  the six enterprise employment size classes <5, 5-9, 10-19, 20-99, 100-499 and 500+, which carry the 20, 100 and
  500 employee cut-offs used to define small and lower-middle-market companies. Each slice also gives, by class
  and for the subtotals <20 and <500 and the total, the published firms, establishments, employment, annual payroll
  and receipts (thousands of dollars), plus derived receipts and payroll per employee. A firm counts in every sector
  in which it has an establishment, so sector firm counts add to more than the all-sector count. SUSB applies noise
  to employment, payroll and receipts (flags G, H and J mark low, medium and high noise); firm and establishment
  counts are published without noise. Receipts come from the 2022 Economic Census. The Census Bureau publishes these
  files without a licence statement, so the licence is recorded as unstated and the entry held at license-review.
