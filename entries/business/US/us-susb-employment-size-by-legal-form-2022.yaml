notes: For each legal form of organization (Total, Corporation, S-Corporation, Partnership, Sole Propietorship as
  the source spells it, Nonprofit, Government, Other), the share of US employer firms in the enterprise employment
  size classes <5, 5-9, 10-19, 20-99, 100-499 and 500+, with the published firms, establishments, employment, annual
  payroll and receipts and derived receipts and payroll per employee by class and for the subtotals <20 and <500.
  Pairs with the legal-form-by-sector entry to draw an entity type and a size together. SUSB applies noise to employment,
  payroll and receipts (flags G, H and J mark low, medium and high noise); firm and establishment counts carry no
  noise flag. The tables credit the 2022 County Business Patterns and Economic Census as their source. The Census
  Bureau publishes these files without a licence statement, so the licence is recorded as unstated and the entry
  held at license-review.
