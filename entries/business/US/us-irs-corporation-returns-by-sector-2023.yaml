notes: Table 1 of the IRS Statistics of Income Corporation Complete Report for tax year 2023 (returns of active
  corporations), one row per industrial sector with the fifteen published columns renamed to snake_case and two
  derived margins. Money amounts are in thousands of dollars and all figures are sample-based estimates, as the
  table's own note says. Cells the IRS suppresses to avoid disclosure ('d') are null. The all-sector total row is
  kept under parameters.all_sectors. The publisher is a US federal body and the resource carries no licence statement,
  so the licence is recorded as unstated and the entry held at license-review.
