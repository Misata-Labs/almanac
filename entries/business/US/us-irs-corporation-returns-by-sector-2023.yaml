assumed:
- parameter: net_income_to_total_receipts_percent
  value: 100 * net income / total receipts
  method: derived
  rationale: Net income (less deficit) of all returns in the sector over total receipts of all returns, both from
    Table 1.
- parameter: cost_of_goods_sold_to_business_receipts_percent
  value: 100 * cost of goods sold / business receipts
  method: derived
  rationale: Cost of goods sold over business receipts, both from Table 1; business receipts exclude investment
    income so this is the gross-margin complement.
- parameter: rows
  value: bold rows of Table 1
  method: derived
  rationale: Sector rows are identified by the bold font the IRS uses for sector headings; the unbolded rows beneath
    each are minor industries and are left out.
