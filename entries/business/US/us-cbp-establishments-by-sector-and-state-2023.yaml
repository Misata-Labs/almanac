notes: For each state and the District of Columbia, the share of establishments in each NAICS sector (keyed by the
  SUSB-style sector code; the source writes 31----, 44---- and 48---- for 31-33, 44-45 and 48-49), with establishment
  counts, mid-March employment, annual payroll ($1,000) and derived payroll per employee. Sector titles are in the
  CBP size-by-sector entry. CBP counts establishments (single physical locations) with paid employees in the week
  of March 12; size classes are the establishment's own employment, not the firm's. Employment, payroll and first-quarter
  payroll carry noise flags (G low, H medium, J high, N not available); establishment counts carry none. Size classes
  whose count the source prints as N are null and left out of the shares, so the published classes can add to slightly
  less than the total. The Census Bureau publishes these files without a licence statement, so the licence is recorded
  as unstated and the entry held at license-review.
