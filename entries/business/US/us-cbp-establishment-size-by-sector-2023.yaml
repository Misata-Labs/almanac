assumed:
- parameter: shares
  value: establishments in the class / establishments in all classes
  method: derived
  rationale: Shares are computed from the published establishment counts n<5 to n1000; classes printed as N are
    left out.
- parameter: annual_payroll_per_employee_usd
  value: 1000 * ap / emp
  method: derived
  rationale: Annual payroll ($1,000) per employee in whole dollars, by class where the source publishes both.
- parameter: label
  value: sector titles from the SUSB 2022 legal-form workbook
  method: derived
  rationale: The file carries NAICS sector codes only; the titles come from the SUSB workbook, which prints code
    and title for the same sectors.
- parameter: sector keys
  value: 31----, 44---- and 48---- keyed as 31-33, 44-45 and 48-49
  method: derived
  rationale: CBP writes each multi-code sector under its first code; the keys follow SUSB and BDS so the entries
    join on one sector code.
