notes: 'Economy-wide annual Business Dynamics Statistics from 1978 to 2023: employer firms (the series value), establishments,
  employment, establishment entry and exit rates, job creation, destruction, net job creation and reallocation rates
  (percent) and the number of firm deaths. Use it to give a synthetic economy realistic start-up, closure and churn
  rates for any year. BDS counts firms and establishments in March of each year; entry, exit and job flow measures
  cover the twelve months before, and rates are percentages of the average of the current and prior year''s figure
  (the ''denom'' column). Cells the source marks X (not applicable), D (withheld to avoid disclosing data of individual
  companies), N or S are omitted or null. The Census Bureau publishes these files without a licence statement, so
  the licence is recorded as unstated and the entry held at license-review.'
