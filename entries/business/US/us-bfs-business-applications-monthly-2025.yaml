notes: Monthly US business applications in 2025, not seasonally adjusted (the series value), with high-propensity
  applications, applications with planned wages and applications from corporations, the seasonally adjusted versions
  of all four, and the projected number of business formations within four quarters. Business applications are applications
  for an Employer Identification Number on IRS Form SS-4; the Census Bureau classes as high-propensity those whose
  characteristics are associated with a high rate of becoming a business with payroll, and as applications with
  planned wages the high-propensity ones that state a first wages-paid date. The file at this URL is replaced with
  each monthly release and recent months are revised, so the content hash is expected to change at the next release.
  The Census Bureau publishes these files without a licence statement, so the licence is recorded as unstated and
  the entry held at license-review.
