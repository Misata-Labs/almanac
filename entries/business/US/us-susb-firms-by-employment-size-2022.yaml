assumed:
- parameter: receipts_per_employee_usd
  value: 1000 * receipts_usd_thousands / employment
  method: derived
  rationale: Receipts per employee in whole dollars from the published receipts ($1,000) and employment of the same
    cell.
- parameter: annual_payroll_per_employee_usd
  value: 1000 * annual_payroll_usd_thousands / employment
  method: derived
  rationale: Annual payroll per employee in whole dollars from the published payroll ($1,000) and employment of
    the same cell.
- parameter: shares
  value: firms in the class / firms in all mutually exclusive classes
  method: derived
  rationale: Shares are computed from the published firm counts; subtotal classes such as <20 and <500 are kept
    in the measures but excluded from the shares.
- parameter: classes
  value: <5 to 2,500-4,999 from the detailed file; 5,000-9,999, 10,000-19,999 and 20,000+ from the large-size workbook
  method: derived
  rationale: The detailed file stops at 5,000+; the large-size workbook splits that class, so the two are joined
    at 5,000 employees to give mutually exclusive classes.
tests:
- statistic: share["<5"]
  expected: 0.629967
  tolerance: 0.005
- statistic: share["5-9"]
  expected: 0.161694
  tolerance: 0.005
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
- statistic: share["20,000+"]
  expected: 8.5e-05
  tolerance: 0.001
notes: 'Employer firms (enterprises) in the United States in 2022 by enterprise employment size, the backbone of
  lower-middle-market sizing: the share of firms in each mutually exclusive size class, and for every class, and
  for the subtotals <20 and <500 and the total, the published firms, establishments, employment, annual payroll
  and receipts (both in thousands of dollars), with derived receipts and payroll per employee. Classes are by enterprise
  employment size, as the tables are titled. SUSB applies noise to employment, payroll and receipts (flags G, H
  and J mark low, medium and high noise); firm and establishment counts carry no noise flag. The tables credit the
  2022 County Business Patterns and Economic Census as their source. The Census Bureau publishes these files without
  a licence statement, so the licence is recorded as unstated and the entry held at license-review.'
