notes: For each NAICS sector, five years (2019 to 2023) of employer firms, employment, establishment entry and exit
  rates, job creation and destruction rates, reallocation rate and firm deaths, with the column name suffixed by
  the year. Lets a sourcing or credit model tell high-churn sectors (construction, accommodation and food) from
  stable ones. Entry, exit and job flow measures cover the twelve months before the reference date ('during the
  last 12 months' in the Census variable labels), and rates are percentages of the published denominator (the 'denom'
  column). Cells the source marks X (not applicable), D (withheld to avoid disclosing data of individual companies),
  N or S are omitted or null. The Census Bureau publishes these files without a licence statement, so the licence
