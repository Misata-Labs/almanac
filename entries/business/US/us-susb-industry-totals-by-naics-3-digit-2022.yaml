notes: Employer firms, establishments, mid-March employment, annual payroll and receipts (thousands of dollars)
  for every NAICS sector and three-digit subsector in the United States in 2022, with derived receipts per establishment,
  per firm and per employee, payroll per employee and employees per establishment. SUSB takes its 2022 receipts
  from the 2022 Economic Census, so this table stands in for the Economic Census core statistics, whose own files
  are published only as pipe-delimited .dat members that the verifier cannot search. It covers employer businesses
  only. SUSB applies noise to employment, payroll and receipts (flags G, H and J mark low, medium and high noise);
  firm and establishment counts are published without noise. Receipts come from the 2022 Economic Census. The Census
  Bureau publishes these files without a licence statement, so the licence is recorded as unstated and the entry
  held at license-review.
