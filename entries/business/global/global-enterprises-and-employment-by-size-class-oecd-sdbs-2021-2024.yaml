  rationale: For each economy the query window 2020-2024 is narrowed to the latest year in which the total enterprise
    count is published; the row's year column says which year that is.
- parameter: rows[*].enterprise_share_of_total
  value: enterprises / enterprises of the economy's _T row
  method: derived
  rationale: Share of the economy's enterprises in the size class; employment_share_of_total does the same for persons
    employed. Classes overlap (S10T49 contains S10T19 and S20T49; S_GE10 contains every class from 10 up), so shares
    of overlapping classes must not be added.
- parameter: rows[*].persons_employed_per_enterprise
  value: persons_employed / enterprises
  method: derived
  rationale: Average headcount of an enterprise in the size class.
