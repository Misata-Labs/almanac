notes: 'Firm-level survey indicators from the World Bank Enterprise Surveys as served by the World Bank API source
  2 (World Development Indicators; data last updated 2026-11-11), one row per economy keyed by ISO 3166-1 alpha-3
  code with the year of its latest survey for IC.FRM.BNKL.ZS, its World Bank income level and region. Columns are
  percentages of surveyed firms: with a bank loan or line of credit, using banks to finance investment, using banks
  to finance working capital, fully and partially credit constrained, exporting directly at least 10 percent of
  sales, with female participation in ownership, with a female top manager, and with at least 10 percent foreign
  ownership. Indicator codes: IC.FRM.BNKL.ZS, IC.FRM.BNKS.ZS, IC.FRM.BKWC.ZS, IC.FRM.CRDC.FL.ZS, IC.FRM.CRDC.PT.ZS,
  IC.FRM.EXS.ZS, IC.FRM.FEMO.ZS, IC.FRM.FEMM.ZS, IC.FRM.FO.ZS. 165 of 179 economies have a survey from 2019 or later;
  older rows describe their survey year, not today. The values describe the firms each survey covers, not all businesses
  in the economy. The World Bank licenses its datasets under CC BY 4.0.'
