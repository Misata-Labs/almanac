notes: 'Firm-level survey indicators from the World Bank Enterprise Surveys as served by the World Bank API source
  13 (Enterprise Surveys; data last updated 2022-03-25), one row per economy keyed by ISO 3166-1 alpha-3 code with
  the year of its latest survey for IC.FRM.FCHAR.CAR1, its World Bank income level and region. Columns: average
  age of the establishment in years, proportion of loans requiring collateral, value of collateral needed for a
  loan as a percentage of the loan amount, real annual sales growth, real annual labour productivity growth (both
  in percent), and the top manager''s years of experience in the firm''s sector. This World Bank API source was
  last updated in 2022, so its latest surveys are older than those of the finance, trade and ownership table, and
  the two tables'' survey years differ for many economies. Indicator codes: IC.FRM.FCHAR.CAR1, IC.FRM.FIN.FIN11,
  IC.FRM.FIN.FIN10, IC.FRM.SLS.GROW.PEFT1, IC.FRM.PROD.GROW.PEFT3, IC.FRM.WRKF.WK8. 43 of 146 economies have a survey
  from 2019 or later; older rows describe their survey year, not today. The values describe the firms each survey
  covers, not all businesses in the economy. The World Bank licenses its datasets under CC BY 4.0.'
