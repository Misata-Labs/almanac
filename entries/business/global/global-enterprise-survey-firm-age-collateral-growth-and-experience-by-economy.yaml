assumed:
- parameter: rows[*].survey_year
  value: latest year in 2006:2025 with a published IC.FRM.FCHAR.CAR1 value
  method: derived
  rationale: Each economy's row is anchored on its most recent survey year for the first indicator; every other
    column is taken from the same year and is null when that survey does not publish it, so all values in a row
    come from one survey.
- parameter: rows
  value: economies only
  method: derived
  rationale: Rows whose region is 'Aggregates' in the World Bank country API are dropped.
