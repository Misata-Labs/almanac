notes: The sections (by Roman numeral, with the first and last chapter of each) and chapters (two-digit code) of
  the UK Integrated Online Tariff, the goods classification the UK applies to imports and exports, from the Trade
  Tariff service API. The API serves the tariff in force on the day of the request, so valid_from is the day the
  entry was built. Chapter titles are the service's formatted descriptions, checked to carry no markup. The Trade
  Tariff is a GOV.UK service and its content is published under the Open Government Licence v3.0.
