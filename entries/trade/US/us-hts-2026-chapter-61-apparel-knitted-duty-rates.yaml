notes: 'The rate-bearing tariff lines of chapter 61 (articles of apparel and clothing accessories, knitted or crocheted)
  of the Harmonized Tariff Schedule of the United States, from the USITC JSON export of the current revision (2026HTSRev22),
  keyed by eight-digit subheading. Each row carries the line''s own description, its four-digit heading, the descriptions
  of its superior lines below the heading (the heading descriptions are in us-hts-2026-headings), the column 1 general
  rate (most-favoured-nation), the column 1 special rate with the programme indicators in brackets (free trade agreements
  and preference programmes, see General Notes 3 to 36), the column 2 rate (General Note 3(b) countries), the units
  of quantity of the line and its statistical suffixes, and footnotes. Rates are strings exactly as published: ad
  valorem (a percentage), specific (cents per unit) or compound. Additional duties under chapter 99 (for example
  trade-remedy or emergency measures) are not in these columns; footnotes that point to chapter 99 are kept. Of
  the 252 lines, 12 have a general rate of Free. The export always serves the current revision, so this entry must
