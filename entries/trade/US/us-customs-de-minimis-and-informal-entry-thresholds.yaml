spec:
  implementation: almanac.rules.lookup_table
  parameters:
    currency: USD
    cfr_date: '2026-10-29'
    rows:
      de_minimis_shipment:
        amount_usd: 800
        section: 10.151(a)
        suspended: true
        scope: shipment imported by one person on one day, fair retail value in the country of shipment
        suspension: '10.151(b): suspended for all modes other than the international postal network'
        authority: CBP Dec. 26-12, 91 FR 37800, June 24, 2026
      de_minimis_postal:
        amount_usd: 800
        section: 145.31(a)
        suspended: true
        scope: packages arriving through the international postal network
        suspension: '145.31(b): suspended for merchandise arriving through the international postal network'
      bona_fide_gift:
        amount_usd: 100
        section: '10.152'
        suspended: false
        scope: aggregate fair retail value received by one person on one day
      bona_fide_gift_from_insular_possessions:
        amount_usd: 200
        section: '10.152'
        suspended: false
        scope: gifts sent from a person in the Virgin Islands, Guam or American Samoa
      informal_entry_limit:
        amount_usd: 2500
        section: 143.21(a)
        suspended: false
        scope: shipments of merchandise eligible for informal entry
      informal_entry_chapter_99_article_limit:
        amount_usd: 250
        section: 143.21(a)
        suspended: false
        scope: articles above this value classified in Chapter 99, Subchapters III and IV, HTSUS, are excluded from
          informal entry
      informal_entry_us_goods_returned:
        amount_usd: 10000
        section: 143.21(k)
        suspended: false
        scope: products of the United States returned for repair or alteration, or rejected by the foreign purchaser
      returning_resident_exemption:
        amount_usd: 800
        section: '148.33'
        suspended: false
        scope: articles acquired abroad accompanying a returning resident
      returning_resident_exemption_insular_possessions:
        amount_usd: 1600
        section: '148.33'
        suspended: false
        scope: arrival from American Samoa, Guam, the Northern Mariana Islands or the US Virgin Islands
      nonresident_in_transit:
        amount_usd: 200
        section: '148.41'
        suspended: false
        scope: articles a nonresident in transit carries through US Customs territory
      administrative_exemption:
        amount_usd: 200
        section: '148.64'
        suspended: false
        scope: articles not otherwise entitled to an exemption, section 321(a)(2)(B) Tariff Act of 1930
  vectors:
  - input:
      key: informal_entry_limit
      column: amount_usd
    expected: 2500
    origin: source
  - input:
      key: de_minimis_shipment
      column: suspended
    expected: true
    origin: source
  - input:
      key: returning_resident_exemption
      column: amount_usd
    expected: 800
    origin: source
  - input:
      key: bona_fide_gift
      column: amount_usd
    expected: 100
    origin: source
  - input: formal_entry_limit
    expected: false
    origin: derived
