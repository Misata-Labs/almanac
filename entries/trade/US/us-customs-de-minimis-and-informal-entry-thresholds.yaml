notes: US customs dollar thresholds for low-value shipments and travellers, read from 19 CFR as of 2026-10-29. The
  de minimis administrative exemption of 19 U.S.C. 1321 (10.151 for commercial modes, 145.31 for mail) keeps its
  dollar amount in the text but is suspended by paragraph (b) of both sections, for every mode of arrival, by CBP
  Dec. 26-12, 91 FR 37800, June 24, 2026; the suspension holds until CBP announces otherwise in the Federal Register,
  so a generator should treat no low-value shipment as duty-free under de minimis. The bona fide gift exemption
  (10.152), the informal entry ceiling (143.21), the returning resident exemption for articles acquired abroad (148.33),
  the nonresident in-transit allowance (148.41) and the administrative exemption for travellers (148.64) are not
  suspended. valid_from is the latest eCFR version date of 10.151 and 145.31, the sections the suspension amended.
  US federal government works carry no copyright, but neither the eCFR API nor the regulation text states reuse
  terms, so the licence is recorded as unstated and the entry held at license-review.
