id: us-customs-de-minimis-and-informal-entry-thresholds
title: United States customs de minimis, gift, informal entry and traveller exemption thresholds, 19 CFR parts 10,
  143, 145 and 148
kind: rule
domain: trade
region: US
status: license-review
tier: A
valid_from: '2026-06-24'
valid_to: null
tags:
