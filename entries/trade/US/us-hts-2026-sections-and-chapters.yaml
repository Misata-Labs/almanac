notes: The 22 sections and 99 chapters of the Harmonized Tariff Schedule of the United States as listed in the table
  of contents of 2026HTSRev22, the revision current when the entry was built (release start date sets valid_from).
  Section titles are upper case as printed; chapter titles are as printed, with line wraps joined. Chapters 1 to
  97 follow the international Harmonized System; chapter 77 is reserved, and chapters 98 and 99 are US-only special
  classification provisions and temporary legislation, including the chapter 99 headings that carry additional duties.
  The table of contents is fetched for the pinned revision, so its bytes do not move when a later revision is published;
  the supporting release-details record does change at that point. The USITC publishes the HTS as a US government
  work but states no reuse licence in the files cited, so the licence is recorded as unstated and the entry held
  at license-review.
