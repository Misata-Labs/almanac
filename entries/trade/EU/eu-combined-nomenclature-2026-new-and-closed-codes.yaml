spec:
  implementation: almanac.rules.enumeration
  parameters:
    sets:
      opened_2026:
        '28419040': Lithium nickel manganese cobalt oxides
        '28419070': Salts of oxometallic or peroxometallic acids (excl. chromates, dichromates, peroxochromates,
          manganites, manganates, permanganates, molybdates, tungstates "wolframates", zincates, vanadates and lithium
          nickel manganese cobalt oxides)
        '28429020': Lithium iron phosphate
        '28429070': Salts of inorganic acids or peroxoacids, n.e.s.
        '29093037': Decabromodiphenyl ether
        '29093039': Brominated derivatives of aromatic ethers (excl. pentabromodiphenyl ether, decabromodiphenyl
          ether, 1,2,4,5-tetrabromo-3,6-bis"pentabromophenoxy"benzene and 1,2-bis"2,4,6-tribromophenoxy"ethane for
          the manufacture of acrylonitrile-butadiene-styrene [ABS])
        '29159015': Perfluorooctanoic acids and their salts
        '29159090': Saturated acyclic monocarboxylic acids, their anhydrides, halides, peroxides and peroxyacids;
          their halogenated, sulphonated, nitrated or nitrosated derivatives (excl. formic acid and acetic acid,
          mono-, di- or trichloroacetic acids, propionic acid, butanoic and pentanoic acids, palmitic, stearic and
          lauric acids and their salts and esters, acetic anhydride, and perfluorooctanoic acids and their salts)
        '38011010': Artificial graphite powders containing <=0,05 % of ash by weight
        '38011090': Artificial graphite (excl. retort graphite, retort carbon, goods of artificial graphite, incl.
          refractory materials based on artificial graphite, and powders containing <=0,05 % of ash by weight)
        '38180011': Doped silicon wafers of a thickness <=200μm, rectangular, whether or not with cut or rounded
          corners "photovoltaic wafers"
        '38180019': Silicon doped for use in electronics, in the form of discs, wafers, cylinders, rods or similar
          forms, whether or not polished or with a uniform epitaxial coating (excl. elements that have been further
          processed, e.g. by selective diffusion, and "photovoltaic" rectangular wafers of a thickness <=200μm)
        '73082010': Tubular wind turbine steel towers and tower-sections
        '73082090': Towers and lattice masts, of iron or steel (excl. tubular wind turbine steel towers and tower-sections)
        '84109010': Rotors of hydraulic turbines and water wheels
        '84109020': Stators of hydraulic turbines and water wheels
        '84109090': Parts of hydraulic turbines and water wheels incl. regulators (excl. rotors and stators)
        '84129060': Wind turbine blades
        '84129070': Parts of non-electrical engines and motors, n.e.s.
        '85013310': Hydrogen fuel cell DC generators of an output > 75 kW but <= 375 kW
        '85013390': DC motors and DC generators of an output > 75 kW but <= 375 kW (excl. photovoltaic and hydrogen
          fuel cell generators)
        '85044084': Inverters with maximum power point tracking functionality
        '85044087': Inverters without maximum power point tracking functionality
        '85079031': Separators for electric accumulators, of plastic film of a thickness <=40 μm
        '85079039': Separators for electric accumulators (excl. separators of vulcanised rubber other than hard
          rubber or of textiles, and separators of plastic film of a thickness <=40 μm)
        '85439010': Assemblies of stacked galvanic cells for water electrolysis machines for the production of hydrogen
          or oxygen
        '85439090': Parts of electrical machines and apparatus, having individual functions, n.e.s. in chapter 85
      closed_2025:
        '28419085': Salts of oxometallic or peroxometallic acids (excl. chromates, dichromates, peroxochromates,
          manganites, manganates, permanganates, molybdates, tungstates "wolframamtes", zincates and vanadates)
        '28429080': Salts of inorganic acids or peroxoacids (excl. of oxometallic or peroxometallic acids, double
          or complex silicates [incl. aluminosilicates whether or not chemically defined], salts, double salts or
          complex salts of selenium or tellurium acids, azides and inorganic or organic compounds of mercury)
        '29093038': Brominated derivatives of aromatic ethers (excl. pentabromodiphenyl ether, 1,2,4,5-tetrabromo-3,6-bis"pentabromophenoxy"benzene
          and 1,2-bis"2,4,6-tribromophenoxy"ethane for the manufacture of acrylonitrile-butadiene-styrene [ABS])
        '29159070': Saturated acyclic monocarboxylic acids, their anhydrides, halides, peroxides and peroxyacids;
          their halogenated, sulphonated, nitrated or nitrosated derivatives (excl. formic acid and acetic acid,
          mono-, di- or trichloroacetic acids, propionic acid, butanoic and pentanoic acids, palmitic, stearic and
          lauric acids and their salts and esters, and acetic anhydride)
        '38011000': Artificial graphite (excl. retort graphite, retort carbon and goods of artificial graphite,
          incl. refractory materials based on artificial graphite)
        '38180010': Silicon doped for use in electronics, in the form of discs, wafers, cylinders, rods or similar
          forms, whether or not polished or with a uniform epitaxial coating (excl. elements that have been further
          processed, e.g. by selective diffusion)
        '73082000': Towers and lattice masts, of iron or steel
        '84109000': Parts of hydraulic turbines and water wheels incl. regulators
        '84129080': Parts of non-electrical engines and motors, n.e.s.
        '85013300': DC motors and DC generators of an output > 75 kW but <= 375 kW
        '85044085': Inverters having power handling capacity <= 7,5 kVA
        '85044086': Inverters having power handling capacity > 7,5 kVA2025
        '85079030': Separators for electric accumulators (excl. separators of vulcanised rubber other than hard
          rubber or of textiles)
        '85439000': Parts of electrical machines and apparatus, having individual functions, n.e.s. in chapter 85
  vectors:
  - input:
