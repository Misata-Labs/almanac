notes: The sections and two-digit chapters of the EU Combined Nomenclature as Eurostat's Comext database carries
  them. Chapters are the numeric two-digit codes of CN.txt whose validity window covers all of 2026 (start on or
  before 1 January, end on or after 31 December); Comext's statistical aggregates (codes with XX, the total TO)
  are dropped from both the chapters and the sections. Chapter titles are upper case as Comext stores them; Comext's
  chapter 99 groups special statistical codes and is not part of the Harmonized System. Section titles come from
  CN_SECTIONS.txt, numbered 01 to 21, and follow the wording Comext stores, which may lag the latest Harmonized
  System edition. Eurostat publishes under CC BY 4.0.
