notes: 'The Belgian national register number as the National Register describes it: YYMMDD, a three-digit order
  number (odd for men, even for women) and a control number equal to 97 minus the remainder of the nine digits divided
  by 97; for people born from 2000 the digit 2 is put in front before dividing. Because the control number depends
  on the birth period, the rule reports which period reproduces it. TI000 also prints the example 40 00 00 955-81,
  which the stated arithmetic does not reproduce, so it is not used as a vector. valid_from is the TI000 version
  date; neither PDF states a licence, so the entry is held at license-review.'
