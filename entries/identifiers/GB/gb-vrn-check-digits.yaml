notes: |
  A nine-digit VRN ends with two check digits. The weighted sum of the first seven digits
  (weights 8 7 6 5 4 3 2) is reduced by repeatedly subtracting 97 while it exceeds 97, and the
  check digits are 97 minus the result. The MOD 9755 variant adds 55 to the sum first; a VRN is
  accepted if either variant reproduces its check digits. The reduction stops at exactly 97,
  so a sum of 97 yields check digits 00 and a sum of 0 yields 97, which is why 000000097 is
  valid. Vrn.scala additionally accepts a legacy five-digit form in stored data; that is a
  storage compatibility case, not an issued-number format, and is excluded from this rule.
  valid_from is the date of the pinned revision; valid_to is open.
