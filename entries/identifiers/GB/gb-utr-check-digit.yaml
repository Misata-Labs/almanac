notes: |
  The check character is the first of the ten digits. It is the remainder-lookup entry for the
  weighted sum of the following nine digits modulo 11, using weights 6 7 8 9 10 5 4 3 2 and the
  lookup string 21987654321. Self Assessment references may carry a K before or after the
  digits (case-insensitive); Corporation Tax references may not. Source: the reference checker
  HM Revenue & Customs publishes in hmrc/domain (release v13.0.0, commit bc4a37fe), whose test
  suite supplies the vectors. valid_from is the date of the pinned revision; valid_to is open.
