id: pl-pesel-check-digit
title: 'Poland PESEL number: century-coded birth month, sex digit and check digit'
kind: rule
domain: identifiers
region: PL
status: license-review
tier: B
valid_from: '2026-10-31'
valid_to: null
tags:
- identifiers
- check-digit
- kyc
- pesel
use_cases:
- kyc-onboarding
- person-generation
- payroll-demo
- data-quality-validation
spec:
  implementation: almanac.rules.pl_pesel
  parameters:
    check_digit:
      weights:
      - 1
      - 3
      - 7
      - 9
      - 1
      - 3
      - 7
      - 9
      - 1
      - 3
      modulus: 10
      check: complement
      remainder_map:
        '0': 0
    month_offsets: &id001
      '80': 1800
      '0': 1900
      '20': 2000
      '40': 2100
      '60': 2200
  vectors:
  - input:
      body: 0207080362
    expected: '8'
    origin: source
    note: 'gov.pl worked example: weighted last digits sum to 32, 10 - 2 = 8'
  - input: 02070803628
    expected: true
    origin: source
    note: the full number the worked example produces
  - input:
      birth_date_of: 02070803628
    expected: '1902-07-08'
    origin: source
    note: 'OECD sheet: a person born on the 8 of July 1902'
  - input:
      sex_of: 02070803628
    expected: female
    origin: source
    note: 'OECD sheet: sex female'
  - input: 02070803627
    expected: false
    origin: derived
    note: check digit altered
  - input:
      birth_date_of: 02270803620
    expected: '2002-07-08'
    origin: derived
    note: month field 27 decodes to July 2000-2099 per the month table
