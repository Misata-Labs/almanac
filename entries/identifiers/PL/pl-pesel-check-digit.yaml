assumed:
- parameter: check_digit
  value: weighted sum modulo 10, complement, 10 written 0
  method: derived
  rationale: gov.pl sums only the last digit of each product and subtracts the last digit of the total from 10;
    that equals 10 minus the full weighted sum modulo 10, and a result of 10 must be written as the single digit
    0.
- parameter: month_offsets
  value: *id001
  method: derived
  rationale: Each offset is the January code of a century column in the gov.pl table minus 1.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: vector_count
  expected: 6
  tolerance: 0
notes: 'PESEL as the Polish government describes it: eleven digits RRMMDDPPPPK with the birth month raised by a
  century offset (read from the gov.pl month table: 80 for the 1800s, 20 for 2000 to 2099, 40, 60 for the two centuries
  after), a serial whose last digit is even for women and odd for men, and a check digit equal to 10 minus the last
  digit of the sum of the weighted digits'' last digits, which is the same as the weighted sum modulo 10 subtracted
  from 10. The gov.pl worked example and the OECD sheet''s decoded sample supply the vectors. Neither page carries
  a date or licence, so valid_from is the access date and the entry is held at license-review.'
