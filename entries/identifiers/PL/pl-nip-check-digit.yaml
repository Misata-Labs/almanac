id: pl-nip-check-digit
title: Poland tax identification number (NIP) modulus 11 check digit
kind: rule
domain: identifiers
region: PL
status: license-review
tier: B
valid_from: '2026-10-31'
valid_to: null
tags:
- identifiers
- check-digit
- kyc
- nip
- tax-identifier
use_cases:
- kyb-onboarding
- company-generation
- invoicing
- data-quality-validation
spec:
  implementation: almanac.rules.weighted_modulus
  parameters:
    weights:
    - 6
    - 5
    - 7
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    modulus: 11
    check: remainder
    remainder_map:
      '10': null
  vectors:
  - input: '2234567895'
    expected: true
    origin: source
    note: 'OECD sheet sample: weighted sum 236, 236 % 11 = 5'
  - input:
      body: '223456789'
    expected: '5'
    origin: source
  - input: '2234567896'
    expected: false
    origin: derived
    note: check digit altered
  - input:
      body: '900000000'
    expected: null
    origin: derived
    note: weighted sum 54 leaves remainder 10, so no valid number exists
