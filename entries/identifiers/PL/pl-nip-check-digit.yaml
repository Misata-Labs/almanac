notes: 'The ten-digit Polish tax identification number (NIP) as Poland describes it in its OECD tax identification
  number sheet: nine digits weighted 6 5 7 2 3 4 5 6 7, summed and reduced modulo 11; the remainder is the check
  digit and a remainder of 10 means the number is not valid. Weights are read from the sheet and its sample 2234567895
  supplies the source vectors. The sheet carries no date or licence statement, so valid_from is the access date
  and the entry is held at license-review.'
