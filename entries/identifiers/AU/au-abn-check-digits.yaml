  value: 1
  method: derived
  rationale: The page says to subtract 1 from the first digit; stored as an offset so the generator can apply it.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: vector_count
  expected: 5
  tolerance: 0
notes: 'The Australian Business Register''s own description of the ABN: eleven digits, two leading check digits
  over a nine-digit identifier. Verification subtracts 1 from the first digit, weights the eleven digits by the
  position weights in the register''s example table and requires the sum to be divisible by 89. The weights are
  read from that table and the worked example 51 824 753 556 supplies the source vectors. Issuing check digits for
  a new identifier means searching the pairs from 10 upwards for the one that satisfies the rule, which the derived
  vector exercises. The page states no date or licence, so valid_from is the access date and the entry is held at
  license-review.'
