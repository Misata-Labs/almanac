assumed:
- parameter: repeat_rule
  value: three equal digits may not stand in three consecutive positions
  method: derived
  rationale: The document says three equal digits may never stand in directly consecutive positions, yet its own
    example 65929970489 has two of its three 9s side by side; the rule is read as forbidding a run of three, which
    every published example satisfies.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: vector_count
  expected: 15
  tolerance: 0
notes: 'The German tax identification number as the ELSTER interface documentation specifies it: eleven digits,
  no leading zero outside test numbers, exactly one digit in the first ten occurring twice or three times, and an
  eleventh check digit from the ISO 7064 MOD 11,10 fold printed in the document (moduli read from its code). All
  six examples of Tabelle 2-1 are vectors; the first is a test number with a leading zero. The document is dated
  2 September 2026, which is valid_from, and states that all rights are reserved, so the entry is held at license-review;
  only facts and the publisher''s examples are restated.'
