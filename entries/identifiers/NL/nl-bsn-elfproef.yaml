spec:
  implementation: almanac.rules.weighted_modulus
  parameters:
    weights:
    - 9
    - 8
    - 7
    - 6
    - 5
    - 4
    - 3
    - 2
    modulus: 11
    check: remainder
    remainder_map:
      '10': null
  vectors:
  - input: '123456789'
    expected: false
    origin: source
    note: 'RvIG test A.1: Nummer is geen BSN'
  - input: '999990068'
    expected: true
    origin: source
    note: 'RvIG test A.2: Nummer is een BSN'
  - input: '999990019'
    expected: true
    origin: source
    note: BSN of an RvIG test person
  - input: '999990160'
    expected: true
    origin: source
    note: BSN of an RvIG test person
  - input: '999994396'
    expected: true
    origin: source
    note: BSN of an RvIG test person
  - input: '999994931'
    expected: true
    origin: source
    note: BSN of an RvIG test person
  - input:
      body: '99999006'
    expected: '8'
    origin: derived
  - input: '999990069'
    expected: false
    origin: derived
    note: check digit altered
  - input:
      body: '60000000'
    expected: null
    origin: derived
    note: weighted sum 54 leaves remainder 10, so no BSN exists
