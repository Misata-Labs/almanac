notes: 'The nine-digit Dutch BSN: the first eight digits weighted 9 down to 2 and summed, the remainder modulo 11
  is the ninth digit, and a remainder of 10 means no BSN can be formed (the Dutch OECD sheet). RvIG, which issues
  the numbers, generates eight random digits and appends the ninth so that the eleven test holds, retrying in the
  1 in 11 cases where that is impossible. The source vectors are RvIG''s connection-test cases and the BSNs of its
  test persons. valid_from is the test document''s date; no source states a licence, so the entry is held at license-review.'
