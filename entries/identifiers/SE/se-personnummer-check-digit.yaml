assumed:
- parameter: valid_from
  value: '1967-01-01'
  method: derived
  rationale: SCB gives only the year 1967 for the introduction of the check digit; the first day of that year is
    used.
- parameter: luhn
  value: standard Luhn over the nine digits
  method: derived
  rationale: Alternate weights 2 and 1 starting from the first of nine digits, with product digits summed and the
    result subtracted from 10, is exactly the Luhn computation the shared luhn rule implements.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: vector_count
  expected: 6
  tolerance: 0
notes: 'The Swedish personal identity number as Statistics Sweden documents it: YYMMDD, a three-digit birth number
  and a check digit introduced in 1967. The nine digits are multiplied alternately by 2 and 1, the digits of the
  products are added, and the check digit is 10 minus the last digit of that sum (0 when the result is 10), which
  is the Luhn formula. Registers store the twelve-digit form with the century. SCB notes that its example is fictitious.
  valid_from is the start of the year the check digit was introduced; the PDF states no licence, so the entry is
  held at license-review.'
