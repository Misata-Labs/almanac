id: br-cnpj-check-digits
title: Brazil CNPJ check digits (modulus 11) for numeric and alphanumeric registrations
kind: rule
domain: identifiers
region: BR
status: license-review
tier: B
valid_from: 2026-07-01
valid_to: null
spec:
  implementation: almanac.rules.br_cnpj
  parameters:
    base_pattern: '^[0-9A-Z]{12}$'
    character_value: ASCII code minus 48
    modulus: 11
    zero_below_remainder: 2
    weights_first: [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
    weights_second: [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
  vectors:
    - {input: {base: "12.ABC.345/01DE"}, expected: "35", origin: source, note: worked example in the Receita Federal Q&A}
    - {input: "12.ABC.345/01DE-35", expected: true, origin: source}
    - {input: "12ABC34501DE35", expected: true, origin: source, note: same example without punctuation}
    - {input: "12.ABC.345/01DE-53", expected: false, origin: derived, note: check digits swapped}
    - {input: "12.ABC.345/01DE-3", expected: false, origin: derived, note: one check digit missing}
    - {input: "12.abc.345/01de-35", expected: true, origin: derived, note: lower-case input is upper-cased}
