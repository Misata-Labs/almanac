assumed:
  - parameter: zero_below_remainder
    value: 2
    method: derived
    rationale: The Receita Federal worked example only shows remainders 8 and 6. The treatment of remainders 0 and 1 (check digit 0) is taken from SERPRO's calculation note, the federal data-processing company that builds the CNPJ systems, and is recorded as supporting evidence rather than from the regulator's own document.
  - parameter: character_value
    value: ASCII code minus 48
    method: derived
    rationale: The Q&A states that every character is transformed by its ASCII code and shows A as 65 minus 48 equal to 17; the rule applies the same subtraction to all characters, which leaves digits at their face value.
tests:
  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: vector_count, expected: 6, tolerance: 0}
notes: |
  Check digits for the CNPJ as described by Receita Federal for the alphanumeric format
  introduced by Instrução Normativa RFB 2.229/2024, with implementation scheduled for July
  2026 according to the same Q&A; valid_from is the start of that month. Numeric registrations
  issued earlier keep their check digits, and the same arithmetic reproduces them. Each of the twelve base
  characters is valued at its ASCII code minus 48, weights 5 4 3 2 9 8 7 6 5 4 3 2 give the
  first check digit and weights 6 5 4 3 2 9 8 7 6 5 4 3 2 over the thirteen characters give
  the second, each as 11 minus the remainder modulo 11, or 0 when the remainder is 0 or 1.
  The Q&A states that existing numeric registrations and their check digits remain valid,
  which the same arithmetic reproduces because digits keep their face value. The gov.br
  pages are published under Creative Commons Attribution-NoDerivatives 3.0 and the SERPRO
  note carries no licence statement, so the entry is held at license-review; only facts and
  the publisher's own worked example are restated.
