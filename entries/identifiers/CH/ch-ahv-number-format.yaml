id: ch-ahv-number-format
title: 'Switzerland AHV number (Versichertennummer): 13 digits with country code 756 and control digit'
kind: rule
domain: identifiers
region: CH
status: license-review
tier: A
valid_from: '2007-12-01'
valid_to: null
tags:
- identifiers
- check-digit
- kyc
- ahv
- avs
- social-security-number
use_cases:
- kyc-onboarding
- person-generation
- payroll-demo
- data-quality-validation
spec:
  implementation: almanac.rules.ch_ahv_number
  parameters:
    country_code: '756'
  vectors:
  - input: 756.1234.5678.97
    expected: true
    origin: source
    note: the model number in the OECD sheet
  - input:
      parts_of: 756.1234.5678.97
    expected:
      country_code: '756'
      number: '123456789'
      control_digit: '7'
    origin: derived
  - input: '7561234567897'
    expected: true
    origin: derived
    note: without dots
  - input: 757.1234.5678.97
    expected: false
    origin: derived
    note: another country code
  - input: 756.1234.5678.9
    expected: false
    origin: derived
    note: twelve digits
