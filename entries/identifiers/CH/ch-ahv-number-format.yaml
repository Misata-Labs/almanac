notes: 'The Swiss social security number as Art. 133 AHVV defines it: thirteen digits made of the country code 756,
  a nine-digit number that reveals nothing about the person, and a control digit; the dotted grouping is the one
  Switzerland''s OECD sheet shows. The ordinance does not state the control digit''s arithmetic, so the rule checks
  composition only. valid_from is the date the article''s current wording entered into force; the law publisher
  states no licence for the XML, so the entry is held at license-review.'
