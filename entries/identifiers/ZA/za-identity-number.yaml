notes: 'The thirteen-digit South African identity number as South Africa describes it in its OECD tax identification
  number sheet: YYMMDD, four sequence digits whose range encodes sex, a citizenship digit, one further digit the
  sheet labels A without explaining, and a Luhn check digit. The sheet prints no complete number, so beyond the
  date-encoding example every vector is derived by applying the stated rules to a constructed number. It carries
  no date or licence statement, so valid_from is the access date and the entry is held at license-review.'
