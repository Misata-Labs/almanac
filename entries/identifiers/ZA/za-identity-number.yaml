id: za-identity-number
title: 'South Africa identity number: birth date, sex range, citizenship digit and Luhn check digit'
kind: rule
domain: identifiers
region: ZA
status: license-review
tier: B
valid_from: '2026-10-31'
valid_to: null
tags:
- identifiers
- check-digit
- kyc
- luhn
- national-id
use_cases:
- kyc-onboarding
- person-generation
- payroll-demo
- data-quality-validation
spec:
  implementation: almanac.rules.za_id
  parameters:
    sex_ranges:
      female:
      - 0
      - 4999
      male:
      - 5000
      - 9999
    citizenship_codes:
      '0': South African Citizen
      '1': permanent resident
      '2': refugee
    luhn: {}
  vectors:
  - input:
      encode_birth_date: '1994-05-10'
    expected: '940510'
    origin: source
    note: 'OECD sheet: 10 May 1994 is displayed as 940510'
  - input:
      sex_of: '9405105001087'
    expected: male
    origin: derived
    note: sequence 5001 is in the male range
  - input:
      sex_of: '9405104999083'
    expected: female
    origin: derived
    note: sequence 4999 is in the female range
  - input:
      citizenship_of: '9405105001087'
    expected: South African Citizen
    origin: derived
  - input:
      body: '940510500108'
    expected: '7'
    origin: derived
    note: Luhn over the first twelve digits
  - input: '9405105001087'
    expected: true
    origin: derived
  - input: '9405105001088'
    expected: false
    origin: derived
    note: check digit altered
  - input: '9405105001381'
    expected: false
    origin: derived
    note: citizenship digit 3 is not defined
