id: no-organisasjonsnummer-check-digit
title: Norway organisation number (organisasjonsnummer) modulus 11 check digit
kind: rule
domain: identifiers
region: 'NO'
status: license-review
tier: B
valid_from: '2023-12-13'
valid_to: null
tags:
- identifiers
- check-digit
- kyc
- organisasjonsnummer
- brreg
use_cases:
- kyb-onboarding
- company-generation
- invoicing
- data-quality-validation
spec:
  implementation: almanac.rules.weighted_modulus
  parameters:
    weights:
    - 3
    - 2
    - 7
    - 6
    - 5
    - 4
    - 3
    - 2
    modulus: 11
    check: complement
    remainder_map:
      '0': 0
      '1': null
  vectors:
  - input: '974760673'
    expected: true
    origin: source
    note: the Brønnøysund Register Centre's own organisation number as printed on the page
  - input:
      body: '97476067'
    expected: '3'
    origin: derived
  - input:
      body: '10000004'
    expected: '0'
    origin: derived
    note: weighted sum 11 divides evenly, so the check digit is 0
  - input:
      body: '10000013'
    expected: null
    origin: derived
    note: remainder 1 would need check digit 10, so the number is invalid
  - input: '974760674'
    expected: false
    origin: derived
    note: check digit altered
