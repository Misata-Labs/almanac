notes: 'The nine-digit Norwegian organisation number as the Brønnøysund Register Centre describes it: eight digits
  weighted 3 2 7 6 5 4 3 2 from the first digit, the sum divided by 11 and the remainder subtracted from 11; a remainder
  of 0 gives check digit 0 and a remainder of 1 means the number is invalid. The page''s worked example shows only
  its totals and also says the weights run from right to left, which contradicts the preceding sentence; reading
  them from the first digit reproduces the register''s own number printed on the page, which is the source vector,
  and matches Norway''s OECD sheet. valid_from is the page''s last-updated date; no licence is stated, so the entry
  is held at license-review.'
