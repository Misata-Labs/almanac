id: us-ssn-format
title: 'United States Social Security number: 000-00-0000 form and never-assigned values'
kind: rule
domain: identifiers
region: US
status: license-review
tier: B
valid_from: '2011-06-23'
valid_to: null
tags:
- identifiers
- check-digit
- kyc
- ssn
- ssa
use_cases:
- kyc-onboarding
- person-generation
- payroll-demo
- data-quality-validation
spec:
  implementation: almanac.rules.us_tin_format
  parameters:
    area_forbidden:
    - '000'
    - '666'
    area_forbidden_ranges:
    - - '900'
      - '999'
    group_forbidden:
    - '00'
    serial_forbidden:
    - '0000'
  vectors:
  - input:
      area: '000'
    expected: false
    origin: source
    note: 'POMS RM 10201.035: area 000'
  - input:
      area: '666'
    expected: false
    origin: source
    note: 'POMS RM 10201.035: area 666'
  - input:
      area: '900'
    expected: false
    origin: source
    note: 'POMS RM 10201.035: the 900 series'
  - input: 234-00-5678
    expected: false
    origin: source
    note: group 00 is never assigned
  - input: 234-56-0000
    expected: false
    origin: source
    note: serial 0000 is never assigned
  - input:
      area: '987'
    expected: false
    origin: derived
    note: inside the 900 series
  - input: 234-56-7890
    expected: true
    origin: derived
    note: no never-assigned group
  - input: '234567890'
    expected: true
    origin: derived
    note: the same number without hyphens
  - input: 234-56-789
    expected: false
    origin: derived
    note: eight digits
