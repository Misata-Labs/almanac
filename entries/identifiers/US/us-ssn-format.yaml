assumed:
- parameter: area_forbidden_ranges
  value:
  - - '900'
    - '999'
  method: derived
  rationale: The manual names the 900 series; it is stored as the inclusive range of three-digit areas beginning
    with 9.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: vector_count
  expected: 9
  tolerance: 0
notes: 'The nine-digit Social Security number in the form the Treasury regulation gives (000-00-0000) with the values
  the Social Security Administration''s operations manual names as never assigned: area 000, 666 or anything in
  the 900 series, group 00 and serial 0000. A number that passes may still never have been issued; only a Numident
  query confirms assignment. Since randomisation the area and group carry no geographic or sequential meaning, so
  generators should draw them uniformly from the permitted values. valid_from is the manual section''s effective
  date; US government works carry no copyright, but neither source states terms, so the entry is held at license-review.'
