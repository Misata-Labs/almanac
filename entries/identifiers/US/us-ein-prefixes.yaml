notes: The nine-digit EIN in the form 00-0000000 (26 CFR 301.6109-1), whose first two digits must be one of the
  prefixes the IRS lists for its campuses, its online application and the Small Business Administration; the table
  is read from the IRS page. Several prefixes appear under both a campus and Internet. A generator can draw the
  prefix from this table and the remaining seven digits freely. valid_from is the page's last-reviewed date; neither
  source states terms, so the entry is held at license-review.
