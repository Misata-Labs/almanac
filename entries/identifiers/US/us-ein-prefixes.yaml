      locations_for: '10'
    expected:
    - Andover
    origin: source
  - input: 31-1234567
    expected: true
    origin: derived
  - input: '311234567'
    expected: true
    origin: derived
    note: without the hyphen
  - input: 07-1234567
    expected: false
    origin: derived
    note: 07 is not a listed prefix
