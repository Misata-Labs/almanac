  expected: 7
  tolerance: 0
notes: 'The Danish personal identification number as the CPR office describes it: DDMMYY, then a four-digit serial
  whose last digit is even for women and odd for men; the serial''s first digit together with the two-digit year
  fixes the century (the table rows are read from the PDF). Numbers were first assigned so that the ten digits weighted
  4 3 2 7 6 5 4 3 2 1 sum to a multiple of 11, and a remainder of 1 leaves no usable control digit. Once those ran
  out for a birth date, the office assigns numbers without the control digit, so the default evaluation checks only
  that the date and century resolve; the modulus check is exposed separately for generators that want the older
  construction. valid_from is the document date; the PDF states no licence, so the entry is held at license-review.'
