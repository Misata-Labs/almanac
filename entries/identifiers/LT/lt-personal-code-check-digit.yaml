spec:
  implementation: almanac.rules.weighted_modulus
  parameters:
    weights:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 1
    fallback_weights:
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 1
    - 2
    - 3
    retry_remainder: 10
    modulus: 11
    check: remainder
    remainder_map:
      '10': 0
  vectors:
  - input:
      body: '3330924006'
    expected: '4'
    origin: source
    note: 'OECD sheet sample: first pass 109 mod 11 = 10, second pass 169 mod 11 = 4'
  - input: '33309240064'
    expected: true
    origin: source
  - input: '10101010005'
    expected: true
    origin: source
    note: structure sample in the OECD sheet
  - input: '33309240065'
    expected: false
    origin: derived
    note: check digit altered
