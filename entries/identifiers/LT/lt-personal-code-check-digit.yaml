notes: 'The eleven-digit Lithuanian personal code, which Lithuania uses as its tax identification number: ten digits
  weighted 1 to 9 then 1 and reduced modulo 11; if the remainder is 10 the digits are reweighted 3 to 9 then 1 to
  3, and a second remainder of 10 gives check digit 0. The weight tables and the worked sample come from Lithuania''s
  OECD tax identification number sheet. It carries no date or licence statement, so valid_from is the access date
  and the entry is held at license-review.'
