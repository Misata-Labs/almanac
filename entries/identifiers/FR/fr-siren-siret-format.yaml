assumed: []
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: vector_count
  expected: 5
  tolerance: 0
notes: 'INSEE''s definitions: the SIREN is nine digits identifying a legal unit, the first eight without meaning
  and the ninth a check digit; the SIRET is fourteen digits, the SIREN followed by the NIC, a four-digit order number
  and a check digit over the whole SIRET. INSEE''s definition pages do not state the check-digit arithmetic, so
  the rule checks lengths and composition only. valid_from is the later of the two pages'' update dates; neither
  states a licence, so the entry is held at license-review.'
