id: fr-siren-siret-format
title: 'France SIREN and SIRET identifiers: nine-digit legal unit and fourteen-digit establishment numbers'
kind: rule
domain: identifiers
region: FR
status: license-review
tier: B
valid_from: '2025-10-21'
valid_to: null
tags:
- identifiers
- check-digit
- kyc
- siren
- siret
- insee
use_cases:
- kyb-onboarding
- company-generation
- invoicing
- data-quality-validation
spec:
  implementation: almanac.rules.fr_siret
  parameters:
    siren_length: 9
    nic_length: 5
  vectors:
  - input:
      kind: siren
      value: 999 999 999
    expected: true
    origin: source
    note: format printed in the OECD sheet
  - input:
      kind: siret
      value: 999 999 999 99999
    expected: true
    origin: source
    note: format printed in the OECD sheet
  - input:
      siren_of: 999 999 999 99999
    expected: '999999999'
    origin: derived
    note: the SIRET begins with the SIREN
  - input:
      kind: siren
      value: '12345678'
    expected: false
    origin: derived
    note: eight digits
  - input:
      kind: siret
      value: '123456789'
    expected: false
    origin: derived
    note: a SIREN is not a SIRET
