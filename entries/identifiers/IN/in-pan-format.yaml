id: in-pan-format
title: India Permanent Account Number (PAN) format and holder-type codes
kind: rule
domain: identifiers
region: IN
status: license-review
tier: B
valid_from: '2026-10-31'
valid_to: null
tags:
- identifiers
- check-digit
- kyc
- pan
- tax-identifier
use_cases:
- kyc-onboarding
- person-generation
- payroll-demo
- data-quality-validation
- kyb-onboarding
spec:
  implementation: almanac.rules.in_pan
  parameters:
    holder_types:
      P: Individual
      F: Firm
      C: Company
      H: HUF
      A: AOP
      T: TRUST
      B: Body of Individuals
      L: Local Authority
      J: Artificial Juridical Person
      G: Government
    sequence_range:
    - 1
    - 9999
  vectors:
  - input: AFZPK7190K
    expected: true
    origin: source
    note: the typical PAN in the OECD sheet
  - input:
      holder_type_of: AFZPK7190K
    expected: Individual
    origin: source
    note: P stands for Individual
  - input:
      holder_type_of: AFZCK7190K
    expected: Company
    origin: derived
  - input: AFZXK7190K
    expected: false
    origin: derived
    note: X is not a holder-type code
  - input: AFZPK0000K
    expected: false
    origin: derived
    note: sequence runs from 0001
  - input: AFZPK7190
    expected: false
    origin: derived
    note: nine characters
