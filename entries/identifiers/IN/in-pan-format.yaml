notes: 'The ten-character PAN as India describes it in its OECD tax identification number sheet: a three-letter
  series, a holder-type letter (codes read from the sheet), the first letter of the holder''s surname or name, a
  sequence from 0001 to 9999 and an alphabetic check character whose arithmetic the sheet does not give. The rule
  checks shape and holder type only. The sheet carries no date or licence statement, so valid_from is the access
  date and the entry is held at license-review.'
