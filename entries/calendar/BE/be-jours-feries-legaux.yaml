assumed:
- parameter: easter_offset
  value: Easter Sunday from the Gregorian computus; Easter Monday +1, Ascension +39, Whit Monday +50
  method: derived
  rationale: The source names the movable feasts without dates. The rule computes Easter Sunday with the standard
    Gregorian algorithm, and the offsets reproduce every Lundi de Pâques, Ascension and Lundi de Pentecôte date
    in the etalab jours fériés list for 2006 to 2031 (checked by the builder and by tests/test_calendars.py).
- parameter: valid_from
  value: '2026-10-31'
  method: assumed
  rationale: The ministry page states the list without an effective date; valid_from records the day the page was
    fetched. The underlying Royal Decree of 18 April 1974 is not cited here.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count[2026]
  expected: 10
  tolerance: 0
- statistic: count[2027]
  expected: 10
  tolerance: 0
notes: 'The ten legal public holidays as the Federal Public Service Employment lists them in French and Dutch: 1
  January, Easter Monday, 1 May, Ascension, Whit Monday, 21 July, 15 August, 1 November, 11 November and 25 December.
  Replacement days for holidays falling on a Sunday or a non-working day, which the same pages describe, are decided
  per sector or employer and are not modelled. The builder re-reads the lists on each run and stops if any of the
  ten entries is missing.'
