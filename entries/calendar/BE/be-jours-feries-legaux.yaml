id: be-jours-feries-legaux
title: 'Belgium: the ten legal public holidays (jours fériés légaux / wettelijke feestdagen)'
kind: rule
domain: calendar
region: BE
status: license-review
tier: B
valid_from: '2026-10-31'
valid_to: null
tags:
- calendar
- holidays
- business-days
- jours-feries
- feestdagen
use_cases:
- payroll-demo
- settlement-calendar
- scheduling-demo
- logistics-demo
spec:
  implementation: almanac.rules.holiday_list
  parameters:
    holidays:
    - name: 1er janvier
      month: 1
      day: 1
    - name: Lundi de Pâques
      easter_offset: 1
    - name: 1er mai (Fête du travail)
      month: 5
      day: 1
    - name: Ascension
      easter_offset: 39
    - name: Lundi de Pentecôte
      easter_offset: 50
    - name: 21 juillet (Fête nationale)
      month: 7
      day: 21
    - name: 15 août (Assomption)
      month: 8
      day: 15
    - name: 1er novembre (Toussaint)
      month: 11
      day: 1
    - name: 11 novembre (Armistice)
      month: 11
      day: 11
    - name: 25 décembre (Noël)
      month: 12
      day: 25
  vectors:
  - input:
      year: 2026
    expected:
    - date: '2026-01-01'
      name: 1er janvier
    - date: '2026-04-06'
      name: Lundi de Pâques
    - date: '2026-05-01'
      name: 1er mai (Fête du travail)
    - date: '2026-05-14'
      name: Ascension
    - date: '2026-05-25'
      name: Lundi de Pentecôte
    - date: '2026-07-21'
      name: 21 juillet (Fête nationale)
    - date: '2026-08-15'
      name: 15 août (Assomption)
    - date: '2026-11-01'
      name: 1er novembre (Toussaint)
    - date: '2026-11-11'
      name: 11 novembre (Armistice)
    - date: '2026-12-25'
      name: 25 décembre (Noël)
    origin: derived
    note: the ten legal holidays applied to 2026
  - input: '2026-05-14'
    expected: true
    origin: derived
    note: Ascension 2026, the Thursday 39 days after Easter Sunday
  - input: '2026-05-25'
    expected: true
    origin: derived
  - input: '2026-07-21'
    expected: true
    origin: source
  - input: '2026-04-03'
    expected: false
    origin: derived
    note: Good Friday is not a Belgian legal holiday
  - input:
      op: next_business_day
      date: '2026-05-01'
    expected: '2026-05-04'
    origin: derived
    note: 1 May 2026 is a Friday
