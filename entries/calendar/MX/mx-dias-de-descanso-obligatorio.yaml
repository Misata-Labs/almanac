assumed:
- parameter: holidays
  value: fractions VII and IX omitted
  method: derived
  rationale: Fraction VII (1 October every six years when the federal executive changes) and fraction IX (election
    days set by electoral law) depend on events outside the statute's own text, so the rule models only the seven
    fixed and ordinal-weekday rest days.
- parameter: valid_from
  value: '2024-09-30'
  method: derived
  rationale: The date of the most recent reform of article 74 printed in the consolidated text; the seven modelled
    fractions predate it.
