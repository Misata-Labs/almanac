notes: 'Article 74 of the Ley Federal del Trabajo lists the days of obligatory rest: 1 January, the first Monday
  of February (for 5 February), the third Monday of March (for 21 March), 1 May, 16 September, the third Monday
  of November (for 20 November), 25 December, plus 1 October every six years at the change of federal executive
  and election days. The builder reads the consolidated text the Chamber of Deputies publishes and checks every
  modelled fraction''s wording before writing the entry. The weekend is the default Saturday and Sunday; the law
  itself sets one rest day per six of work (article 69) rather than a weekend.'
