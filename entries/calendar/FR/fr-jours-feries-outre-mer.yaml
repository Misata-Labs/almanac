notes: One record per date and name with the zones it applies to, merged from the API's per-zone lists for guadeloupe,
  guyane, la-reunion, martinique, mayotte, saint-barthelemy, saint-martin. These zones add their own commemorations
  (chiefly the abolition of slavery, on a different date in each) to the metropolitan list. The API also accepts
  nouvelle-caledonie, polynesie-francaise, saint-pierre-et-miquelon and wallis-et-futuna but returns the metropolitan
  list byte for byte for them, so they are left out here; use fr-jours-feries-metropole for those. The API serves
  the list that Etalab maintains from the Code du travail (article L3133-1) and the specific provisions for each
  zone, twenty years back and five ahead. Names are the French labels the API returns. No licence is stated by the
  API itself, so the licence is recorded as unstated and the entry held for review.
