notes: The rule computes the last Sunday of March (clocks forward, 01:00 local) and the last Sunday of October (clocks
  back, 02:00 local) as GOV.UK states, and every published date for 2025 to 2028 in the JSON behind www.gov.uk/when-do-the-clocks-change
  reproduces from it (alphagov/frontend commit b078a86e, data last updated 24/11/2025). The published dates are
  kept under parameters.published for direct lookup. Transition times are taken from the same GOV.UK sentence; the
  underlying statute is the Summer Time Act 1972.
