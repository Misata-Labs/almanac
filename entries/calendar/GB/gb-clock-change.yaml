      year: 2025
    expected:
      forward: '2025-03-30'
      back: '2025-10-26'
    origin: source
  - input:
      year: 2026
    expected:
      forward: '2026-03-29'
      back: '2026-10-25'
    origin: source
  - input:
      year: 2027
    expected:
      forward: '2027-03-28'
      back: '2027-10-31'
    origin: source
  - input:
      year: 2028
    expected:
      forward: '2028-03-26'
      back: '2028-10-29'
    origin: source
