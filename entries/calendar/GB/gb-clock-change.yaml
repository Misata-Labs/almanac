id: gb-clock-change
title: United Kingdom clock changes (British Summer Time), 2025 to 2028
kind: rule
domain: calendar
region: GB
status: verified
tier: A
valid_from: '2025-01-01'
valid_to: '2028-12-31'
spec:
  implementation: almanac.rules.gb_clock_change
  parameters:
    transitions:
      forward:
        month: 3
        weekday: sunday
        ordinal: last
        local_time: 01:00
      back:
        month: 10
        weekday: sunday
        ordinal: last
        local_time: 02:00
    published:
      '2025':
        forward: '2025-03-30'
        back: '2025-10-26'
      '2026':
        forward: '2026-03-29'
        back: '2026-10-25'
      '2027':
        forward: '2027-03-28'
        back: '2027-10-31'
      '2028':
        forward: '2028-03-26'
        back: '2028-10-29'
