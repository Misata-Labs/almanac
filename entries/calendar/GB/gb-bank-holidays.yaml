notes: Dates are the bank holidays GOV.UK publishes for England and Wales, Scotland and Northern Ireland from 2019
  to 2028, read from the JSON data behind www.gov.uk/bank-holidays in alphagov/frontend (commit b078a86e, data last
  updated 24/11/2025). Dates are converted from DD/MM/YYYY to ISO 8601; substitute_day is true where the source
  notes a substitute day and bunting is copied unchanged. Bank holidays are set by the Banking and Financial Dealings
  Act 1971 and by royal proclamation; the source is maintained by the Government Digital Service under the MIT licence
  and GOV.UK content is also available under the Open Government Licence v3. Future years can change by proclamation,
  so re-run the verifier before relying on them. The Scotland list for 2026 includes a World Cup bank holiday on
  15 June 2026 exactly as published; it is flagged for human review. Division names are derived from the source
  slugs.
