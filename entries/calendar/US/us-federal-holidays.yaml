- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 11
  tolerance: 0
- statistic: count[2026]
  expected: 11
  tolerance: 0
notes: 'The eleven legal public holidays of 5 U.S.C. 6103(a), each as a fixed date or an ordinal weekday of a month,
  with the observance shifts for a Monday-to-Friday workweek: Saturday holidays are observed the Friday before (6103(b)(1))
  and Sunday holidays the Monday after (Executive Order 11582 section 3(a), referenced by 5 CFR 610.202(b)). Inauguration
  Day (6103(c)) applies only in the Washington area every fourth year and is not modelled. valid_from is the statutory
  text''s edition date (2023 edition, current through the end of 2023). US government works are not subject to copyright,
  but none of the three pages states terms, so the entry is held at license-review.'
