assumed:
- parameter: observance
  value: Saturday to preceding Friday; Sunday to following Monday
  method: derived
  rationale: The statute moves a Saturday holiday to the Friday before for Monday-to-Friday workweeks; Executive
    Order 11582 moves a Sunday holiday to the next workday of the basic workweek, which for that workweek is Monday.
    The rule implements only this common workweek; the alternative rules for other schedules in 6103(b)(2), (b)(3)
    and (d) are not modelled.
- parameter: vectors
  value: computed dates for 2026 and 2027
  method: derived
  rationale: The sources state the holidays as ordinal weekdays and fixed dates, not as calendar dates for a given
    year; the vectors apply those rules and are checked by hand against a calendar.
