notes: Every all-day event in the public holidays calendar that the 1823 contact centre publishes for the Government
  of Hong Kong, 51 dates from 2025 to 2027, with the English summaries as published (the feed is also listed on
  DATA.GOV.HK). General holidays are gazetted under the General Holidays Ordinance (Cap. 149) each year, so a new
  year appears in the feed only once gazetted. The DATA.GOV.HK terms allow free reuse with attribution but are not
  an SPDX licence; the entry is held for licence review.
