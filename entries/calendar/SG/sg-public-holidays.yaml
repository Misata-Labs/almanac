notes: Every record of the consolidated public holidays dataset the Ministry of Manpower manages on data.gov.sg,
  104 dates from 2020 to 2027, read through the CKAN datastore API. Names are as published; a holiday falling on
  a Sunday is followed by a separate '(Observed)' record for the Monday, which the Holidays Act provides. The dataset
  metadata says it is refreshed annually when the next year's list is released. data.gov.sg content is offered under
  the Singapore Open Data Licence, which is not an SPDX licence; the entry is held for review.
