notes: 'iso3166.tab gives the two-letter country code and the usual English name tzdb uses for it (which sometimes
  departs from the ISO-listed name, as the file''s own header explains). The zones column is derived by inverting
  zone1970.tab: every zone whose country list names the code, in file order. Codes with no zone row in zone1970.tab
  keep an empty list. The IANA Time Zone Database release 2026f is cited from its versioned, uncompressed directory
  on data.iana.org, so the bytes never move under the hash. Its LICENSE file places the code and data in the public
  domain. valid_from is the release date on the NEWS file''s first Release line; valid_to is null until a later
  release is cited.'
