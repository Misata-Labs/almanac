notes: 'zone1970.tab lists one row per timezone whose civil clocks have agreed since 1970: the ISO 3166 alpha-2
  codes of the countries that overlap it (most populous first), the principal location in ISO 6709 sign-degrees-minutes
  form, the TZ identifier and, for countries with several zones, a comment. Rows are keyed by the TZ identifier
  and country_codes is kept as a list. The IANA Time Zone Database release 2026f is cited from its versioned, uncompressed
  directory on data.iana.org, so the bytes never move under the hash. Its LICENSE file places the code and data
  in the public domain. valid_from is the release date on the NEWS file''s first Release line; valid_to is null
  until a later release is cited.'
