notes: 'The 2026 table of fiestas laborales published in the Boletín Oficial del Estado, read from the BOE''s XML
  rendering of the resolution: one record per date, name and kind, with the autonomous communities and the cities
  of Ceuta and Melilla it applies to. kind is ''national'' for the non-substitutable national holidays (marked *
  in the table), ''national-substitutable'' for national holidays the community chose to keep (**) and ''regional''
  for the community''s own holidays (***). Island and local holidays in the resolution''s notes (Canarias by island,
  Arán) and municipal holidays are not included. The AGE días inhábiles resolution is cited as corroboration of
  the national dates. The BOE states no SPDX licence; held for licence review.'
