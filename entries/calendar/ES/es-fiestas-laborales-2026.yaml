      date: '2026-04-23'
      region: madrid
    expected: false
    origin: derived
    note: the regional holiday of Aragón is not a Madrid holiday
  - input:
      date: '2026-04-06'
      region: cataluna
    expected: true
    origin: source
  - input:
      date: '2026-04-06'
      region: andalucia
    expected: false
    origin: derived
    note: Andalucía took Jueves Santo instead of Lunes de Pascua
  - input:
      op: is_business_day
      date: '2026-12-25'
      region: galicia
    expected: false
    origin: derived
    note: a listed holiday is not a business day
  - input:
      op: next_business_day
      date: '2026-12-25'
      region: galicia
    expected: '2026-12-28'
    origin: derived
    note: first weekday after the holiday that is not itself listed
