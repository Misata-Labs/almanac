notes: 'Official holidays a Saudi private-sector worker receives with full pay, as the Ministry of Human Resources
  and Social Development''s 2025 awareness guide lists them: Founding Day (22 February) and National Day (23 September),
  one day each, and Eid al-Fitr and Eid al-Adha, four days each. The Eid holidays follow the Hijri calendar: Eid
  al-Fitr starts the day after 29 Ramadan and Eid al-Adha on the day of standing at Arafat. Their Gregorian dates
  depend on the announced Hijri month and are held in hijri_holidays rather than as dates, so is_holiday answers
  only for the fixed Gregorian days. Friday is the weekly rest day unless another day is agreed with notice to the
  labour office. Holidays that fall on a rest day are compensated with a day before or after; National or Founding
  Day overlapping an Eid is not compensated.'
