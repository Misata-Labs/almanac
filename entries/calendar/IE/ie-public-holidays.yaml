  parameters:
    holidays:
    - name: New Year's Day (the 1st day of January)
      month: 1
      day: 1
      paragraph: 1(f)
    - name: St. Brigid's Day (first Monday in February, or 1 February when a Friday)
      month: 2
      weekday: monday
      ordinal: first
      fixed_if_weekday:
        day: 1
        weekday: friday
      paragraph: 1(g), S.I. No. 50/2022
    - name: St. Patrick's Day
      month: 3
      day: 17
      paragraph: 1(c)
    - name: Easter Monday
      easter_offset: 1
      paragraph: 1(d)
    - name: First Monday in May
      month: 5
      weekday: monday
      ordinal: first
      paragraph: 1(d)
    - name: First Monday in June
      month: 6
      weekday: monday
      ordinal: first
      paragraph: 1(d)
    - name: First Monday in August
      month: 8
      weekday: monday
      ordinal: first
      paragraph: 1(d)
    - name: Last Monday in October
      month: 10
      weekday: monday
      ordinal: last
      paragraph: 1(e)
    - name: Christmas Day
      month: 12
      day: 25
      paragraph: 1(a)
    - name: St. Stephen's Day
      month: 12
      day: 26
      paragraph: 1(b)
