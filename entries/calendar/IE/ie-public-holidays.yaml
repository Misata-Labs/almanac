      year: 2026
    expected:
    - date: '2026-01-01'
      name: New Year's Day (the 1st day of January)
    - date: '2026-02-02'
      name: St. Brigid's Day (first Monday in February, or 1 February when a Friday)
    - date: '2026-03-17'
      name: St. Patrick's Day
    - date: '2026-04-06'
      name: Easter Monday
    - date: '2026-05-04'
      name: First Monday in May
    - date: '2026-06-01'
      name: First Monday in June
    - date: '2026-08-03'
      name: First Monday in August
    - date: '2026-10-26'
      name: Last Monday in October
    - date: '2026-12-25'
      name: Christmas Day
    - date: '2026-12-26'
      name: St. Stephen's Day
    origin: derived
    note: the schedule applied to 2026
  - input: '2023-02-06'
    expected: true
    origin: source
    note: the first St. Brigid's Day holiday named in the regulations
  - input: '2030-02-01'
    expected: true
    origin: derived
    note: 1 February 2030 is a Friday, so the fixed date applies
  - input: '2030-02-04'
    expected: false
    origin: derived
    note: the first Monday of February 2030 is not a holiday because the Friday rule applied
  - input: '2026-04-06'
    expected: true
    origin: derived
    note: Easter Monday 2026
  - input: '2026-04-03'
    expected: false
    origin: derived
    note: Good Friday is not a public holiday under the Act
  - input:
      op: next_business_day
      date: '2026-12-25'
    expected: '2026-12-28'
    origin: derived
    note: St. Stephen's Day 2026 is a Saturday; the Monday is the next business day
