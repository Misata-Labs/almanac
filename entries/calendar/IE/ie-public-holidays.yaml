assumed:
- parameter: easter_offset
  value: Easter Sunday from the Gregorian computus; Easter Monday +1, Ascension +39, Whit Monday +50
  method: derived
  rationale: The source names the movable feasts without dates. The rule computes Easter Sunday with the standard
    Gregorian algorithm, and the offsets reproduce every Lundi de Pâques, Ascension and Lundi de Pentecôte date
    in the etalab jours fériés list for 2006 to 2031 (checked by the builder and by tests/test_calendars.py).
- parameter: holidays
  value: 25 December, 26 December and 17 March
  method: assumed
  rationale: The schedule names Christmas Day, St. Stephen's Day and St. Patrick's Day without calendar dates; the
    rule uses the dates on which those feasts are kept.
- parameter: holidays
  value: once-off 18 March 2022 holiday omitted
  method: derived
  rationale: S.I. No. 50/2022 also prescribed a single public holiday on 18 March 2022; a recurring list cannot
    carry it, and it predates valid_from.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count[2026]
  expected: 10
  tolerance: 0
- statistic: count[2030]
  expected: 10
  tolerance: 0
notes: 'The nine public holidays of the Second Schedule to the Organisation of Working Time Act 1997 as revised
  by the Law Reform Commission, plus St. Brigid''s Day prescribed under paragraph 1(g) by S.I. No. 50/2022: the
  first Monday in February, or 1 February when that is a Friday. valid_from is the start of the year of the first
  St. Brigid''s Day holiday the regulations name. The Church-holiday substitution an employer may make under paragraph
  3 is not modelled.'
