notes: The 17 closed (gazetted) holidays in Annexure I and the 28 restricted holidays in Annexure II of the 2026
  holiday list published by the Comptroller and Auditor General of India for Central Government offices in Karnataka.
  Central Government holiday lists derive from the Department of Personnel and Training office memorandum for the
  year (fourteen compulsory holidays plus three chosen by the Central Government Employees Welfare Coordination
  Committee of each state), and the DoPT circular host was unreachable when this entry was built, so this office
  list stands in for it and the regional choices are Karnataka's. Only the closed holidays enter the business-day
  rule; restricted holidays are kept under restricted_holidays. Dates for Id-ul-Fitr, Id-ul-Zuha, Muharram and Id-e-Milad
  can move with the lunar sighting.
