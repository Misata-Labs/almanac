notes: Daily index of UK spending on credit and debit cards for 2023, an ONS experimental faster indicator built
  from the CHAPS payments that card processors make to around 100 major UK retail corporates, as the full time-series
  CSV of version 130 of the uk-spending-on-cards dataset publishes it. The aggregate is the series value; the four
  category columns follow ONS's classification of retailers (staple, delayable, social and work-related). The index
  base is not stated in the dataset metadata. Other years are dropped. The metadata carries no licence field; ONS
  publishes its datasets under the Open Government Licence v3.0, as the cpih01 metadata states.
