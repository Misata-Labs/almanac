notes: Weighted shares of UK businesses from the ONS Business Insights and Conditions Survey (BICS), all industries
  and size bands. Each period is the month the expectation refers to; the question is asked in the wave fielded
  during the preceding month. The primary series is the share of businesses currently trading that expect turnover
  to increase; the turnover columns complete that question's answers. The price columns answer the question on expected
  prices of goods or services sold, as shares of businesses not permanently stopped trading. Shares are proportions
  between 0 and 1 as the workbook stores them. Taken from the weighted time-series sheets of the wave 168 dataset,
  a fixed per-wave file; ONS publishes it under the Open Government Licence v3.0.
