notes: 'CPIH index (2015 = 100) for the United Kingdom, monthly for 2025, for the twelve COICOP divisions as columns
  beside the all-items index as the series value, from the full time-series CSV of version 67 of the ONS cpih01
  dataset; other aggregates and years are dropped. The columns are the division codes in lower case: cp01 = 01 Food
  and non-alcoholic beverages; cp02 = 02 Alcoholic beverages and tobacco; cp03 = 03 Clothing and footwear; cp04
  = 04 Housing, water, electricity, gas and other fuels; cp05 = 05 Furniture, household equipment and maintenance;
  cp06 = 06 Health; cp07 = 07 Transport; cp08 = 08 Communication; cp09 = 09 Recreation and culture; cp10 = 10 Education;
  cp11 = 11 Restaurants and hotels; cp12 = 12 Miscellaneous goods and services. The all-items series alone is the
  entry gb-cpih-all-items-index-monthly-2025. ONS publishes the dataset under the Open Government Licence v3.0,
  as its metadata states.'
