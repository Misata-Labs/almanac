notes: Seasonally adjusted gross value added volume indices from the ONS GDP monthly estimate, which incorporates
  the index of production and the index of services. The dataset metadata gives the unit as 'Index. Seasonally adjusted
  2016=100', but the levels sit close to 100 in 2023, so the reference year in that field appears out of date; read
  the series as relative indices of output. The primary series is monthly GDP (sections A to T); the columns are
  the published aggregates (B-E production, G-T services, G and I distribution, hotels and restaurants, H and J
  transport and communication, K-N business services and finance, O-T government and other services) and each SIC
  2007 section, keyed as sic_ plus the section code. Taken from the full time-series CSV of version 69 of the ONS
  gdp-to-four-decimal-places dataset; other months are dropped. ONS publishes its datasets under the Open Government
  Licence v3.0, as the cpih01 metadata states.
