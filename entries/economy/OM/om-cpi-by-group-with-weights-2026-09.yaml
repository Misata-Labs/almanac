notes: 'Oman''s consumer price index for September 2026 by the twelve COICOP expenditure groups and the general
  index (key 00), with each group''s basket weight (weights sum to 100, the general index row carries 100.0), the
  index for September 2026, August 2026 and September 2025, and the changes the bulletin prints. Base: average prices
  of January to December 2018. Group labels are normalised (the bulletin prints ''Resturants'' and ''routing'').
  Weights give a ready household spending mix. NCSI data are published under the Open Government License of the
  Sultanate of Oman, whose general provisions say it is compatible with Creative Commons Attribution 4.0; it is
  not itself an SPDX licence, so the entry stays at license-review.'
