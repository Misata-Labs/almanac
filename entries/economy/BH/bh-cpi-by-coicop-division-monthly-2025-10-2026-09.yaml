notes: 'Monthly consumer price index for Bahrain, the general index (COICOP code 0) as the series value and the
  twelve COICOP divisions as columns, for the twelve latest published months (October 2025 to September 2026). Index
  points are rounded to four decimals from the full-precision export; the dataset does not state its base period
  in the export, so treat the values as index points rather than percentage changes. Division columns: 1 = food_non_alcoholic_beverages,
  2 = alcoholic_beverages_tobacco, 3 = clothing_footwear, 4 = housing_utilities_fuels, 5 = furnishings_household_equipment,
  6 = health, 7 = transport, 8 = communication, 9 = recreation_culture, 10 = education, 11 = restaurants_hotels,
  12 = miscellaneous_goods_services. The Bahrain open data portal publishes no licence for this dataset (its catalogue
  licence field is empty), so the entry stays at license-review until the Information & eGovernment Authority''s
  reuse terms are confirmed.'
