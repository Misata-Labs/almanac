notes: 'Eurostat short-term business statistics: producer price index for the domestic market (2021=100), not seasonally
  adjusted, for the EU27 (from 2020). The primary series is industry including water supply (B-E36); the columns
  are mining, manufacturing, energy and water supply, the main industrial groupings and the NACE Rev. 2 manufacturing
  divisions. Output-price inflation by division is the pricing-power benchmark for industrial portfolio companies.
