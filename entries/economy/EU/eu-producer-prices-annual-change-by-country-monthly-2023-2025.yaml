notes: 'Eurostat short-term business statistics: percentage change on the same month of the previous year of the
  domestic producer price index for industry including water supply (B-E36), not seasonally adjusted. The primary
  series is the EU27 (from 2020); the columns are ten member states keyed by their two-letter geo code. Dataset
  last updated 25/11/26 11:00:00; the query is pinned to 2023-01..2025-12 but Eurostat rewrites the dataset at each
  release, so the content hash changes then. Eurostat''s copyright notice states that its data are released under
  the Creative Commons Attribution 4.0 International licence; the notice page renders dynamically and is referenced
  rather than hashed.'
