notes: 'Gross domestic product at current market prices per inhabitant in 2025 for ten member states from Eurostat
  dataflow nama_10_pc: in euro, in purchasing power standards (PPS, EU27 from 2020) and as a percentage of the EU27
  average per inhabitant in PPS. Rows are keyed by the Eurostat geo code and carry the English country name from
  the GEO codelist. Observation flags published with the data: BE eur_per_inhabitant provisional; DE eur_per_inhabitant
  provisional; ES eur_per_inhabitant provisional; FR eur_per_inhabitant provisional; IT eur_per_inhabitant provisional;
