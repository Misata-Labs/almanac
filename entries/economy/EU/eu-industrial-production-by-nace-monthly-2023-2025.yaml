notes: 'Eurostat short-term business statistics: volume index of production (2021=100), seasonally and calendar
  adjusted, for the EU27 (from 2020). The primary series is total industry excluding construction (B-D); the columns
  are mining, manufacturing and energy supply, the main industrial groupings (capital, intermediate, durable and
  non-durable consumer goods, energy) and the NACE Rev. 2 manufacturing divisions, with the NACE code at the end
  of each column name. Dataset last updated 19/11/26 11:00:00; the query is pinned to 2023-01..2025-12 but Eurostat
  rewrites the dataset at each release, so the content hash changes then. Eurostat''s copyright notice states that
  its data are released under the Creative Commons Attribution 4.0 International licence; the notice page renders
  dynamically and is referenced rather than hashed.'
