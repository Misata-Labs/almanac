notes: 'Eurostat short-term business statistics: index of net turnover in value (2021=100), seasonally and calendar
  adjusted, for the EU27 (from 2020). The primary series is services H to N excluding financial services (H-N_X_K);
  the columns are NACE Rev. 2 sections and divisions for transport, accommodation and food, information and communication,
  real estate, professional and administrative services, with the NACE code at the end of each column name. Turnover
  is in current prices, so it carries both volume and price effects. Dataset last updated 25/11/26 11:00:00; the
  query is pinned to 2023-01..2025-12 but Eurostat rewrites the dataset at each release, so the content hash changes
  then. Eurostat''s copyright notice states that its data are released under the Creative Commons Attribution 4.0
  International licence; the notice page renders dynamically and is referenced rather than hashed.'
