notes: Price level indices for 2024 from Eurostat dataflow prc_ppp_ind (PLI_EU27_2020, EU27 average = 100) for household
  final consumption expenditure, each of its twelve COICOP purposes (food, alcohol and tobacco, clothing, housing
  and energy, furnishings, health, transport, communication, recreation, education, restaurants and hotels, miscellaneous)
  and gross domestic product. A value above 100 means the country is more expensive than the EU average for that
  basket. Rows are keyed by the Eurostat geo code and carry the English country name from the GEO codelist; a cell
  Eurostat does not publish is stored as null. Eurostat's copyright notice states that its data are released under
  the Creative Commons Attribution 4.0 International licence; the notice page renders dynamically and is referenced
  rather than hashed.
