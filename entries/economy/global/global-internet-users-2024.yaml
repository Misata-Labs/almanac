notes: 'Individuals using the Internet (% of population) for 2024 from the World Development Indicators API (indicator
  IT.NET.USER.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional
  and income aggregates removed. Source note from the World Bank: Internet users are individuals who have used the
  Internet (from any location) in the last 3 months. The Internet can be used via a computer, mobile phone, personal
  digital assistant, games machine, digital TV etc. The World Bank licenses its datasets under CC BY 4.0.'
