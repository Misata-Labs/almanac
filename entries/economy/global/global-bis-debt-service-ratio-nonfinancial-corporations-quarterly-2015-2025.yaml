notes: The BIS debt service ratio for the non-financial corporate sector, in per cent of income, quarterly from
  2015Q1 to 2025Q4, for the United States (the value) and 16 other economies (columns named by lower-case ISO country
  code). It benchmarks how much of corporate income goes to servicing debt across countries. The BIS terms and conditions
  allow use of statistics from the BIS Data Portal under the terms on its 'About BIS statistics' page, which is
  not an SPDX licence, so the entry is held at license-review. BIS revises history when it adds a quarter, so the
  pinned query can change after a release.
