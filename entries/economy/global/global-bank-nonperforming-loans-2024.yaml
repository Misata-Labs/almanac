notes: 'Bank nonperforming loans to total gross loans (%) for 2024 from the World Development Indicators API (indicator
  FB.AST.NPER.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional
  and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best recent
  year. Source note from the World Bank: The indicator measures the proportion of a deposit taker’s loan portfolio
  that is impaired or at risk of default. It is calculated as the ratio of non-performing loans (NPLs) to total
  gross loans, where NPLs are defined as loans that are past due by 90 days or more or are otherwise considered
  unlikely to be repaid in full without the realization of collateral. Both non-performing loans and total g The
  World Bank licenses its datasets under CC BY 4.0.'
