notes: 'Fertility rate, total (births per woman) for 2023 from the World Development Indicators API (indicator SP.DYN.TFRT.IN,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. Source note from the World Bank: Total fertility rate represents the number of children that
  would be born to a woman if she were to live to the end of her childbearing years and bear children in accordance
  with age-specific fertility rates of the specified year. The World Bank licenses its datasets under CC BY 4.0.'
