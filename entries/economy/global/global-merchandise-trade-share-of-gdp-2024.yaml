notes: 'Merchandise trade (% of GDP) for 2024 from the World Development Indicators API (indicator TG.VAL.TOTL.GD.ZS,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best recent year. Source
  note from the World Bank: General merchandise trade includes goods whose economic ownership is changed between
  a resident and a non-resident and that are not included in the following specific categories: goods under merchanting,
  non-monetary gold, and parts of travel, construction, and government goods and services n.i.e. It is the total
  of merchandise exports plus merchandise imports. This indicator is expressed as a per The World Bank licenses
  its datasets under CC BY 4.0.'
