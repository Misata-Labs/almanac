notes: 'GDP per capita (current US$) for 2024 from the World Development Indicators API (indicator NY.GDP.PCAP.CD,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. Source note from the World Bank: Gross domestic product is the total income earned through
  the production of goods and services in an economic territory during an accounting period. It can be measured
  in three different ways: using either the expenditure approach, the income approach, or the production approach.
  The core indicator has been divided by the general population to achieve a per capita estimate.This indicator
