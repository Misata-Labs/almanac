notes: 'GNI per capita, Atlas method (current US$) for 2024 from the World Development Indicators API (indicator
  NY.GNP.PCAP.CD, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional
  and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best recent
  year. Source note from the World Bank: Gross national income is the total income earned by all residents within
  an economic territory during an accounting period. It is equal to gross domestic product plus earned income receivable
  from abroad minus earned income payable abroad. This figure is converted to U.S. dollars using the World Bank
  Atlas method, and divided by the midyear population. GNI, calculated in national currency, is usua The World Bank
  licenses its datasets under CC BY 4.0.'
