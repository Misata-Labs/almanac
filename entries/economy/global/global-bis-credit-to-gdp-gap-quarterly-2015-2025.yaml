notes: 'The BIS credit-to-GDP gap: total credit to the private non-financial sector as a percentage of GDP minus
  its long-run trend (HP filter), in percentage points of GDP, quarterly 2015Q1 to 2025Q4, for the United States
  (the value) and 43 other economies (columns named by lower-case BIS area code). A large positive gap means credit
  has grown faster than its trend. The BIS terms and conditions allow use of statistics from the BIS Data Portal
  under the terms on its ''About BIS statistics'' page, which is not an SPDX licence, so the entry is held at license-review.
  BIS revises history when it adds a quarter, so the pinned query can change after a release.'
