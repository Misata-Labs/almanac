notes: 'Foreign direct investment, net inflows (% of GDP) for 2024 from the World Development Indicators API (indicator
  BX.KLT.DINV.WD.GD.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with
  regional and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best
  recent year. Source note from the World Bank: Foreign direct investment is the net inflows of investment to acquire
  a lasting management interest (10 percent or more of voting stock) in an enterprise operating in an economy other
  than that of the investor. It is the sum of equity capital, reinvestment of earnings, other long-term capital,
  and short-term capital as shown in the balance of payments. This series shows net inflows (new investment The
  World Bank licenses its datasets under CC BY 4.0.'
