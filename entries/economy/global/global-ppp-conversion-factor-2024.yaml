notes: 'PPP conversion factor, GDP (LCU per international $) for 2024 from the World Development Indicators API
  (indicator PA.NUS.PPP, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with
  regional and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best
  recent year. Source note from the World Bank: The purchasing power parity (PPP) conversion factor is a currency
  conversion factor and a spatial price deflator. PPPs convert different currencies to a common currency and, in
  the process of conversion, equalize their purchasing power by eliminating the differences in price levels between
  countries, thereby allowing volume or output comparisons of gross domestic product (GDP) and its expenditure  The
  World Bank licenses its datasets under CC BY 4.0.'
