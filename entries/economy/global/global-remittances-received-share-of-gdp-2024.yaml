notes: 'Personal remittances, received (% of GDP) for 2024 from the World Development Indicators API (indicator
  BX.TRF.PWKR.DT.GD.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with
  regional and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best
  recent year. Source note from the World Bank: Personal remittances comprise personal transfers and compensation
  of employees. Personal transfers consist of all current transfers in cash or in kind made or received by resident
  households to or from nonresident households. Personal transfers thus include all current transfers between resident
  and nonresident individuals. Compensation of employees refers to the income of border, seasonal, and ot The World
  Bank licenses its datasets under CC BY 4.0.'
