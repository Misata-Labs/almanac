notes: 'Industry (including construction), value added (% of GDP) for 2024 from the World Development Indicators
  API (indicator NV.IND.TOTL.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3
  code, with regional and income aggregates removed. 2024 is the most recent year whose coverage is close to the
  series'' best recent year. Source note from the World Bank: Industry (including construction) corresponds to ISIC
  (Rev.4) divisions 05-43. It is comprised of mining, manufacturing, construction, electricity, water, and gas industries.
  Value added is the contribution to the economy by a producer or an industry or an institutional sector, which
  is estimated by the total value of output produced and deducting the total value of intermediate consumption of
  goo The World Bank licenses its datasets under CC BY 4.0.'
