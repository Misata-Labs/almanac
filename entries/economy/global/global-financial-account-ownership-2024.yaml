notes: 'Account ownership at a financial institution or with a mobile-money-service provider (% of population ages
  15+) for 2024 from the World Development Indicators API (indicator FX.OWN.TOTL.ZS, data last updated 2026-10-08),
  one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income aggregates removed. Source note
  from the World Bank: Account denotes the percentage of respondents who report having an account (by themselves
  or together with someone else) at a bank or another type of financial institution or report personally using a
  mobile money service in the past 12 months (% age 15+). The World Bank licenses its datasets under CC BY 4.0.'
