notes: 'Automated teller machines (ATMs) (per 100,000 adults) for 2024 from the World Development Indicators API
  (indicator FB.ATM.TOTL.P5, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code,
