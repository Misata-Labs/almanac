notes: The composite leading indicator is built to anticipate turning points in economic activity relative to trend.
  Monthly values of the OECD composite leading indicator (cli) series, amplitude adjusted, OECD harmonised methodology,
  from the OECD composite leading indicators dataflow. The primary series is the United States; the columns are
  the other economies and aggregates keyed by their lower-case reference-area codes (ISO 3166-1 alpha-3 for countries).
  Recent months are revised as new component data arrive, so the content hash changes at each OECD update. The OECD
  resource carries no licence statement and the OECD terms page is not byte-stable, so the licence is recorded as
  unstated and the entry held at license-review until a reviewer confirms the terms for OECD data.
