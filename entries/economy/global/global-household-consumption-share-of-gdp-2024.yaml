notes: 'Households and NPISHs final consumption expenditure (% of GDP) for 2024 from the World Development Indicators
  API (indicator NE.CON.PRVT.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3
  code, with regional and income aggregates removed. 2024 is the most recent year whose coverage is close to the
  series'' best recent year. Source note from the World Bank: This field includes expenditure on goods and services
  by the Household and NPISH sector for the direct satisfaction of human needs or wants, whether individual or collective.
  This indicator is expressed as a percentage of Gross Domestic Product (GDP) which is the total income earned through
  the production of goods and services in an economic territory during an accounting period. The World Bank licenses
  its datasets under CC BY 4.0.'
