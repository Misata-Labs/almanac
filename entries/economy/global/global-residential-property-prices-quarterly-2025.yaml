notes: Quarterly nominal residential property price indices (2010 = 100) for 2025, from the BIS selected residential
  property price series (dataflow WS_SPP, unit 628), with the United States as the primary series and the euro area,
  United Kingdom, Japan, Brazil, India, Switzerland, Canada and Australia as columns. The portal publishes the latest
  quarter for some economies before the underlying national release; the figures recorded are those served on the
  access date. The BIS general terms permit limited extracts with attribution but refer statistics to a separate
  'About BIS statistics' notice that was not fetched, so the entry is held at license-review until those terms are
  confirmed.
