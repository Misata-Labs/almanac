notes: 'Agriculture, forestry, and fishing, value added (% of GDP) for 2024 from the World Development Indicators
  API (indicator NV.AGR.TOTL.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3
  code, with regional and income aggregates removed. 2024 is the most recent year whose coverage is close to the
  series'' best recent year. Source note from the World Bank: Agriculture, forestry, and fishing corresponds to
  ISIC (Rev. 4) divisions 01-03 and includes the exploitation of vegetal and animal natural resources, comprising
  the activities of growing of crops, raising and breeding of animals, harvesting of timber and other plants, animals
  or animal products from a farm or their natural habitats.Value added is the contribution to the economy by a producer
  or a The World Bank licenses its datasets under CC BY 4.0.'
