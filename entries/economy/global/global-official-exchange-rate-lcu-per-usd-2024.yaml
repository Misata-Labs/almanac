notes: 'Official exchange rate (LCU per US$, period average) for 2024 from the World Development Indicators API
  (indicator PA.NUS.FCRF, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with
  regional and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best
  recent year. Source note from the World Bank: Official exchange rate refers to the exchange rate determined by
  national authorities or to the rate determined in the legally sanctioned exchange market. This indicator represents
  the ratio of Local Currency Units relative to United States dollars.This indicator is derived as an average over
  the reference period. The World Bank licenses its datasets under CC BY 4.0.'
