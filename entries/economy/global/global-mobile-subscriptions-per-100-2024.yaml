notes: 'Mobile cellular subscriptions (per 100 people) for 2024 from the World Development Indicators API (indicator
  IT.CEL.SETS.P2, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional
  and income aggregates removed. Source note from the World Bank: Mobile cellular telephone subscriptions are subscriptions
  to a public mobile telephone service that provide access to the PSTN using cellular technology. The indicator
  includes (and is split into) the number of postpaid subscriptions, and the number of active prepaid accounts (i.e.
  that have been used during the last three months). The indicator applies to all mobile cellular subscriptions
  that of The World Bank licenses its datasets under CC BY 4.0.'
