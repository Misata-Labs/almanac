notes: 'Tax revenue (% of GDP) for 2023 from the World Development Indicators API (indicator GC.TAX.TOTL.GD.ZS,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. 2023 is the most recent year whose coverage is close to the series'' best recent year. Source
  note from the World Bank: Taxes are compulsory, unrequited payments, in cash or in kind, made by institutional





  units to government units. This indicator is expressed as a percentage of Gross Domestic Product (GDP) which is
  the total income earned through the production of goods and services in an economic territory during an accounting
  period. The World Bank licenses its datasets under CC BY 4.0.'
