notes: 'Gross savings (% of GDP) for 2024 from the World Development Indicators API (indicator NY.GNS.ICTR.ZS, data
  last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income aggregates
  removed. 2024 is the most recent year whose coverage is close to the series'' best recent year. Source note from
  the World Bank: Savings is an amount that represents the part of disposable income (adjusted for the









  change in pension entitlements) that is not spent on final consumption. Gross savings are calculated as gross
  national income less total consumption, plus net transfers. This indicator is expressed as a percentage of Gross
  Domestic Product (GDP) which is the total income earned through the production of go The World Bank licenses its
  datasets under CC BY 4.0.'
