notes: 'Labor force participation rate, total (% of total population ages 15+) (modeled ILO estimate) for 2024 from
  the World Development Indicators API (indicator SL.TLF.CACT.ZS, data last updated 2026-10-08), one row per economy
  keyed by ISO 3166-1 alpha-3 code, with regional and income aggregates removed. Source note from the World Bank:
  Labor force participation rate is the proportion of the population ages 15 and older that is economically active:
  all people who supply labor for the production of goods and services during a specified period. The World Bank
  licenses its datasets under CC BY 4.0.'
