assumed:
- parameter: distribution.parameters.shares
  value: weight / sum of the thirteen group weights
  method: derived
  rationale: SCAD publishes each group's weight in percent of the all-items index; the shares rescale the published
    one-decimal weights so they sum to exactly one.
tests:
- statistic: share["Housing, water, electricity, gas and other fuels"]
  expected: 0.336336
  tolerance: 0.005
- statistic: share["Food and beverages"]
  expected: 0.12012
  tolerance: 0.005
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: Expenditure weights of the Abu Dhabi consumer price index (2021=100 series) for its thirteen groups, from
  the Weights column of Table 1 in SCAD's December 2025 Consumer Price Index release. The weights describe how the
  average household budget in the emirate splits across categories, which makes them a ready category mix for synthetic
  household spending or retail baskets. Published weights (percent) ride along as weights_percent. SCAD's terms
  of use (https://www.scad.gov.ae/terms-of-use) state that its publications and tables may be reproduced without
  further permission provided SCAD is acknowledged as the source; the page is rendered per request and is referenced
  rather than hashed, so the entry stays at licence review.
