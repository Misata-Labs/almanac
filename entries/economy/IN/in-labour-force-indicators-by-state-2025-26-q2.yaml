notes: 'Quarterly labour market indicators for 22 states and all India from Tables 8.10 to 8.12 of the Statistical
  Appendix to the Economic Survey 2025-26, which the Ministry of Finance compiles from MoSPI''s quarterly Periodic
  Labour Force Survey bulletins: labour force participation rate, worker population ratio and unemployment rate
  in current weekly status for persons aged 15 and above, for April-June and July-September 2025. Rows are keyed
  by state name as the tables print it. The validity window is the later quarter. The Survey documents carry no
  licence statement.'
