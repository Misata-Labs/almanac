notes: 'Rupees per unit of foreign currency from Table 5.4 of the Statistical Appendix to the Economic Survey 2025-26,
  sourced by the Ministry of Finance from the Reserve Bank of India: fiscal year averages for 2022-23 to 2024-25
  and provisional monthly averages for April to November 2025, for the US dollar, pound sterling, euro, yen and
  the IMF''s SDR. The table notes that dollar, sterling, euro and yen figures from May 2012 are RBI reference rates,
  disseminated by FBIL from July 2018, and other currencies are FEDAI indicative rates. The Survey documents carry
  no licence statement.'
