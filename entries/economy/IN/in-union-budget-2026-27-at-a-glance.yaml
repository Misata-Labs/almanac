notes: 'Headline aggregates of the Union Budget 2026-27 from the Ministry of Finance''s Budget at a Glance: each
  row is a line of the summary table in ₹ crore with Actuals 2024-25, Budget Estimates 2025-26, Revised Estimates
  2025-26 and Budget Estimates 2026-27; deficit rows also carry the BE 2026-27 share of GDP from the parentheses.
  The GDP used for the ratios is ₹3,93,00,393 crore for 2026-27, 10% over the NSO advance estimate of ₹3,57,13,886
  crore for 2025-26. Total receipts equal total expenditure because borrowings and other liabilities are counted
  as receipts; the fiscal deficit is expenditure less receipts excluding borrowings. RE 2025-26 is adjusted by ₹9,084
  crore for amounts receivable from States. Figures are net of States'' share of taxes. The document carries no
  licence statement.'
