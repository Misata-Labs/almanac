notes: 'Foreign exchange reserves from Table 5.1B of the Statistical Appendix to the Economic Survey 2025-26, sourced
  from the Reserve Bank of India, in US$ million: gold, the reserve tranche position in the IMF, SDRs, foreign currency
  assets and the total at the end of fiscal years 2022-23 to 2024-25 and at end-December 2025. The table''s IMF
  drawal and repurchase columns are left out. Foreign currency assets exclude IIFC (UK) bonds, SDRs transferred
  by the Government to the RBI and SAARC and ACU swap lending, as the table notes. The Survey documents carry no
  licence statement.'
