notes: 'Price index levels from Tables 4.3 and 4.1 of the Statistical Appendix to the Economic Survey 2025-26: the
  Labour Bureau''s CPI for industrial workers (2016=100), agricultural labourers and rural labourers (1986-87=100
  until May 2025, 2019=100 from June 2025, hence the drop in level), the NSO''s CPI new series rural, urban and
  combined (2012=100), and DPIIT''s wholesale price index for all commodities (2011-12=100). Annual rows are averages
  of months; monthly rows run April to December 2025 with November and December provisional and December published
  only for CPI new series and WPI. Inflation rates are not tabulated in the appendix and should be derived from
  these levels year on year. The Survey documents carry no licence statement.'
