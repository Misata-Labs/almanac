notes: 'Annual UPI and RuPay card payment totals from Table 3.6 of the Statistical Appendix to the Economic Survey
  2025-26, sourced from NPCI: UPI value in ₹ billion and volume in million transactions, and RuPay card value and
  volume split between point-of-sale and e-commerce, for fiscal years 2016-17 to 2024-25 plus April to December
  2025. The partial 2025-26 row is not comparable with full years. Monthly UPI statistics on npci.org.in were not
  reachable from this environment, so the Survey table stands in. The Survey documents carry no licence statement.'
