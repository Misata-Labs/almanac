notes: 'Seasonally adjusted ratio of end-of-month total inventories to monthly value of shipments from the M3 survey,
  the benchmark for inventory days and working-capital assumptions. The primary series is total manufacturing (MTM);
  the columns are durable and nondurable goods and the M3 industry groups (the survey publishes no ratio for motor
  vehicles and parts, pharmaceuticals or the market groupings). Source: the M3 time-series dataset the Census Bureau
  publishes as one ZIP per programme (data updated Tuesday, 03-Nov-26 09:05:43 EST). The ZIP is replaced at each
  release, so the content hash changes then; the values for the window are also subject to the programme''s routine
  revisions. The publisher is a US federal body and the resource carries no licence statement, so the licence is
  recorded as unstated and the entry held at license-review.'
