notes: 'Seasonally adjusted monthly sales in millions of US dollars from the Monthly Retail Trade Survey. The primary
  series is retail trade and food services (44X72); the columns are the NAICS kinds of business, with GAFO (general
  merchandise, apparel, furniture and other) and electronic shopping and mail-order houses, keyed by descriptive
  names ending in the NAICS code. Source: the MRTS time-series dataset the Census Bureau publishes as one ZIP per
  programme (data updated Tuesday, 17-Nov-26 09:01:25 EST). The ZIP is replaced at each release, so the content
  hash changes then; the values for the window are also subject to the programme''s routine revisions. The publisher
  is a US federal body and the resource carries no licence statement, so the licence is recorded as unstated and
  the entry held at license-review.'
