assumed:
- parameter: observed_period.end
  value: '2026-10-31'
  method: derived
  rationale: The package's last period is 2026Q4 while the Board's SLOOS page lists the October 2026 survey as the
    latest, so each quarter label is read as the survey conducted in that quarter and the period is closed at the
    end of October 2026 rather than at the end of the quarter.
