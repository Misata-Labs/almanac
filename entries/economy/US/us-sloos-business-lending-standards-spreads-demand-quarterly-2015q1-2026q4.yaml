notes: Net percentages of domestic banks in the Federal Reserve's Senior Loan Officer Opinion Survey that tightened
  standards on commercial and industrial loans (to large and middle-market firms, the value, and to small firms),
  increased spreads of loan rates over their cost of funds, reported stronger C&I loan demand, and tightened standards
  on three kinds of commercial real estate loans, quarterly from 2015Q1 to 2026Q4. Each quarter label is read as
  the survey conducted in that quarter (2026Q4 is the October 2026 survey, the latest listed on the Board's SLOOS
  page); a positive net percentage means more banks tightened, raised spreads or saw stronger demand than the reverse.
  The package holds all observations, so it changes when the next survey is published and the hash then needs refreshing.
  The Board has announced that the Data Download Program's preformatted packages are withdrawn on 31 March 2027
  and the DDP pages on 1 July 2027, after which this URL will stop resolving. The publisher is a US federal body
  and the resource carries no licence statement, so the licence is recorded as unstated and the entry held at license-review.
