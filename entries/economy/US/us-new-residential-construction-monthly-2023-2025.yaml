notes: 'New residential construction for the United States, in thousands of housing units, seasonally adjusted.
  The primary series is total housing starts at an annual rate; the columns are single-family starts and starts
  in buildings with five units or more, permits (total and single-family) and completions at annual rates, and the
  monthly stock of units under construction and authorized but not started. Source: the RESCONST time-series dataset
  the Census Bureau publishes as one ZIP per programme (data updated Wednesday, 25-Nov-26 08:00:00 EST). The ZIP
  is replaced at each release, so the content hash changes then; the values for the window are also subject to the
  programme''s routine revisions. The publisher is a US federal body and the resource carries no licence statement,
  so the licence is recorded as unstated and the entry held at license-review.'
