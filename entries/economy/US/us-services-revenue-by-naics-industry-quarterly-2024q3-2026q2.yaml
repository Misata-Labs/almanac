notes: 'Quarterly total operating revenue in millions of US dollars, not seasonally adjusted, from the Quarterly
  Services Survey for the eight quarters from 2024Q3 to 2026Q2 (the advance estimate for 2026Q3 is left out). The
  primary series is the selected services total; the columns are NAICS sectors and the three- and four-digit industries
  most often held by services portfolios, with the NAICS code at the end of each column name. Year-over-year growth
  should be read across the same quarter because the series is not seasonally adjusted. Source: the QSS time-series
  dataset the Census Bureau publishes as one ZIP per programme (data updated Thursday, 19-Nov-26 09:02:09 EST).
  The ZIP is replaced at each release, so the content hash changes then; the values for the window are also subject
  to the programme''s routine revisions. The publisher is a US federal body and the resource carries no licence
  statement, so the licence is recorded as unstated and the entry held at license-review.'
