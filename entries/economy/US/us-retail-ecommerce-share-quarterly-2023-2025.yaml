notes: E-commerce sales as a percent of total retail sales, seasonally adjusted, by quarter from 2023Q1 to 2025Q4,
  from the Census Bureau's quarterly e-commerce report time-series workbook (estimates from the Monthly Retail Trade
  Survey and administrative records, employer businesses only). Columns carry total retail and e-commerce sales
  in millions of US dollars and the percent changes from the prior quarter and the same quarter a year earlier.
  The workbook is rewritten each quarter and its latest quarter is preliminary; the window ends well before it.
  The publisher is a US federal body and the resource carries no licence statement, so the licence is recorded as
  unstated and the entry held at license-review.
