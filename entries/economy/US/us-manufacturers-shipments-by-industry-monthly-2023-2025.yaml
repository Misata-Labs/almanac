notes: 'Seasonally adjusted value of shipments in millions of US dollars from the Manufacturers'' Shipments, Inventories
  and Orders (M3) survey. The primary series is total manufacturing (MTM); the columns are durable and nondurable
  goods, the M3 industry groups and the market groupings (capital goods, nondefense capital goods excluding aircraft,
  consumer goods, information technology industries), keyed by descriptive names for the M3 category codes. Source:
  the M3 time-series dataset the Census Bureau publishes as one ZIP per programme (data updated Tuesday, 03-Nov-26
  09:05:43 EST). The ZIP is replaced at each release, so the content hash changes then; the values for the window
  are also subject to the programme''s routine revisions. The publisher is a US federal body and the resource carries
  no licence statement, so the licence is recorded as unstated and the entry held at license-review.'
