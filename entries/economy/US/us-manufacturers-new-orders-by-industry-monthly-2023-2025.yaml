notes: 'Seasonally adjusted new orders in millions of US dollars from the M3 survey, a leading indicator of manufacturing
  activity. The primary series is total manufacturing (MTM); the columns cover durable goods, manufacturing excluding
  transportation, the durable industry groups, capital goods split into nondefense, nondefense excluding aircraft
  (the core capital goods series) and defense, consumer durables, information technology industries and construction
  materials, plus total unfilled orders. Source: the M3 time-series dataset the Census Bureau publishes as one ZIP
  per programme (data updated Tuesday, 03-Nov-26 09:05:43 EST). The ZIP is replaced at each release, so the content
  hash changes then; the values for the window are also subject to the programme''s routine revisions. The publisher
  is a US federal body and the resource carries no licence statement, so the licence is recorded as unstated and
  the entry held at license-review.'
