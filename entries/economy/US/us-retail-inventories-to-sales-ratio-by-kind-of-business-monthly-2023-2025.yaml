notes: 'Seasonally adjusted ratio of end-of-month inventories to monthly sales for retailers from the Monthly Retail
  Trade Survey, the benchmark for retail inventory days. The primary series is retail trade (44000, food services
  carry no inventories in the survey); the columns are retail excluding motor vehicles and the kinds of business
  for which the survey publishes the ratio, keyed by descriptive names ending in the NAICS code. Source: the MRTS
  time-series dataset the Census Bureau publishes as one ZIP per programme (data updated Tuesday, 17-Nov-26 09:01:25
  EST). The ZIP is replaced at each release, so the content hash changes then; the values for the window are also
  subject to the programme''s routine revisions. The publisher is a US federal body and the resource carries no
  licence statement, so the licence is recorded as unstated and the entry held at license-review.'
