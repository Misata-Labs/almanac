notes: 'Annual income account of the US nonfinancial corporate business sector (Z.1 table S.11.1.i, annual), 2015
  to 2025, in millions of US dollars: interest paid (the value), gross value added, consumption of fixed capital,
  net operating surplus, interest received, dividends paid and current taxes on income. Net operating surplus plus
  interest received over interest paid gives a sector-wide interest coverage benchmark; the Z.1 publishes interest
  flows only annually. Figures come from the CSV archive of the Z.1 release of 11 September 2026, pinned by its
  dated URL, which covers data to 2026Q2; later releases revise history and live at their own dated URLs. The publisher
  is a US federal body and the resource carries no licence statement, so the licence is recorded as unstated and
  the entry held at license-review.'
