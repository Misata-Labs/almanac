notes: 'People using at least basic drinking water services (% of population) for 2024 from the World Development
  Indicators API (indicator SH.H2O.BASW.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1
  alpha-3 code, with regional and income aggregates removed. 2024 is the most recent year whose coverage is close
  to the series'' best recent year. Source note from the World Bank: The percentage of people using at least basic
  water services.  This indicator encompasses both people using basic water services as well as those using safely
  managed water services.  Basic drinking water services is defined as drinking water from an improved source, provided
  collection time is not more than 30 minutes for a round trip.  Improved water sources include piped water, boreholes
  or tub The World Bank licenses its datasets under CC BY 4.0.'
