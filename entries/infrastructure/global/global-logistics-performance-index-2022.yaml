notes: 'Logistics performance index: Overall (1=low to 5=high) for 2022 from the World Development Indicators API
  (indicator LP.LPI.OVRL.XQ, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code,
  with regional and income aggregates removed. 2022 is the most recent year whose coverage is close to the series''
  best recent year. Source note from the World Bank: The Logistics Performance Index overall score reflects perceptions
  of a country''s logistics based on the efficiency of customs clearance process, quality of trade- and transport-related
  infrastructure, ease of arranging competitively priced shipments, quality of logistics services, ability to track
  and trace consignments, and frequency with which shipments reach the consignee within the scheduled  The World
  Bank licenses its datasets under CC BY 4.0.'
