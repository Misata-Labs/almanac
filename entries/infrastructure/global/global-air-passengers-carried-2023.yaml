notes: 'Air transport, passengers carried for 2023 from the World Development Indicators API (indicator IS.AIR.PSGR,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. 2023 is the most recent year whose coverage is close to the series'' best recent year. Source
  note from the World Bank: Air carrier data per country refers to passengers carried by airlines registered in
  that country regardless of the origin or destination of the passengers. The World Bank licenses its datasets under
  CC BY 4.0.'
