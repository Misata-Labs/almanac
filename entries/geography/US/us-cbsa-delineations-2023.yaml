notes: The delineation file lists one row per county in each core based statistical area; this entry folds those
  rows into one record per CBSA with the title, the metropolitan or micropolitan category, the combined statistical
  area it belongs to, the member counties as five-digit FIPS codes, how many of them are central, the states they
  lie in and any metropolitan divisions. The workbook's banner names the July 2023 vintage, which sets valid_from.
  The Census Bureau publishes the file without a licence statement, so the licence is recorded as unstated and the
  entry held at license-review.
