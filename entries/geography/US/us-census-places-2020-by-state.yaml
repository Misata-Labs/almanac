assumed:
- parameter: valid_from
  value: '2020-01-01'
  method: assumed
  rationale: The file carries no application date of its own; valid_from is the first day of the vintage its name
    announces. The vintage is codes2020.
- parameter: rows[*] and place_types
  value: row counts of national_place2020.txt grouped by STATE and TYPE
  method: derived
  rationale: The file lists individual places; the per-state figures are counts of its rows.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 56
  tolerance: 0
- statistic: value["CA","places"]
  expected: 1611
  tolerance: 0
- statistic: value["AL","incorporated_places"]
  expected: 462
  tolerance: 0
notes: Counts of rows in the Census Bureau's 2020 national place file per state, with the split between INCORPORATED
  PLACE and CENSUS DESIGNATED PLACE rows; place_types records every TYPE value in the file with its national count.
  The counts give a generator the weight of each state when choosing a place at random. The Census Bureau publishes
  the file without a licence statement, so the licence is recorded as unstated and the entry held at license-review.
  The file carries no application date of its own; valid_from is the first day of the vintage its name announces.
  The vintage is 2020.
