notes: The Census Bureau's state.txt lists the two-digit FIPS state code, USPS abbreviation, name and GNIS (ANSI)
  identifier for the states, the District of Columbia and the outlying areas. Rows are keyed by the USPS abbreviation.
  The Census Bureau publishes the file without a licence statement, so the licence is recorded as unstated and the
  entry held at license-review. The file carries no application or publication date; valid_from is the day it was
  fetched.
