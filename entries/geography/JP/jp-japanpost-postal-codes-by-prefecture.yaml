assumed:
- parameter: valid_from
  value: '2026-10-31'
  method: assumed
  rationale: The file carries no application or publication date; valid_from is the day it was fetched.
- parameter: rows[*]
  value: row, distinct postal code and distinct municipality counts per prefecture
  method: derived
  rationale: The file lists individual town rows; the per-prefecture figures are counts over rows sharing the first
    two JIS digits.
