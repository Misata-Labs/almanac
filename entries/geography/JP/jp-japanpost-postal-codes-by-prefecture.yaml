  tolerance: 0
- statistic: value["01","rows"]
  expected: 8190
  tolerance: 0
notes: 'Japan Post''s utf_ken_all.csv lists 124527 rows of town-level postal codes, one per town area, with the
  all-Japan local government (JIS X0401/X0402) code, the seven-digit postal code and the prefecture, municipality
  and town names in half-width katakana and in kanji. This entry groups the rows by the first two digits of the
  JIS code (the prefecture): the prefecture''s kanji and katakana names, the number of rows, of distinct postal
  codes and of distinct municipality codes. The companion entry keeps the full rows for two central Tokyo wards.
  Japan Post''s readme states that it claims no copyright over the postal code data and that it may be distributed
  freely; that is not an SPDX licence, so the licence is recorded as unstated and the entry held at license-review.
  The file carries no application or publication date; valid_from is the day it was fetched.'
