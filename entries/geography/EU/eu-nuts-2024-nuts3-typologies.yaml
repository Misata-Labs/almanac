notes: 'The NUTS-3 Typologies sheet of Eurostat''s NUTS 2024 workbook tags every level-3 region with the territorial
  typologies Eurostat maintains: urban-rural typology, remoteness, coastal and metropolitan status (with the metropolitan
  region id), border, island and mountainous flags. Values are the sheet''s own strings; empty cells become null.
  The label, country, metropolitan name and capital-region columns are left out to keep the entry compact; the label
  and country sit in the NUTS 2024 code entry under the same key. urban_rural_counts counts the regions in each
  urban-rural class, the natural weights for drawing a region type. Snippets are matched against the workbook''s
  sharedStrings member. valid_from is the first day of the 2024 vintage. Eurostat''s copyright notice releases its
  data under the Creative Commons Attribution 4.0 International licence.'
