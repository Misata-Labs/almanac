assumed:
- parameter: valid_from
  value: '2025-01-01'
  method: assumed
  rationale: The file carries no application date of its own; valid_from is the first day of the vintage its name
    announces. The vintage is COG 2025.
- parameter: rows[*]
  value: row counts of v_commune_2025.csv grouped by département and TYPECOM
  method: derived
  rationale: The file lists individual communes; the per-département figures are counts of its rows, with COMD,
    COMA and ARM rows attributed to their parent's département.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 101
  tolerance: 0
- statistic: value["01","COM"]
  expected: 391
  tolerance: 0
- statistic: value["75","ARM"]
  expected: 20
  tolerance: 0
notes: 'Counts of rows in the COG 2025 commune file per département and TYPECOM: COM communes, COMD delegated communes,
  COMA associated communes and ARM municipal arrondissements (Paris, Lyon and Marseille). Rows without a département
  of their own (COMD, COMA and ARM) are counted under the département of their parent commune. The COM count is
  the weight of each département when drawing a commune at random. The Code officiel géographique describes the
  geography in force on 1 January of its year, which sets valid_from. INSEE''s conditions-of-use page states that
  its data are released under the Licence Ouverte / Open Licence 2.0 (Etalab); that identifier is not on the verifier''s
  permissive list, so the entry is held at license-review.'
