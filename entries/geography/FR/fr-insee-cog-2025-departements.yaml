notes: The départements of the Code officiel géographique 2025, keyed by the DEP code (two digits, 2A and 2B for
  Corsica, three digits overseas), with the region code, the name as INSEE writes it, the chef-lieu commune code
  and the TNCC article code. The Code officiel géographique describes the geography in force on 1 January of its
  year, which sets valid_from. INSEE's conditions-of-use page states that its data are released under the Licence
  Ouverte / Open Licence 2.0 (Etalab); that identifier is not on the verifier's permissive list, so the entry is
  held at license-review.
