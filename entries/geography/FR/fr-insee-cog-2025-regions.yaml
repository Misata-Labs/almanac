notes: The 18 régions of the Code officiel géographique 2025 (13 metropolitan and 5 overseas), keyed by the two-character
  REG code, with the name as INSEE writes it (LIBELLE), the commune code of the chef-lieu and INSEE's TNCC article
  code, which says which article and apostrophe the name takes. The Code officiel géographique describes the geography
  in force on 1 January of its year, which sets valid_from. INSEE's conditions-of-use page states that its data
  are released under the Licence Ouverte / Open Licence 2.0 (Etalab); that identifier is not on the verifier's permissive
  list, so the entry is held at license-review.
