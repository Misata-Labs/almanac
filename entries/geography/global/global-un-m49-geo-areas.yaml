  every code and name, GeoArea/Tree nests them under several roots. Rows are taken from the ''World (total) by continental
  regions'' root, with the ancestor Region names recorded as region, sub_region and intermediate_region, and the
  LDC, LLDC and SIDS roots set the three flags. The API returns codes without leading zeros; keys are zero-padded
  to the three-digit M49 form and the raw integer is kept in m49. The publisher states no licence on the file, so
  the licence is recorded as unstated and the entry held at license-review. The file carries no application or publication
  date; valid_from is the day it was fetched.'
