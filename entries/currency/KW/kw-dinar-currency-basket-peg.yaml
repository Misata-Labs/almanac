notes: 'Unlike the other Gulf currencies, the Kuwaiti dinar has no fixed US dollar rate: since 20 May 2007, under
  Decree No. 147/2007, it has been pegged to an undisclosed weighted basket of the currencies of Kuwait''s major
  trade and financial partners, as the Central Bank of Kuwait restates in its November 2022 review. A generator
  converting KWD must use published market rates; the basket weights are not disclosed.'
