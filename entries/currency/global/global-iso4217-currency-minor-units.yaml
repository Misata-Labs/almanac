notes: The current ISO 4217 list (List One, published 2026-09-17) as the ISO 4217 Maintenance Agency distributes
  it in XML. The list has one row per country or territory; rows are collapsed to one record per alphabetic code,
  keeping the name, the three-digit numeric code and the number of minor units. The XML carries no licence statement
  and the maintenance agency's site terms were not confirmed, so the entry is held at license-review. valid_from
  is the list's own publication date; it stays valid until the next amendment replaces the list, at which point
  the content hash changes and the verifier reports it.
