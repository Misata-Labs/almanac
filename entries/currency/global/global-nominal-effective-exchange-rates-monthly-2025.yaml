notes: Monthly averages of the BIS nominal effective exchange rate indices (broad basket of 64 economies, 2020 =
  100) for 2025, from the BIS Data Portal dataflow WS_EER, with the United States as the primary series and the
  euro area (XM), United Kingdom, Japan, Brazil, India, Switzerland, Canada and Australia as columns. A rise means
  the currency appreciated against its trading partners. The BIS general terms permit limited extracts with attribution
  but refer statistics to a separate 'About BIS statistics' notice that was not fetched, so the entry is held at
  license-review until those terms are confirmed.
