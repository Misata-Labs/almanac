notes: The Bahraini dinar is pegged to the US dollar at 0.376 dinars per dollar, a peg the Central Bank of Bahrain
  describes as effectively unchanged since 1980. The CBB buys and sells US dollars to retail banks at rates very
  close to the official rate.
