  implementation: almanac.rules.lookup_table
  parameters:
    rows:
      transfer_of_funds_over:
        value: 800
        currency: GBP
        before_2026_06_30_value: 1000
        before_2026_06_30_currency: EUR
        regulation: 27(1)(b)
        meaning: Occasional transaction that is a transfer of funds, strictly more than
      occasional_transaction:
        value: 12000
        currency: GBP
        before_2026_06_30_value: 15000
        before_2026_06_30_currency: EUR
        regulation: 27(2)
        meaning: Occasional transaction by any relevant person other than those with their own threshold, at least
      high_value_dealer_cash:
        value: 10000
        currency: GBP
        before_2026_06_30_value: 10000
        before_2026_06_30_currency: EUR
        regulation: 27(3)
        meaning: High value dealer cash transaction, at least
      casino:
        value: 2000
        currency: GBP
        before_2026_06_30_value: 2000
        before_2026_06_30_currency: EUR
        regulation: 27(5)
        meaning: Casino stake or collection of winnings, at least
      letting_agent_monthly_rent:
        value: 10000
        currency: GBP
        before_2026_06_30_value: 10000
        before_2026_06_30_currency: EUR
        regulation: 27(7A)
        meaning: 'Letting agent: monthly rent, at least'
      art_market_transaction:
        value: 10000
        currency: GBP
        before_2026_06_30_value: 10000
        before_2026_06_30_currency: EUR
        regulation: 27(7C)(a)
        meaning: Art market participant trade in a work of art, at least
      freeport_art_storage:
        value: 10000
        currency: GBP
        before_2026_06_30_value: 10000
        before_2026_06_30_currency: EUR
        regulation: 27(7C)(b)
        meaning: Freeport operator storing works of art, at least
      cryptoasset_transfer:
        value: 800
        currency: GBP
        before_2026_06_30_value: 1000
        before_2026_06_30_currency: EUR
        regulation: 27(7E)
        meaning: Cryptoasset transfer, at least
      record_retention_years:
        value: 5
        currency: null
        before_2026_06_30_value: null
        before_2026_06_30_currency: null
        regulation: 40(3)
        meaning: Years after the business relationship or occasional transaction ends
      record_retention_max_years:
        value: 10
        currency: null
        before_2026_06_30_value: null
        before_2026_06_30_currency: null
        regulation: 40(4)
        meaning: Longest period records of the business relationship need be kept
  vectors:
  - input:
      key: occasional_transaction
      column: value
    expected: 12000
    origin: source
  - input:
      key: high_value_dealer_cash
      column: value
    expected: 10000
    origin: source
  - input:
      key: casino
      column: value
    expected: 2000
