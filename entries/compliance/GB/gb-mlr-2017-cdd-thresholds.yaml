notes: 'The transaction sizes at which a business regulated by the UK Money Laundering Regulations 2017 must apply
  customer due diligence to an occasional transaction (regulation 27), and how long it must keep due diligence and
  transaction records (regulation 40). The Money Laundering and Terrorist Financing (Amendment) Regulations 2026
  replaced the euro amounts with sterling amounts from 30 June 2026; each row gives the sterling value now in force
  and the euro value it replaced, read from legislation.gov.uk''s point-in-time versions of regulation 27 as of
  2026-10-29 and 2026-06-29. Linked transactions count together. Regulation 27(7D) applies due diligence to every
  transaction at a cryptoasset exchange machine regardless of amount. valid_from is the start of regulation 27''s
  current version. The legislation.gov.uk resource carries no licence statement, although the site publishes legislation
  under the Open Government Licence v3.0, so the licence is recorded as unstated and the entry held at license-review.
  Provisions are cited in legislation.gov.uk''s HTML rendering, which makes the entry tier B: the XML rendering
  of these versions lists unapplied effects whose attributes are reordered on every render, so its bytes do not
  stay fixed.'
