notes: 'Conditions under which an issuer of electronic money need not apply customer due diligence under regulation
  38 of the UK Money Laundering Regulations 2017: the instrument holds no more than the stored-value limit, is not
  reloadable or has the monthly limit and works only in the UK, is used only to buy goods or services and cannot
  be funded with anonymous e-money; the exemption does not cover cash redemptions or remote redemptions above the
  stated amounts. Sterling amounts replaced euro amounts from 30 June 2026; each row records both, read from legislation.gov.uk''s
  point-in-time versions as of 2026-10-29 and 2026-06-29. The legislation.gov.uk resource carries no licence statement,
  although the site publishes legislation under the Open Government Licence v3.0, so the licence is recorded as
  unstated and the entry held at license-review. Provisions are cited in legislation.gov.uk''s HTML rendering, which
  makes the entry tier B: the XML rendering of these versions lists unapplied effects whose attributes are reordered
  on every render, so its bytes do not stay fixed.'
