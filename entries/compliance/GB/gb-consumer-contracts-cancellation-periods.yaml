notes: 'The consumer''s right to cancel a distance or off-premises contract in Great Britain and Northern Ireland:
  the cancellation period ends the stated number of days after the contract for services and digital content, or
  after the goods arrive for sales contracts (the last item for split deliveries, the first for regular deliveries),
  and is extended by up to twelve months when the trader fails to give the cancellation information. The trader
  must refund within the stated days of being told, or, for goods it has not offered to collect, of getting them
  back or evidence of their return. Read from legislation.gov.uk''s versions as of 2026-10-29; valid_from is the
  latest start of the three regulations'' current versions. The legislation.gov.uk resource carries no licence statement,
  although the site publishes legislation under the Open Government Licence v3.0, so the licence is recorded as
  unstated and the entry held at license-review. Provisions are cited in legislation.gov.uk''s HTML rendering, which
  makes the entry tier B: the XML rendering of these versions lists unapplied effects whose attributes are reordered
  on every render, so its bytes do not stay fixed.'
