  parameters:
    rows:
      service_or_digital_cancellation_days:
        value: 14
        unit: days after the contract is entered into
        regulation: 30(2)
      goods_cancellation_days:
        value: 14
        unit: days after the goods come into the consumer's physical possession
        regulation: 30(3)
      extended_cancellation_months:
        value: 12
        unit: months after the normal period would have ended, when cancellation information was not given
        regulation: 31(3)
      refund_days:
        value: 14
        unit: days after the trader is told of the cancellation
        regulation: 34(6)
      refund_days_goods_not_collected:
        value: 14
        unit: days after the trader receives the goods back or evidence of return, if earlier
        regulation: 34(5)
