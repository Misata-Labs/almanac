assumed:
- parameter: sets (country codes)
  value: Côte d’Ivoire = Cote d'Ivoire; Democratic Republic of the Congo = Congo, Dem. Rep.; Democratic People’s
    Republic of Korea = Korea, Dem. People's Rep.; Iran = Iran, Islamic Rep.; Syria = Syrian Arab Republic; Venezuela
    = Venezuela, RB; Vietnam = Viet Nam; Yemen = Yemen, Rep.
  method: derived
  rationale: HM Treasury names the jurisdictions; each name is matched to its ISO 3166-1 alpha-2 code through the
    World Bank country list, with these spelling differences mapped by hand. The labels keep HM Treasury's names.
