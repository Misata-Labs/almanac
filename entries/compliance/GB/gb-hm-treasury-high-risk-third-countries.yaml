notes: The jurisdictions the Financial Action Task Force lists as High-Risk Jurisdictions subject to a Call for
  Action and as Jurisdictions under Increased Monitoring, as HM Treasury's advisory notice of June 2026 reproduces
  them after the FATF update of 19 June 2026, keyed by ISO 3166-1 alpha-2 code, with the subset HM Treasury notes
  is also under UK financial sanctions. Under the UK Money Laundering Regulations 2017 a high-risk third country
  is one on either FATF list; from 30 June 2026 the mandatory enhanced due diligence of regulation 33(1)(b) applies
  only to the call-for-action list, while increased monitoring remains a geographic risk factor. FATF updates the
  lists after each plenary (February, June and October); this entry is the June 2026 notice, the latest HM Treasury
  had published on GOV.UK when it was built, and should be replaced when a later notice appears. The FATF's own
  pages could not be fetched (they sit behind a browser challenge).
