notes: 'The numeric limits the FCC''s Telephone Consumer Protection Act rules set for telephone solicitation and
  telemarketing, read from 47 CFR 64.1200 as of 2026-10-29: no telephone solicitation to a residential subscriber
  before the window opens or after it closes (local time at the called party''s location), the business days within
  which a company-specific do-not-call request and a revocation of consent must be honoured, how fresh a copy of
  the national do-not-call registry must be, the maximum abandoned-call rate per calling campaign and the period
  over which it is measured, how long an unanswered call must ring, how quickly a live agent or message must follow
  the called person''s greeting, the call limit for exempt non-commercial calls to a residential line, and the fax
  opt-out deadline. Each limit has conditions and exemptions in the section it cites. valid_from is the latest version
  date the eCFR versions endpoint lists for the sections cited; the eCFR history starts in late 2016, so a date
  at that start marks the beginning of the record rather than of the rule. US federal government works carry no
  copyright, but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded as
  unstated and the entry held at license-review.'
