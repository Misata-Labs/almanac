notes: 'Time limits the FTC Mail, Internet, or Telephone Order Merchandise Rule sets for remote sales, read from
  16 CFR 435 as of 2026-10-29: a seller that states no shipping time must ship within the default number of days,
  or the longer period when the buyer applies to the seller for credit; a delay beyond that requires offering the
  buyer the option to cancel, with consent deemed given only for a short revised delay; refunds are due within the
  stated working days, or one billing cycle when the refund is a credit to a credit account. Useful for order, shipment
  and refund timestamps that stay within the rule. valid_from is the latest version date the eCFR versions endpoint
  lists for the sections cited; the eCFR history starts in late 2016, so a date at that start marks the beginning
  of the record rather than of the rule. US federal government works carry no copyright, but neither the eCFR API
  nor the regulation text states reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
