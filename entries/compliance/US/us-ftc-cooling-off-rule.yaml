notes: The FTC Cooling-Off Rule gives a buyer the right to cancel a door-to-door sale, which includes sales at the
  buyer's home and at temporary locations such as hotel rooms, convention centres and fairgrounds, until midnight
  of the third business day after the transaction, when the price reaches the threshold for where the sale was made.
  The seller must then refund and return trade-ins within the stated business days and may not assign the buyer's
  note before the stated business day. Read from 16 CFR 429 as of 2026-10-29. Exclusions (emergency repairs the
  buyer waives in writing, sales after negotiation at the seller's permanent premises, and others) are in 429.0(a).
  valid_from is the latest version date the eCFR versions endpoint lists for the sections cited; the eCFR history
  starts in late 2016, so a date at that start marks the beginning of the record rather than of the rule. US federal
  government works carry no copyright, but neither the eCFR API nor the regulation text states reuse terms, so the
  licence is recorded as unstated and the entry held at license-review.
