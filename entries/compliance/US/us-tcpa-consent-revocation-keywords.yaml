notes: The words that, sent in reply to an incoming text message, revoke prior express consent to robocalls and
  robotexts per se under the FCC's TCPA rules, read from 47 CFR 64.1200(a)(10) as of 2026-10-29. Other replies must
  still be treated as revocation when a reasonable person would understand them that way, and any reasonable method
  of revoking counts; the list is the set a caller can never refuse. Revocations must be honoured within the business
  days recorded in the parameters. Matching should ignore case and surrounding whitespace. valid_from is the latest
  version of 64.1200 in the eCFR versions endpoint, not the date the paragraph was added. US federal government
  works carry no copyright, but neither the eCFR API nor the regulation text states reuse terms, so the licence
  is recorded as unstated and the entry held at license-review.
