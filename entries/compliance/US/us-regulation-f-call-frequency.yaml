assumed:
- parameter: vector dates
  value: '2026'
  method: derived
  rationale: The official interpretation's examples give weekdays and days of the month but no year; 2026 is a year
    in which every weekday named (Wednesday, April 1; Thursday, August 13; Friday, August 14) matches. Where an
    example says only that six calls were placed between April 2 and April 7, one call a day is assumed.
