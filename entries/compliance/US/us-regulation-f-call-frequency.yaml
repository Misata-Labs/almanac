- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: max_calls_in_window
  expected: 7
  tolerance: 0
- statistic: post_conversation_days
  expected: 7
  tolerance: 0
notes: 'Regulation F presumes a debt collector complies with the ban on repeated or continuous calls when, for one
  person and one debt, it places no more than the stated number of calls within any run of consecutive days, and
  no call within the run of days starting on the day of a telephone conversation; exceeding either presumes a violation.
  The rule answers whether one more call on a given day stays inside the presumption, given the dates of earlier
  counted calls and conversations; leave out calls the regulation excludes (made with the person''s direct prior
  consent, not connected, or to the persons listed in 1006.6(d)). It also says whether a local time is presumed
  inconvenient. The parameters record the validation period: it ends the stated number of days after the consumer
  receives the validation information, which may be assumed to happen a set number of business days after it is
  provided. Most vectors are the CFPB''s own examples from Supplement I to part 1006. valid_from is the latest version
  date the eCFR versions endpoint lists for the sections cited; the eCFR history starts in late 2016, so a date
  at that start marks the beginning of the record rather than of the rule. US federal government works carry no
  copyright, but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded as
  unstated and the entry held at license-review.'
