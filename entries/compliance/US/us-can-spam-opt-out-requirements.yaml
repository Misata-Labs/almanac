notes: 'The CAN-SPAM Act''s deadlines for commercial email: a sender may not send further commercial email to a
  recipient more than the stated business days after receiving an opt-out request, and the opt-out mechanism in
  each message must keep working for at least the stated number of days after it is sent. The FTC''s rule adds the
  exact label that must open the subject line of a message containing sexually explicit material (with its trailing
  space). The statute is read from govinfo''s HTML of the 2023 US Code, which makes the entry tier B; valid_from
  is the section''s effective date as the Code''s note records it. The FTC rule text is as of 2026-10-29, and its
  latest eCFR version is 2016-12-22. US federal statutes carry no copyright, but the govinfo page states no reuse
  terms, so the licence is recorded as unstated and the entry held at license-review.'
