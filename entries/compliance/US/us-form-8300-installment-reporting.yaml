  expected: 15
  tolerance: 0
notes: 'Executable form of the multiple-payment rule for Form 8300 (26 U.S.C. 6050I): a business receiving cash
  for one transaction, or related transactions, reports within the stated number of days once the cash exceeds the
  threshold, and again each time later unreported payments received within a twelve-month window exceed it. Replaying
  the payment history returns each report with the day it was triggered, its due date and the amount it covers.
  The first vector is the regulation''s own worked example: an initial payment above the threshold, then three smaller
  payments that cross it together. The option to combine several reports falling due within one filing period is
  not modelled. ''Related transactions'' are those between the same payer and recipient within the stated number
  of hours, or a longer series the recipient knows to be connected; grouping payments into one transaction is left
  to the caller. valid_from is the latest version date the eCFR versions endpoint lists for the sections cited;
  the eCFR history starts in late 2016, so a date at that start marks the beginning of the record rather than of
  the rule. US federal government works carry no copyright, but neither the eCFR API nor the regulation text states
  reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
