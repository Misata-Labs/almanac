assumed:
- parameter: window boundary
  value: a payment on the first anniversary of the earliest unreported payment falls outside the window
  method: derived
  rationale: The regulation says 'within one year of the initial payment' and 'within a 12-month period' without
    fixing the boundary day; the rule treats the anniversary itself as outside, and the two derived vectors exercise
    that choice.
