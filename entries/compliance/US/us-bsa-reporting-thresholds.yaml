notes: The dollar thresholds, filing deadlines and retention periods that transaction-monitoring and AML systems
  enforce under the Bank Secrecy Act rules in 31 CFR chapter X, and the parallel IRS rule for cash received in a
  trade or business (26 CFR 1.6050I-1, Form 8300), read from the eCFR text as of 2026-10-29. Each row names its
  section; the unit says whether the threshold is 'more than' or 'at least', which matters at the boundary (a CTR
  is due for $10,000.01 but not for exactly $10,000; the travel rule applies from exactly $3,000). Suspicious activity
  report thresholds differ by institution type and sit in their own entry, us-bsa-sar-thresholds-by-institution;
  the instalment rule for Form 8300 is executable in us-form-8300-installment-reporting. The FBAR row is the account-balance
  threshold only; the filing date in the regulation text is not reproduced because the statutory due date has since
  moved. valid_from is the latest version date the eCFR versions endpoint lists for the sections cited; the eCFR
  history starts in late 2016, so a date at that start marks the beginning of the record rather than of the rule.
  US federal government works carry no copyright, but neither the eCFR API nor the regulation text states reuse
  terms, so the licence is recorded as unstated and the entry held at license-review.
