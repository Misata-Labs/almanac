id: us-bsa-reporting-thresholds
title: 'United States Bank Secrecy Act reporting and recordkeeping thresholds: CTR, CMIR, FBAR, travel rule, beneficial
  ownership and Form 8300'
kind: rule
domain: compliance
region: US
status: license-review
tier: A
valid_from: '2026-01-02'
valid_to: null
tags:
- compliance
- aml
- bank-secrecy-act
- currency-transaction-report
- travel-rule
- beneficial-ownership
- form-8300
- 31-cfr-1010
use_cases:
- aml-demo
- fraud-detection-demo
- kyc-onboarding
- banking-demo
- data-quality-validation
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    currency: USD
    rows:
      ctr_currency_transaction_over_usd:
        value: 10000
        unit: USD, strictly more than
        section: 31 CFR 1010.311
        meaning: Currency Transaction Report for a deposit, withdrawal, exchange or other payment or transfer in
          currency
      ctr_aggregation_per_business_day_over_usd:
        value: 10000
        unit: USD cash in or cash out per business day
        section: 31 CFR 1010.313(b)
        meaning: Multiple currency transactions by or for one person treated as one when known to the institution
      ctr_filing_days:
        value: 15
        unit: days after the transaction
        section: 31 CFR 1010.306(a)(1)
        meaning: Deadline to file a Currency Transaction Report
      casino_ctr_currency_transaction_over_usd:
        value: 10000
        unit: USD, strictly more than
        section: 31 CFR 1021.311
        meaning: Casino Currency Transaction Report, cash in or cash out
      casino_aggregation_per_gaming_day_over_usd:
        value: 10000
        unit: USD cash in or cash out per gaming day
        section: 31 CFR 1021.313
        meaning: Casino aggregation of multiple currency transactions
      cmir_transport_over_usd:
        value: 10000
        unit: USD at one time, strictly more than
        section: 31 CFR 1010.340(a)
        meaning: Report of international transportation of currency or monetary instruments (CMIR)
      cmir_receipt_filing_days:
        value: 15
        unit: days after receipt
        section: 31 CFR 1010.306(b)(2)
        meaning: Deadline for the recipient of unreported currency shipped from abroad
      fbar_aggregate_accounts_over_usd:
        value: 10000
        unit: USD, strictly more than
        section: 31 CFR 1010.306(c)
        meaning: Report of foreign financial accounts (FBAR)
      credit_extension_record_over_usd:
        value: 10000
        unit: USD, strictly more than
        section: 31 CFR 1010.410(a)
        meaning: Record of an extension of credit not secured by real property
      cross_border_transfer_record_over_usd:
        value: 10000
        unit: USD, strictly more than
        section: 31 CFR 1010.410(b)
        meaning: Record of an instruction to transfer value to or from a place outside the United States
      bank_funds_transfer_record_min_usd:
        value: 3000
        unit: USD, at least
        section: 31 CFR 1020.410(a)
        meaning: Bank recordkeeping for a funds transfer
      nonbank_funds_transmittal_record_min_usd:
        value: 3000
        unit: USD, at least
        section: 31 CFR 1010.410(e)
        meaning: Recordkeeping for a transmittal of funds by a financial institution other than a bank
      travel_rule_min_usd:
        value: 3000
        unit: USD, at least
        section: 31 CFR 1010.410(f)
        meaning: Information that must travel with a transmittal order (travel rule)
      monetary_instrument_cash_purchase_min_usd:
        value: 3000
        unit: USD in currency, inclusive
        section: 31 CFR 1010.415(a)
        meaning: Record of a cash purchase of a bank check, cashier's check, money order or traveler's check, lower
          bound
      monetary_instrument_cash_purchase_max_usd:
        value: 10000
        unit: USD in currency, inclusive
        section: 31 CFR 1010.415(a)
        meaning: Upper bound of the monetary instrument recordkeeping band
      msb_money_order_daily_activity_over_usd:
        value: 1000
        unit: USD per person per day, strictly more than
        section: 31 CFR 1010.100(ff)(3)(i)
        meaning: Daily amount above which an issuer or seller of traveler's checks or money orders is a money services
          business
      record_retention_years:
        value: 5
        unit: years
        section: 31 CFR 1010.430(d)
        meaning: Retention of every record the Bank Secrecy Act rules require
      beneficial_owner_equity_percent:
        value: 25
        unit: percent of equity interests, at least
        section: 31 CFR 1010.230(d)(1)
        meaning: Ownership prong of the beneficial owner definition for legal entity customers
      msb_initial_registration_days:
        value: 180
        unit: days after the business is established
        section: 31 CFR 1022.380(b)(3)
        meaning: Deadline for a money services business to register with FinCEN
      msb_registration_period_years:
        value: 2
        unit: calendar years
        section: 31 CFR 1022.380(b)(2)
        meaning: Length of each registration and renewal period
      msb_reregistration_transfer_over_percent:
        value: 10
        unit: percent of voting power or equity, strictly more than
        section: 31 CFR 1022.380(b)(4)
        meaning: Transfer of control that requires re-registration
      form_8300_cash_over_usd:
        value: 10000
        unit: USD in one or related transactions, strictly more than
        section: 26 CFR 1.6050I-1(a)(1)
        meaning: Return of cash received in a trade or business (Form 8300)
      form_8300_filing_days:
        value: 15
        unit: days after receipt
        section: 26 CFR 1.6050I-1(b)(1)
        meaning: Deadline to file Form 8300
      form_8300_statement_due:
        value: January 31
        unit: day of the following year
        section: 26 CFR 1.6050I-1(f)(3)
        meaning: Annual statement to each person named in a Form 8300
      form_8300_retention_years:
        value: 5
        unit: years from filing
        section: 26 CFR 1.6050I-1(e)(3)(iii)
        meaning: Retention of a copy of each Form 8300
  vectors:
  - input:
      key: ctr_currency_transaction_over_usd
      column: value
    expected: 10000
    origin: source
  - input:
      key: travel_rule_min_usd
      column: value
    expected: 3000
    origin: source
  - input:
      key: beneficial_owner_equity_percent
      column: value
    expected: 25
    origin: source
  - input:
      key: form_8300_cash_over_usd
      column: value
    expected: 10000
    origin: source
  - input:
      key: msb_initial_registration_days
      column: value
    expected: 180
    origin: source
  - input: ctr_currency_transaction_over_usd
    expected: true
    origin: source
  - input: ctr_currency_transaction_at_least_usd
    expected: false
    origin: derived
