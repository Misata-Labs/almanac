spec:
  implementation: almanac.rules.lookup_table
  parameters:
    currency: USD
    rows:
      bank:
        threshold_usd: 5000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: 60
        retention_years: 5
        section: 31 CFR 1020.320
      casino_or_card_club:
        threshold_usd: 5000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: 60
        retention_years: 5
        section: 31 CFR 1021.320
      money_services_business:
        threshold_usd: 2000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: null
        retention_years: 5
        section: 31 CFR 1022.320
      broker_dealer:
        threshold_usd: 5000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: 60
        retention_years: 5
        section: 31 CFR 1023.320
      mutual_fund:
        threshold_usd: 5000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: 60
        retention_years: 5
        section: 31 CFR 1024.320
      insurance_company:
        threshold_usd: 5000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: 60
        retention_years: 5
        section: 31 CFR 1025.320
      futures_commission_merchant_or_introducing_broker:
        threshold_usd: 5000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: 60
        retention_years: 5
        section: 31 CFR 1026.320
      loan_or_finance_company:
        threshold_usd: 5000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: 60
        retention_years: 5
        section: 31 CFR 1029.320
      housing_gse:
        threshold_usd: 5000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: 60
        retention_years: 5
        section: 31 CFR 1030.320
      money_order_or_travelers_check_issuer_clearance_review:
        threshold_usd: 5000
        filing_deadline_days: 30
        max_deadline_without_suspect_days: null
        retention_years: 5
        section: 31 CFR 1022.320(a)(3)
  vectors:
  - input:
      key: bank
      column: threshold_usd
    expected: 5000
    origin: source
  - input:
      key: money_services_business
      column: threshold_usd
    expected: 2000
    origin: source
  - input:
      key: bank
      column: max_deadline_without_suspect_days
    expected: 60
    origin: source
  - input:
      key: money_services_business
      column: max_deadline_without_suspect_days
    expected: null
    origin: source
    note: 1022.320 has no extension for an unidentified suspect
  - input:
      key: insurance_company
      column: filing_deadline_days
    expected: 30
    origin: source
  - input: credit_union
    expected: false
    origin: derived
    note: credit unions file under the bank rule in part 1020
