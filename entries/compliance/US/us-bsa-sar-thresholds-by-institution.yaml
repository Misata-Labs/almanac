notes: The amount at which a known or suspected suspicious transaction, or pattern of transactions, must be reported
  on a SAR, the number of calendar days after initial detection within which it must be filed, the longest delay
  allowed when no suspect has been identified, and how long the SAR and its supporting documents must be kept, for
  each institution type with a SAR rule in 31 CFR chapter X, read from the eCFR text as of 2026-10-29. Money services
  businesses have a lower threshold and no extension for an unidentified suspect; an issuer of money orders or traveler's
  checks reviewing clearance records reports only from the higher amount in its own row. Credit unions and other
  depository institutions file under the bank rule. Thresholds are 'at least' amounts and include aggregated transactions.
  valid_from is the latest version date the eCFR versions endpoint lists for the sections cited; the eCFR history
  starts in late 2016, so a date at that start marks the beginning of the record rather than of the rule. US federal
  government works carry no copyright, but neither the eCFR API nor the regulation text states reuse terms, so the
  licence is recorded as unstated and the entry held at license-review.
