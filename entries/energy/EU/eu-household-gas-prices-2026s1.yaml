notes: Natural gas prices for household consumers, all taxes and levies included, consumption band D2 (20 to 199
  GJ per year), in euro per kWh for the half-year 2026-S1, from Eurostat dataflow nrg_pc_202. Poland is omitted
  because Eurostat publishes its observation as confidential (CONF_STATUS C) with no value. valid_from and valid_to
  bound the half-year the prices describe. Rows are keyed by the Eurostat geo code and carry the English country
  name from the GEO codelist. Eurostat's copyright notice states that its data are released under the Creative Commons
  Attribution 4.0 International licence; the notice page renders dynamically and is referenced rather than hashed.
