notes: 'Electricity prices for non-household consumers, consumption band IC (500 to 1 999 MWh per year), in euro
  per kWh for the half-year 2026-S1, from Eurostat dataflow nrg_pc_205, both including all taxes and levies and
  excluding taxes and levies. valid_from and valid_to bound the half-year the prices describe. Rows are keyed by
  the Eurostat geo code and carry the English country name from the GEO codelist. Observation flags published with
  the data: DE eur_per_kwh_including_taxes provisional; DE eur_per_kwh_excluding_taxes provisional. Eurostat''s
