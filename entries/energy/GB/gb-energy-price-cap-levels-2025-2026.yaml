notes: The annual bill for a dual fuel household paying by Direct Debit at Ofgem's typical domestic consumption
  values, as Ofgem's summary of changes document for each quarterly cap period states it, in pounds per year; the
  cap itself limits unit rates and standing charges, and this figure is Ofgem's headline illustration of it. Each
  step is the first day of a cap period (January, April, July and October). Ofgem revised its typical domestic consumption
  values from 1 July 2026, so the levels from that date are on the 2026 values and are not comparable with earlier
  steps on the 2023 values; each step records which basis applies. Ofgem's copyright page states that its Crown
  copyright material may be used under the Open Government Licence.
