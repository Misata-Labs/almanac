notes: 'Electric power consumption (kWh per capita) for 2024 from the World Development Indicators API (indicator
  EG.USE.ELEC.KH.PC, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional
