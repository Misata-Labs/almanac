notes: 'Access to clean fuels and technologies for cooking (% of population) for 2024 from the World Development
  Indicators API (indicator EG.CFT.ACCS.ZS, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1
  alpha-3 code, with regional and income aggregates removed. 2024 is the most recent year whose coverage is close
  to the series'' best recent year. Source note from the World Bank: Access to clean fuels and technologies for
  cooking is the proportion of total population primarily using clean cooking fuels and technologies for cooking.
  Under WHO guidelines, kerosene is excluded from clean cooking fuels. The World Bank licenses its datasets under
  CC BY 4.0.'
