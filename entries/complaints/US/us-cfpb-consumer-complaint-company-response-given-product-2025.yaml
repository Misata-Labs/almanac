notes: 'Distribution of the company''s response to the consumer given the product a complaint is about, for complaints
  received in 2025: one search-API query per product (the product filter), reading the company_response aggregation.
  Each conditional total equals the product''s bucket count in the unfiltered query, which the builder checks. Product
  and category labels are the API''s own. Counts come from the Consumer Complaint Database search API with size=0,
  which returns only the aggregations over complaints received between the two dates. The database grows as companies
  respond and new complaints are published, so the content hash tracks the day''s index; the API''s _meta block
  states the data licence as CC0 and is cited as supporting evidence.'
