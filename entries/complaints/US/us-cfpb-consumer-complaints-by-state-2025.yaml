assumed:
- parameter: shares
  value: counts / total
  method: derived
  rationale: Shares are bucket counts divided by their sum; 8375 complaints without a state value are excluded.
tests:
- statistic: share["FL"]
  expected: 0.145593
  tolerance: 0.003
- statistic: share["PW"]
  expected: 1.0e-06
  tolerance: 0.002
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: Complaints received by the CFPB in calendar 2025 by the consumer's state, territory or military post code,
  from the state aggregation of the search API. The categories carry the API's own labels. 8375 of the 5442938 complaints
  have no value for this field and are left out of the shares. Categories are the two-letter codes the API returns,
  including territories, military post codes and one spelled-out outlying-islands value. Counts come from the Consumer
  Complaint Database search API with size=0, which returns only the aggregations over complaints received between
  the two dates. The database grows as companies respond and new complaints are published, so the content hash tracks
  the day's index; the API's _meta block states the data licence as CC0 and is cited as supporting evidence.
