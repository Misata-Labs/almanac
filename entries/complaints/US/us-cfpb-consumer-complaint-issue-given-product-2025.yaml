assumed:
- parameter: shares
  value: counts / total
  method: derived
  rationale: Shares are the product-filtered bucket counts divided by the product's complaint total.
- parameter: Other issues
  value: total - sum of top 10
  method: derived
  rationale: Values beyond the 10 most frequent are folded into one remainder category per product.
