notes: Number of complaints the CFPB received in each month of 2025, one search-API query per month with size=0
  and date_received_min/max set to the first and last day of the month. The twelve monthly counts sum exactly to
  the annual query's total of 5442938, which confirms both bounds are inclusive. The busiest month was 2025-10.
  Counts come from the Consumer Complaint Database search API with size=0, which returns only the aggregations over
  complaints received between the two dates. The database grows as companies respond and new complaints are published,
  so the content hash tracks the day's index; the API's _meta block states the data licence as CC0 and is cited
  as supporting evidence.
