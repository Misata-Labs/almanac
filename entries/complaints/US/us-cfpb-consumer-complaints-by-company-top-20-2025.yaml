assumed:
- parameter: shares
  value: counts / total
  method: derived
  rationale: Shares are the published counts divided by their sum over the listed categories.
- parameter: All other companies
  value: total - sum of top 20
  method: derived
  rationale: The remainder category is the total complaint count less the 20 listed buckets.
tests:
- statistic: share["EQUIFAX, INC."]
  expected: 0.308755
  tolerance: 0.003
- statistic: share["MOHELA"]
  expected: 0.001902
  tolerance: 0.002
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: 'Complaints received by the CFPB in calendar 2025 by the company the complaint was sent to: the 20 most frequent
  values of the API''s company aggregation, in the API''s descending order, with every other value folded into ''All
  other companies'' so the shares sum to one over all 5442938 complaints. The API returned 3968 distinct values
  in all. Counts come from the Consumer Complaint Database search API with size=0, which returns only the aggregations
  over complaints received between the two dates. The database grows as companies respond and new complaints are
  published, so the content hash tracks the day''s index; the API''s _meta block states the data licence as CC0
  and is cited as supporting evidence.'
