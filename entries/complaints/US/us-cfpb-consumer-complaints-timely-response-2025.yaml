- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: Complaints received by the CFPB in calendar 2025 by whether the company responded within the CFPB's 15-day
  window (the API's timely field), from the timely aggregation of the search API. The categories carry the API's
  own labels. 0 of the 5442938 complaints have no value for this field and are left out of the shares. Counts come
  from the Consumer Complaint Database search API with size=0, which returns only the aggregations over complaints
  received between the two dates. The database grows as companies respond and new complaints are published, so the
  content hash tracks the day's index; the API's _meta block states the data licence as CC0 and is cited as supporting
  evidence.
