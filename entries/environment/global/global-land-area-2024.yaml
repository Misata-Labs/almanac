notes: 'Land area (sq. km) for 2024 from the World Development Indicators API (indicator AG.LND.TOTL.K2, data last
  updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income aggregates
  removed. 2024 is the most recent year whose coverage is close to the series'' best recent year. Source note from
  the World Bank: Land area is a country''s total area, excluding area under inland water bodies, national claims
  to continental shelf, and exclusive economic zones. In most cases the definition of inland water bodies includes
  major rivers and lakes. The World Bank licenses its datasets under CC BY 4.0.'
