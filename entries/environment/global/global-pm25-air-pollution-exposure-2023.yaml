notes: 'PM2.5 air pollution, mean annual exposure (micrograms per cubic meter) for 2023 from the World Development
  Indicators API (indicator EN.ATM.PM25.MC.M3, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1
  alpha-3 code, with regional and income aggregates removed. 2023 is the most recent year whose coverage is close
  to the series'' best recent year. Source note from the World Bank: Population-weighted exposure to ambient PM2.5
  pollution is defined as the average level of exposure of a nation''s population to concentrations of suspended
  particles measuring less than 2.5 microns in aerodynamic diameter, which are capable of penetrating deep into
  the respiratory tract and causing severe health damage. Exposure is calculated by weighting mean annual concentrations
  of PM2.5 by pop The World Bank licenses its datasets under CC BY 4.0.'
