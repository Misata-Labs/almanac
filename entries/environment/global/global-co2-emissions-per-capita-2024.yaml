notes: 'Carbon dioxide (CO2) emissions excluding LULUCF per capita (t CO2e/capita) for 2024 from the World Development
  Indicators API (indicator EN.GHG.CO2.PC.CE.AR5, data last updated 2026-10-08), one row per economy keyed by ISO
  3166-1 alpha-3 code, with regional and income aggregates removed. 2024 is the most recent year whose coverage
  is close to the series'' best recent year. Source note from the World Bank: Total annual emissions of carbon dioxide
  (CO2), one of the six Kyoto greenhouse gases (GHG), from the agriculture, energy, waste, and industrial sectors,
  excluding LULUCF, standardized to carbon dioxide equivalent values divided by the economy''s population. This
  measure excludes GHG fluxes caused by Land Use, Land-Use Change and Forestry (LULUCF), as these fluxes have larger
  uncertainties. The World Bank licenses its datasets under CC BY 4.0.'
