tests:
  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: vector_count, expected: 13, tolerance: 0}
notes: |
  This is the acceptance rule a large government service estate applies to email addresses,
  not the full RFC 5322 grammar: no quoted local parts, no comments, no IP-literal domains,
  and the domain may not start or end with a dot or contain consecutive dots. The local part
  alphabet includes the typographic apostrophe (U+2019) as well as the ASCII one. Source is
  hmrc/emailaddress v4.1.0 (commit 5d467f93); vectors are the library's own examples, with the
  property-based cases represented by their fixed seeds. valid_from is the date of the pinned
  revision; valid_to is open.
tags: [email, contact-data, validation]
use_cases: [person-generation, crm-demo, kyc-onboarding]
