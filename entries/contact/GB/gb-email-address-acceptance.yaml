id: gb-email-address-acceptance
title: Email address acceptance pattern used by HM Revenue & Customs services
kind: rule
domain: contact
region: GB
status: verified
tier: A
valid_from: 2024-09-27
valid_to: null
spec:
  implementation: almanac.rules.gb_email_address
  parameters:
    address_pattern: '^([a-zA-Z0-9.!#$%&’''*+/=?^_`{|}~-]+)@([a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*)$'
    domain_pattern: '^([a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*)$'
  vectors:
    - {input: "test@domain.com", expected: true, origin: source}
    - {input: "abcdef@example.com", expected: true, origin: source}
    - {input: "sausages", expected: false, origin: source}
    - {input: "", expected: false, origin: source}
    - {input: "test@domain.comtest@domain.com", expected: false, origin: source, note: two addresses joined}
    - {input: "§test@domain.com", expected: false, origin: source, note: leading character outside the alphabet}
    - {input: "test@domain.com§", expected: false, origin: source, note: trailing character outside the alphabet}
    - {input: {part: domain, value: "domain.com"}, expected: true, origin: source}
    - {input: {part: domain, value: ""}, expected: false, origin: source}
    - {input: {part: domain, value: "e."}, expected: false, origin: source}
    - {input: {part: domain, value: ".uk"}, expected: false, origin: source}
    - {input: {part: domain, value: ".com"}, expected: false, origin: source}
    - {input: {part: domain, value: "*domain"}, expected: false, origin: source}
