notes: Number of hospitals and hospital beds in 2024 by administrative region and sector (government, private),
  from Tables 1 and 4 of GASTAT's Healthcare Establishments and Workforce Statistics 2024 workbook (Ministry of
  Health data). Use the counts to weight where synthetic hospital claims or admissions happen and how they split
  between public and private providers. Neither file carries a licence statement, so the entry stays at license-review;
  GASTAT's website use policy permits reuse, including commercial reuse, with GASTAT acknowledged as the source
  and changes indicated.
