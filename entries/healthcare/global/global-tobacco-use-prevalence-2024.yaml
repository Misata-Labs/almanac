  and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best recent
  year. Source note from the World Bank: The percentage of the population ages 15 years and over who currently use
  any tobacco product (smoked and/or smokeless tobacco) on a daily or non-daily basis. Tobacco products include
  cigarettes, pipes, cigars, cigarillos, waterpipes (hookah, shisha), bidis, kretek, heated tobacco products, and
