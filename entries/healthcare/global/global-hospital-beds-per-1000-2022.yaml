notes: 'Hospital beds (per 1,000 people) for 2022 from the World Development Indicators API (indicator SH.MED.BEDS.ZS,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. 2022 is the most recent year whose coverage is close to the series'' best recent year. Source
  note from the World Bank: Hospital beds include inpatient beds available in public, private, general, and specialized
  hospitals and rehabilitation centers. In most cases beds for both acute and chronic care are included. The World
  Bank licenses its datasets under CC BY 4.0.'
