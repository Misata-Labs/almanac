notes: 'Nurses and midwives (per 1,000 people) for 2022 from the World Development Indicators API (indicator SH.MED.NUMW.P3,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. 2022 is the most recent year whose coverage is close to the series'' best recent year. Source
  note from the World Bank: Nurses and midwives include professional nurses, professional midwives, auxiliary nurses,
  auxiliary midwives, enrolled nurses, enrolled midwives and other associated personnel, such as dental nurses and
  primary care nurses. The World Bank licenses its datasets under CC BY 4.0.'
