notes: 'Death rate, crude (per 1,000 people) for 2024 from the World Development Indicators API (indicator SP.DYN.CDRT.IN,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best recent year. Source
  note from the World Bank: Crude death rate indicates the number of deaths occurring during the year, per 1,000
  population estimated at midyear. Subtracting the crude death rate from the crude birth rate provides the rate
  of natural increase, which is equal to the rate of population change in the absence of migration. The World Bank
  licenses its datasets under CC BY 4.0.'
