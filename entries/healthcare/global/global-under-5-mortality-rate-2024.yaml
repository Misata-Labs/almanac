notes: 'Mortality rate, under-5 (per 1,000 live births) for 2024 from the World Development Indicators API (indicator
  SH.DYN.MORT, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional
  and income aggregates removed. 2024 is the most recent year whose coverage is close to the series'' best recent
  year. Source note from the World Bank: Under-five mortality rate is the probability per 1,000 that a newborn baby
  will die before reaching age five, if subject to age-specific mortality rates of the specified year. The World
  Bank licenses its datasets under CC BY 4.0.'
