notes: 'Current health expenditure (% of GDP) for 2023 from the World Development Indicators API (indicator SH.XPD.CHEX.GD.ZS,
  data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income
  aggregates removed. 2023 is the most recent year whose coverage is close to the series'' best recent year. Source
  note from the World Bank: Level of current health expenditure expressed as a percentage of GDP.  Estimates of
  current health expenditures include healthcare goods and services consumed during each year. This indicator does
  not include capital health expenditures such as buildings, machinery, IT and stocks of vaccines for emergency
  or outbreaks. The World Bank licenses its datasets under CC BY 4.0.'
