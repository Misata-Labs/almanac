assumed:
- parameter: rows[*].discharges_per_100000_inhabitants
  value: discharges * 100000 / average_population
  method: derived
  rationale: Eurostat's historical per-100 000 series stops at 2021; the rate is rebuilt from the published discharge
    count and the average population of the same year.
- parameter: rows[*].somatic_discharges_per_100000_inhabitants
  value: somatic_discharges * 100000 / average_population
  method: derived
  rationale: Same construction for somatic care, which is the comparable series for countries that exclude psychiatric
    care.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 10
  tolerance: 0
- statistic: max[average_length_of_stay_days]
  expected: 7.5
  tolerance: 0
notes: 'Hospital in-patient activity for 2023 from Eurostat dataflow hlth_co_inpagg: average length of stay in days,
  number of discharges and bed-days for all in-patient curative care and separately for somatic and psychiatric
  care, with the 2023 average population from dataflow demo_gind and the derived discharges per 100 000 inhabitants.
  The Netherlands reports somatic care only and France reports somatic care as its total, so their psychiatric cells
  (and the Dutch totals) are null. Rows are keyed by the Eurostat geo code and carry the English country name from
  the GEO codelist; a cell Eurostat does not publish is stored as null. Observation flags published with the data:
  break in time series (b): DE (average_population); PL (psychiatric_average_length_of_stay_days, psychiatric_bed_days,
  psychiatric_discharges, somatic_average_length_of_stay_days, somatic_bed_days, somatic_discharges, average_length_of_stay_days,
  bed_days, discharges). definition differs (see metadata) (d): BE (psychiatric_average_length_of_stay_days, psychiatric_bed_days,
  psychiatric_discharges); FR (somatic_average_length_of_stay_days, somatic_bed_days, somatic_discharges, average_length_of_stay_days,
  bed_days, discharges). provisional (p): ES (psychiatric_average_length_of_stay_days, psychiatric_bed_days, psychiatric_discharges,
  somatic_average_length_of_stay_days, somatic_bed_days, somatic_discharges, average_length_of_stay_days, bed_days,
  discharges); FR (average_population). Eurostat''s copyright notice states that its data are released under the
  Creative Commons Attribution 4.0 International licence; the notice page renders dynamically and is referenced
  rather than hashed.'
