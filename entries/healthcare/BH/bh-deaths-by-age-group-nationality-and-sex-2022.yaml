evidence:
- publisher: Ministry of Health, Kingdom of Bahrain (via the Bahrain open data portal)
  title: Bahrain open data portal, dataset 22-deaths-by-age-groups (CSV export, 2022)
  url: https://www.data.gov.bh/api/explore/v2.1/catalog/datasets/22-deaths-by-age-groups/exports/csv?delimiter=%2C&select=n%2Cyear%2Cnationality%2Csex%2Cage_group%2Cdeaths%2Cljnsy%2Cjns%2Cfy_t_lsn&where=year%3Ddate%272022%27&order_by=n
  accessed_at: '2026-11-09'
  locator: row nationality=Non-Bahraini, sex=Male, age_group=75 +
  value: '36'
  unit: count
  snippet: 1729.0,2022,Non-Bahraini,Male,75 +,36
  source_license: unstated
  content_sha256: d7fef7b63e9e781a3bccfe1e73758585d4bf25cd8d2293fa9a740939175607a3
  role: primary
assumed:
- parameter: distributions.*.parameters.shares
  value: count / sum of counts within each group
  method: derived
  rationale: The publisher gives counts; shares are each count over the group total. Age labels have doubled spaces
    collapsed ('1  -  4' becomes '1 - 4').
tests:
- statistic: share["Bahraini|Male","75 +"]
  expected: 0.33794466
  tolerance: 0.005
- statistic: sum_of_shares["Bahraini|Male"]
  expected: 1
  tolerance: 1.0e-06
- statistic: share["Bahraini|Female","75 +"]
  expected: 0.44655172
  tolerance: 0.005
- statistic: sum_of_shares["Bahraini|Female"]
  expected: 1
  tolerance: 1.0e-06
- statistic: share["Non-Bahraini|Male","40 - 44"]
  expected: 0.11627907
  tolerance: 0.005
- statistic: sum_of_shares["Non-Bahraini|Male"]
  expected: 1
  tolerance: 1.0e-06
- statistic: share["Non-Bahraini|Female","75 +"]
  expected: 0.24896266
  tolerance: 0.005
- statistic: sum_of_shares["Non-Bahraini|Female"]
  expected: 1
  tolerance: 1.0e-06
notes: Deaths registered in Bahrain in 2022 by age group of the deceased (under a week, under a month, under a year,
  then five-year bands to 75 +), for Bahraini and non-Bahraini men and women, from the Ministry of Health's vital
  statistics on the national open data portal, with Arabic age-group labels from the same export. The Bahrain open
  data portal publishes no licence for this dataset (its catalogue licence field is empty), so the entry stays at
  license-review until the Information & eGovernment Authority's reuse terms are confirmed.
