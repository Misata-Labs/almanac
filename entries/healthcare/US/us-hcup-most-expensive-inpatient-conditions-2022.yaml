notes: 'Table 1 of AHRQ''s HCUP Statistical Brief 316: the twenty CCSR principal diagnosis categories with the highest
  aggregate hospital costs across all payers in 2022, with each one''s aggregate cost in millions of dollars, share
  of national inpatient costs, number of stays in thousands and share of stays, from the National Inpatient Sample.
  Costs are hospital costs, not charges or payments. The table is the natural weight for the principal diagnosis
  of a synthetic inpatient stay. The brief is a PDF, so the entry is tier B; AHRQ states no licence on the file.'
