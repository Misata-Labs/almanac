assumed:
- parameter: rows[*].hospitals_with_err, mean_err, median_err, min_err, max_err, penalised_hospitals, penalised_share
  value: summaries over hospitals with a reported ERR
  method: derived
  rationale: Computed from the hospital rows of the supplemental file; the peer group median ERR columns are copied
    from the file, where every hospital in a peer group carries the same value.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 6
  tolerance: 0
- statistic: max[hospitals_with_err]
  expected: 2842
  tolerance: 0
notes: For each of the six Hospital Readmissions Reduction Program measures, how many hospitals had an excess readmission
  ratio (ERR) in the fiscal 2026 program, the mean, median and range of those ratios, the share of hospitals penalised
  on the measure, and the peer-group median ERR thresholds CMS used for the five dual-eligibility peer groups, from
  the final rule supplemental data file. ERR is predicted over expected readmissions, so 1.0 is average performance.
  data.cms.gov and cms.gov publish these files without a licence statement, so the entry is held at license-review.
