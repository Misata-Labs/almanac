notes: 'The CMS notice of the 2026 Medicare Part B premium (FR Doc. 2025-20251, 90 FR, November 19, 2025): the standard
  monthly premium, the annual deductible, the immunosuppressive-drug-only premium, and the income-related monthly
  adjustment amounts for full Part B coverage. Tiers 1 to 6 apply to beneficiaries filing individual returns (individual_return_magi)
  or joint returns (joint_return_magi); the married_filing_separately tiers apply to married beneficiaries who lived
  with their spouse at any time in the year and file separately. Each tier keeps the notice''s own wording of its
  MAGI range; Social Security uses MAGI from the tax return two years earlier. Source is the Federal Register issue
  XML on govinfo, which is machine-readable, so the entry is tier A. Works of the US federal government carry no
  copyright in the United States, but the cited documents state no reuse terms, so the licence is recorded as unstated
  and the entry held at license-review.'
