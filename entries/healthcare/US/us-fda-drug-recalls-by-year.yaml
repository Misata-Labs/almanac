notes: 'The number of drug product entries in FDA weekly enforcement reports per calendar year, summed from the
  openFDA drug enforcement endpoint''s per-date counts as of 2026-10-28. A synthetic pharmacovigilance or recall
  feed can use it to set annual volume. The query is pinned to enforcement reports dated in a closed window, but
  openFDA refreshes the endpoint weekly and every response carries the refresh date in meta.last_updated, so the
  content hash moves with each refresh and late-classified reports can still shift the counts: re-indexed weekly;
  rebuild before release. openFDA states that its data is public domain under a CC0 1.0 Universal dedication (supporting
  evidence).'
