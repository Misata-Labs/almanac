notes: Medicare enrolment in July 2026 by state or territory of residence, with the split between Original Medicare
  and Medicare Advantage and other plans, aged and disabled entitlement, sex, dual eligibility for Medicaid and
  Part D drug coverage, from the CMS Medicare Monthly Enrollment dataset read through the data.cms.gov API with
  the month and county-total filters in the URL. The national totals sit in parameters.national. Use the state totals
  to place synthetic beneficiaries and the splits to assign coverage type. data.cms.gov and cms.gov publish these
  files without a licence statement, so the entry is held at license-review.
