assumed:
- parameter: distribution.parameters.weights
  value: hospitals per distinct factor value
  method: derived
  rationale: The file lists one factor per hospital; the empirical distribution weights each distinct value by how
    many hospitals carry it, and penalised_share is the fraction of hospitals with a factor below 1.
tests:
- statistic: mean
  expected: 0.99656
  tolerance: 0.0002
- statistic: min
  expected: 0.97
  tolerance: 0
- statistic: max
  expected: 1.0
  tolerance: 0
notes: The payment adjustment factor applied to each hospital's base operating DRG payments in fiscal 2026 under
  the Hospital Readmissions Reduction Program, based on discharges from July 2021 to June 2024; 1.0 means no penalty
  and 0.97 the maximum three percent reduction. Drawing a factor from this distribution gives a synthetic hospital
  a realistic readmission penalty. data.cms.gov and cms.gov publish these files without a licence statement, so
  the entry is held at license-review.
