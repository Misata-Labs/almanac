notes: 'Table 1 of AHRQ''s HCUP Statistical Brief 311: aggregate costs in billions of dollars, share of costs, average
  cost per visit, visits in millions and share of visits for treat-and-release emergency department visits in 2021,
  by patient age group, sex, primary expected payer, community income quartile, residence location and discharge
  status, from the Nationwide Emergency Department Sample. Costs are hospital costs rather than charges. The payer
  and age rows weight and price synthetic ED encounters. The brief is a PDF, so the entry is tier B; AHRQ states
  no licence on the file.'
