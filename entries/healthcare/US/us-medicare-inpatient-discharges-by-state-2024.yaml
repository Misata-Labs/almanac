assumed:
- parameter: distribution.parameters.counts
  value: sum of Tot_Dschrgs over DRG rows per state
  method: derived
  rationale: The file lists discharges per state and DRG; the state totals are their sums and omit DRG rows CMS
    suppressed for fewer than eleven discharges.
- parameter: distribution.parameters.shares
  value: counts / total
  method: derived
  rationale: Shares are each category's count over the sum of all categories in the table.
