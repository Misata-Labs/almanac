notes: Work, practice expense (facility and non-facility), malpractice and total relative value units for the new
  and established patient office or outpatient visit codes 99202 to 99215 from the RVU26D release of the Medicare
  physician fee schedule relative value file, with the conversion factor from the same file and the national payment
  amounts derived from them. Descriptions are omitted because CPT descriptors are copyrighted by the American Medical
  Association; the codes themselves anchor the most common professional claim lines. data.cms.gov and cms.gov publish
  these files without a licence statement, so the entry is held at license-review.
