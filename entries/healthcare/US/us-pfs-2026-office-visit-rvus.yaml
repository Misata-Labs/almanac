assumed:
- parameter: rows[*].nonfacility_national_payment_usd and rows[*].facility_national_payment_usd
  value: total RVU x conversion factor, rounded to cents
  method: derived
  rationale: The file carries the RVUs and the conversion factor; the national payment amount is their product before
    the geographic practice cost index adjustment, which the fee schedule applies per locality.
