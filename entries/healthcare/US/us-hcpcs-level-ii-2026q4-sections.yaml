assumed:
- parameter: rows[*].codes and rows[*].active_codes
  value: counts of procedure records per leading letter
  method: derived
  rationale: Counted from the first-line procedure records (record identification code 3); a code is active when
    its termination date is blank.
- parameter: code_pattern
  value: ^[A-V][0-9]{4}$
  method: derived
  rationale: Shape observed across every procedure record in the file; the layout describes Level II codes as five-position
    alpha-numeric codes.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 17
  tolerance: 0
- statistic: max[codes]
  expected: 2011
  tolerance: 0
notes: The alphabetic sections of HCPCS Level II as released in the October 2026 quarterly update, with the number
  of codes in each section, how many have no termination date, and the first code and its long description, read
  from the fixed-width alpha-numeric file in the CMS archive. The file holds the CMS-maintained Level II codes (A
  to V) and not the AMA's CPT Level I codes or the ADA's dental codes. A synthetic claim generator can use the section
  counts to spread supply, drug and service codes realistically. data.cms.gov and cms.gov publish these files without
  a licence statement, so the entry is held at license-review.
