notes: 'How FDA drug recalls in the enforcement reports dated 2012-01-01 to 2025-12-31 split between Class I (reasonable
  probability of serious harm), Class II and Class III, counted by the openFDA drug enforcement endpoint as of 2026-10-28;
  the earliest report date in the window is 2012-06-20. Each count is one product on one recall event. The split
  gives synthetic recall records a realistic severity mix. The query is pinned to enforcement reports dated in a
  closed window, but openFDA refreshes the endpoint weekly and every response carries the refresh date in meta.last_updated,
  so the content hash moves with each refresh and late-classified reports can still shift the counts: re-indexed
  weekly; rebuild before release. openFDA states that its data is public domain under a CC0 1.0 Universal dedication
  (supporting evidence).'
