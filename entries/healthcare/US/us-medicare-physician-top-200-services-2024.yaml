notes: The two hundred HCPCS code and place-of-service pairs with the most Medicare fee-for-service physician and
  supplier services in calendar 2024, with rendering providers, beneficiaries, services, and the average submitted
  charge, allowed amount and Medicare payment per service, from the national rows of the CMS Medicare Physician
  & Other Practitioners by Geography and Service dataset read through the data.cms.gov API. Service counts weight
  the procedure code on a synthetic professional claim; the averages anchor its charge and payment. Descriptions
  of CPT codes (numeric codes) are omitted for copyright reasons. data.cms.gov and cms.gov publish these files without
  a licence statement, so the entry is held at license-review.
