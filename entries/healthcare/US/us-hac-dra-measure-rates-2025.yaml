spec:
  implementation: almanac.rules.lookup_table
  parameters:
    measurement_period: 3Q2022 to 2Q2024
    rate_unit: as published in the Rate column
    hospital_rows: 12120
    rows:
      Foreign Object Retained After Surgery:
        measure: Foreign Object Retained After Surgery
        hospitals: 3030
        hospitals_with_rate: 3030
        mean_rate: 0.0121
        max_rate: 1.541
        share_with_zero_rate: 0.9347
        footnoted: 4
      Air Embolism:
        measure: Air Embolism
        hospitals: 3030
        hospitals_with_rate: 3030
        mean_rate: 0.0009
        max_rate: 0.374
        share_with_zero_rate: 0.9921
        footnoted: 1
      Blood Incompatibility:
        measure: Blood Incompatibility
        hospitals: 3030
        hospitals_with_rate: 3030
        mean_rate: 0.0002
        max_rate: 0.113
        share_with_zero_rate: 0.997
        footnoted: 0
      Falls and Trauma:
        measure: Falls and Trauma (Includes fractures, dislocations, intracranial injuries, crushing injuries, burns,
          other injuries)
        hospitals: 3030
        hospitals_with_rate: 3030
        mean_rate: 0.3325
        max_rate: 16.0
        share_with_zero_rate: 0.4551
        footnoted: 4
  vectors:
  - input:
      key: Falls and Trauma
      column: hospitals
    expected: 3030
    origin: source
  - input:
      key: Air Embolism
      column: measure
    expected: Air Embolism
    origin: source
  - input: Pressure Ulcer
    expected: false
    origin: derived
