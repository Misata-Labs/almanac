assumed:
- parameter: rows[*].mean_rate, max_rate, share_with_zero_rate, hospitals, hospitals_with_rate, footnoted
  value: summaries over hospital rows per measure
  method: derived
  rationale: The dataset lists one rate per hospital and measure, fetched in three API pages; the entry summarises
    them and keeps the measure names unchanged.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 4
  tolerance: 0
- statistic: max[mean_rate]
  expected: 0.3325
  tolerance: 0
notes: The four Deficit Reduction Act hospital-acquired condition measures that CMS reports per hospital (foreign
  object retained after surgery, air embolism, blood incompatibility, and falls and trauma) with the number of hospitals,
  the mean and maximum rate and the share of hospitals with a zero rate over the measurement period, from the 2025
  release of the Deficit Reduction Act Hospital-Acquired Condition Measures dataset on data.cms.gov. Rates are kept
  in the unit CMS publishes them in; the dataset's dictionary page renders in the browser and its unit could not
  be confirmed from a stable resource, so check it before labelling rates. The high share of zero rates gives a
  synthetic hospital quality profile realistic sparsity. data.cms.gov and cms.gov publish these files without a
  licence statement, so the entry is held at license-review.
