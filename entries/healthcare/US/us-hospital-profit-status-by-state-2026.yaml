assumed:
- parameter: distributions[*].parameters.shares
  value: records per PROPRIETARY NONPROFIT code within each state
  method: derived
  rationale: Counted from the extract. The dictionary documents P (proprietor) and N (nonprofit); the code D appears
    on 128 records without a published meaning and is kept under its own label.
tests:
- statistic: share[TX,proprietary]
  expected: 0.486111
  tolerance: 0.004
- statistic: share[NY,nonprofit]
  expected: 0.971963
  tolerance: 0.004
- statistic: sum_of_shares[CA]
  expected: 1
  tolerance: 0.0001
notes: For each state or territory, the share of Medicare hospital enrolment records registered with the IRS as
  proprietary (for-profit) versus nonprofit, from the PROPRIETARY NONPROFIT flag of the CMS Hospital Enrollments
  extract of 29 September 2026. Ownership varies strongly by state, so draw it conditionally when generating a synthetic
  hospital. data.cms.gov and cms.gov publish these files without a licence statement, so the entry is held at license-review.
