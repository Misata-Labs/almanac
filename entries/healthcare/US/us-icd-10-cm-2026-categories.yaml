evidence:
- publisher: Centers for Disease Control and Prevention, National Center for Health Statistics
  title: ICD-10-CM FY2026 code descriptions archive (icd10cm-codes-2026.txt and icd10cm-order-2026.txt)
  url: https://ftp.cdc.gov/pub/Health_Statistics/NCHS/Publications/ICD10CM/2026/icd10cm-Code%20Descriptions-2026.zip
  accessed_at: '2026-10-31'
  locator: icd10cm-codes-2026.txt, first line
  value: A000 Cholera due to Vibrio cholerae 01, biovar cholerae
  unit: text
  snippet: A000
  source_license: unstated
  content_sha256: a852eb91b3344ae38476e63816976ee1eeb94dcced7151118324f060e8499f88
  role: primary
assumed:
- parameter: code_pattern
  value: ^[A-Z][0-9A-Z]{2}[0-9A-Z]{0,4}$
  method: derived
  rationale: Observed shape of every valid code in the FY2026 list (3 to 7 characters, a letter first, letters and
    digits after); the files do not state a pattern.
- parameter: rows[*].valid_codes
  value: count of valid codes beginning with the category
  method: derived
  rationale: Counted from icd10cm-codes-2026.txt.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 1918
  tolerance: 0
- statistic: max[valid_codes]
  expected: 3096
  tolerance: 0
notes: The three-character categories of ICD-10-CM for the fiscal year beginning 1 October 2025, read from the tabular
  order file in the CDC/NCHS code descriptions archive, with each category's long title, whether the category itself
  is a billable code, and how many valid codes sit under it. The archive is a ZIP whose text files the verifier
  cannot search, so the evidence snippet is checked against the decoded archive bytes only loosely; re-run the builder
  to re-derive everything from the archive. ICD-10 is a WHO classification and ICD-10-CM its US clinical modification;
  the archive carries no licence statement, so the entry is held at license-review.
