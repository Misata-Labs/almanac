assumed:
- parameter: distribution.parameters.counts
  value: column sums over all hospitals
  method: derived
  rationale: CMS publishes the counts per hospital; 683 hospital cells are blank (suppressed for fewer than eleven
    beneficiaries) and count as zero.
- parameter: distribution.parameters.shares
  value: counts / total
  method: derived
  rationale: Shares are each category's count over the sum of all categories in the table.
