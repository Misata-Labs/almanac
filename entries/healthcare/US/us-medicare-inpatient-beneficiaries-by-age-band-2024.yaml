notes: The age band mix of beneficiaries with a Medicare fee-for-service inpatient stay in calendar 2024, summed
  over every hospital in the CMS Medicare Inpatient Hospitals by Provider file. A beneficiary admitted to two hospitals
  is counted at each, so the totals describe hospital-beneficiary pairs rather than unique people. data.cms.gov
  and cms.gov publish these files without a licence statement, so the entry is held at license-review.
