- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: Deaths in the United States in 2017 by the ten leading causes NCHS publishes in its leading causes of death
  series, with every other cause collected into one remainder, so the shares sum to all deaths. 2017 is the last
  year in the data.cdc.gov series. The cause weights give synthetic mortality or claims data a realistic diagnosis
  mix. data.cdc.gov labels these datasets Public Domain U.S. Government only in view metadata that carries live
  view and download counters, so the statement cannot be pinned by a content hash and the licence is recorded as
  unstated.
