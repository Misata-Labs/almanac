assumed:
- parameter: distribution.parameters.counts[Other causes]
  value: all causes minus the ten named causes
  method: derived
  rationale: NCHS publishes the ten leading causes and the all-cause total; the remainder is their difference.
- parameter: distribution.parameters.shares
  value: counts / total
  method: derived
  rationale: Shares are each category's count over the sum of all categories in the table.
tests:
- statistic: share[Other causes]
  expected: 0.260164
  tolerance: 0.004
- statistic: share[Heart disease]
