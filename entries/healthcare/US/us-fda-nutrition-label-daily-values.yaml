notes: The Reference Daily Intakes for vitamins and minerals and the Daily Reference Values for food components
  on which the percent Daily Value of a US Nutrition Facts label is based, for the four population groups the regulation
  distinguishes, keyed by nutrient as the two tables in 21 CFR 101.9(c)(8)(iv) and (c)(9) print it in the eCFR text
  as of 2026-10-29. Adult values rest on a 2,000-calorie reference intake and the children 1 through 3 values on
  1,000 calories. valid_from is the date of the latest version of 101.9 in the eCFR versions endpoint. US federal
  government works carry no copyright, but neither the eCFR API nor the regulation text states reuse terms, so the
  licence is recorded as unstated and the entry held at license-review.
