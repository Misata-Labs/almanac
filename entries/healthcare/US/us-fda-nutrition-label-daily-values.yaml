assumed:
- parameter: rows[*]
  value: footnote markers removed; Protein rows merged
  method: derived
  rationale: Table cells carry footnote numbers before some values and after some names and units (for example '1
    78' and 'Folate 6'); the builder keeps the value and drops the marker. Protein appears in both tables with complementary
    N/A cells, so its RDI (infants, pregnant and lactating) and DRV (adults, children 1 through 3) figures are merged
    into one row. N/A becomes null.
