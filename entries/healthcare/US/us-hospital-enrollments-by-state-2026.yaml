assumed:
- parameter: distribution.parameters.counts
  value: enrolment records per practice-location state
  method: derived
  rationale: Counted from the STATE column of the extract; a hospital with several practice locations contributes
    one record per location.
- parameter: distribution.parameters.shares
  value: counts / total
  method: derived
  rationale: Shares are each category's count over the sum of all categories in the table.
