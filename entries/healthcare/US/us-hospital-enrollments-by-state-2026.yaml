notes: Where the hospitals, critical access hospitals and rural emergency hospitals enrolled in Medicare are located,
  counted from the CMS Hospital Enrollments extract of 29 September 2026 by the state of the practice location.
  The file holds one record per enrolment and practice location, so multi-site systems weigh more than once. Use
  it to place synthetic providers. data.cms.gov and cms.gov publish these files without a licence statement, so
  the entry is held at license-review.
