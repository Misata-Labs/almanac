notes: 'Medicare Part A amounts for calendar year 2026 from two CMS notices published in the Federal Register on
  November 19, 2025: the inpatient hospital deductible per benefit period and the daily coinsurance for hospital
  days 61 to 90, lifetime reserve days and skilled nursing facility days 21 to 100 (FR Doc. 2025-20249); and the
  monthly premium for people who buy Part A because they lack enough quarters of coverage, full and with the 45
  percent reduction (FR Doc. 2025-20250). The statute fixes the coinsurance amounts as one-fourth, one-half and
  one-eighth of the deductible. Most beneficiaries pay no Part A premium. Source is the Federal Register issue XML
  on govinfo (tier A). Works of the US federal government carry no copyright in the United States, but the cited
  documents state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
