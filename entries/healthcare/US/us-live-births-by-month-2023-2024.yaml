notes: Provisional monthly counts of live births, deaths and infant deaths for the United States from the NCHS Vital
  Statistics Rapid Release, read from the data.cdc.gov export of the state and national provisional counts with
  a fixed row order. Counts are rounded by NCHS. The month-to-month shape sets the seasonality of synthetic birth
  and death events. data.cdc.gov labels these datasets Public Domain U.S. Government only in view metadata that
  carries live view and download counters, so the statement cannot be pinned by a content hash and the licence is
  recorded as unstated.
