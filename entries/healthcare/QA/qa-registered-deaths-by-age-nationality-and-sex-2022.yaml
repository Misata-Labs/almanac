assumed:
- parameter: distributions.*.parameters.shares
  value: count / sum of counts within each group
  method: derived
  rationale: The publisher gives counts; shares are each count over the group total. Ages are under 1, single years
    1 to 4, five-year bands to 95 +, and not stated, ordered by age. Rows whose sex is not stated are left out.
