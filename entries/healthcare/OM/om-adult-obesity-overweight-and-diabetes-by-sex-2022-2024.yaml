notes: 'Age-standardised prevalence (percent) among adults in Oman, for both sexes, men and women, with the lower
  and upper bounds of the WHO uncertainty interval (_low and _high): obesity (BMI 30 or more, GHO indicator NCD_BMI_30A)
  and overweight (BMI 25 or more, NCD_BMI_25A) for ages 18 and over in 2024, and diabetes (NCD_DIABETES_PREVALENCE_AGESTD)
  for ages 18 and over and 30 and over in 2022, the latest year that indicator carries. Each GHO query is filtered
  to one year and the six GCC states. Rows are keyed by measure and record their indicator and year. The World Bank
  diabetes table already in the archive gives one both-sexes figure for ages 20 to 79; this adds the split by sex.
  The GHO API carries no licence statement, so the licence is recorded as unstated and the entry stays at license-review
  until a reviewer confirms the WHO terms that apply.'
