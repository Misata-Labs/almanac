id: us-regulation-d-accredited-investor-definition
title: US Regulation D accredited investor categories and dollar thresholds (17 CFR 230.501(a))
kind: rule
domain: funds
region: US
status: license-review
tier: A
valid_from: '2025-02-18'
valid_to: null
tags:
- funds
- private-equity
- regulation
- accredited-investor
- regulation-d
- investor-eligibility
use_cases:
- fund-administration-demo
- kyb-onboarding
- kyc-onboarding
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    currency: USD
    indexed_for_inflation: false
    rows:
      natural_person_net_worth:
        paragraph: 230.501(a)(5)
        investor: natural person
        test: individual or joint (with spouse or spousal equivalent) net worth, excluding the primary residence
          and the debt it secures up to its value
        threshold_usd: 1000000
        comparison: exceeds
      natural_person_income:
        paragraph: 230.501(a)(6)
        investor: natural person
        test: individual income in each of the two most recent years, with a reasonable expectation of the same
          in the current year
        threshold_usd: 200000
        comparison: exceeds
      natural_person_joint_income:
        paragraph: 230.501(a)(6)
        investor: natural person
        test: joint income with spouse or spousal equivalent in each of the two most recent years, with the same
          expectation
        threshold_usd: 300000
        comparison: exceeds
      professional_certification:
        paragraph: 230.501(a)(10)
        investor: natural person
        test: holds in good standing a professional certification, designation or credential the Commission has
          designated
        threshold_usd: null
        comparison: null
      knowledgeable_employee:
        paragraph: 230.501(a)(11)
        investor: natural person
        test: knowledgeable employee of a private fund issuer relying on section 3(c)(1) or 3(c)(7)
        threshold_usd: null
        comparison: null
      director_officer_general_partner:
        paragraph: 230.501(a)(4)
        investor: natural person
        test: director, executive officer or general partner of the issuer or of its general partner
        threshold_usd: null
        comparison: null
      entity_total_assets:
        paragraph: 230.501(a)(3)
        investor: 501(c)(3) organisation, corporation, business trust, partnership or LLC not formed to acquire
          the securities
        test: total assets
        threshold_usd: 5000000
        comparison: exceeds
      trust_total_assets:
        paragraph: 230.501(a)(7)
        investor: trust not formed to acquire the securities, directed by a sophisticated person
        test: total assets
        threshold_usd: 5000000
        comparison: exceeds
      entity_investments:
        paragraph: 230.501(a)(9)
        investor: entity of another type not formed to acquire the securities
        test: investments as defined in rule 2a51-1(b)
        threshold_usd: 5000000
        comparison: exceeds
      family_office_assets_under_management:
        paragraph: 230.501(a)(12)
        investor: family office not formed to acquire the securities
        test: assets under management
        threshold_usd: 5000000
        comparison: exceeds
      benefit_plan_total_assets:
        paragraph: 230.501(a)(1)
        investor: state or ERISA employee benefit plan
        test: total assets (or a qualifying fiduciary or accredited self-directed decision makers)
        threshold_usd: 5000000
        comparison: exceeds
      entity_all_owners_accredited:
        paragraph: 230.501(a)(8)
        investor: entity
        test: all equity owners are accredited investors
        threshold_usd: null
        comparison: null
      regulated_institution:
        paragraph: 230.501(a)(1)
        investor: bank, broker-dealer, registered or exempt reporting adviser, insurance company, registered fund,
          BDC, SBIC or RBIC
        test: status
        threshold_usd: null
        comparison: null
  vectors:
  - input:
      key: natural_person_net_worth
      column: threshold_usd
    expected: 1000000
    origin: source
  - input:
      key: natural_person_income
      column: threshold_usd
    expected: 200000
    origin: source
  - input:
      key: natural_person_joint_income
      column: threshold_usd
    expected: 300000
    origin: source
  - input:
      key: entity_investments
      column: threshold_usd
    expected: 5000000
    origin: source
  - input:
      key: knowledgeable_employee
      column: threshold_usd
    expected: null
    origin: source
  - input: sophisticated_non_accredited_purchaser
    expected: false
    origin: derived
    note: not an accredited investor category
