notes: The categories of accredited investor in Rule 501(a) of Regulation D, which private funds rely on to offer
  interests under Rule 506(b) or 506(c). Natural persons qualify by net worth (excluding the primary residence),
  by income in each of the last two years, by holding a designated professional certification, or as knowledgeable
  employees of the fund; entities qualify by total assets, investments or assets under management above the stated
  amount (each requiring that the entity was not formed to acquire the securities), by regulated status, or because
  all their equity owners are accredited. All thresholds are tests of 'in excess of'. The amounts are not indexed.
  valid_from is the date the section's current text took effect according to the eCFR; the income and net worth
  tests are much older. The family client category of paragraph (a)(13) is omitted. Works of the US federal government
  carry no copyright in the United States, but the cited resources state no reuse terms, so the licence is recorded
  as unstated and the entry held at license-review.
