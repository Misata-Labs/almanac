notes: 'The two exclusions from the definition of investment company that private equity and venture funds rely
  on. Section 3(c)(1) covers an issuer not making a public offering whose securities are beneficially owned by no
  more than 100 persons, or 250 for a qualifying venture capital fund, whose aggregate capital contributions and
  uncalled committed capital may not exceed a statutory amount the SEC indexes every five years (17 CFR 270.3c-7
  sets the current figure; valid_from is the date that rule''s current text took effect). An investing company holding
  the stated share of the voting securities that is itself a private fund is looked through. Section 3(c)(7) covers
  an issuer owned exclusively by qualified purchasers: natural persons and family companies owning the lower investments
  amount, and persons investing at least the higher amount on a discretionary basis. Works of the US federal government
  carry no copyright in the United States, but the cited resources state no reuse terms, so the licence is recorded
  as unstated and the entry held at license-review.'
