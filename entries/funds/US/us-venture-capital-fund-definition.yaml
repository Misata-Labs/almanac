notes: An adviser that advises solely venture capital funds is exempt from SEC registration under section 203(l)
  of the Advisers Act. A private fund is a venture capital fund if it represents that it pursues a venture strategy,
  keeps assets other than qualifying investments (equity bought directly from qualifying portfolio companies) and
  short-term holdings within the stated basket of its capital contributions and uncalled commitments, does not borrow
  or guarantee beyond the stated share of that capital or for longer than the stated term, gives investors no redemption
  rights except in extraordinary circumstances, and is not a registered fund or BDC. The same definition fixes which
  funds can be qualifying venture capital funds under section 3(c)(1) of the Investment Company Act. Works of the
  US federal government carry no copyright in the United States, but the cited resources state no reuse terms, so
  the licence is recorded as unstated and the entry held at license-review.
