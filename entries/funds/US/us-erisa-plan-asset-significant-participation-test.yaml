notes: When an employee benefit plan invests in a fund that is neither publicly offered, a registered investment
  company nor an operating company (including a venture capital or real estate operating company), the plan's assets
  include an undivided interest in the fund's underlying assets, making the manager an ERISA fiduciary, unless equity
  participation by benefit plan investors is not significant. Participation is significant when benefit plan investors
  hold 25 percent or more of the value of any class of equity interests immediately after the most recent acquisition,
  disregarding interests held by the manager, advisers for a fee and their affiliates. Private equity funds therefore
  cap benefit plan investors below the threshold or qualify as a venture capital operating company. The vectors
  are the regulation's own examples in paragraph (j). valid_from is the date the eCFR versions endpoint gives for
  the section's current text, which is the start of the eCFR's version history rather than the date the 25 percent
  test was adopted. Works of the US federal government carry no copyright in the United States, but the cited resources
  state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.
