spec:
  implementation: almanac.rules.erisa_plan_asset_test
  parameters:
    threshold_percent: 25
    test: benefit plan investors hold the threshold or more of the value of any class of equity interests, immediately
      after the most recent acquisition
    disregarded: interests of persons with discretionary authority or control over the entity's assets or who give
      investment advice for a fee about them, and their affiliates (other than benefit plan investors)
  vectors:
  - input:
      benefit_plan_value: 30
      total_value: 100
    expected: true
    origin: source
    note: 'paragraph (j)(2): plan 15% plus governmental plan 15%'
  - input:
      benefit_plan_value: 10
      total_value: 100
    expected: false
    origin: source
    note: paragraph (j)(3)
  - input:
      benefit_plan_value: 1000
      total_value: 10000
      disregarded_value: 6500
      output: share
    expected: 28.6
    origin: source
    note: 'paragraph (j)(4): $1000/$3500'
  - input:
      benefit_plan_value: 1000
      total_value: 10000
      disregarded_value: 6500
    expected: true
    origin: source
    note: paragraph (j)(4)
  - input:
      benefit_plan_value: 25
      total_value: 100
    expected: true
    origin: derived
    note: exactly the threshold is significant ('25 percent or more')
  - input:
      benefit_plan_value: 2499
      total_value: 10000
    expected: false
    origin: derived
    note: just below the threshold
