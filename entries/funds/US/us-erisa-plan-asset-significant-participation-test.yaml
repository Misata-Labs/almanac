id: us-erisa-plan-asset-significant-participation-test
title: 'US ERISA plan-asset regulation: 25% significant participation test by benefit plan investors (29 CFR 2510.3-101(f))'
kind: rule
domain: funds
region: US
status: license-review
tier: A
