notes: 'A registered investment adviser may charge a performance fee (such as carried interest from a 3(c)(1) fund)
  only to qualified clients: clients with at least the assets-under-management amount with the adviser immediately
  after contracting, with net worth above the net-worth amount (excluding the primary residence), qualified purchasers,
  or certain officers and knowledgeable employees of the adviser. Rule 205-3 sets the amounts by reference to the
  most recent SEC inflation order; the order published on 1 May 2026 raised them with effect from 29 June 2026 and
  does not apply retroactively to existing contracts. The previous amounts and the date they took effect are kept
  for contracts entered into before then. Works of the US federal government carry no copyright in the United States,
  but the cited resources state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
