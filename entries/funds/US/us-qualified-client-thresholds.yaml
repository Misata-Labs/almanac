        previous_value: 1100000
        previous_effective: '2021-08-16'
      net_worth_test:
        value: 2700000
        unit: USD
        comparison: more than
        paragraph: 275.205-3(d)(1)(ii)(A)
        effective: '2026-06-29'
        previous_value: 2200000
        previous_effective: '2021-08-16'
        excludes: primary residence and the debt it secures up to its value
      employee_participation_months:
        value: 12
        unit: months
        paragraph: 275.205-3(d)(1)(iii)(B)
    next_adjustment: approximately every five years by Commission order, indexed to the PCE price index and rounded
      to the nearest $100,000
