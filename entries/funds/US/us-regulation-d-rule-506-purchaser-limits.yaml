notes: Rule 506 is the safe harbour most private funds use to offer interests without registration. Under 506(b)
  there may be no more than 35 purchasers in any 90-calendar-day period, counted under Rule 501(e), which excludes
  accredited investors and certain relatives and controlled entities, so the limit in practice applies to non-accredited
  purchasers, each of whom must be sophisticated (alone or with a purchaser representative); general solicitation
  is not permitted. Under 506(c) general solicitation is allowed but every purchaser must be an accredited investor
  and the issuer must take reasonable steps to verify that status. valid_from is the date the section's current
  text took effect according to the eCFR. Works of the US federal government carry no copyright in the United States,
  but the cited resources state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.
