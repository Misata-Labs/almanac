notes: An investment adviser that advises only qualifying private funds and has less than the stated private fund
  assets in the United States is exempt from SEC registration (it files as an exempt reporting adviser). A registered
  adviser to private funds with at least the Form PF amount of private fund assets at its fiscal year end must file
  Form PF; the higher thresholds for large hedge fund, liquidity fund and private equity fund advisers are set in
  the form's instructions, which the CFR text does not reproduce, so they are left out. The rules state the amounts
  in millions of dollars; the table carries them in dollars. Each row's effective date is the date its section's
  current text took effect according to the eCFR. Works of the US federal government carry no copyright in the United
  States, but the cited resources state no reuse terms, so the licence is recorded as unstated and the entry held
  at license-review.
