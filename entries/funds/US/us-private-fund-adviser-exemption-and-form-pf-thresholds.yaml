spec:
  implementation: almanac.rules.lookup_table
  parameters:
    currency: USD
    rows:
      private_fund_adviser_exemption_us:
        value: 150000000
        unit: USD
        comparison: less than
        measure: private fund assets (regulatory assets under management of qualifying private funds), calculated
          annually
        paragraph: 275.203(m)-1(a)
        effective: '2018-03-12'
      private_fund_adviser_exemption_non_us:
        value: 150000000
        unit: USD
        comparison: less than
        measure: private fund assets managed at a place of business in the United States
        paragraph: 275.203(m)-1(b)
        effective: '2018-03-12'
      form_pf_filing_threshold:
        value: 150000000
        unit: USD
        comparison: at least
        measure: private fund assets at the end of the most recently completed fiscal year, for registered advisers
        paragraph: 275.204(b)-1(a)
        effective: '2025-03-12'
  vectors:
  - input:
      key: private_fund_adviser_exemption_us
