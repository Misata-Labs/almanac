id: us-private-fund-adviser-exemption-and-form-pf-thresholds
title: US private fund adviser registration exemption (under $150 million) and Form PF filing threshold (17 CFR
  275.203(m)-1, 275.204(b)-1)
kind: rule
domain: funds
region: US
status: license-review
tier: A
valid_from: '2025-03-12'
valid_to: null
tags:
- funds
