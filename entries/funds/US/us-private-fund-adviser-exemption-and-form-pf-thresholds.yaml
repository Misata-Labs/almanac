    origin: source
  - input:
      key: form_pf_filing_threshold
      column: comparison
    expected: at least
    origin: source
  - input: large_private_equity_fund_adviser
    expected: false
    origin: derived
    note: the Form PF large adviser thresholds are in the form's instructions, not the CFR text
