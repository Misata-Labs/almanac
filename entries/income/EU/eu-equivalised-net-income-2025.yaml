notes: Median and mean equivalised net income in euro for the whole population, EU-SILC survey year 2025, ten member
  states, from Eurostat dataflow ilc_di03. EU-SILC income refers to the calendar year before the survey year; valid_from
  and valid_to bound the survey year under which Eurostat files the figures. Rows are keyed by the Eurostat geo
  code and carry the English country name from the GEO codelist. Eurostat's copyright notice states that its data
