assumed:
- parameter: distributions[*].parameters.shares
  value: per mille of a division / sum of the twelve divisions' per mille
  method: derived
  rationale: Eurostat publishes the structure in per mille of total consumption expenditure, rounded so the twelve
    divisions sum to between 999 and 1002; shares are renormalised over the published divisions so each distribution
    sums to one. The published per mille values are kept beside them.
tests:
- statistic: share[DE,CP04]
  expected: 0.314
  tolerance: 0.005
- statistic: share[FR,CP01]
  expected: 0.142715
  tolerance: 0.005
- statistic: sum_of_shares[DE]
  expected: 1
  tolerance: 0.0001
- statistic: sum_of_shares[PL]
  expected: 1
  tolerance: 0.0001
notes: 'Structure of household consumption expenditure in the 2020 wave of the Household Budget Survey from Eurostat
  dataflow hbs_str_t211, as a categorical distribution over the twelve COICOP divisions CP01 to CP12 for each country.
  Each distribution carries the published per mille values, the derived shares, the English COICOP labels and the
  country name. Sweden is absent because Eurostat publishes no 2020 wave for it, so nine of the ten usual member
  states are covered. Observation flags published with the data: FR estimated (e, all divisions). Eurostat''s copyright
  notice states that its data are released under the Creative Commons Attribution 4.0 International licence; the
  notice page renders dynamically and is referenced rather than hashed.'
