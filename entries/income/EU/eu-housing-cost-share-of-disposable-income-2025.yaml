notes: Mean share of total housing costs in disposable household income, EU-SILC survey year 2025, from Eurostat
  dataflow ilc_mded01, for all households and separately for people below and above 60 percent of the median equivalised
  income (the at-risk-of-poverty threshold). EU-SILC income refers to the calendar year before the survey year;
  valid_from and valid_to bound the survey year under which Eurostat files the figures. Rows are keyed by the Eurostat
  geo code and carry the English country name from the GEO codelist; a cell Eurostat does not publish is stored
  as null. Eurostat's copyright notice states that its data are released under the Creative Commons Attribution
  4.0 International licence; the notice page renders dynamically and is referenced rather than hashed.
