notes: Mean nominal monthly earnings of employees in Saudi Arabia in 2020 for citizens, foreign citizens and all
  employees, by sex, in Saudi riyals, US dollars and PPP dollars, from ILOSTAT indicator EAR_EMTA_SEX_CCT_CUR_NB
  (labour force survey). This is the latest year ILOSTAT holds for the series. Citizens' mean earnings are well
  above those of foreign citizens for both sexes, so synthetic salaries should be drawn after nationality. Rows
  are keyed '<citizenship>:<sex>'. The ILOSTAT terms-of-use page could not be fetched byte-stably in this session,
  so the licence is recorded as unstated and the entry stays at license-review until a reviewer confirms the terms
  that apply to ILOSTAT data.
