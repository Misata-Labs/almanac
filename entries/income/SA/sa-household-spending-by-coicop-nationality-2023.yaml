assumed:
- parameter: distributions.*.parameters.shares
  value: division mean / sum of division means
  method: derived
  rationale: The table publishes mean monthly riyal amounts per division; each share is a division's amount over
    the sum of the thirteen amounts for that nationality, rounded to 6 decimals. GASTAT also publishes percentage
    shares (Table 12-4); these derived shares agree with them up to rounding.
tests:
- statistic: share["saudi","Food and beverages"]
  expected: 0.276415
  tolerance: 0.004
- statistic: share["non-saudi","Housing, water, electricity, gas and other fuels"]
  expected: 0.222458
  tolerance: 0.004
- statistic: share["total","Transport"]
  expected: 0.104946
  tolerance: 0.004
- statistic: sum_of_shares["saudi"]
  expected: 1
  tolerance: 0.002
- statistic: sum_of_shares["non-saudi"]
  expected: 1
  tolerance: 0.002
- statistic: sum_of_shares["total"]
  expected: 1
  tolerance: 0.002
notes: Mean household monthly final monetary (cash) consumption expenditure in Saudi riyals by COICOP division,
  for households headed by a Saudi, by a non-Saudi, and overall, from Table 11-4 of GASTAT's Household Income and
  Consumption Expenditure Survey 2023 workbook. The riyal means sit beside the derived shares, so a generator can
  draw both the category of a purchase and a plausible monthly budget per category. Neither file carries a licence
  statement, so the entry stays at license-review; GASTAT's website use policy permits reuse, including commercial
  reuse, with GASTAT acknowledged as the source and changes indicated.
