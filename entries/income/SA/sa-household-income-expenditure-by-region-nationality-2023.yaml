notes: Mean and median household monthly disposable income and mean household monthly consumption expenditure, in
  Saudi riyals, by administrative region and nationality of the household head (saudi, non_saudi, total), from Tables
  1-2, 2-2 and 1-3 of GASTAT's Household Income and Consumption Expenditure Survey 2023 workbook. GASTAT notes that
  2023 is the first survey to use the disposable income and consumption expenditure method, so earlier rounds are
  not comparable. Use the mean and median together to fit a skewed income distribution per region and nationality.
  Neither file carries a licence statement, so the entry stays at license-review; GASTAT's website use policy permits
  reuse, including commercial reuse, with GASTAT acknowledged as the source and changes indicated.
