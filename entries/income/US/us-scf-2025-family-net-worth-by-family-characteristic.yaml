notes: Median and mean family net worth for the 2025 survey by family characteristic, from the Federal Reserve's
  SCF historical tables workbook (4. Family net worth, by selected characteristics of families, 1989–2025 surveys).
  Rows are keyed 'group/characteristic' using the table's own group headings (age_of_reference_person_years, current_occupation_of_reference_person,
  current_work_status_of_reference_person, education_of_reference_person, family_structure, housing_status, percentile_of_income,
  percentile_of_net_worth, race_or_ethnicity_of_respondent); 'all_families' is the overall row. The Survey of Consumer
  Finances is a triennial household survey; figures are nominal thousands of US dollars for the 2025 survey (income
  refers to the previous calendar year). The publisher is a US federal body and the resource carries no licence
  statement, so the licence is recorded as unstated and the entry held at license-review.
