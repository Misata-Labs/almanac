assumed:
- parameter: average_agi_usd
  value: 1000 * agi_usd_thousands / returns
  method: derived
  rationale: Mean AGI per return in whole dollars, from the bracket's total AGI (thousands) and number of returns;
    rounded to cents.
- parameter: bracket_order
  value: 1..10
  method: derived
  rationale: Position of the bracket from lowest to highest AGI, as the IRS orders the columns.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 10
  tolerance: 0
- statistic: value[$1,000,000 or more,returns]
  expected: 799320
  tolerance: 0
- statistic: max[average_agi_usd]
  expected: 3172830.39
  tolerance: 0.01
notes: 'Selected items of the IRS Statistics of Income Historic Table 2 for tax year 2023 (United States file) by
  size of adjusted gross income: returns in total and by filing status, elderly returns, total AGI, and the number
  and amount of salaries and wages, taxable interest and ordinary dividends, with a derived average AGI per return.
  Money amounts are in thousands of dollars as published; the ''Under $1'' bracket has negative total AGI. The all-returns
  column is kept under parameters.all_returns. The publisher is a US federal body and the resource carries no licence
  statement, so the licence is recorded as unstated and the entry held at license-review.'
