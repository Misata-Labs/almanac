notes: Quarterly gross weight of goods handled in main ports (all directions, national and international traffic,
  thousand tonnes) from Eurostat dataflow mar_go_qm for the maritime member states of the Almanac's Eurostat set
  with every quarter of the window published; Germany is the series value and the other countries ride along as
  columns keyed by the lower-case reporting-country code (dimension rep_mar). Austria is not a reporting country
  of the dataflow (the API rejects its code), so it is left out. Eurostat's copyright notice states that its data
  are released under the Creative Commons Attribution 4.0 International licence; the notice page renders dynamically
  and is referenced rather than hashed.
