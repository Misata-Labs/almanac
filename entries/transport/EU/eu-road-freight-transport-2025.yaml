assumed:
- parameter: rows[*].empty_running_share_of_vehicle_km
  value: vehicle_km_million_empty / vehicle_km_million_total
  method: derived
  rationale: Share of all vehicle-kilometres driven empty, from the two published figures.
- parameter: rows[*].international_share_of_tonne_km
  value: tonne_km_million_international / tonne_km_million_total
  method: derived
  rationale: Share of freight work performed in international transport.
- parameter: rows[*].average_load_tonnes_per_loaded_vehicle_km
  value: tonne_km_million_total / vehicle_km_million_loaded
  method: derived
  rationale: Mean payload in tonnes while laden, since tonne-kilometres accrue only on loaded journeys.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 10
  tolerance: 0
- statistic: max[tonne_km_million_total]
  expected: 380988.0
  tolerance: 0
notes: 'Road freight transport in 2025 reported by each country to Eurostat dataflow road_go_ta_tott (hire-or-reward
  and own-account operations together): million tonne-kilometres in total and split into national and international
  transport, million vehicle-kilometres in total and split into loaded and empty running, and thousand tonnes carried.
  Derived columns give the empty-running share of vehicle-kilometres, the international share of tonne-kilometres
  and the average load per loaded vehicle-kilometre. Italy publishes no empty-running figures, so its empty cells
  and the empty-running share are null. Rows are keyed by the Eurostat geo code and carry the English country name
  from the GEO codelist; a cell Eurostat does not publish is stored as null. Eurostat''s copyright notice states
  that its data are released under the Creative Commons Attribution 4.0 International licence; the notice page renders
  dynamically and is referenced rather than hashed.'
