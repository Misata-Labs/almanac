notes: Monthly passengers carried on commercial flights (scheduled and non-scheduled, national and international,
  arrivals and departures) at each country's reporting airports for 2025 from Eurostat dataflow avia_paoc. The series
  carries the seasonal profile of air travel demand. Germany is the primary series; the other nine member states
  ride along as columns keyed by their two-letter geo code. Eurostat's copyright notice states that its data are
  released under the Creative Commons Attribution 4.0 International licence; the notice page renders dynamically
  and is referenced rather than hashed.
