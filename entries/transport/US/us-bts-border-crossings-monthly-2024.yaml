notes: Inbound crossings at US land ports of entry in 2024 as published by BTS from US Customs and Border Protection
  counts, queried with a SoQL aggregate on the Border Crossing Entry Data dataset. Measures count vehicles, containers
  and people separately (for example Trucks and Personal Vehicle Passengers), so they are not additive across measures.
  The series value is the Trucks measure at the US-Mexico border; every other measure and border rides along as
  a column named measure_border. The dataset's Socrata metadata declares the licence as Public Domain, which has
  no SPDX identifier in this repository, so the licence is recorded as unstated and the entry held at license-review.
