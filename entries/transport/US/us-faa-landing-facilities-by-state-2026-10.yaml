assumed:
- parameter: rows[*]
  value: APT_BASE.csv records with COUNTRY_CODE US grouped by STATE_CODE; columns count SITE_TYPE_CODE A and H,
    FACILITY_USE_CODE PU and OWNERSHIP_TYPE_CODE PU
  method: derived
  rationale: Each record is one landing facility; the column counts apply the published codes.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 59
  tolerance: 0
- statistic: max[facilities]
  expected: 1960.0
  tolerance: 1.0e-09
notes: Landing facilities in the FAA National Airspace System Resources (NASR) airport file for the 28-day cycle
  effective 2026-10-29. Rows are keyed by the NASR STATE_CODE and carry the state name; the 19287 US facilities
  split 5022 public use and 14265 private use, 4797 publicly owned. The publisher states no licence on the file
  itself, so the licence is recorded as unstated and the entry held at license-review even though US federal publications
  are normally free to reuse.
