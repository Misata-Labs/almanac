evidence:
- publisher: Bureau of Transportation Statistics
  title: BTS Border Crossing Entry Data, Socrata dataset keg4-3bc2 on data.bts.gov (SoQL CSV export)
  url: https://data.bts.gov/resource/keg4-3bc2.csv?$select=border,measure,sum(value)&$group=border,measure&$order=border,measure&$where=date%3E=%272024-01-01T00:00:00%27%20AND%20date%3C%272025-01-01T00:00:00%27
  accessed_at: '2026-10-31'
  locator: row border=US-Canada Border, measure=Buses, sum_value
  value: '50334'
  unit: count
  snippet: '"US-Canada Border","Buses","50334"'
  source_license: unstated
  content_sha256: 5ad160a87c8fb998c2830f804c61891d72b09803b3d4bf0c6b04b75ebebcf7c1
  role: primary
assumed:
- parameter: distributions[*].parameters.shares
  value: sum_value of a measure / sum over the measures of the border
  method: derived
  rationale: The query returns annual totals per border and measure; shares are each measure over the sum of all
    measures at that border, which mixes vehicle, container and person counts and is meant as a mix of record types
    rather than a physical ratio.
tests:
- statistic: share[us_canada_border,"Personal Vehicle Passengers"]
  expected: 0.600131
  tolerance: 0.005
- statistic: sum_of_shares[us_canada_border]
  expected: 1
  tolerance: 0.0001
- statistic: share[us_mexico_border,"Personal Vehicle Passengers"]
  expected: 0.517268
  tolerance: 0.005
- statistic: sum_of_shares[us_mexico_border]
  expected: 1
  tolerance: 0.0001
notes: Inbound crossings at US land ports of entry in 2024 as published by BTS from US Customs and Border Protection
  counts, queried with a SoQL aggregate on the Border Crossing Entry Data dataset. Measures count vehicles, containers
  and people separately (for example Trucks and Personal Vehicle Passengers), so they are not additive across measures.
  Conditioning keys are us_canada_border and us_mexico_border. The dataset's Socrata metadata declares the licence
  as Public Domain, which has no SPDX identifier in this repository, so the licence is recorded as unstated and
  the entry held at license-review.
