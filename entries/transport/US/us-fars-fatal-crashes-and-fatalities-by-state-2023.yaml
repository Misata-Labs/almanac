assumed:
- parameter: rows[*].fatal_crashes and rows[*].fatalities
  value: records grouped by STATE; fatalities is the sum of FATALS
  method: derived
  rationale: Each accident.csv record is one fatal crash carrying its FATALS count; both columns are aggregates
    over the records of a state.
- parameter: rows[*].fatalities_per_crash
  value: fatalities / fatal_crashes
  method: derived
  rationale: Ratio of the two aggregates.
tests:
- statistic: vector_pass_fraction
  expected: 1
