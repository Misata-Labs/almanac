- statistic: count
  expected: 51
  tolerance: 0
- statistic: max[fatal_crashes]
  expected: 3877.0
  tolerance: 1.0e-09
notes: Fatal motor-vehicle crashes in the United States in 2023 from the NHTSA Fatality Analysis Reporting System
  National CSV release (accident.csv, one record per crash). The published counts sit beside the derived shares.
  Rows are keyed by the two-digit FARS state code (state FIPS code) and carry the STATENAME text. The publisher
  states no licence on the file itself, so the licence is recorded as unstated and the entry held at license-review
  even though US federal publications are normally free to reuse.
