assumed:
- parameter: distributions[*].parameters.counts
  value: APT_BASE.csv records with COUNTRY_CODE US grouped by SITE_TYPE_CODE then OWNERSHIP_TYPE_CODE
  method: derived
  rationale: Each APT_BASE.csv record is one landing facility; the codes are kept as published (site type A airport,
