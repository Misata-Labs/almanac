notes: Landing facilities in the FAA National Airspace System Resources (NASR) airport file for the 28-day cycle
  effective 2026-10-29. Site type codes condition the ownership-type distribution; facility counts per site type
  are carried as site_type_facilities. Codes are the NASR codes as published; the layout PDF inside the archive
  defines them. The publisher states no licence on the file itself, so the licence is recorded as unstated and the
  entry held at license-review even though US federal publications are normally free to reuse.
