notes: Pension contributions for UAE nationals registered with the General Pension and Social Security Authority,
  as two GPSSA pages state them. The FAQ (last updated 21 August 2024) gives 5% from the insured, 15% from a government-sector
  employer, and 12.5% from a private-sector employer with the government bearing 2.5%, 20% in total. GPSSA's article
  on Federal Law No. 57 of 2023 says that under that law the total is 26%, 11% from the insured and 15% from the
  employer, with the government paying 2.5% of the employer share for Emiratis whose contribution salary is below
  AED 20,000. The pages do not say which insured persons each schedule covers; the rows are kept separate and named
  after their source for a human to reconcile. Abu Dhabi nationals are covered by the Abu Dhabi Pension Fund, whose
  site could not be reached.
