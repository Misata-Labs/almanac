notes: 'From OECD dataflow DF_PAG (Pensions at a Glance): the current normal retirement age for a person who entered
  the labour force at age 22, the future normal retirement age for someone entering at 22 under legislated rules,
  and the average effective age at which workers leave the labour market, each for men and women. Rows are keyed
  by ISO 3166-1 alpha-3 code and carry the OECD reference-area label; OECD, EU and G7 aggregates are left out. Values
  are the 2024 observations of the dataflow. The OECD terms and conditions page could not be fetched byte-stably
  in this session, so the licence is recorded as unstated and the entry stays at license-review until a reviewer
  confirms the terms that apply to OECD data.'
