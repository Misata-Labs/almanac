assumed:
- parameter: rows[*].born_from, rows[*].born_to, rows[*].age_in_months
  value: ISO dates and total months
  method: derived
  rationale: The table gives birth-date ranges as m/d/yyyy pairs; the builder converts them to ISO dates (the open
    ends become null and the first range ends the day before its printed bound) and adds years times twelve plus
    months.
