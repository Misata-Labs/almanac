notes: The age at which unreduced old-age, wife's or husband's Social Security benefits are payable, by the beneficiary's
  date of birth, as the table in 20 CFR 404.409(a) prints it in the eCFR text as of 2026-10-29. Rows are keyed by
  the ISO birth-date range (min and max for the open ends) and carry the years and months separately and as a total
  in months. The separate widow's and widower's table in 404.409(b) is not included. valid_from is the date of the
  latest version of 404.409 in the eCFR versions endpoint. US federal government works carry no copyright, but neither
  the eCFR API nor the regulation text states reuse terms, so the licence is recorded as unstated and the entry
  held at license-review.
