notes: 'Cost-of-living adjusted retirement plan limits for 2026 from IRS Notice 2025-67, effective January 1, 2026:
  elective deferral limits for 401(k), 403(b), the Thrift Savings Plan and governmental 457(b) plans; catch-up contributions
  at age 50 and the higher catch-up for those who attain 60 to 63 during the year; the wage threshold above which
  catch-ups must be Roth; SIMPLE limits; the section 415 defined contribution and defined benefit limits; the compensation
  limit; the highly compensated and key employee thresholds; the IRA contribution and catch-up limits; and the traditional
  and Roth IRA phase-out ranges. The highly compensated employee test compares compensation in the look-back year
  with the threshold. Works of the US federal government carry no copyright in the United States, but the cited
  documents state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
