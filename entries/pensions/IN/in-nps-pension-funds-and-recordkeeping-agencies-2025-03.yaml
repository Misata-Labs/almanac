notes: The pension fund managers (Table 2) and central recordkeeping agencies (Table 3) registered with PFRDA as
  on 31 March 2025, from the Handbook of National Pension System Statistics 2025, keyed by the handbook's own acronyms.
  Table 2 lists eleven pension funds while the architecture overview on page 18 says ten are registered; both statements
  are in the same document and the discrepancy is left for the reader. The handbook names Axis Bank as NPS Trustee
  Bank and says fifteen annuity service providers are registered. PFRDA states no licence for the handbook, so the
  entry stays at license-review.
