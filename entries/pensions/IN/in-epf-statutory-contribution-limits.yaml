notes: 'Statutory provident fund contribution rates under section 16 of the Code on Social Security, 2020 (in force
  from 21 November 2025, replacing the Employees'' Provident Funds and Miscellaneous Provisions Act, 1952): the
  employer pays ten per cent. of wages, raised to twelve per cent. in establishments the Central Government notifies,
  and the employee pays an equal amount (more if they choose, without obliging the employer). Out of the employer''s
  contribution, up to eight and one-third per cent. of wages goes to the Pension Fund; the employer also pays up
  to one per cent. of wages to the Deposit-Linked Insurance Fund plus up to a quarter of that for its administration.
  Administrative charges on the EPF are 0.50% of pay from 1 June 2018 with minimums of ₹75 a month for a non-functional
  establishment and ₹500 for others (S.O. 2011(E), kept in force by section 164(2)). The operative EPS and EDLI
  percentages and the wage ceiling are set in the EPF, EPS and EDLI Schemes, whose current texts could not be fetched
  from EPFO; this entry holds the statutory limits only and does not state the wage ceiling. Wages are as defined
  in the Code on Wages (50% rule).'
