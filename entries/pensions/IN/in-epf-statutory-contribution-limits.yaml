id: in-epf-statutory-contribution-limits
title: India provident fund contributions under Code on Social Security s 16 (10% or 12%, pension up to 8 1/3%)
  and EPF admin charges
kind: rule
domain: pensions
region: IN
status: license-review
tier: B
valid_from: '2025-11-21'
valid_to: null
tags:
- india
- payroll
- provident-fund
- pension
- compliance
use_cases:
- payroll-demo
- hr-demo
- pensions
- compliance-demo
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    rows:
      employer_contribution_percent:
        value: 10
        basis: wages payable to each employee
        provision: Code on Social Security s 16(1)(a)
      employer_contribution_percent_notified_establishments:
        value: 12
        basis: wages, in establishments the Central Government notifies
        provision: s 16(1)(a) first proviso
      employee_contribution:
        value: equal to the employer contribution
        basis: may voluntarily exceed it
        provision: s 16(1)(a)
      pension_fund_share_max_percent:
        value: eight and one-third
        basis: wages, paid from the employer contribution
        provision: s 16(1)(b)(i)
      insurance_fund_max_percent:
        value: 1
        basis: wages, paid by the employer
        provision: s 16(1)(c)
      insurance_administration_max:
        value: one-fourth
        basis: of the employer's insurance fund contribution
        provision: s 16(1)(c) proviso
      epf_administrative_charges_percent:
        value: 0.5
        basis: pay, from 1 June 2018
        provision: S.O. 2011(E), EPF Scheme paragraphs 30 and 38(1)
      epf_administrative_charges_minimum_non_functional:
        value: 75
        basis: rupees per month per non-functional establishment with no contributory member
        provision: S.O. 2011(E)
      epf_administrative_charges_minimum_other:
        value: 500
        basis: rupees per month per establishment
        provision: S.O. 2011(E)
  vectors:
  - input:
      key: employer_contribution_percent
      column: value
    expected: 10
    origin: source
  - input:
      key: employer_contribution_percent_notified_establishments
      column: value
    expected: 12
    origin: source
  - input:
      key: pension_fund_share_max_percent
      column: value
    expected: eight and one-third
    origin: source
  - input:
      key: insurance_fund_max_percent
      column: value
    expected: 1
    origin: source
  - input:
      key: epf_administrative_charges_percent
      column: value
    expected: 0.5
    origin: source
  - input:
      key: epf_administrative_charges_minimum_other
      column: value
    expected: 500
    origin: source
