notes: 'Weekly State Pension rates for 2025/26 and 2026/27 from the DWP ''Benefit and pension rates 2026 to 2027''
  publication: the full rate of the new State Pension (for people reaching State Pension age from 6 April 2016,
  normally needing 35 qualifying years), the old basic State Pension by category and the maximum additional pension.
  GOV.UK''s new State Pension guide records the April 2026 change in its change history and gives the deferral increase.
  Sources are the GOV.UK content API''s JSON for each page, stable between editorial updates; GOV.UK publishes its
  content under the Open Government Licence v3.0.'
