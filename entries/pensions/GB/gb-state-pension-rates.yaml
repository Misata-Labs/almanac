id: gb-state-pension-rates
title: United Kingdom new State Pension full rate and old State Pension basic rates per week, 2025/26 and 2026/27
kind: rule
domain: pensions
region: GB
status: verified
tier: A
valid_from: '2025-04-06'
valid_to: '2027-04-05'
tags:
- state-pension
- pensions
- retirement
- weekly-rates
use_cases:
- pensions
- personal-finance
- financial-planning
- person-generation
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    currency: GBP
    unit: per week
    qualifying_years_for_full_new_state_pension: 35
    deferral_increase_percent_per_year: just under 5.8
    new_state_pension_uprating_percent_2026_27: 4.7991
    rows:
      new_state_pension_full_rate:
        weekly_2025_26: 230.25
        weekly_2026_27: 241.3
        dwp_label: Full rate
      old_state_pension_category_a_or_b_basic:
        weekly_2025_26: 176.45
        weekly_2026_27: 184.9
        dwp_label: Category A or B basic pension
      old_state_pension_category_b_lower_basic:
        weekly_2025_26: 105.7
        weekly_2026_27: 110.75
        dwp_label: Category B (lower) basic pension - spouse or civil partner’s insurance
      old_state_pension_category_c_or_d_non_contributory:
        weekly_2025_26: 105.7
        weekly_2026_27: 110.75
        dwp_label: Category C or D - non-contributory
      maximum_additional_pension:
        weekly_2025_26: 222.1
        weekly_2026_27: 230.54
        dwp_label: Maximum additional pension (own and inherited)
  vectors:
  - input:
      key: new_state_pension_full_rate
      column: weekly_2026_27
    expected: 241.3
    origin: source
  - input:
      key: new_state_pension_full_rate
      column: weekly_2025_26
    expected: 230.25
    origin: source
  - input:
      key: old_state_pension_category_a_or_b_basic
      column: weekly_2026_27
    expected: 184.9
    origin: source
  - input:
      key: old_state_pension_category_c_or_d_non_contributory
      column: weekly_2026_27
    expected: 110.75
    origin: source
  - input: pension_credit
    expected: false
    origin: derived
    note: Pension Credit is a separate benefit
