assumed:
- parameter: rows[*].world_usd_millions and top_partners_usd_millions
  value: published value rounded to 0.1
  method: derived
  rationale: The OECD publishes positions in millions of US dollars to several decimals; the table keeps one decimal.
- parameter: rows[*].top_partners_usd_millions
  value: 15 largest individual partner economies
  method: derived
  rationale: Partners are limited to ISO 3166 economies (regional and economic aggregates dropped, ISO list from
    the archive's ISO 3166 entry), confidential cells left out, and ranked by position.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: value[USA:inward,world_usd_millions]
  expected: 5707721.0
  tolerance: 0
- statistic: count
  expected: 10
  tolerance: 0
notes: 'Foreign direct investment positions at the end of 2024 under the directional principle (inward: foreign
  investment in the reporter; outward: the reporter''s investment abroad), all resident units, immediate counterpart,
  total of equity and debt, in millions of US dollars converted at market exchange rates, from OECD dataflow DF_FDI_POS_CTRY
  (BMD4). Each row carries the world total and the fifteen largest individual partner economies; partners whose
  data are confidential are not ranked. Partners are immediate counterparts, not ultimate investors. India does
  not report to this dataflow. No licence statement was found in the OECD file or in a byte-stable OECD document,
  so the licence is recorded as unstated and the entry held at license-review.'
