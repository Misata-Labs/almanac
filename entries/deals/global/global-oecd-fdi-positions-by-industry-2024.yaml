notes: FDI positions at the end of 2024 by ISIC Rev. 4 section of the resident enterprise (inward) or of the resident
  investor (outward), world counterpart, directional principle, all resident units, in millions of US dollars, from
  OECD dataflow DF_FDI_POS_IND (BMD4). Null marks a confidential or unreported cell, so sections need not sum to
  the total; net positions can be negative. Germany publishes only the all-activity total in this breakdown and
  India does not report to the dataflow, so neither is included. No licence statement was found in the OECD file
  or in a byte-stable OECD document, so the licence is recorded as unstated and the entry held at license-review.
