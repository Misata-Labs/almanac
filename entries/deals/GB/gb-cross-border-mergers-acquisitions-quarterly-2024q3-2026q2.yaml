notes: Cross-border mergers, acquisitions and disposals worth £1 million or more involving UK companies, from Table
  1 of the ONS Mergers and Acquisitions dataset published with the Q2 2026 release. Outward deals are acquisitions
  or disposals abroad by UK companies; inward deals are acquisitions or disposals in the UK by foreign companies.
  Values are in millions of pounds. 2026 Q1 is marked [er] (earliest revision) in the source and its figures are
  read without that marker; quarters are revised as late survey returns arrive. The value of a quarter can swing
  with a single large deal. Released under the Open Government Licence v3.0.
