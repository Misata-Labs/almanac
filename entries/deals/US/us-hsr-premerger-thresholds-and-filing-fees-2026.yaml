- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: tier_count
  expected: 6
  tolerance: 0
- statistic: threshold[all_transactions_above_usd]
  expected: 535500000
  tolerance: 0
- statistic: fee[5869000000]
  expected: 2460000
  tolerance: 0
notes: 'Thresholds of the Hart-Scott-Rodino Antitrust Improvements Act and the filing fee schedule as revised by
  the Federal Trade Commission''s annual notice published in the Federal Register on 16 January 2026 (FR Doc. 2026-00877),
  effective 17 February 2026, thirty days after publication. An acquisition is reportable when the acquiring person
  would hold voting securities and assets of the acquired person in excess of the upper size-of-transaction threshold,
  or in excess of the lower threshold when one of the three size-of-person tests of section 7A(a)(2)(B)(ii) is also
  met. The filing fee depends only on the size of transaction, in six tiers whose lower bounds are inclusive (''not
  less than''). Exemptions, valuation rules and aggregation under 16 CFR parts 801 to 803 are not modelled. The
  rule answers {''fee'': size}, {''band'': size} and {''reportable'': size, ''acquiring'': {...}, ''acquired'':
  {...}} with annual_net_sales_usd, total_assets_usd and, for the acquired person, manufacturing. Values are read
  from the govinfo bulk XML of that day''s Federal Register. The publisher is a US federal body and the resource
  carries no licence statement, so the licence is recorded as unstated and the entry held at license-review.'
