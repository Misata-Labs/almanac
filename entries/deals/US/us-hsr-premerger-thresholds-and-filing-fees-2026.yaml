id: us-hsr-premerger-thresholds-and-filing-fees-2026
title: Hart-Scott-Rodino premerger notification thresholds and filing-fee tiers in force from 17 February 2026
kind: rule
domain: deals
region: US
status: license-review
tier: A
valid_from: '2026-02-17'
valid_to: null
tags:
- deals
- m-and-a
- hart-scott-rodino
- antitrust
- filing-fee
- thresholds
- ftc
use_cases:
- deal-sourcing-demo
- pe-portfolio-demo
- valuation-demo
- lbo-modelling
- compliance-demo
spec:
  implementation: almanac.rules.us_hsr_premerger
  parameters:
    size_of_transaction:
      all_transactions_above_usd: 535500000
      size_of_person_test_above_usd: 133900000
    size_of_person:
      smaller_person_usd: 26800000
      larger_person_usd: 267800000
    filing_fees:
    - from_usd: 0
      below_usd: 189600000
      fee_usd: 35000
      published_band: less than $189.6 million
      published_fee: $35,000
    - from_usd: 189600000
      below_usd: 586900000
      fee_usd: 110000
      published_band: not less than $189.6 million but less than $586.9 million
      published_fee: 110,000
    - from_usd: 586900000
      below_usd: 1174000000
      fee_usd: 275000
      published_band: not less than $586.9 million but less than $1.174 billion
      published_fee: 275,000
    - from_usd: 1174000000
      below_usd: 2347000000
      fee_usd: 440000
      published_band: not less than $1.174 billion but less than $2.347 billion
      published_fee: 440,000
    - from_usd: 2347000000
      below_usd: 5869000000
      fee_usd: 875000
      published_band: not less than $2.347 billion but less than $5.869 billion
      published_fee: 875,000
    - from_usd: 5869000000
      below_usd: null
      fee_usd: 2460000
      published_band: $5.869 billion or more
      published_fee: 2,460,000
    adjusted_thresholds:
      $10 million: $26.8 million
      $50 million: $133.9 million
      $100 million: $267.8 million
      $110 million: $294.5 million
      $200 million: $535.5 million
      $500 million: $1.339 billion
      $1 billion: $2.678 billion
  vectors:
  - input:
      fee: 100000000
    expected: 35000
    origin: source
    note: first tier, less than $189.6 million
  - input:
      fee: 189600000
    expected: 110000
    origin: source
    note: second tier starts at not less than $189.6 million but less than $586.9 million
  - input:
      fee: 1174000000
    expected: 440000
    origin: source
    note: not less than $1.174 billion but less than $2.347 billion
  - input:
      fee: 5869000000
    expected: 2460000
    origin: source
    note: top tier, $5.869 billion or more
  - input:
      fee: 5868999999
    expected: 875000
    origin: derived
    note: one dollar below the top tier
  - input:
      band: 535500001
    expected: reportable
    origin: derived
    note: in excess of the 7A(a)(2)(A) threshold
  - input:
      band: 535500000
    expected: size-of-person test applies
    origin: derived
    note: exactly at the upper threshold is not in excess of it
  - input:
      band: 133900000
    expected: not reportable
    origin: derived
  - input:
      reportable: 134900000
      acquiring:
        annual_net_sales_usd: 267800000
        total_assets_usd: 0
      acquired:
        manufacturing: true
        annual_net_sales_usd: 26800000
        total_assets_usd: 0
    expected: true
    origin: derived
    note: size-of-person test (I) met at both minimums
  - input:
      reportable: 134900000
      acquiring:
        annual_net_sales_usd: 267799999
        total_assets_usd: 0
      acquired:
        manufacturing: true
        annual_net_sales_usd: 26800000
        total_assets_usd: 0
    expected: false
    origin: derived
    note: acquirer one dollar short of the larger amount
  - input:
      reportable: 134900000
      acquiring:
        annual_net_sales_usd: 267800000
        total_assets_usd: 0
      acquired:
        manufacturing: false
        annual_net_sales_usd: 26800000
        total_assets_usd: 0
    expected: false
    origin: derived
    note: test (II) counts only the total assets of a non-manufacturing acquired person
