assumed:
- parameter: size_of_transaction, size_of_person, filing_fees[*].from_usd and below_usd
  value: published '$x million' or '$x billion' as whole dollars
  method: derived
  rationale: The notice states amounts in millions or billions of dollars; the rule restates them as whole dollars,
    and the published wording is kept beside each fee tier.
- parameter: meaning of the size-of-person tests
  value: 15 U.S.C. 18a(a)(2)(B)(ii)
  method: derived
  rationale: The notice lists adjusted amounts by subsection; which amount applies to which party and to which measure
    (net sales, total assets) is taken from the statute text cited as supporting evidence.
