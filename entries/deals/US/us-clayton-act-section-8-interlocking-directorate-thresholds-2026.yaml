  parameters:
    key: Clayton Act subsection
    rows:
      8(a)(1):
        description: Each competitor corporation has capital, surplus and undivided profits aggregating more than
          this amount
        threshold_usd: 54402000
        published: $54,402,000
      8(a)(2)(A):
        description: No corporation is covered if the competitive sales of either corporation are less than this
          amount
        threshold_usd: 5440200
        published: $5,440,200
