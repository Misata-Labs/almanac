notes: Wireless (mobile) subscribers, including M2M cellular connections, of each access service provider at the
  end of September 2026 from the 'Total' row of Annexure-II (page 20) of the TRAI press release; FWA subscribers
  are excluded. Shares are the counts divided by the 1,299,999,801 total and reproduce the 92.74%/7.26% private/PSU
  split stated on page 8. TRAI's website carries no licence statement for its press releases and reports, so the
  entry stays at license-review.
