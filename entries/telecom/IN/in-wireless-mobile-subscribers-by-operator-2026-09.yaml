assumed:
- parameter: distribution.parameters.shares
  value: count / total, rounded to six decimals
  method: derived
  rationale: The source publishes counts (subscribers); each share is the category count divided by the sum of the
    listed counts (1.3e+09). The counts are kept in distribution.parameters.counts.
- parameter: column assignment
  value: Bharti Airtel, Reliance Communications, Vodafone Idea, BSNL, MTNL, Reliance Jio
  method: derived
  rationale: 'pypdf flattens the Annexure-II header, so operator columns were identified from the body: the MTNL
    column equals the Delhi plus Mumbai cells, the private/PSU split matches page 8, and the order agrees with Annexure
    1.1 of TRAI''s quarterly performance indicators report.'
