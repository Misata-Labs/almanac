notes: 'Headline indicators for the quarter ending 30 June 2026 from TRAI''s Indian Telecom Services Performance
  Indicators report (snapshot, executive summary, Table 2.1, Table 3.1), one row per indicator with its unit. ARPU
  is TRAI''s regulatory measure: quarterly revenue net of interconnect and roaming settlement divided by average
  subscribers, which the report notes is lower than operators'' own ARPU. Crore values are as printed (1 crore =
  10 million). TRAI''s website carries no licence statement for its press releases and reports, so the entry stays
  at license-review.'
