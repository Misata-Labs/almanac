notes: 'Per-service-area wireless parameters for the quarter ending June 2026 from Annexure 2.1 of TRAI''s performance
  indicators report: prepaid subscribers as a share of total, monthly ARPU in rupees, and outgoing SMS, outgoing,
  incoming and total minutes of usage per subscriber per month (usage from and outside the home service area). Rows
  are keyed by the slug of the licensed service area; Tamil Nadu includes Chennai. TRAI''s website carries no licence
  statement for its press releases and reports, so the entry stays at license-review.'
