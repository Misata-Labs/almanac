notes: 'Wireless (mobile) subscribers in each of TRAI''s 22 licensed service areas at the end of September 2026,
  taken from the ''Total'' column of Annexure-II (page 20). Service areas are not states: Delhi includes Ghaziabad,
  Noida, Gurgaon and Faridabad, Mumbai and Kolkata are separate from Maharashtra and West Bengal, Uttar Pradesh
  is split East/West, and North East covers six states (page 14 notes). Shares are counts divided by the 1,299,999,801
  total. TRAI''s website carries no licence statement for its press releases and reports, so the entry stays at
  license-review.'
