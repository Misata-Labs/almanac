notes: 'Composition of the INR 192.53 monthly revenue per wireless subscriber from home subscribers in the quarter
  ending June 2026 (TRAI Table 2.3): rental, calls, SMS, data usage, other value-added services and other revenue
  from the home service area, plus revenue from out-roamers. Shares are the published percentages divided by 100
  (they sum to 100.02 because of rounding); the INR amounts are kept as counts. Revenue from in-roamers and interconnect
  is excluded from the base. TRAI''s website carries no licence statement for its press releases and reports, so
  the entry stays at license-review.'
