notes: End-of-month wireless, wireline and total telephone subscribers (millions) from the highlights table of each
  monthly TRAI subscription press release for 2025; one evidence item per release. The December 2025 release (PR
  19/2026) is an image-only PDF and is omitted. The releases footnote that wireless includes 5G fixed wireless access
  subscriptions, and from mid-2025 the wireline column is noticeably higher than in the earlier months, so treat
  the series as published rather than strictly like-for-like. TRAI's website carries no licence statement for its
  press releases and reports, so the entry stays at license-review.
