notes: The highlights table on page 1 of TRAI's monthly subscription press release for September 2026, keyed by
  segment (wireless, wireline, total). Wireless comprises mobile subscribers including M2M cellular connections
  plus fixed wireless access; tele-density uses the 2011-2036 population projections of the Technical Group on Population
  Projections. Extra parameters record the active (VLR) wireless base and the month's MNP requests. TRAI's website
  carries no licence statement for its press releases and reports, so the entry stays at license-review.
