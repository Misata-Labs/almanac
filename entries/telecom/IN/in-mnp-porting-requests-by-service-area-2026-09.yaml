assumed:
- parameter: distribution.parameters.shares
  value: count / total, rounded to six decimals
  method: derived
  rationale: The source publishes counts (porting requests); each share is the category count divided by the sum
    of the listed counts (1.6769e+07). The counts are kept in distribution.parameters.counts.
tests:
- statistic: share[uttar-pradesh-east]
  expected: 0.148701
  tolerance: 0.004
- statistic: share[uttar-pradesh-west]
  expected: 0.100211
  tolerance: 0.004
- statistic: share[madhya-pradesh]
  expected: 0.094749
  tolerance: 0.004
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.002
notes: Number of mobile number portability requests submitted in September 2026 in each licensed service area, from
  the LSA-wise MNP status table on page 18 of the TRAI press release (Zone-I covers northern and western India,
  Zone-II southern and eastern). Shares are counts divided by the 16,769,016 total and give a churn-by-circle pattern
  for telecom generators. TRAI's website carries no licence statement for its press releases and reports, so the
  entry stays at license-review.
