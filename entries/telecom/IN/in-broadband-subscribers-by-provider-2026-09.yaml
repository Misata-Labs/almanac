assumed:
- parameter: distribution.parameters.shares
  value: count / total, rounded to six decimals
  method: derived
  rationale: The source publishes counts (million subscribers); each share is the category count divided by the
    sum of the listed counts (1107.68). The counts are kept in distribution.parameters.counts.
- parameter: counts.others
  value: 15.6
  method: derived
  rationale: Total broadband subscribers (1,107.68 million) minus the five listed providers.
tests:
- statistic: share[reliance-jio]
  expected: 0.488562
  tolerance: 0.004
- statistic: share[bharti-airtel]
  expected: 0.351058
  tolerance: 0.004
- statistic: share[vodafone-idea]
  expected: 0.118265
  tolerance: 0.004
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.002
notes: Wired plus wireless broadband subscribers of the five largest providers at the end of September 2026 (page
  2 of the TRAI press release) with the remainder of the 1,107.68 million total assigned to 'others'. The release
  states the top five hold 98.59% of the market, which the derived shares reproduce. TRAI's website carries no licence
  statement for its press releases and reports, so the entry stays at license-review.
