notes: 'Fixed broadband subscriptions (per 100 people) for 2023 from the World Development Indicators API (indicator
  IT.NET.BBND.P2, data last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional
  and income aggregates removed. 2023 is the most recent year whose coverage is close to the series'' best recent
  year. Source note from the World Bank: Fixed broadband subscriptions refers to fixed subscriptions to high-speed
  access to the public Internet (a TCP/IP connection), at downstream speeds equal to, or greater than, 256 kbit/s.
  This includes cable modem, DSL, fiber-to-the-home/building, other fixed (wired)-broadband subscriptions, satellite
  broadband and terrestrial fixed wireless broadband. This total is measured irrespective of the met The World Bank
  licenses its datasets under CC BY 4.0.'
