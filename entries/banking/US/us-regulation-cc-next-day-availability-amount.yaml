notes: The portion of a day's check deposits a depositary bank must make available on the next business day regardless
  of check type, as indexed to the CPI-W every five years under 12 CFR 229.11 and listed by period in 229.11(c)(1)
  of the eCFR text as of 2026-10-29. The first step is the first period the regulation dates; the amount before
  it sits in before_first_step. US federal government works carry no copyright, but neither the eCFR API nor the
  regulation text states reuse terms, so the licence is recorded as unstated and the entry held at license-review.
