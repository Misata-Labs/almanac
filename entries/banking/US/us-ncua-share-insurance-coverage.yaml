notes: 'How much of a member''s shares the NCUA insures at one federally insured credit union: the standard maximum
  share insurance amount (SMSIA) applies separately to each ownership category. Revocable trust accounts are insured
  at the SMSIA per different beneficiary, per owner; when more than five beneficiaries are named and an owner''s
  trust balance exceeds five times the SMSIA, coverage is the greater of five times the SMSIA and the sum of each
  beneficiary''s interest capped at the SMSIA. Every vector is one of the regulation''s own examples. Read from
  the eCFR text as of 2026-10-29. Unlike the FDIC''s trust rule (us-fdic-deposit-insurance-coverage), the number
  of beneficiaries is not capped. valid_from is the latest version date the eCFR versions endpoint lists for the
  sections cited; the eCFR history starts in late 2016, so a date at that start marks the beginning of the record
  rather than of the rule. US federal government works carry no copyright, but neither the eCFR API nor the regulation
  text states reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
