id: us-ncua-share-insurance-coverage
title: United States NCUA share insurance coverage by ownership category for federally insured credit unions, 12
  CFR 745
kind: rule
domain: banking
region: US
status: license-review
tier: A
valid_from: '2024-09-30'
valid_to: null
tags:
- compliance
- deposit-insurance
- share-insurance
- credit-unions
- ncua
- 12-cfr-745
use_cases:
- banking-demo
- customer-service-demo
- data-quality-validation
- personal-finance
spec:
  implementation: almanac.rules.us_deposit_insurance
  parameters:
    currency: USD
    insurer: NCUA
    standard_maximum: 250000
    trust_rule:
      method: per_beneficiary_with_floor
      floor_beneficiaries: 5
      section: 12 CFR 745.4(a) and (e)
    categories:
      single:
        basis: aggregate
        section: 12 CFR 745.3
        scope: individual accounts and accounts held by agents or nominees
      joint:
        basis: aggregate
        section: 12 CFR 745.8
        scope: each co-owner's interests in all qualifying joint accounts
      trust:
        basis: per_beneficiary
        section: 12 CFR 745.4
        scope: revocable trust accounts, including payable-on-death and living trust accounts
      business:
        basis: aggregate
        section: 12 CFR 745.6
        scope: corporation, partnership or unincorporated association engaged in an independent activity
      employee_benefit_plan:
        basis: aggregate
        section: 12 CFR 745.9-2
        scope: pass-through coverage of each participant's non-contingent interest
      government:
        basis: aggregate
        section: 12 CFR 745.10
        scope: per official custodian
  vectors:
  - input:
      category: joint
      interests:
      - 75000
      - 100000
      - 125000
    expected:
      insured: 250000
      uninsured: 50000
    origin: source
    note: co-owner A in the 12 CFR 745.8(b) example
  - input:
      category: joint
      interests:
      - 75000
      - 125000
    expected:
      insured: 200000
      uninsured: 0
    origin: source
    note: co-owner B in the 12 CFR 745.8(b) example
  - input:
      category: joint
      interests:
      - 100000
      - 125000
    expected:
      insured: 225000
      uninsured: 0
    origin: source
    note: co-owner C in the 12 CFR 745.8(b) example
  - input:
      category: trust
      beneficiaries: 4
    expected:
      coverage: 1000000
    origin: source
    note: 745.4(a) example 1
  - input:
      category: trust
      beneficiaries: 2
      balance: 600000
    expected:
      coverage: 500000
      insured: 500000
      uninsured: 100000
    origin: source
    note: 745.4(a) example 3
  - input:
      category: trust
      beneficiaries: 4
      balance: 2000000
    expected:
      coverage: 1000000
      insured: 1000000
      uninsured: 1000000
    origin: source
    note: '745.4(e) example 1: more than five times the SMSIA but only four beneficiaries'
  - input:
      category: trust
      beneficiary_interests:
      - 125000
      - 125000
      - 125000
      - 15000
      - 175000
      - 935000
      balance: 1500000
    expected:
      coverage: 1250000
      insured: 1250000
      uninsured: 250000
    origin: source
    note: '745.4(e) example 2: six beneficiaries, floor of five times the SMSIA applies'
  - input:
      category: trust
      beneficiaries: 3
      owners: 2
    expected:
      coverage: 1500000
    origin: source
    note: '745.4(f) example 1: co-owned account'
