notes: Institutions filing with the FDIC for the report date 2026-06-30 by charter class code, from the financials
  endpoint aggregated by BKCLASS. Codes follow the FDIC's definitions in the field dictionary (N national commercial
  bank, NM state non-member commercial bank, SM state member commercial bank, SB federal savings bank, SI state
  stock savings bank, SL state savings and loan association, OI insured US branch of a foreign bank, NC non-insured
  non-deposit commercial bank or trust company); the names map in the parameters carries the full text. Counts and
  total assets by class sit beside the shares. The publisher is a US federal body and the resource carries no licence
  statement, so the licence is recorded as unstated and the entry held at license-review.
