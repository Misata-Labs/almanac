notes: 'The dollar threshold shared by the new-account, large-deposit and repeated-overdraft exceptions to the funds
  availability schedule: amounts above it may be held longer, and the overdraft exception counts days the account
  was negative by at least this amount. Listed by period in 229.11(c)(3) as of 2026-10-29. The first step is the
  first period the regulation dates; the amount before it sits in before_first_step. US federal government works
  carry no copyright, but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded
  as unstated and the entry held at license-review.'
