notes: Sums over every institution filing a quarterly report with the FDIC for each of the eight report dates from
  2024-09-30 to 2026-06-30, from the BankFind Suite financials endpoint with agg_by=REPDTE and agg_sum_fields over
  the listed call-report items. Money is in thousands of US dollars as the API publishes it; items ending in _quarter
  are single-quarter flows (the API's Q-suffixed fields), the rest are end-of-quarter balances. The institution
  count is the number of filers aggregated for that date. Figures are revised when institutions amend their reports,
  so the content hash tracks the FDIC index version. The publisher is a US federal body and the resource carries
  no licence statement, so the licence is recorded as unstated and the entry held at license-review.
