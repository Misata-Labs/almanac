notes: Number of FDIC-insured institutions that failed or received assistance in each calendar year from 2000 to
  2025, from the failures endpoint aggregated by FAILYR. The aggregation omits years with no failures, so 2005,
  2006, 2018, 2021, 2022 are written as zero. The query's filter also covers 2026, whose partial count is left out
  of the series because the year is not complete. The peak year was 2010. The publisher is a US federal body and
  the resource carries no licence statement, so the licence is recorded as unstated and the entry held at license-review.
