notes: The amount of check deposits a depositary bank must make available for withdrawal by cash or similar means
  by 5:00 p.m. on the day the funds become available, when it extends the availability schedule by one business
  day, as listed by period in 229.11(c)(2) of the eCFR text as of 2026-10-29. The first step is the first period
  the regulation dates; the amount before it sits in before_first_step. US federal government works carry no copyright,
  but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded as unstated and
  the entry held at license-review.
