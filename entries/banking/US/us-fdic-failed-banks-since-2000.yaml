notes: 'Every bank failure or assistance transaction the FDIC records from 2000 onward, keyed by the FDIC certificate
  number, from the BankFind Suite failures endpoint sorted by failure date. Columns are the API''s fields: total
  assets and total deposits at the last quarterly report before failure (QBFASSET, QBFDEP) and the estimated loss
  to the insurance fund (COST), all in thousands of US dollars and null where the FDIC has not published them; resolution
  type, charter class and the insurance fund as the API codes them. The failure date is restated from the API''s
  m/d/yyyy form to ISO 8601. The list is updated when institutions fail, so the hash tracks the FDIC index version.
  The publisher is a US federal body and the resource carries no licence statement, so the licence is recorded as
  unstated and the entry held at license-review.'
