assumed:
- parameter: share_of_institutions
  value: institutions / sum over classes
  method: derived
  rationale: Shares are computed from the five class counts, which together cover every filer at the report date.
- parameter: share_of_assets
  value: total_assets_usd_thousands / sum over classes
  method: derived
  rationale: Asset shares are computed from the five class sums.
- parameter: return_on_assets_percent
  value: 100 * 4 * sum_NETINCQ / sum_ASSET
  method: derived
  rationale: Quarterly net income annualised by four over end-of-quarter total assets; the FDIC's own ROA uses average
    assets, which the aggregation endpoint does not return.
- parameter: net_interest_margin_percent
  value: 100 * 4 * sum_NIMQ / sum_ERNAST
  method: derived
  rationale: Quarterly net interest income annualised over end-of-quarter earning assets.
- parameter: efficiency_ratio_percent
  value: 100 * sum_NONIXQ / (sum_NIMQ + sum_NONIIQ)
  method: derived
  rationale: Quarterly noninterest expense over quarterly net interest income plus noninterest income.
- parameter: noncurrent_loan_ratio_percent
  value: 100 * sum_NCLNLS / sum_LNLSGR
  method: derived
  rationale: Noncurrent loans and leases over gross loans and leases, both end-of-quarter balances.
- parameter: net_charge_off_rate_percent
  value: 100 * 4 * sum_NTLNLSQ / sum_LNLSGR
  method: derived
  rationale: Quarterly net charge-offs annualised over end-of-quarter gross loans and leases.
- parameter: cost_of_funding_earning_assets_percent
  value: 100 * 4 * sum_EINTXQ / sum_ERNAST
  method: derived
  rationale: Quarterly interest expense annualised over end-of-quarter earning assets.
- parameter: provision_to_loans_percent
  value: 100 * 4 * sum_ELNATQ / sum_LNLSGR
  method: derived
  rationale: Quarterly provision for credit losses annualised over end-of-quarter gross loans and leases.
- parameter: equity_to_assets_percent
  value: 100 * sum_EQ / sum_ASSET
  method: derived
  rationale: Equity capital over total assets.
- parameter: loans_to_deposits_percent
  value: 100 * sum_LNLSGR / sum_DEP
  method: derived
  rationale: Gross loans and leases over total deposits.
