- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 5
  tolerance: 0
- statistic: value[under_100m,institutions]
  expected: 584
  tolerance: 0
- statistic: max[total_assets_usd_thousands]
  expected: 16853018769
  tolerance: 0
notes: Every FDIC-insured institution filing for the report date 2026-06-30, grouped into the five asset-size classes
  the FDIC Quarterly Banking Profile uses, with one aggregation query per class (the ASSET filter is recorded in
  each row; ASSET is in thousands of dollars). Each row carries the number of institutions, summed balance-sheet
  and single-quarter income items, the derived performance ratios of us-fdic-insured-institutions-quarterly-performance-ratios-2024q3-2026q2
  and the class's share of institutions and of assets. The publisher is a US federal body and the resource carries
  no licence statement, so the licence is recorded as unstated and the entry held at license-review.
