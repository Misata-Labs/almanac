notes: The 47 nine-digit routing numbers of Federal Reserve Bank offices and the 20 of Federal Home Loan Banks that Regulation CC Appendix A lists as drawing next-day
  availability checks, printed there in the groups 'XXXX XXXX X' and stored here without spaces. Each label names the Federal Reserve District read from the first
  two digits (see us-routing-number-federal-reserve-prefix). Useful as genuine routing numbers of central institutions for test data that should not name a commercial
  bank. US federal works carry no copyright, but the eCFR states no reuse terms, so the entry is held at license-review.
