notes: Seasonally adjusted charge-off rates on loans at all US commercial banks by loan category, quarterly from
  2024Q1 to 2025Q4, from the Federal Reserve's Charge-off and Delinquency Rates release (CHGDEL) through the Data
  Download Program package for all banks. Rates are percent of loans, annualised for charge-offs; the all-loans
  series is the entry's value and each category is a column. Figures are revised as banks amend their reports. The
  publisher is a US federal body and the resource carries no licence statement, so the licence is recorded as unstated
  and the entry held at license-review.
