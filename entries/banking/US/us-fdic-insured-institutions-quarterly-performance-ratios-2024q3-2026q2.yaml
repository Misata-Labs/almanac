notes: Industry-wide ratios for all FDIC-insured institutions, computed from the same summed call-report items as
  us-fdic-insured-institutions-quarterly-aggregates-2024q3-2026q2 with the formulas listed in assumed[]. Every ratio
  is exact arithmetic on published sums, but the definitions differ from the FDIC Quarterly Banking Profile in using
  end-of-quarter balances rather than averages as denominators, so the levels are close to but not identical with
  the FDIC's published industry ratios. Percent values are rounded to four decimals. The publisher is a US federal
  body and the resource carries no licence statement, so the licence is recorded as unstated and the entry held
  at license-review.
