notes: 'How much of a depositor''s money the FDIC insures at one bank: the standard maximum deposit insurance amount
  (SMDIA) applies separately to each ownership category, aggregating a depositor''s interests within it; trust deposits
  are insured at the SMDIA per eligible beneficiary up to a cap on beneficiaries per grantor, under the simplified
  trust rule effective in 2024. The joint account vectors are the regulation''s own example. Government deposits
  are insured per official custodian, with demand deposits and time and savings deposits counted separately; pass
  the relevant subset as interests. Read from the eCFR text as of 2026-10-29. The NCUA''s share insurance rules
  for credit unions are in us-ncua-share-insurance-coverage and differ for trusts. valid_from is the latest version
  date the eCFR versions endpoint lists for the sections cited; the eCFR history starts in late 2016, so a date
  at that start marks the beginning of the record rather than of the rule. US federal government works carry no
  copyright, but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded as
  unstated and the entry held at license-review.'
