id: us-fdic-deposit-insurance-coverage
title: United States FDIC deposit insurance coverage by ownership category, 12 CFR 330
kind: rule
domain: banking
region: US
status: license-review
tier: A
valid_from: '2024-04-01'
valid_to: null
tags:
- compliance
- deposit-insurance
- fdic
- ownership-categories
- 12-cfr-330
use_cases:
- banking-demo
- customer-service-demo
- data-quality-validation
- personal-finance
spec:
  implementation: almanac.rules.us_deposit_insurance
  parameters:
    currency: USD
    insurer: FDIC
    standard_maximum: 250000
    trust_rule:
      method: per_beneficiary_capped
      max_beneficiaries: 5
      section: 12 CFR 330.10(b)(1)
    categories:
      single:
        basis: aggregate
        section: 12 CFR 330.6
        scope: individual, sole proprietorship, single-name community property and decedent accounts
      joint:
        basis: aggregate
        section: 12 CFR 330.9
        scope: each co-owner's interests in all qualifying joint accounts
      trust:
        basis: per_beneficiary
        section: 12 CFR 330.10
        scope: informal and formal revocable trusts and irrevocable trusts, aggregated per grantor
      business:
        basis: aggregate
        section: 12 CFR 330.11
        scope: corporation, partnership or unincorporated association engaged in an independent activity
      certain_retirement:
        basis: aggregate
        section: 12 CFR 330.14(b)(2)
        scope: IRAs and the other self-directed retirement accounts listed, per participant
      employee_benefit_plan:
        basis: aggregate
        section: 12 CFR 330.14(a)
        scope: pass-through coverage of each participant's non-contingent interest
      government:
        basis: aggregate
        section: 12 CFR 330.15
        scope: per official custodian; time and savings deposits and demand deposits are insured separately
  vectors:
  - input:
      category: joint
      interests:
      - 75000
      - 100000
      - 125000
    expected:
      insured: 250000
      uninsured: 50000
    origin: source
    note: co-owner A in the 12 CFR 330.9(b) example
  - input:
      category: joint
      interests:
      - 75000
      - 125000
    expected:
      insured: 200000
      uninsured: 0
    origin: source
    note: co-owner B in the 12 CFR 330.9(b) example
  - input:
      category: joint
      interests:
      - 100000
      - 125000
    expected:
      insured: 225000
      uninsured: 0
    origin: source
    note: co-owner C in the 12 CFR 330.9(b) example
  - input:
      category: trust
      beneficiaries: 3
      balance: 900000
    expected:
      coverage: 750000
      insured: 750000
      uninsured: 150000
    origin: derived
  - input:
      category: trust
      beneficiaries: 7
    expected:
      coverage: 1250000
    origin: derived
    note: beneficiaries beyond the cap add no coverage
  - input:
      category: single
      interests:
      - 250000
    expected:
      insured: 250000
      uninsured: 0
    origin: source
