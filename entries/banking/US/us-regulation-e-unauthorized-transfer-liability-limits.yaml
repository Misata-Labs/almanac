notes: 'How much a consumer can be held liable for after an unauthorized electronic fund transfer under Regulation
  E, 12 CFR 1005.6(b): the cap when the institution is told within the notice window after the consumer learns of
  a lost or stolen access device, the higher cap when it is not, and the number of days after a periodic statement
  is sent within which an unauthorized transfer must be reported to avoid liability for later transfers. Read from
  the eCFR text as of 2026-10-29, with the statutory source (15 U.S.C. 1693g) cited as supporting evidence. valid_from
  is the date of the latest version of 1005.6 in the eCFR versions endpoint. US federal government works carry no
  copyright, but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded as
  unstated and the entry held at license-review.'
