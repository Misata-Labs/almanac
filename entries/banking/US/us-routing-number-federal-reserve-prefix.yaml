notes: 'The structure of the American Bankers Association routing number as Regulation CC (12 CFR part 229, Appendix A) describes it: the first four digits form the
  Federal Reserve routing symbol and the first two identify the Federal Reserve District of the bank, 01 (Boston) to 12 (San Francisco), with 2 added to the first
  digit for a thrift institution, so 21 to 32. The 24 rows are generated from that rule. Other prefixes in use (such as those for electronic or Treasury items) are
  not stated in the regulation and are not listed. The ninth digit''s check algorithm is not stated by any official body fetched here and is not included. valid_from
  is the appendix''s original Federal Register citation. US federal works carry no copyright, but the eCFR states no reuse terms, so the entry is held at license-review.'
