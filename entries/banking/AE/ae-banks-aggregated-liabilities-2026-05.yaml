notes: 'Liabilities side of the aggregated balance sheet of all banks operating in the UAE at the end of May 2026,
  by category: domestic monetary deposits (demand deposits and bankers'' drafts), quasi-monetary deposits (time
  and savings deposits in dirhams, other deposits in foreign currency), government and other domestic deposits,
  amounts due to the central bank and resident banks, capital market funding, foreign liabilities including non-resident
  deposits, capital and reserves, provisions and other liabilities, with subtotals and the total. Compiled by the
  Central Bank of the UAE under the IMF Monetary and Financial Statistics Manual. The dataset states no unit; CBUAE
  monetary statistics report balance-sheet amounts in AED million, so treat amounts as such only after checking
  the CBUAE bulletin. LCY is local currency (dirham) and FCY foreign currency. Bayanat, the UAE federal open data
  portal run by the Federal Competitiveness and Statistics Centre, states on its Copyright and Data Licensing page
  that datasets on the portal are available under the Creative Commons Attribution 4.0 International licence unless
  otherwise stated; that page is rendered per request and is referenced rather than hashed. Bayanat download links
  carry an opaque resource token issued by the portal.'
