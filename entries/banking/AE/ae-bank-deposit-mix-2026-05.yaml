assumed:
- parameter: distribution.parameters.shares
  value: amount / sum of the seven deposit amounts
  method: derived
  rationale: CBUAE publishes balances; the shares are each deposit balance over the sum of the deposit balances
    listed. Non-resident deposits are the 'Other Deposits (LCY + FCY)' line under Foreign Liabilities.
tests:
- statistic: share["Demand deposits (LCY)"]
  expected: 0.253627
  tolerance: 0.005
- statistic: share["Non-resident deposits (LCY + FCY)"]
  expected: 0.091975
  tolerance: 0.005
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: 'Balance-weighted mix of deposits held with UAE banks at the end of May 2026: resident deposits in dirhams
  split into demand, time and savings deposits, resident foreign-currency deposits, government deposits, other domestic
  deposits, and non-resident deposits. Shares weight by balance, not by number of accounts, so use them for the
  split of a synthetic bank''s deposit book rather than for account counts. Source: CBUAE Banks Aggregated Balance
  Sheet - Liabilities (All Banks). Bayanat, the UAE federal open data portal run by the Federal Competitiveness
  and Statistics Centre, states on its Copyright and Data Licensing page that datasets on the portal are available
  under the Creative Commons Attribution 4.0 International licence unless otherwise stated; that page is rendered
  per request and is referenced rather than hashed. Bayanat download links carry an opaque resource token issued
  by the portal.'
