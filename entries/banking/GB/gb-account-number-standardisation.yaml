spec:
  implementation: almanac.rules.gb_account_standardisation
  parameters:
    ten_digit:
      natwest: last_eight
      co-operative: first_eight
      leeds: first_eight
    nine_digit:
      santander: first_digit_to_sort_code
    pad_from: 6
  vectors:
  - input:
      sort_code: '600000'
      account: 0123456789
      institution: natwest
    expected:
    - '600000'
    - '23456789'
    origin: source
    note: NatWest example 0123456789
  - input:
      sort_code: '600000'
      account: 01-23456789
      institution: natwest
    expected:
    - '600000'
    - '23456789'
    origin: source
    note: hyphen ignored
  - input:
      sort_code: 089000
      account: '1234567890'
      institution: co-operative
    expected:
    - 089000
    - '12345678'
    origin: source
  - input:
      sort_code: 090000
      account: '123456789'
      institution: santander
    expected:
    - 090001
    - '23456789'
    origin: source
    note: sorting code nn-nn-nn becomes nn-nn-n1
  - input:
      sort_code: '200000'
      account: '1234567'
    expected:
    - '200000'
    - '01234567'
    origin: source
  - input:
      sort_code: '200000'
      account: '123456'
    expected:
    - '200000'
    - '00123456'
    origin: source
  - input:
      sort_code: '200000'
      account: '12345678'
    expected:
    - '200000'
    - '12345678'
    origin: derived
    note: eight digits are already standard
