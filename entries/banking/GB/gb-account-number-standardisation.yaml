notes: 'UK modulus checks assume an eight-digit account number. Section 2.1.2 of the Vocalink specification converts the others: ten-digit National Westminster numbers
  keep the last eight digits (a hyphen after the second digit is ignored), ten-digit Co-operative Bank and Leeds Building Society numbers keep the first eight, a
  nine-digit Santander number moves its first digit into the last place of the sorting code and keeps the remaining eight, and seven- and six-digit numbers are prefixed
  with one or two zeros. Institutions are keyed natwest, co-operative, leeds and santander. The source vectors are the specification''s own examples; sorting codes
  in them are placeholders. Apply this before gb-sort-code-modulus-check. The document states ''All rights reserved'' and no reuse licence, so the entry is held at
  license-review.'
