  value:
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  method: derived
  rationale: The heading reads 2, 3, 4, 5 ff. and the worked example weights a six-digit base number 6 5 4 3 2, so the weights continue in steps of one over positions
    2 to 7.
- parameter: methods.17.weights
  value: reversed
  method: derived
  rationale: Method 17 states its weights left to right over positions 2 to 7; the module applies weights from the right, so they are stored reversed.
