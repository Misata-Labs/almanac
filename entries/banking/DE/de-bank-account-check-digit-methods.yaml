notes: Germany's bank account number check digits, as the Deutsche Bundesbank specifies them in its Prüfzifferberechnungsmethoden. Every sort code in the Bankleitzahlendatei
  names a method; the account number is padded with zeros to ten digits and checked against it. This entry implements methods 00, 01, 02, 06, 09, 10, 13, 17, 20,
  24, 28, 32, 34, 38, 61, 63, 76, 88, 91 and 99, which together are named by 3335 of the 3505 sort codes in the current file. Weights are parsed from each method's
  heading in the PDF and positions follow its text. Methods with alternative computations (13, 63 and 76 for accounts quoted without their 00 sub-account, 61 and
  88 depending on a digit, 91 with four variants) accept an account when any applicable variant does. The source vectors are the PDF's own test account numbers and
  worked examples. The 'complete' input fills the check position of the first variant, for generating valid numbers. The PDF states no licence, so the entry is held
  at license-review.
