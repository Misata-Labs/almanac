notes: 'The Deutsche Bundesbank''s bank sort code file (Bankleitzahlendatei) for the current validity period, reduced to one row per sort code: the record with Merkmal
  1, which marks the payment service provider that holds the code, while records with Merkmal 2 are further branches sharing it. Records flagged for deletion (Änderungskennzeichen
  D) are left out. Each row carries the institution''s name (Bezeichnung), BIC (null where the file has none), postcode, city and the two-character check-digit method
  code (method) that de-bank-account-check-digit-methods implements. The Bundesbank replaces the file on the Monday after the first Saturday of March, June, September
  and December, so the cited bytes change at the next update; re-run the builder then. The file carries no licence statement, so the entry is held at license-review.'
