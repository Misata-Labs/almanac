notes: 'Sort codes in the Bundesbank''s current Bankleitzahlendatei whose owning record (Merkmal 1) announces an intended deletion (field Bankleitzahllöschung = 1)
  or names a successor sort code (Nachfolge-Bankleitzahl), typically after a bank merger. Use it to age synthetic or migrated account data: an account at a code listed
  here moves to the successor when one is given (28 codes) and has no announced successor otherwise. Records already deleted in this file (Änderungskennzeichen D)
  are excluded. The file is replaced each quarter and carries no licence statement, so the entry is held at license-review.'
