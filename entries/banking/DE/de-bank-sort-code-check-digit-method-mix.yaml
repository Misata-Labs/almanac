notes: How often each check-digit method code appears across the 3505 sort codes of the Bundesbank's current sort code file, counting the Merkmal 1 record of each
  code. Method 09 means no check digit is computed. Draw a method from this distribution, then generate an account number with de-bank-account-check-digit-methods,
  to reproduce the national mix. The file changes each quarter and carries no licence statement, so the entry is held at license-review.
