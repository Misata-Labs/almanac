  value: '12.25'
  unit: percent
  snippet: '{"data":"01/01/2025","valor":'
  source_license: ODbL-1.0
  content_sha256: 9a5bf16530aa431bcb0f6bacf086cce487644607dea8ea14b5fcf59b9ba3eaac
  role: primary
- publisher: Banco Central do Brasil
  title: SGS series 432, Taxa de juros - Meta Selic definida pelo Copom (daily, JSON)
  url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados?formato=json&dataInicial=01/01/2025&dataFinal=31/12/2025
  accessed_at: '2026-10-31'
  locator: data=31/12/2025, valor
  value: '15.00'
  unit: percent
  snippet: '{"data":"31/12/2025","valor":'
  source_license: ODbL-1.0
