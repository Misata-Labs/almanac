id: br-selic-target-rate-changes-2025
title: 'Brazil Selic target rate set by the Copom: levels in force during 2025'
kind: rule
domain: rates
region: BR
status: verified
tier: A
valid_from: '2025-01-01'
valid_to: '2025-12-31'
tags:
- policy-rate
- selic
- step-schedule
- bcb
use_cases:
- banking-demo
- loan-pricing
- treasury
spec:
  implementation: almanac.rules.step_schedule
  parameters:
    series: bcdata.sgs.432
    unit: percent per year
    steps:
    - from: '2025-01-01'
      value: 12.25
    - from: '2025-01-30'
      value: 13.25
    - from: '2025-03-20'
      value: 14.25
    - from: '2025-05-08'
      value: 14.75
    - from: '2025-06-19'
      value: 15.0
  vectors:
  - input:
      'on': '2025-01-01'
    expected: 12.25
    origin: source
  - input:
      'on': '2025-12-31'
    expected: 15.0
    origin: source
  - input:
      'on': '2025-01-30'
    expected: 13.25
    origin: source
    note: first change of the year
evidence:
- publisher: Banco Central do Brasil
  title: SGS series 432, Taxa de juros - Meta Selic definida pelo Copom (daily, JSON)
  url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados?formato=json&dataInicial=01/01/2025&dataFinal=31/12/2025
  accessed_at: '2026-10-31'
