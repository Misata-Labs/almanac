  role: primary
assumed:
- parameter: steps[*].from
  value: first calendar day on which the daily series shows a new level
  method: derived
  rationale: The series publishes the target level for every day; the schedule keeps only the days on which the
    level differs from the previous day. The first step is the level on 1 January, not a decision date.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 5
  tolerance: 0
- statistic: max
  expected: 15.0
  tolerance: 0
notes: The Selic target rate (percent per year) in force on each day of 2025 from SGS series 432, reduced to the
  dates on which the level changed. The BCB open data catalogue (dadosabertos.bcb.gov.br) lists this series under
  the Open Database License; the catalogue API answers vary between requests, so that record is referenced here
  rather than hashed as evidence.
