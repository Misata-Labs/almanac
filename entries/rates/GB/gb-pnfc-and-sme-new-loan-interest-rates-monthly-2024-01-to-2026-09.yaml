notes: 'Monthly weighted average interest rates charged by UK monetary financial institutions on new sterling loans
  (other than overdrafts) to private non-financial corporations, January 2024 to September 2026, in percent, from
  the Bank of England Database: all PNFCs (CFMBJ82, the value), floating and fixed rate (CFMBJ83, CFMBJ84), and
  small and medium-sized PNFCs in total (CFMZ6LD), floating rate (CFMZJ3L, of which Bank Rate linked CFMZJ3M and
  SONIA linked CFMZJ3Q) and fixed rate (CFMZJ3U, by initial fixation up to 1 year, 1 to 5 years and over 5 years:
  CFMZJ3V, CFMZJ3W, CFMZJ3X). The series by loan size (CFMBJ88, CFMBJ89, CFMBJ92) and by fixation for all PNFCs
  return no observations for this period and are not included. Recent months can be revised in later releases. The
  Bank of England''s legal notice states that reproduction of data in its Statistical Interactive Database is subject
  to the UK Open Government Licence; that page is not byte-stable, so the statement is not cited as evidence and
  the entry is held at license-review until the clause is confirmed.'
