notes: 'Deposit interest rate (%) for 2024 from the World Development Indicators API (indicator FR.INR.DPST, data
  last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income aggregates
  removed. 2024 is the most recent year whose coverage is close to the series'' best recent year. Source note from
  the World Bank: Deposit interest rate is the rate paid by commercial or similar banks for demand, time, or savings
  deposits. The terms and conditions attached to these rates differ by country, however, limiting their comparability.
  This indicator is expressed as a percentage (a÷b)*100. The World Bank licenses its datasets under CC BY 4.0.'
