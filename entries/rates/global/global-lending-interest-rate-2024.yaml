notes: 'Lending interest rate (%) for 2024 from the World Development Indicators API (indicator FR.INR.LEND, data
  last updated 2026-10-08), one row per economy keyed by ISO 3166-1 alpha-3 code, with regional and income aggregates
  removed. 2024 is the most recent year whose coverage is close to the series'' best recent year. Source note from
  the World Bank: Lending rate is the bank rate that usually meets the short- and medium-term financing needs of
  the private sector. This rate is normally differentiated according to creditworthiness of borrowers and objectives
  of financing. The terms and conditions attached to these rates differ by country, however, limiting their comparability.
  The World Bank licenses its datasets under CC BY 4.0.'
