notes: The German civil-law base rate, which the Deutsche Bundesbank announces for 1 January and 1 July of each year under section 247 BGB and to which statutory
  default interest and many contracts refer. Steps are the months of the Bundesbank's end-of-month series whose observation comment announces a new rate ('Ab 1. Jan.'
  or 'Ab 1. Juli'), each taken to apply from the first day of that month; unchanged half-years are kept as steps with the same value. The query is pinned to January
  2002 to October 2026 in data-only SDMX CSV, which carries no update timestamp. The series carries no licence statement, so the entry is held at license-review.
