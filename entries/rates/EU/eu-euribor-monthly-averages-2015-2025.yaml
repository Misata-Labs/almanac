notes: Monthly averages of daily Euribor fixings at 1, 3, 6 and 12 months (3 months is the value), January 2015
  to December 2025, in percent, from the ECB Data Portal's financial market dataset. Euribor is the usual base rate
  of euro-denominated floating-rate corporate loans. The ECB's series titles state that the data are provided by
  Refinitiv and Euribor is a third-party benchmark, so redistribution may be subject to third-party terms beyond
  the ECB's free-use clause; the entry is held at license-review for that reason. The ECB series was preferred to
  Eurostat's irt_st_m because Eurostat's CSV embeds a last-update timestamp that changes every month. The ECB's
  website disclaimer states that users may make free use of information obtained from it provided it is reproduced
  accurately and the ECB is cited as the source; the clause is carried by the licence identifier ECB-free-use-with-attribution
  documented in CONTRIBUTING.md.
