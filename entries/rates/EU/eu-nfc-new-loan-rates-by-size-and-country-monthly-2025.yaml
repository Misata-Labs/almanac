notes: 'Annualised agreed rates charged by euro area banks on new euro loans to non-financial corporations, split
  by loan amount: up to EUR 1 million, a proxy for SME lending, and over EUR 1 million, monthly for 2025, for the
  euro area (u2, the value is up to EUR 1 million) and the 21 countries in the dataset with both series complete
  for the year. Columns are <country>_up_to_1m and <country>_over_1m in percent; the gap between them is the size
  premium small borrowers pay. The ECB''s website disclaimer states that users may make free use of information
  obtained from it provided it is reproduced accurately and the ECB is cited as the source; the clause is carried
  by the licence identifier ECB-free-use-with-attribution documented in CONTRIBUTING.md.'
