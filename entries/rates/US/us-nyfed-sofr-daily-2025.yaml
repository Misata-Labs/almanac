notes: SOFR, the New York Fed's secured overnight reference rate for borrowing against Treasury collateral, for
  each business day of 2025, with the 1st, 25th, 75th and 99th volume-weighted percentiles and the underlying volume
  in billions of US dollars, from the New York Fed reference rates API. SOFR is the base rate for most new US dollar
  floating-rate loans, including leveraged and private credit loans priced at SOFR plus a spread. Rates are published
  by the New York Fed each business day for the previous business day; dates are the effective dates of the rates.
  The API's terms of use are on an HTML page that is not byte-stable, so the licence is recorded as unstated and
  the entry held at license-review.
