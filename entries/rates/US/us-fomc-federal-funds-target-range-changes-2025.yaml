assumed:
- parameter: steps
  value: change dates read from the daily target-range columns
  method: derived
  rationale: The schedule starts at the first EFFR publication of 2025 and adds a step on each effective date whose
    target range differs from the previous business day's, as recorded alongside EFFR in the New York Fed API.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 4
  tolerance: 0
notes: 'The FOMC''s target range for the federal funds rate as a step schedule over 2025: the range in force on
  the first business day of the year and each later change, dated by the first effective date on which the New York
  Fed records the new range alongside EFFR. Each step''s value carries the lower and upper bound in percent. Rates
  are published by the New York Fed each business day for the previous business day; dates are the effective dates
  of the rates. The API''s terms of use are on an HTML page that is not byte-stable, so the licence is recorded
  as unstated and the entry held at license-review.'
