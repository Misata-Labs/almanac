notes: Monthly average spot (zero-coupon) rates of the Treasury's High Quality Market (HQM) corporate bond yield
  curve, which the Treasury publishes alongside its papers on the corporate bond yield curve and the Pension Protection
  Act. The value is the 10-year spot rate; columns y<n> carry the n-year spot rate (y0_5 is six months). It is the
  official discount curve for high-quality US corporate cash flows. The workbook is a legacy binary Excel file,
  so the verifier confirms its identity by hash and its labels by text, while the rates were read cell by cell with
  xlrd. The 2024-2028 workbook gains a month each month until 2028, so its hash changes monthly and the entry must
  be rebuilt to re-verify. The publisher is a US federal body and the resource carries no licence statement, so
  the licence is recorded as unstated and the entry held at license-review.
