notes: 'Monthly averages for 2025 of the series in the Federal Reserve''s H.15 monthly package: the bank prime loan
  rate (the value), the effective federal funds rate, AA nonfinancial and financial commercial paper at 30, 60 and
  90 days, the discount window primary credit rate, Treasury bill rates on a discount basis, nominal Treasury constant
  maturities from 1 month to 30 years, and TIPS real constant maturities from 5 to 30 years with their long-term
  average. Columns are named from the Board''s series codes (cmt_ for nominal constant maturity, tips_ for inflation-indexed);
  a series with a month of no data is left out (see assumed). The Board has announced that the Data Download Program''s
  preformatted packages are withdrawn on 31 March 2027 and the DDP pages on 1 July 2027, after which this URL will
  stop resolving. The publisher is a US federal body and the resource carries no licence statement, so the licence
  is recorded as unstated and the entry held at license-review.'
