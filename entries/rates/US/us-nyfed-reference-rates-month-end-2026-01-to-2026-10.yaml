notes: Month-end values of the New York Fed's five overnight reference rates, the 30-day SOFR average, the SOFR
  Index and the upper bound of the FOMC target range for January to October 2026, taken from one pinned API download
  covering those ten closed months. Month-end rates are what loan interest periods, fund NAV statements and valuation
  dates usually reference. Rates are published by the New York Fed each business day for the previous business day;
  dates are the effective dates of the rates. The API's terms of use are on an HTML page that is not byte-stable,
  so the licence is recorded as unstated and the entry held at license-review.
