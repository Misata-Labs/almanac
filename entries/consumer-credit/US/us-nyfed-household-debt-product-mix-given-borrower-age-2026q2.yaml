notes: 'Composition of outstanding household debt by loan product within each borrower age group at 2026Q2, from
  the report''s ''Debt Share by Product Type and Age'' page, which publishes balances in trillions of US dollars.
  Balances are kept beside the shares. Use it to assign a product mix to a synthetic borrower of a given age. Source:
  the Quarterly Report on Household Debt and Credit data workbook, built from the New York Fed Consumer Credit Panel
  / Equifax, a nationally representative 5 percent sample of credit-report data. The publisher is a US federal body
