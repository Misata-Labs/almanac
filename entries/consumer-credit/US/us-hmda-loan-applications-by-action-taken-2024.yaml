assumed:
- parameter: shares
  value: counts / total
  method: derived
  rationale: Shares are the published counts divided by their sum over the listed categories.
- parameter: mean_loan_amount_usd
  value: loan_amount_sum_usd / counts
  method: derived
  rationale: The API returns count and sum; the mean is their quotient.
tests:
- statistic: share["1 Loan originated"]
  expected: 0.505505
  tolerance: 0.003
- statistic: share["7 Preapproval request denied"]
  expected: 0.003859
  tolerance: 0.002
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0001
notes: 'Loan/application register records reported under HMDA for 2024, nationwide, by action taken: one data browser
  aggregation query per code, giving the record count and the sum of the loan amount field in dollars. Category
  labels are ''<code> <description>'' with descriptions from the 2024 Filing Instructions Guide. mean_loan_amount_usd
  is the sum divided by the count. The publisher is a US federal body and the resource carries no licence statement,
  so the licence is recorded as unstated and the entry held at license-review.'
