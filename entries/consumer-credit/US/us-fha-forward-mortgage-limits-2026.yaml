notes: 'FHA''s 2026 nationwide forward mortgage limits from HUD Mortgagee Letter 2025-23 (December 11, 2025), effective
  for FHA case numbers assigned on or after January 1, 2026: the floor that applies in low-cost areas (65 percent
  of the national conforming limit), the ceiling in high-cost areas (150 percent), and the higher ceiling for the
  special exception areas of Alaska, Hawaii, Guam and the Virgin Islands, each for one- to four-unit properties.
  Each county''s own FHA limit lies between the floor and the applicable ceiling; HUD publishes the county list
  separately. The national conforming limit the percentages refer to is the FHFA baseline (us-fhfa-conforming-loan-limits-2026-by-county).
  Works of the US federal government carry no copyright in the United States, but the cited documents state no reuse
  terms, so the licence is recorded as unstated and the entry held at license-review.'
