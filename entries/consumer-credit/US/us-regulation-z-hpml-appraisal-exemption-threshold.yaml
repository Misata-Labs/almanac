notes: The loan amount at or below which a higher-priced mortgage loan is exempt from the appraisal requirements
  of 12 CFR 1026.35(c), adjusted each January 1 by the change in the CPI-W, as the official interpretation (comment
  35(c)(2)(ii)-3) lists it by period in the eCFR text as of 2026-10-29. The commentary lists the amount for each
  calendar year; the last listed year is 2026, which sets valid_to. US federal government works carry no copyright,
  but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded as unstated and
  the entry held at license-review.
