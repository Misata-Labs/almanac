notes: The amount above which an extension of consumer credit not secured by real property or a dwelling is exempt
  from Regulation Z (12 CFR 1026.3(b)), adjusted each January 1 by the change in the CPI-W, as the official interpretation
  (comment 3(b)-3) lists it by period in the eCFR text as of 2026-10-29. The commentary lists the amount for each
  calendar year; the last listed year is 2026, which sets valid_to. US federal government works carry no copyright,
  but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded as unstated and
  the entry held at license-review.
