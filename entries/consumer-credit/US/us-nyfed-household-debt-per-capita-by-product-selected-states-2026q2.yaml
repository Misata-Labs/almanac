notes: 'Debt balance per capita (per person with a credit report) at 2026Q2 for the eleven states the report follows
  (AZ, CA, FL, IL, MI, NJ, NV, NY, OH, PA, TX) and the US as a whole, split by loan product as the report''s ''Composition
  of Debt Balance per Capita by State'' page publishes it, in thousands of US dollars. Columns in the page''s order:
  Mortgage, HE Revolving, Auto Loan, Credit Card, Student Loan, Other. Source: the Quarterly Report on Household
  Debt and Credit data workbook, built from the New York Fed Consumer Credit Panel / Equifax, a nationally representative
  5 percent sample of credit-report data. The publisher is a US federal body and the resource carries no licence
  statement, so the licence is recorded as unstated and the entry held at license-review.'
