id: us-fcra-adverse-information-time-limits
title: United States Fair Credit Reporting Act time limits on adverse information in consumer reports, 15 U.S.C.
  1681c(a) and (b)
kind: rule
domain: consumer-credit
region: US
status: license-review
tier: B
valid_from: '2003-12-04'
valid_to: null
tags:
- fcra
- credit-reports
- credit-bureau
- retention-limits
- 15-usc-1681c
use_cases:
- credit-risk
- collections
- kyc-onboarding
- banking-demo
spec:
  implementation: almanac.rules.lookup_table
  parameters:
    exemption_thresholds:
      credit_transaction_principal_usd: 150000
      life_insurance_face_amount_usd: 150000
      employment_annual_salary_usd: 75000
    rows:
      bankruptcy_cases:
        max_years: 10
        section: 1681c(a)(1)
      civil_suits_judgments_and_arrest_records:
        max_years: 7
        section: 1681c(a)(2)
        note: or the governing statute of limitations if longer
      paid_tax_liens:
        max_years: 7
        section: 1681c(a)(3)
      collection_and_charged_off_accounts:
        max_years: 7
        section: 1681c(a)(4)
      other_adverse_items:
        max_years: 7
        section: 1681c(a)(5)
  vectors:
  - input:
      key: bankruptcy_cases
      column: max_years
    expected: 10
    origin: source
  - input:
      key: collection_and_charged_off_accounts
      column: max_years
    expected: 7
    origin: source
  - input: other_adverse_items
    expected: true
    origin: source
  - input: criminal_convictions
    expected: false
    origin: derived
    note: records of convictions are excluded from the seven-year limit
