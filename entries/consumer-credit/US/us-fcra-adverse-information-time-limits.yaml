  value: '2003-12-04'
  method: derived
  rationale: The section's amendment history shows its most recent substantive amendment in the 2003 Act (Pub. L.
    108-159), whose enactment date subsection (g)(3)(A) states; the seven-year and ten-year limits themselves date
    from earlier amendments, and the exemption amounts from the 1996 amendment.
