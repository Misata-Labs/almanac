notes: 'How long each category of adverse information may stay in a consumer report under section 605 of the Fair
  Credit Reporting Act: the longer limit for bankruptcy cases and the common limit for civil judgments, paid tax
  liens, collection accounts and other adverse items, measured from the dates the statute names. The exemption_thresholds
  carry the transaction sizes above which subsection (b) lifts these limits. Useful for ageing out tradelines and
  public records in synthetic credit files. US federal statutes carry no copyright, but the govinfo page states
  no reuse terms, so the licence is recorded as unstated and the entry held at license-review; the HTML form of
  the source makes the entry tier B.'
