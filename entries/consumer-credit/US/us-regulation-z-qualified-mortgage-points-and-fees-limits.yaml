notes: 'The points-and-fees limits a covered mortgage must stay within to be a qualified mortgage under 12 CFR 1026.43(e)(3):
  five tiers by loan amount, with a percentage of the loan amount in tiers A, C and E and a dollar cap in tiers
  B and D. Tier A applies at or above tier_a_min_loan_usd, tier B from tier_b_min_loan_usd up to it, tier C from
  tier_c_min_loan_usd, tier D from tier_d_min_loan_usd, and tier E below that. The rows give the inflation-adjusted
  figures for each calendar year as the official interpretation (comment 43(e)(3)(ii)-1) lists them in the eCFR
  text as of 2026-10-29; the percentages are the same in every year. US federal government works carry no copyright,
  but neither the eCFR API nor the regulation text states reuse terms, so the licence is recorded as unstated and
  the entry held at license-review.'
