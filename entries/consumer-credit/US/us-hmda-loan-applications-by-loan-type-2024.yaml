- parameter: shares
  value: counts / total
  method: derived
  rationale: Shares are the published counts divided by their sum over the listed categories.
- parameter: mean_loan_amount_usd
  value: loan_amount_sum_usd / counts
  method: derived
  rationale: The API returns count and sum; the mean is their quotient.
