notes: 'The points-and-fees coverage test for high-cost mortgages under the Home Ownership and Equity Protection
  Act as implemented in 12 CFR 1026.32(a)(1)(ii): a loan is high-cost when points and fees exceed a fixed percentage
  of the loan amount at or above the indexed loan-amount threshold, or the lesser of a higher percentage and an
  indexed dollar cap below it. The rows give the two indexed figures for each calendar year as the official interpretation
  lists them in the eCFR text as of 2026-10-29; the percentages, the APR triggers and the prepayment penalty limits
  come from the regulation text itself. US federal government works carry no copyright, but neither the eCFR API
  nor the regulation text states reuse terms, so the licence is recorded as unstated and the entry held at license-review.'
