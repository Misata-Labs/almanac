notes: 'Interest rates on credit card plans (all accounts and accounts assessed interest), new-auto instalment loans
  of 48, 60 and 72 months and 24-month personal loans at commercial banks from the Federal Reserve G.19 release
  through the Data Download Program''s Terms of Credit package. The series is quarterly: the Board surveys once
  a quarter and publishes the figure in the month shown, leaving the other months as ND, so the period labels are
  the months in which the observations fall. Not seasonally adjusted. The publisher is a US federal body and the
  resource carries no licence statement, so the licence is recorded as unstated and the entry held at license-review.'
