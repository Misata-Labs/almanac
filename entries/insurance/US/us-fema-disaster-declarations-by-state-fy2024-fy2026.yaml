notes: Distinct disasters declared in fiscal years 2024 to 2027 by state or territory, counted from the OpenFEMA
  Disaster Declarations Summaries filtered to fyDeclared >= 2024 (one row per designated area, disasters counted
  once). A disaster spanning several state or territory values is counted under each. OpenFEMA datasets are refreshed
  as declarations and assistance totals change, so the content hash tracks the day's file. The publisher is a US
  federal body and the resource carries no licence statement, so the licence is recorded as unstated and the entry
  held at license-review.
