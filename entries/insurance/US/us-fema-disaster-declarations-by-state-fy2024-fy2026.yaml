notes: 'Distinct disasters declared in fiscal years 2024 to 2026 by state or territory, counted from the OpenFEMA
  Disaster Declarations Summaries filtered to fiscal years 2024 to 2026 (one row per designated area, disasters
  counted once). A disaster spanning several state or territory values is counted under each. The OpenFEMA query
  is pinned to closed fiscal years, a fixed column list and an explicit sort, but OpenFEMA refreshes its tables
  daily as amendments add designated areas and assistance totals grow, so the content hash tracks the day''s data:
  re-indexed daily; rebuild before release. The publisher is a US federal body and the resource carries no licence
  statement, so the licence is recorded as unstated and the entry held at license-review.'
