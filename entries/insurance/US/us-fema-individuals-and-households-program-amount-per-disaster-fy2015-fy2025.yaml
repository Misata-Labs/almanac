notes: 'Total dollars approved under FEMA''s Individuals and Households Program for each disaster declared in fiscal
  years 2015 to 2025 that has a positive amount in the FEMA Web Disaster Summaries dataset: an empirical distribution
  of claim-programme severity per event, with the disaster numbers and the number of approved Individual Assistance
  registrants in parallel lists. Amounts are cumulative to the file date and continue to grow for recent events.
  The median and 90th-percentile tests allow for sampling noise around the published values. OpenFEMA datasets are
  refreshed as declarations and assistance totals change, so the content hash tracks the day''s file. The publisher
  is a US federal body and the resource carries no licence statement, so the licence is recorded as unstated and
  the entry held at license-review.'
