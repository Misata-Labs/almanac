notes: Distinct disaster numbers declared in each federal fiscal year (fyDeclared), counted from the OpenFEMA Disaster
  Declarations Summaries file, which has one row per declared disaster and designated area. The columns split the
  count by declaration type (DR major disaster, EM emergency, FM fire management) and give the number of designated-area
  rows in the year. Fiscal years run from 1 October to 30 September; 2026 is excluded as incomplete. The busiest
  year was FY2020. OpenFEMA datasets are refreshed as declarations and assistance totals change, so the content
  hash tracks the day's file. The publisher is a US federal body and the resource carries no licence statement,
  so the licence is recorded as unstated and the entry held at license-review.
