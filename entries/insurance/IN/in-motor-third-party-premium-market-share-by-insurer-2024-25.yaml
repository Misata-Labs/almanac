notes: Market share of each general insurer in motor third-party gross direct premium for FY 2024-25 from Annexure
  3 of the IRDAI Annual Report 2024-25, the table IRDAI uses to set motor TP obligations for FY 2025-26 (premium
  total 58,958 crore). Shares are the published percentages divided by 100; the premium column in crore is kept
  in parameters exactly as pypdf reads it, and four cells there (Magma, Royal Sundaram, Universal Sompo, Oriental)
  are split by a stray space in the extracted text. Kshema General Insurance has a zero share. IRDAI publishes the
  document without a licence statement, so the entry stays at license-review.
