notes: Number of registered insurers and reinsurers in India as at 31 March 2025 from Table I.18 of the IRDAI Annual
  Report 2024-25, by type (life, general, specialized, stand-alone health, reinsurer) and ownership. The table's
  own note says the count includes Reliance Health Insurance (directed to stop selling new policies in 2019) and
  Sahara India Life (business transferred to SBI Life in 2023); the narrative in paragraph I.3.1 groups the two
  specialized insurers with general insurers (27). IRDAI publishes the document without a licence statement, so
  the entry stays at license-review.
