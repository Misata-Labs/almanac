notes: 'Outcome of individual-business death claims handled by Indian life insurers in FY 2024-25 from Table I.11
  of the IRDAI Annual Report 2024-25: of 10,34,455 claims (Indian digit grouping, 1,034,455), the shares paid, repudiated
  (section 45 of the Insurance Act), rejected on policy terms, unclaimed and pending at year end are the published
  percentages divided by 100 (they sum to 0.9999). The policy counts and the group-business figures (16,33,833 lives,
