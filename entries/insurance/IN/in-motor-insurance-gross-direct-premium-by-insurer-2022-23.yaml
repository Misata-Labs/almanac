notes: Audited FY 2022-23 gross direct premium (INR crore) of 24 general insurers split into motor own damage, motor
  third party, total motor and total premium, published by IRDAI as the basis for FY 2023-24 motor third-party obligations.
  Rows are keyed by the insurer's short name as printed; the parsed columns reproduce the printed grand totals (31,782.95
  / 49,497.03 / 81,279.98 / 2,14,833.09, the last in Indian digit grouping). A more recent market-share table for
  FY 2024-25 is carried in a separate entry from the IRDAI annual report. IRDAI publishes the document without a
  licence statement, so the entry stays at license-review.
