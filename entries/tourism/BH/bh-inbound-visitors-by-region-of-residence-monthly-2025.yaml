notes: Monthly inbound visitors (arrivals) to Bahrain in 2025 by region of residence, from the Inbound Tourism Survey
  published by the Bahrain Tourism & Exhibitions Authority. Visitors resident in Saudi Arabia are the series value;
  the other GCC states, Europe, Asia, the Middle East, the Americas and other countries ride along as columns. The
  source publishes no all-regions total; summing the seven figures gives one. The Bahrain open data portal publishes
  no licence for this dataset (its catalogue licence field is empty), so the entry stays at license-review until
  the Information & eGovernment Authority's reuse terms are confirmed.
