assumed:
- parameter: distributions.*.parameters.shares
  value: count / sum of counts within each group
  method: derived
  rationale: The publisher gives counts; shares are each count over the group total. Nights of stay ride along per
    nationality group; nights divided by guests gives the mean length of stay.
tests:
- statistic: share["Five Star","Qataris"]
  expected: 0.32019008
  tolerance: 0.005
- statistic: sum_of_shares["Five Star"]
  expected: 1
  tolerance: 1.0e-06
- statistic: share["Four Star","Asians (except Arabs)"]
  expected: 0.42884204
  tolerance: 0.005
- statistic: sum_of_shares["Four Star"]
  expected: 1
  tolerance: 1.0e-06
- statistic: share["Three Star","Asians (except Arabs)"]
  expected: 0.4958958
  tolerance: 0.005
- statistic: sum_of_shares["Three Star"]
