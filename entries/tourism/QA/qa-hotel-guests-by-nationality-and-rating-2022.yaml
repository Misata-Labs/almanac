notes: Hotel guests in Qatar in 2022 by nationality group (Qataris, other GCC, other Arabs, Asians, Africans, Europeans,
  Americans, Australians and New Zealanders) within each hotel rating (five, four, three, two and one star), with
  the nights of stay for the same cells. 2022 is the latest year on the portal for this table. The portal's catalogue
  record for the dataset gives the licence as CC BY with the Creative Commons Attribution 4.0 licence URL.
