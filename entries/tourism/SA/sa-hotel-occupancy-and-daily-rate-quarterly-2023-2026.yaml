notes: Quarterly national occupancy rate (0 to 1; value is hotels) and average daily rate in Saudi riyals for hotels
  and for serviced apartments and other hospitality facilities, from Tables 1.2 and 1.3 of GASTAT's Q2 2026 Tourism
  Establishments Statistics workbook (Ministry of Tourism data, preliminary). Hotel rates peak in the second quarter
  in some years because of the Hajj and Umrah seasons. Average daily rates exclude VAT and municipal fees. Neither
  file carries a licence statement, so the entry stays at license-review; GASTAT's website use policy permits reuse,
  including commercial reuse, with GASTAT acknowledged as the source and changes indicated.
