  tolerance: 0
notes: Licensed tourist hospitality facilities, occupancy rate (share of rooms sold, 0 to 1) and average daily rate
  in Saudi riyals by administrative region for the second quarter of 2026, for hotels and for serviced apartments
  and other hospitality facilities, from GASTAT's Tourism Establishments Statistics workbook (Ministry of Tourism
  Tourism Monitoring Platform, preliminary data). Average daily rates exclude VAT and municipal fees. Region names
  are the publication's English labels. Neither file carries a licence statement, so the entry stays at license-review;
  GASTAT's website use policy permits reuse, including commercial reuse, with GASTAT acknowledged as the source
  and changes indicated.
