assumed:
- parameter: rows
  value: quarterly averages
  method: derived
  rationale: Occupancy and average daily rate are the 'Quarterly average' columns of Tables 2.3, 2.4, 2.9 and 2.10,
    rounded (occupancy to 4 decimals, rates to 2); facility counts are copied from Table 2.1.
