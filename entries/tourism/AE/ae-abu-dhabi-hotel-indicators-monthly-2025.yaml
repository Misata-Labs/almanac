notes: Key indicators of hotel establishments in the Emirate of Abu Dhabi by month in 2025, from Table 1 (key indicators)
  and Table 9 (revenues by type, AED million) of SCAD's monthly Hotel Establishments Statistics releases, compiled
  by the Department of Culture and Tourism and marked preliminary. value is the occupancy rate as a ratio; average_room_rate_aed
  is the average daily room rate and revpar_aed the revenue per available room, both in dirhams; guests and guest
  nights are in thousands. SCAD's publication list carries no monthly hotel release for 2025-05, 2025-11, so those
  months are absent from the series. SCAD's terms of use (https://www.scad.gov.ae/terms-of-use) state that its publications
  and tables may be reproduced without further permission provided SCAD is acknowledged as the source; the page
  is rendered per request and is referenced rather than hashed, so the entry stays at licence review.
