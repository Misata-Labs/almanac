assumed:
- parameter: distributions[*].parameters.counts
  value: published thousands x 1000, rounded to whole guests
  method: derived
  rationale: Table 4 publishes guests in thousands with three decimals, which is a whole number of guests.
- parameter: distributions[*].parameters.shares
  value: count / sum of the nine world-region counts
  method: derived
  rationale: SCAD publishes counts; each share is the count divided by the sum of the counts in its distribution.
tests:
- statistic: share["2025-12","Europe"]
  expected: 0.288776
  tolerance: 0.005
- statistic: share["2025-07","GCC"]
  expected: 0.16454
  tolerance: 0.005
- statistic: sum_of_shares["2025-01"]
  expected: 1
  tolerance: 0.0001
notes: Hotel guests in the Emirate of Abu Dhabi by world region of nationality for each month of 2025 with a SCAD
  release, from Table 4 of the monthly Hotel Establishments Statistics (preliminary data from the Department of
  Culture and Tourism). Condition on the booking month to draw a guest's source market with the month's own mix.
  Region labels are SCAD's own; 'UAE' is reported alongside the GCC and other regions as published. SCAD's publication
  list carries no monthly hotel release for 2025-05, 2025-11, so those months are absent from the series. SCAD's
  terms of use (https://www.scad.gov.ae/terms-of-use) state that its publications and tables may be reproduced without
  further permission provided SCAD is acknowledged as the source; the page is rendered per request and is referenced
  rather than hashed, so the entry stays at licence review.
