notes: Monthly nights spent by residents and non-residents at hotels, holiday and other short-stay accommodation,
  camping grounds, recreational vehicle parks and trailer parks (NACE Rev. 2 I55.1 to I55.3) for 2025 from Eurostat
  dataflow tour_occ_nim. The series carries the seasonal profile of tourism demand. Germany is the primary series;
  the other nine member states ride along as columns keyed by their two-letter geo code. Eurostat's copyright notice
  states that its data are released under the Creative Commons Attribution 4.0 International licence; the notice
  page renders dynamically and is referenced rather than hashed.
