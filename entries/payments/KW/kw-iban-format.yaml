assumed:
- parameter: letter_values
  value: A=10 to Z=35
  method: derived
  rationale: ISO 13616 conversion table, as printed in the Central Bank of Bahrain's IBAN standard (Table 1).
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
notes: 'Kuwaiti International Bank Account Numbers as the Central Bank of Kuwait specifies them, effective 1 January
  2011: 30 characters made of the country code KW, two ISO 7064 MOD 97-10 check digits, a four-letter bank code
  and a 22-character account number formed by left-padding the bank''s existing account number with zeros. The vectors
  are the CBK''s own example in print and electronic form.'
