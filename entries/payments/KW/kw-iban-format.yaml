id: kw-iban-format
title: 'Kuwait IBAN format: 30 characters, KW, check digits, four-letter bank code and 22-character account number
  (CBK)'
kind: rule
domain: payments
region: KW
status: license-review
tier: B
valid_from: '2011-01-01'
valid_to: null
tags:
- gcc
- banking
- payments
- iban
- check-digit
- kuwait
use_cases:
- banking-demo
- payments-demo
- kyc-onboarding
- data-quality-validation
spec:
  implementation: almanac.rules.iban
  parameters:
    modulus: 97
    complement_base: 98
    valid_remainder: 1
    letter_values:
      A: 10
      B: 11
      C: 12
      D: 13
      E: 14
      F: 15
      G: 16
      H: 17
      I: 18
      J: 19
      K: 20
      L: 21
      M: 22
      N: 23
      O: 24
      P: 25
      Q: 26
      R: 27
      S: 28
      T: 29
      U: 30
      V: 31
      W: 32
      X: 33
      Y: 34
      Z: 35
    lengths:
      KW: 30
    structure:
      country_code: KW
      check_digits: 2
      bank_code: four letters
      account_number: 22 alphanumeric characters, left-padded with zeros
  vectors:
  - input: KW81CBKU0000000000001234560101
    expected: true
    origin: source
    note: electronic format example
  - input: KW81 CBKU 0000 0000 0000 1234 5601 01
    expected: true
    origin: source
    note: print format example
  - input:
      country: KW
      bban: CBKU0000000000001234560101
    expected: '81'
    origin: source
    note: check digits of the example
  - input: KW81CBKU000000000000123456010
    expected: false
    origin: derived
    note: 29 characters
