notes: 'Credit and debit cards issued by local banks in Kuwait, in thousands: cards valid at the end of each month
  (the series value is the total) and cards issued during the month, January to September 2026, from the plastic
  cards table of the Central Bank of Kuwait''s Monthly Monetary Statistical Bulletin (September 2026 issue). ATM
  and point-of-sale machine counts in the same table are left out because the extracted text runs the two counts
  together without a separator. The bulletin publishes no reuse licence, so the entry stays at license-review.'
