assumed:
- parameter: tra_bands
  value: EUR 500 0,01 0,005
  method: derived
  rationale: The Annex writes reference fraud rates with decimal commas (for example 0,01); the parameters restate
    them as decimal numbers in percent.
- parameter: previous_cumulative and previous_count
  value: payments since the last strong customer authentication, excluding the payment being tested
  method: derived
  rationale: Article 11(b) and 16(b) speak of 'previous' transactions; Article 11(c) does not say whether the current
    one counts, and the rule reads both limits the same way.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 3
  tolerance: 0
- statistic: max[etv_eur]
  expected: 500
  tolerance: 0
notes: 'When a payment service provider in the European Union may skip strong customer authentication under the
  PSD2 regulatory technical standards: a contactless payment at the point of sale or a low-value remote payment
  within its single-payment limit, provided either the cumulative amount or the count of payments since the last
  authentication stays within its limit; or a remote payment the provider''s real-time transaction risk analysis
  rates low risk, up to the exemption threshold value its fraud rate for the payment type qualifies for. The text
  is the regulation as adopted, published by legislation.gov.uk because EUR-Lex could not be reached; later EU amendments,
  which changed other articles, could not be checked against the consolidated text. The UK has its own version under
  the FCA and is not covered here. The legislation.gov.uk resource carries no licence statement, although the site
  publishes legislation under the Open Government Licence v3.0, so the licence is recorded as unstated and the entry
  held at license-review. Provisions are cited in legislation.gov.uk''s HTML rendering, which makes the entry tier
  B: the XML rendering of these versions lists unapplied effects whose attributes are reordered on every render,
  so its bytes do not stay fixed.'
