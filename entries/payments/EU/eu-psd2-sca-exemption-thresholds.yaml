id: eu-psd2-sca-exemption-thresholds
title: 'European Union PSD2 strong customer authentication exemptions: contactless, low-value remote and transaction
  risk analysis limits'
kind: rule
domain: payments
region: EU
status: license-review
tier: B
valid_from: '2019-09-14'
valid_to: null
tags:
- compliance
- fraud
- psd2
- strong-customer-authentication
- card-payments
- 3ds
use_cases:
- fraud-detection-demo
- payments-demo
- fintech-demo
- data-quality-validation
spec:
  implementation: almanac.rules.eu_sca_exemptions
  parameters:
    currency: EUR
    contactless:
      max_amount_eur: 50
      max_cumulative_eur: 150
      max_consecutive: 5
      article: '11'
    low_value_remote:
      max_amount_eur: 30
      max_cumulative_eur: 100
      max_consecutive: 5
      article: '16'
    tra_bands:
    - etv_eur: 500
      card_reference_fraud_rate_percent: 0.01
      credit_transfer_reference_fraud_rate_percent: 0.005
    - etv_eur: 250
      card_reference_fraud_rate_percent: 0.06
      credit_transfer_reference_fraud_rate_percent: 0.01
    - etv_eur: 100
      card_reference_fraud_rate_percent: 0.13
      credit_transfer_reference_fraud_rate_percent: 0.015
    tra_article: 18 and Annex
  vectors:
  - input:
      exemption: contactless
      amount: 50
      previous_cumulative: 150
      previous_count: 9
    expected: true
    origin: source
  - input:
      exemption: contactless
      amount: 51
    expected: false
    origin: derived
  - input:
      exemption: contactless
      amount: 20
      previous_cumulative: 200
      previous_count: 5
    expected: true
    origin: source
    note: count limit met although the cumulative limit is exceeded
  - input:
      exemption: contactless
      amount: 20
      previous_cumulative: 200
      previous_count: 6
    expected: false
    origin: derived
  - input:
      exemption: low_value_remote
      amount: 30
      previous_cumulative: 0
      previous_count: 0
    expected: true
    origin: source
  - input:
      exemption: low_value_remote
      amount: 10
      previous_cumulative: 101
      previous_count: 6
    expected: false
    origin: derived
  - input:
      exemption: tra_threshold
      payment_type: card
      fraud_rate_percent: 0.01
    expected: 500
    origin: source
  - input:
      exemption: tra_threshold
      payment_type: card
      fraud_rate_percent: 0.06
    expected: 250
    origin: source
  - input:
      exemption: tra_threshold
      payment_type: credit_transfer
      fraud_rate_percent: 0.015
    expected: 100
    origin: source
  - input:
      exemption: tra_threshold
      payment_type: card
      fraud_rate_percent: 0.2
    expected: null
    origin: derived
    note: fraud rate above every reference rate
  - input:
      exemption: tra
      payment_type: card
      fraud_rate_percent: 0.05
      amount: 300
    expected: false
    origin: derived
