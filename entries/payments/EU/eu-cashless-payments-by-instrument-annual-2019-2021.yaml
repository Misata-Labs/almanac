notes: 'Annual number of payment transactions involving non-MFIs sent from the euro area (changing composition),
  in millions (UNIT_MULT 6 in the source), from the ECB payments statistics dataset PSS: all payment services as
  the primary series, with card payments by cards issued by resident PSPs, credit transfers, direct debits, cheques
  and e-money payment transactions as columns. The query asked for 2019 to 2024; the portal served 3 years ending
  2021, the last reference year compiled under the earlier payments statistics methodology. The ECB''s website disclaimer
  states that users may make free use of information obtained from it provided it is reproduced accurately and the
  ECB is cited as the source; the page renders dynamically, so the clause is carried by the licence identifier ECB-free-use-with-attribution
  documented in CONTRIBUTING.md.'
