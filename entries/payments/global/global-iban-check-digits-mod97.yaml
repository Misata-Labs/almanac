notes: 'The check digits of every International Bank Account Number (ISO 13616): move the country code and check digits to the end, replace letters by 10 to 35, and
  require the number to leave remainder 1 modulo 97; to issue check digits, put 00 in their place and subtract the remainder from 98. The procedure, the letter table
  and the worked example are taken from the IBAN guidelines of the Central Bank of the Republic of Azerbaijan, which also states the Azerbaijani IBAN length of 28.
  The ISO 13616 registry of country formats is maintained by SWIFT and could not be fetched, so ''lengths'' holds only the lengths an official source fetched here
  states; a country not listed is checked for its check digits only. The PDF states no licence, so the entry is held at license-review.'
