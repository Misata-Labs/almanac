  tolerance: 1.0e-05
notes: Share of Pix transactions by the payer's state in June 2025, derived from the Banco Central do Brasil Pix
  statistics service table of transactions by municipality (5571 rows, one month selected with an OData filter and
  the payer-side columns projected). Keys are ASCII slugs of the state names; the published spelling and region
  sit under source_labels and regions. The BCB open data catalogue (dadosabertos.bcb.gov.br) lists this series under
  the Open Database License; the catalogue API answers vary between requests, so that record is referenced here
  rather than hashed as evidence.
