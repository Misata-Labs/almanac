assumed:
- parameter: distribution.parameters.shares
  value: sum over municipalities of QT_PagadorPF + QT_PagadorPJ per state / total
  method: derived
  rationale: The service publishes transaction counts per municipality split by payer type; counts are summed per
    state (payer side, natural and legal persons together). Rows the publisher could not assign to a municipality
    are kept as the category nao_informado.
