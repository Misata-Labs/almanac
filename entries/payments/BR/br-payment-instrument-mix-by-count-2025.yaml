  tolerance: 0.001
- statistic: sum_of_shares
  expected: 1
  tolerance: 1.0e-05
notes: Mix of payment instruments by number of transactions in Brazil over the four quarters of 2025, derived from
  the quarterly payment-instrument statistics of the Banco Central do Brasil (Olinda MPV_DadosAbertos service).
  Counts are kept in thousands as published. The BCB open data catalogue (dadosabertos.bcb.gov.br) lists this series
  under the Open Database License; the catalogue API answers vary between requests, so that record is referenced
  here rather than hashed as evidence.
