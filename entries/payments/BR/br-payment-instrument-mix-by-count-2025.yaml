assumed:
- parameter: distribution.parameters.shares
  value: sum of the four 2025 quarterly counts per instrument / sum over instruments
  method: derived
  rationale: The service publishes quarterly counts per instrument; the shares are their quotient over the year.
    ATM withdrawals are left out because they are not payments, and instruments with a zero count for the year are
    left out so every category can be sampled.
