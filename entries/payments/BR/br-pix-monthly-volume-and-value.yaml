notes: Monthly Pix transactions and settled value from the Banco Central do Brasil payment-instrument statistics
  (Olinda MPV_DadosAbertos service), covering settlements inside and outside the SPI including payment orders and
  returns. The query asks for every month from 2024-01 onward; the service answered with 33 months ending 2026-09.
  The publisher warns that figures for transactions settled outside the SPI can be revised retroactively, so a later
  re-fetch may change the content hash; the figures recorded here are those served on the access date. The dataset
  is released under the Open Database License according to the BCB open data catalogue, whose API answers vary between
  requests and is therefore referenced rather than hashed.
