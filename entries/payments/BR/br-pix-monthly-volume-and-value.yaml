assumed:
- parameter: series[*].value (pix_average_ticket_brl)
  value: value_brl_millions * 1e6 / (quantity_thousands * 1e3), rounded to cents
  method: derived
  rationale: The source publishes the monthly count (thousands) and the settled value (BRL millions); the average
    ticket is their quotient and is not itself published.
