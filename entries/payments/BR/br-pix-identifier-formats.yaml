assumed:
  - parameter: fields.cpf.pattern
    value: '^\d{11}$'
    method: derived
    rationale: The specification writes the CPF pattern as /^\d{11}$/; the surrounding slashes are regex-literal delimiters, not pattern characters, and are removed.
  - parameter: fields.end_to_end_id.min_length, fields.end_to_end_id.max_length
    value: 32
    method: derived
    rationale: Copied from the schema's minLength and maxLength, which restate the fixed width already implied by the pattern.
tests:
  - {statistic: vector_pass_fraction, expected: 1, tolerance: 0}
  - {statistic: vector_count, expected: 18, tolerance: 0}
notes: |
  Formats are taken from the OpenAPI document Banco Central do Brasil publishes for the Pix API
  (version 2.11.0-rc1, commit 3ebbd6a1). Positive vectors are the specification's own example
  values. The CNPJ field has accepted alphanumeric values since API version 2.9.0, which the
  changelog attributes to Instrução Normativa RFB nº 2229 of 15 October 2024; the digits-only
  pattern for CPF is unchanged. One example EndToEndId in the specification is 34 characters
  long and therefore fails the specification's own 32-character constraint; it is kept as a
  negative vector and flagged for review. Pattern matching is whole-string. The pinned version
  is a release candidate; valid_from is the date of the pinned revision and valid_to is open.
