id: br-pix-identifier-formats
title: Brazil Pix identifier formats (txid, EndToEndId, CPF, CNPJ, ISPB, amount)
kind: rule
domain: payments
region: BR
status: verified
tier: A
valid_from: 2026-10-29
valid_to: null
spec:
  implementation: almanac.rules.br_pix_identifiers
  parameters:
    fields:
      txid:
        pattern: "[a-zA-Z0-9]{26,35}"
      end_to_end_id:
        pattern: "[a-zA-Z0-9]{32}"
        min_length: 32
        max_length: 32
      cpf:
        pattern: '^\d{11}$'
      cnpj:
        pattern: "^[0-9A-Z]{14}$"
      ispb:
        pattern: "^[0-9A-Z]{8}$"
      amount:
        pattern: '\d{1,10}\.\d{2}'
  vectors:
    - {input: {field: txid, value: "7978c0c97ea847e78e8849634473c1f1"}, expected: true, origin: source}
    - {input: {field: txid, value: "cd1fe328c875481285a6f233ae41b662"}, expected: true, origin: source}
    - {input: {field: txid, value: "abcdefghijklmnopqrstuvwxy"}, expected: false, origin: derived, note: 25 characters}
    - {input: {field: txid, value: "7978c0c9-7ea8-47e7-8e88-49634473c1f1"}, expected: false, origin: derived, note: hyphens are outside the alphabet}
    - {input: {field: end_to_end_id, value: "E12345678202009091221abcdef12345"}, expected: true, origin: source}
    - {input: {field: end_to_end_id, value: "E1234567820200909122120200808008"}, expected: true, origin: source}
    - {input: {field: end_to_end_id, value: "E12345678202009091221ghijk78901234"}, expected: false, origin: source, note: 34-character example in the specification contradicts its own 32-character bound}
    - {input: {field: cnpj, value: "12345678000195"}, expected: true, origin: source}
    - {input: {field: cnpj, value: "12345678000195a"}, expected: false, origin: derived, note: 15 characters}
    - {input: {field: cpf, value: "12345678901"}, expected: true, origin: derived, note: eleven digits}
    - {input: {field: cpf, value: "1234567890"}, expected: false, origin: derived, note: ten digits}
    - {input: {field: ispb, value: "81102623"}, expected: true, origin: source}
    - {input: {field: ispb, value: "52780028"}, expected: true, origin: source}
    - {input: {field: amount, value: "100.00"}, expected: true, origin: source}
    - {input: {field: amount, value: "110.00"}, expected: true, origin: source}
    - {input: {field: amount, value: "3.50"}, expected: true, origin: source}
    - {input: {field: amount, value: "100"}, expected: false, origin: derived, note: two decimals are mandatory}
    - {input: {field: amount, value: "100,00"}, expected: false, origin: derived, note: comma separator}
