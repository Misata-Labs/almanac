notes: 'Quarterly counts of transactions (thousands) by payment instrument from the Banco Central do Brasil payment-instrument
  statistics (Olinda MPV_DadosAbertos service, quarterly table): Pix as the primary series with TED, TEC, cheques,
  boletos, DOC, credit, debit and prepaid cards, intrabank transfers, utility and tax collection agreements (convênios),
  direct debits and ATM withdrawals as columns. The query asks for every quarter from 2025 Q1 onward; the service
  answered with 6 quarters ending 2026-Q2. The publisher warns that figures for Pix transactions settled outside
  the SPI can be revised, so a later re-fetch may change the content hash. The BCB open data catalogue (dadosabertos.bcb.gov.br)
  lists this series under the Open Database License; the catalogue API answers vary between requests, so that record
  is referenced here rather than hashed as evidence.'
