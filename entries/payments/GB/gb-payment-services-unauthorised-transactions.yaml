notes: 'Rules a UK payment service provider applies to an unauthorised payment transaction under the Payment Services
  Regulations 2017, read from legislation.gov.uk''s versions as of 2026-10-29: it refunds the payer by the end of
  the business day after it becomes aware of the transaction (unless it reasonably suspects fraud and notifies the
  appropriate authority); it may hold the payer liable for no more than the stated cap for losses from a lost, stolen
  or misappropriated instrument (with exceptions for fraud, gross negligence and losses the payer could not detect);
  and the payer must notify within the stated months of the debit date to be entitled to redress. valid_from is
  the latest start of the three regulations'' current versions. The legislation.gov.uk resource carries no licence
  statement, although the site publishes legislation under the Open Government Licence v3.0, so the licence is recorded
  as unstated and the entry held at license-review. Provisions are cited in legislation.gov.uk''s HTML rendering,
  which makes the entry tier B: the XML rendering of these versions lists unapplied effects whose attributes are
  reordered on every render, so its bytes do not stay fixed.'
