notes: 'For Bahrain, one row per year: personal remittances paid in current US dollars (indicator BM.TRF.PWKR.CD.DT:
  personal transfers plus compensation of employees paid to non-residents, from IMF balance of payments data and
  World Bank staff estimates) and the average total cost, as a percentage of the amount sent, of sending USD 200
  from Bahrain across the providers in the World Bank''s Remittance Prices Worldwide database (indicator SI.RMT.COST.OB.ZS).
  Remittances paid are published for 2010 to 2024 and the cost for 2016 to 2023; a column is null where that indicator
  has no value (2010, 2011, 2012, 2013, 2014, 2015, 2024). The outflow sets the annual scale of a synthetic outbound
  remittance ledger and the cost prices its fees; the destination mix can be taken from the UN DESA migrant-stock-by-origin
  entry. Rows are keyed by year. Data last updated 2026-10-08. The World Bank licenses its data under CC BY 4.0.'
