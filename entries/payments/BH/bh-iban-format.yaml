tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
notes: 'Bahraini International Bank Account Numbers as the Central Bank of Bahrain''s 2011 ISO IBAN standard specifies
  them: 22 characters made of the country code BH, two MOD 97-10 check digits, the first four letters of the account-holding
  bank''s BIC, and the 14-character core account number padded with leading zeros. The vectors are the standard''s
  own examples and its worked check-digit generation (remainder 48, check digits 98 - 48 = 50).'
