id: bh-iban-format
title: 'Bahrain IBAN format: 22 characters, BH, check digits, four-letter bank code from the BIC and 14-character
  account (CBB)'
kind: rule
domain: payments
region: BH
status: license-review
tier: B
valid_from: '2011-02-16'
valid_to: null
tags:
- gcc
- banking
- payments
- iban
- check-digit
- bahrain
use_cases:
- banking-demo
- payments-demo
- kyc-onboarding
- data-quality-validation
spec:
  implementation: almanac.rules.iban
  parameters:
    modulus: 97
    complement_base: 98
    valid_remainder: 1
    letter_values:
      A: 10
      B: 11
      C: 12
      D: 13
      E: 14
      F: 15
      G: 16
      H: 17
      I: 18
      J: 19
      K: 20
      L: 21
      M: 22
      N: 23
      O: 24
      P: 25
      Q: 26
      R: 27
      S: 28
      T: 29
      U: 30
      V: 31
      W: 32
      X: 33
      Y: 34
      Z: 35
    lengths:
      BH: 22
    structure:
      country_code: BH
      check_digits: 2
      bank_identifier: first four letters of the bank's BIC
      account_number: 14 characters, left-padded with zeros
  vectors:
  - input: BH50NBOB00001299123456
    expected: true
    origin: source
    note: Example 1
  - input: BH89SCBLBHD18123456701
    expected: true
    origin: source
    note: Example 2, alphanumeric account
  - input: BH50 NBOB 0000 1299 1234 56
    expected: true
    origin: source
    note: print format of Example 1
  - input:
      country: BH
      bban: NBOB00001299123456
    expected: '50'
    origin: source
    note: Annexure I check digit generation
  - input: BH51NBOB00001299123456
    expected: false
    origin: derived
