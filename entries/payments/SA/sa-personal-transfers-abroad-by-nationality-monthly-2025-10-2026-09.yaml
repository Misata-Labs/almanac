notes: Monthly bank sales of foreign exchange attributed to personal transfers abroad, in millions of riyals, split
  by Saudis and non-Saudis, from Table 25 (Bank Purchases and Sales of Foreign Exchange, section A, sales attributable
  to specific purposes) of SAMA's Monthly Statistical Bulletin for September 2026. The non-Saudi series (value)
  is the monthly measure commonly read as expatriate workers' remittances; the balance of payments workers' remittances
  line is quarterly and defined differently. SAMA publishes no licence for its statistical files, so the entry stays
  at license-review.
