assumed:
- parameter: distribution.parameters.shares
  value: city transactions / sum over cities
  method: derived
  rationale: Each city's number of transactions is summed over the four published weeks and divided by the sum over
    all listed cities including 'Others'; the city tables carry no total row of their own.
- parameter: distribution.parameters.transactions_thousand
  value: sum of four weeks
  method: derived
  rationale: Transactions (thousands) and sales (thousand riyals) are the sums of the four weekly figures printed
    in the report; the weekly transaction counts are kept beside them.
tests:
- statistic: share["Riyadh"]
  expected: 0.33503
  tolerance: 0.004
- statistic: share["Jeddah"]
  expected: 0.111756
  tolerance: 0.004
- statistic: share["Others"]
  expected: 0.10562
  tolerance: 0.004
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0002
notes: Point-of-sale card transactions (thousands) and sales (thousand riyals) by city for the four weeks from 4
  to 31 October 2026, from Tables 2.1 and 2.2 of SAMA's Weekly Points of Sale Transactions report published for
  the week ending 31 October 2026. 60 named cities plus 'Others' are listed; city names are SAMA's English spellings
  (for example Tabouk, Hayel, Ar'ar). The report is a PDF, so the entry is tier B; values are parsed from its extracted
  text and every figure keeps its weekly breakdown. SAMA publishes no licence for its statistical files, so the
  entry stays at license-review.
