assumed:
- parameter: distribution.parameters.shares
  value: activity transactions / total transactions
  method: derived
  rationale: Shares are each top-level activity's Q3 2026 transaction count over the published total; sub-activities
    (for example airlines within transportation) are kept separately so nothing is counted twice. The builder checks
    the top-level activities add up to the total.
- parameter: distribution.parameters.average_ticket_sar
  value: sales / transactions
  method: derived
  rationale: Average ticket in riyals is the activity's sales (thousand riyals) divided by its transactions (thousands).
tests:
- statistic: share["Restaurants & Café"]
  expected: 0.239425
  tolerance: 0.004
- statistic: share["Gas Stations"]
  expected: 0.072658
  tolerance: 0.004
- statistic: share["Jewelry"]
  expected: 0.00128
  tolerance: 0.002
- statistic: sum_of_shares
  expected: 1
  tolerance: 0.0002
notes: Point-of-sale card transactions in Saudi Arabia in the third quarter of 2026 by merchant activity, from Tables
  30d (number, thousands) and 30e (sales, thousand riyals) of SAMA's Monthly Statistical Bulletin for September
  2026. shares weight activities by number of transactions, so a generator draws the merchant category of a card
  payment and then its amount around average_ticket_sar. Sub-activities of transportation, health and recreation
  and culture are listed under sub_activities. Activity labels are SAMA's. SAMA publishes no licence for its statistical
  files, so the entry stays at license-review.
