assumed:
- parameter: lengths.SA
  value: 24
  method: derived
  rationale: Length of SAMA's electronic IBAN example; the rulebook page does not state the length in words.
- parameter: valid_from
  value: '2021-05-05'
  method: derived
  rationale: Date of the rulebook's IBAN payment-message rule (7.12, 5/5/2021) in the same rulebook; the format
    is older.
- parameter: letter_values
  value: A=10 to Z=35
  method: derived
  rationale: ISO 13616 conversion table, as printed in the Central Bank of Bahrain's IBAN standard (Table 1).
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
notes: 'Saudi International Bank Account Numbers as the Saudi Central Bank''s rulebook presents them, citing its
  document IBAN Standards in Saudi Arabia: printed in groups of four characters separated by blanks or dashes, and
  written electronically without separators. The check digits follow ISO 7064 MOD 97-10 (see global-iban-check-digits-mod97).
  The 24-character length is taken from SAMA''s example; the structure of the BBAN (bank code and account number)
  is in SAMA''s IBAN standard document, which was not fetched.'
