- data-quality-validation
spec:
  implementation: almanac.rules.iban
  parameters:
    modulus: 97
    complement_base: 98
    valid_remainder: 1
    letter_values:
      A: 10
      B: 11
      C: 12
      D: 13
      E: 14
      F: 15
      G: 16
      H: 17
      I: 18
      J: 19
      K: 20
      L: 21
      M: 22
      N: 23
      O: 24
      P: 25
      Q: 26
      R: 27
      S: 28
      T: 29
      U: 30
      V: 31
      W: 32
      X: 33
      Y: 34
      Z: 35
    lengths:
      SA: 24
    print_format: groups of four characters separated by a blank space or dashes
  vectors:
  - input: SA3915000999103143430001
    expected: true
    origin: source
    note: SAMA's electronic IBAN example
  - input: SA39 1500 0999 1031 4343 0001
    expected: true
    origin: source
    note: SAMA's printed IBAN example
  - input:
      country: SA
      bban: '15000999103143430001'
    expected: '39'
    origin: source
    note: check digits of SAMA's example
  - input: SA3815000999103143430001
    expected: false
    origin: derived
    note: one check digit altered
  - input: SA391500099910314343000
    expected: false
    origin: derived
    note: 23 characters
