notes: Monthly number (value) and value in millions of riyals of payments through Saudi Arabia's Instant Payments
  System (launched 21 February 2021), with SARIE (Saudi Arabian Riyal Interbank Express) customer payments and SARIE
  totals (customer, interbank and other payments including direct debits), from Tables 27a and 27b of SAMA's Monthly
  Statistical Bulletin for September 2026. Dividing value by number gives the average transfer size, which is far
  smaller for instant payments than for SARIE. SAMA publishes no licence for its statistical files, so the entry
  stays at license-review.
