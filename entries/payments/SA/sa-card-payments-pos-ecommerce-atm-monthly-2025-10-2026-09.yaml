notes: Monthly card payment activity in Saudi Arabia from SAMA's Monthly Statistical Bulletin for September 2026.
  value is point-of-sale sales in thousands of riyals (Table 30c); the columns add POS transaction counts, terminals
  at month end, near-field-communication POS transactions made with mobile phones and with cards, mada e-commerce
  sales (thousand riyals) and transactions, and from Table 30a the number of ATMs and cards issued at month end,
  ATM transactions (cash withdrawals and other transactions, mada and bank networks combined) and ATM cash withdrawals
  in millions of riyals. mada e-commerce covers online shopping, in-app purchases and e-wallets with mada cards
  only, not Visa, MasterCard or other credit cards. Average ticket is sales divided by transactions. SAMA publishes
  no licence for its statistical files, so the entry stays at license-review.
