notes: How long a German invoice may give a business or public debtor to pay. Between businesses an agreed payment term of more than 60 days from receipt of the performance
  (or of a later invoice) is effective only if expressly agreed and not grossly unfair to the creditor. Where the debtor is a public contracting authority a term
  over 30 days needs express agreement and objective justification, and one over 60 days is void. An inspection or acceptance period over 30 days needs express agreement.
  None of this applies to instalment payments or to consumers as debtors. Under Article 229 section 34 EGBGB the provision applies to obligations arising after 28
  July 2014. The law publisher's XML states no licence, so the entry is held at license-review.
