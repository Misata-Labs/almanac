notes: Late-payment rules of the German Civil Code for invoices and payment claims. A money debt in default bears interest of five percentage points over the base
  rate a year (section 288(1)); where no consumer is party, payment claims bear nine points over it (288(2)); a creditor whose debtor is not a consumer may also claim
  a flat fee of 40 euros (288(5)). A debtor of a payment claim is in default at the latest when it has not paid within 30 days of the due date and receipt of the
  invoice (286(3); for consumers only when the invoice says so), the period counted from the day after the event and ending with its last day (sections 187(1) and
  188(1)). The base rate steps are the Bundesbank series also published as de-basiszinssatz-247-bgb. Under Article 229 section 34 EGBGB the current wording applies
  to obligations arising after 28 July 2014, hence valid_from. The rate applies to each day at the base rate then in force; weekend and holiday shifts of the last
  day (section 193) are not modelled. The law publisher's XML states no licence, so the entry is held at license-review.
