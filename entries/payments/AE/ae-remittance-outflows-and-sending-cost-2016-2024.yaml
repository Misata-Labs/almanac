notes: 'For United Arab Emirates, one row per year: personal remittances paid in current US dollars (indicator BM.TRF.PWKR.CD.DT:
  personal transfers plus compensation of employees paid to non-residents, from IMF balance of payments data and
  World Bank staff estimates) and the average total cost, as a percentage of the amount sent, of sending USD 200
  from United Arab Emirates across the providers in the World Bank''s Remittance Prices Worldwide database (indicator
  SI.RMT.COST.OB.ZS). Remittances paid are published for 2023 to 2024 and the cost for 2016 to 2023; a column is
  null where that indicator has no value (2016, 2017, 2018, 2019, 2020, 2021, 2022, 2024). The outflow sets the
  annual scale of a synthetic outbound remittance ledger and the cost prices its fees; the destination mix can be
  taken from the UN DESA migrant-stock-by-origin entry. Rows are keyed by year. Data last updated 2026-10-08. The
  World Bank licenses its data under CC BY 4.0.'
