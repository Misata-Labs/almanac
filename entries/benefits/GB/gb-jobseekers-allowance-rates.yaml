      max_age: 24
    - name: 25 or over
      min_age: 25
    categories: []
    tables:
    - from: '2025-04-06'
      rates:
        Under 25: 72.9
        25 or over: 92.05
    - from: '2026-04-06'
      rates:
        Under 25: 75.65
        25 or over: 95.55
