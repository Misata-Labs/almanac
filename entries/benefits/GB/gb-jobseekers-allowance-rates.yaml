      age: 40
      'on': '2025-06-01'
    expected: 92.05
    origin: source
  - input:
      age: 18
      'on': '2025-04-06'
    expected: 72.9
    origin: source
  - input:
      age: 24
      'on': '2026-04-05'
    expected: 72.9
