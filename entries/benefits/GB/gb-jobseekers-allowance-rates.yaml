notes: Weekly personal rates of New Style (contribution-based) Jobseeker's Allowance by age band for 2025/26 and
  2026/27 from the DWP 'Benefit and pension rates 2026 to 2027' publication, confirmed by GOV.UK's JSA guide, which
  also gives the 182-day maximum. The age_band_rates rule returns the rate for an age on a date. Sources are the
  GOV.UK content API's JSON for each page, stable between editorial updates; GOV.UK publishes its content under
  the Open Government Licence v3.0.
