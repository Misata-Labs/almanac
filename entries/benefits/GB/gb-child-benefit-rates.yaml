notes: Weekly Child Benefit rates for the eldest or only child and for each other child, and the weekly Guardian's
  Allowance, for the tax years 2024 to 2025, 2025 to 2026 and 2026 to 2027, read from HMRC's rates and allowances
  table and confirmed for 2026 to 2027 by GOV.UK's Child Benefit guide. Rows are keyed by tax year so a generator
  can date a payment. The High Income Child Benefit Charge is out of scope. Sources are the GOV.UK content API's
  JSON for each page, stable between editorial updates; GOV.UK publishes its content under the Open Government Licence
  v3.0.
