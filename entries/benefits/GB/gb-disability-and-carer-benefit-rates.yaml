notes: Weekly rates of Personal Independence Payment (daily living and mobility components at standard and enhanced
  rates), Attendance Allowance (higher and lower rates) and Carer's Allowance for 2025/26 and 2026/27, read from
  the DWP 'Benefit and pension rates 2026 to 2027' publication. The enhanced daily living and higher Attendance
  Allowance rates coincide, as do the standard daily living and lower Attendance Allowance rates. Sources are the
  GOV.UK content API's JSON for each page, stable between editorial updates; GOV.UK publishes its content under
  the Open Government Licence v3.0.
