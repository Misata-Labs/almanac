assumed:
- parameter: valid_from and valid_to
  value: tax years 6 April to 5 April
  method: derived
  rationale: The DWP table labels its columns 'Rates 2025/26' and 'Rates 2026/27' without dates; the windows are
    taken as the tax years. Uprating of individual benefits takes effect in the first full benefit week of April,
    which can differ from 6 April by a few days.
