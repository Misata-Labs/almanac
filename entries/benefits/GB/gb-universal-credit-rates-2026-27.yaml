notes: 'Universal Credit amounts per monthly assessment period for 2025/26 and 2026/27 as the DWP ''Benefit and
  pension rates 2026 to 2027'' publication tables them: the four standard allowances by age and couple status, child
  elements, disabled child additions, limited capability for work amounts (the LCWRA amount for new claims from
  April 2026 is lower than the protected pre-2026 amount), carer and childcare elements, work allowances and the
  capital limits with the assumed income per £250 of capital. GOV.UK''s Universal Credit guide confirms the standard
  allowances and gives the 55p earnings taper and 85% childcare cover. Each row keeps DWP''s label. Sources are
  the GOV.UK content API''s JSON for each page, stable between editorial updates; GOV.UK publishes its content under
  the Open Government Licence v3.0.'
