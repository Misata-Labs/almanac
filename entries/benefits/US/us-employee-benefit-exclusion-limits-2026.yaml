notes: 'Employer benefit limits for 2026 from Rev. Proc. 2025-32: the health flexible spending arrangement salary-reduction
  limit and carryover, the monthly qualified transportation fringe exclusions, the adoption assistance exclusion,
  the educational assistance exclusion (unindexed until after 2026), the qualified small employer HRA maxima, the
  small employer health credit wage amount, the long-term care per diem, and the age-banded limits on long-term
  care premiums treated as medical care. Monthly amounts are per employee per month; the others are annual. The
  adoption assistance exclusion phases out over the same modified AGI range as the adoption credit (us-child-tax-credit-and-adoption-credit-2026).
  Works of the US federal government carry no copyright in the United States, but the cited documents state no reuse
  terms, so the licence is recorded as unstated and the entry held at license-review.'
