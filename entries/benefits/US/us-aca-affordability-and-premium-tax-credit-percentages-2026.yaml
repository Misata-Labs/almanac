notes: 'Rev. Proc. 2025-25 for taxable and plan years beginning in 2026. The applicable percentage table of section
  36B(b)(3)(A)(i) gives, for each band of household income as a percentage of the Federal poverty line, the share
  of income a household is expected to contribute to benchmark Marketplace coverage; within a band the percentage
  rises from the initial to the final figure. The required contribution percentage is the employer-coverage affordability
  threshold: an employee''s required contribution for self-only coverage above this share of household income makes
  the offer unaffordable for premium tax credit purposes. The 2026 table stops at 400% of the poverty line. Poverty
  guidelines are in us-hhs-poverty-guidelines-2026. Works of the US federal government carry no copyright in the
  United States, but the cited documents state no reuse terms, so the licence is recorded as unstated and the entry
  held at license-review.'
