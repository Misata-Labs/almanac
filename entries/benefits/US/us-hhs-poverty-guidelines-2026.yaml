notes: The 2026 HHS poverty guidelines (FR Doc. 2026-00755, 91 FR 1797, January 15, 2026), the simplified version
  of the Census Bureau poverty thresholds that Medicaid, the Marketplace premium tax credit, SNAP and many other
  programmes use to set eligibility, often as a percentage of the guideline (the 'federal poverty level'). Separate
  tables apply to the 48 contiguous states and DC, to Alaska and to Hawaii; households over eight persons add a
  fixed amount per person. The guidelines are effective from the date the notice gives unless a programme sets its
  own date, and stay in force until the 2027 update, so valid_to is open. The rule returns the guideline for a household
  size and, given an income, that income as a percentage of the guideline. Source is the Federal Register issue
  XML (tier A). Works of the US federal government carry no copyright in the United States, but the cited documents
  state no reuse terms, so the licence is recorded as unstated and the entry held at license-review.
