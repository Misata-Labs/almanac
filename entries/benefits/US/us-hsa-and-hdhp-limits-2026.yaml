notes: 'Health savings account amounts for calendar year 2026 from Rev. Proc. 2025-19: the annual contribution limits
  for self-only and family HDHP coverage, and the minimum deductible and maximum out-of-pocket expenses that define
  a high deductible health plan; plus the maximum an excepted benefit HRA may make newly available for plan years
  beginning in 2026. The Archer MSA deductible ranges for 2026 come from Rev. Proc. 2025-32. The additional HSA
  contribution for account holders aged 55 or over is statutory and not part of this entry. Works of the US federal
  government carry no copyright in the United States, but the cited documents state no reuse terms, so the licence
  is recorded as unstated and the entry held at license-review.'
