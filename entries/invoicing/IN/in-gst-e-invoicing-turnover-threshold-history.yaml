      'on': '2020-10-01'
    expected: 5000000000
    origin: source
  - input:
      'on': '2021-01-01'
    expected: 1000000000
    origin: source
  - input:
      'on': '2022-09-30'
    expected: 200000000
    origin: source
  - input:
