      value: 5000000000
      notification: 13/2020 as amended by 61/2020
    - from: '2021-01-01'
      value: 1000000000
      notification: 88/2020
    - from: '2021-04-01'
      value: 500000000
      notification: 05/2021
    - from: '2022-04-01'
      value: 200000000
      notification: 01/2022
    - from: '2022-10-01'
      value: 100000000
      notification: 17/2022
    - from: '2023-08-01'
      value: 50000000
      notification: 10/2023
