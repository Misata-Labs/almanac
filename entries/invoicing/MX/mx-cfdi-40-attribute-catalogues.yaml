      Comprobante/Receptor/@ResidenciaFiscal:
        catalogue: c_Pais
        use: optional
      Comprobante/Receptor/@RegimenFiscalReceptor:
        catalogue: c_RegimenFiscal
        use: required
      Comprobante/Receptor/@UsoCFDI:
        catalogue: c_UsoCFDI
        use: required
      Comprobante/Conceptos/Concepto/Impuestos/Traslados/Traslado/@Impuesto:
        catalogue: c_Impuesto
        use: required
      Comprobante/Conceptos/Concepto/Impuestos/Traslados/Traslado/@TipoFactor:
        catalogue: c_TipoFactor
        use: required
      Comprobante/Conceptos/Concepto/Impuestos/Retenciones/Retencion/@Impuesto:
        catalogue: c_Impuesto
        use: required
      Comprobante/Conceptos/Concepto/Impuestos/Retenciones/Retencion/@TipoFactor:
        catalogue: c_TipoFactor
        use: required
      Comprobante/Conceptos/Concepto/ACuentaTerceros/@RegimenFiscalACuentaTerceros:
        catalogue: c_RegimenFiscal
        use: required
      Comprobante/Conceptos/Concepto/Parte/@ClaveProdServ:
        catalogue: c_ClaveProdServ
        use: required
      Comprobante/Conceptos/Concepto/@ClaveProdServ:
        catalogue: c_ClaveProdServ
        use: required
      Comprobante/Conceptos/Concepto/@ClaveUnidad:
        catalogue: c_ClaveUnidad
        use: required
      Comprobante/Conceptos/Concepto/@ObjetoImp:
        catalogue: c_ObjetoImp
        use: required
      Comprobante/Impuestos/Retenciones/Retencion/@Impuesto:
        catalogue: c_Impuesto
        use: required
      Comprobante/Impuestos/Traslados/Traslado/@Impuesto:
        catalogue: c_Impuesto
        use: required
      Comprobante/Impuestos/Traslados/Traslado/@TipoFactor:
        catalogue: c_TipoFactor
        use: required
      Comprobante/@FormaPago:
        catalogue: c_FormaPago
        use: optional
      Comprobante/@Moneda:
        catalogue: c_Moneda
        use: required
      Comprobante/@TipoDeComprobante:
        catalogue: c_TipoDeComprobante
        use: required
      Comprobante/@Exportacion:
        catalogue: c_Exportacion
        use: required
      Comprobante/@MetodoPago:
        catalogue: c_MetodoPago
        use: optional
      Comprobante/@LugarExpedicion:
        catalogue: c_CodigoPostal
        use: required
  vectors:
  - input:
      key: Comprobante/Receptor/@UsoCFDI
      column: catalogue
    expected: c_UsoCFDI
    origin: source
  - input:
      key: Comprobante/Receptor/@RegimenFiscalReceptor
      column: use
    expected: required
    origin: source
  - input:
      key: Comprobante/@MetodoPago
      column: use
    expected: optional
    origin: source
  - input:
      key: Comprobante/@Exportacion
      column: catalogue
    expected: c_Exportacion
    origin: source
  - input: Comprobante/@Folio
    expected: false
    origin: derived
    note: free-text attribute, no catalogue
