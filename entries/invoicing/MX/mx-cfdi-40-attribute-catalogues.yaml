notes: Which attributes of a CFDI 4.0 invoice take their value from a SAT catalogue, keyed by element path and attribute
  (for example Comprobante/Receptor/@UsoCFDI), with the catalogue type and whether the schema marks the attribute
  required or optional. Optional attributes such as MetodoPago and FormaPago are conditional under the filling guide,
  which was not reachable. Read from cfdv40.xsd on www.sat.gob.mx; no licence is stated, so the entry stays at license-review.
