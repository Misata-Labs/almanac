spec:
  implementation: almanac.rules.lookup_table
  parameters:
    rows:
      Comprobante/InformacionGlobal/@Periodicidad:
        catalogue: c_Periodicidad
        use: required
      Comprobante/InformacionGlobal/@Meses:
