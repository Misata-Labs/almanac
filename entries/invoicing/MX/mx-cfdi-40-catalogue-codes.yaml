notes: 'The closed CFDI 4.0 catalogues that most invoice fields draw from, exactly as the SAT''s catalogue schema
  enumerates them: payment forms (c_FormaPago), payment method PUE or PPD (c_MetodoPago), voucher type I, E, T,
  N or P (c_TipoDeComprobante), export key, tax object key (c_ObjetoImp), tax codes 001 to 003 (c_Impuesto), factor
  type, relation type, periodicity and months for global invoices, tax regimes (c_RegimenFiscal), CFDI uses (c_UsoCFDI)
  and currencies (c_Moneda). The schema carries codes only; the descriptions, the regimes each use allows, the person
  types and the c_TasaOCuota rate table are published only in catCFDI.xls on omawww.sat.gob.mx, which was unreachable,
  so labels are empty. No licence is stated, so the entry stays at license-review.'
