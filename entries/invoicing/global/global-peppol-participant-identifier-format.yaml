- parameter: value_pattern
  value: '[A-Za-z0-9._~-]+'
  method: derived
  rationale: Policy 1 lists the permitted characters in prose; the pattern restates that list as a regular expression.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count[active_icd]
  expected: 84
  tolerance: 0
- statistic: value[max_value_length]
  expected: 130
  tolerance: 0
notes: A Peppol participant identifier is an ISO 6523 ICD and a value joined by a colon (for example 0088 and a
  GLN), under the meta scheme iso6523-actorid-upis. Policy 1 limits the value, excluding the ICD, to 1 to 130 letters,
  digits, minus, period, underscore or tilde; Policy 2 makes values case insensitive. Policy 7 publishes each participant
  in the SML under a DNS label made of the unpadded Base32 SHA-256 digest of the lowercased identifier, which the
  vectors check against the policy's own worked example. active_icd is the set of ICD values with state active in
  code list 9.7. No licence is stated, so the entry stays at license-review.
