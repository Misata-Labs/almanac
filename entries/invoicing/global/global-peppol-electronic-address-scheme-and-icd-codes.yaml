notes: 'Scheme identifiers for electronic addresses (BT-34 and BT-49 schemeID: the EAS list, mostly ISO 6523 ICD
  values plus 99xx national schemes such as 9930 for German VAT numbers) and for party identifiers (the ISO 6523
  ICD list used for BT-29, BT-46 and similar). Names are as the code-list files of release 3.0.21 give them. OpenPeppol
  states it holds the copyright of the BIS and that the EC-CEN agreement allows derivative works with no additional
  licensing requirements; no SPDX licence is named, so the entry stays at license-review.'
