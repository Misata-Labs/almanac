notes: 'UN/CEFACT 4461 payment means codes accepted in BT-81 of a Peppol BIS Billing 3.0 invoice, with their names:
  30 credit transfer, 31 debit transfer, 48 bank card, 49 direct debit, 58 SEPA credit transfer, 59 SEPA direct
  debit, ZZZ mutually defined, and the rest of D.16B, from the release 3.0.21 code-list file at a pinned commit.
  OpenPeppol states it holds the copyright of the BIS and that the EC-CEN agreement allows derivative works with
  no additional licensing requirements; no SPDX licence is named, so the entry stays at license-review.'
