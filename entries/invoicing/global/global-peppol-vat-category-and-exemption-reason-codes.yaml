notes: 'VAT category codes a Peppol BIS Billing 3.0 invoice may use in BT-118 and BT-151 (the OpenPeppol subset
  of UN/CEFACT 5305, D.16B: S standard, Z zero, E exempt, AE reverse charge, K intra-community, G export, O outside
  scope, L and M for the Canary Islands and Ceuta and Melilla, B for Italian split payment), and the VATEX exemption
  reason codes for BT-121, from the code-list files of release 3.0.21 at a pinned commit of the OpenPeppol repository.
  OpenPeppol states it holds the copyright of the BIS and that the EC-CEN agreement allows derivative works with
  no additional licensing requirements; no SPDX licence is named, so the entry stays at license-review.'
