notes: 'Document type codes for BT-3 in a Peppol BIS Billing 3.0 invoice (UNCL1001 invoice subset: 380 commercial
  invoice, 383 debit note, 384 corrected, 386 prepayment, 389 self-billed and others) and credit note (81, 83, 381,
  396, 532). allowed_in_billing_profiles_01_02 records whether the code appears in the token list of schematron
  rule P0100 or P0101, which binds the billing profiles; the 3.0.21 hotfix further limits 326 and 389 to German
  trading partners and 384 to German or Slovak pairs, which this table does not encode. OpenPeppol states it holds
  the copyright of the BIS and that the EC-CEN agreement allows derivative works with no additional licensing requirements;
  no SPDX licence is named, so the entry stays at license-review.'
