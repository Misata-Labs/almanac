id: es-verifactu-tax-operation-and-exemption-codes
title: Spain VERI*FACTU tax, CalificacionOperacion, OperacionExenta (E1 to E6) and IDType codes, Orden HAC/1177/2024
kind: rule
domain: invoicing
region: ES
status: license-review
tier: B
