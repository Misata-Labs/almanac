spec:
  implementation: almanac.rules.enumeration
  parameters:
    sets:
      impuesto:
        '01': Impuesto sobre el Valor Añadido (IVA).
        '02': Impuesto sobre la Producción, los Servicios y la Importación (IPSI) de Ceuta y Melilla.
        '03': Impuesto General Indirecto Canario (IGIC).
        '05': Otros.
      calificacion_operacion:
        S1: Operación Sujeta y No exenta - Sin inversión del sujeto pasivo.
        S2: Operación Sujeta y No exenta - Con Inversión del sujeto pasivo.
        N1: Operación No Sujeta artículo 7, 14, otros.
        N2: Operación No Sujeta por Reglas de localización.
      operacion_exenta:
        E1: Exenta por el artículo 20.
        E2: Exenta por el artículo 21.
        E3: Exenta por el artículo 22.
        E4: Exenta por los artículos 23 y 24.
        E5: Exenta por el artículo 25.
        E6: Exenta por otros.
      id_type:
        '02': NIF-IVA.
        '03': Pasaporte.
        '04': Documento oficial de identificación expedido por el país o territorio de residencia.
        '05': Certificado de residencia.
        '06': Otro documento probatorio.
        '07': No censado.
  vectors:
  - input:
      set: impuesto
      value: '01'
    expected: true
    origin: source
  - input:
      set: impuesto
      value: '03'
    expected: true
    origin: source
  - input:
      set: calificacion_operacion
      value: S1
    expected: true
    origin: source
  - input:
      set: calificacion_operacion
      value: N2
    expected: true
    origin: source
  - input:
      set: operacion_exenta
      value: E1
    expected: true
    origin: source
  - input:
      set: operacion_exenta
      value: E6
    expected: true
    origin: source
  - input:
      set: id_type
      value: '02'
    expected: true
    origin: source
  - input:
      set: operacion_exenta
      value: E7
    expected: false
    origin: derived
  - input:
      set: impuesto
      value: '04'
    expected: false
    origin: derived
    note: list L1 jumps from 03 to 05
