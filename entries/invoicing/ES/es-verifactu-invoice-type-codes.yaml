notes: 'Invoice types for the TipoFactura field of a VERI*FACTU invoicing record (list L2 of the annex to Orden
  HAC/1177/2024): F1 full invoice, F2 simplified invoice, F3 invoice replacing simplified ones, R1 to R4 corrective
  invoices by legal ground, R5 corrective simplified invoice; and list L3 for TipoRectificativa (S by substitution,
  I by differences). Descriptions are as printed in the BOE. The BOE states no licence on the document, so the entry
  stays at license-review.'
