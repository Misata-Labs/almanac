id: es-verifactu-invoice-type-codes
title: Spain VERI*FACTU TipoFactura (F1, F2, F3, R1 to R5) and TipoRectificativa codes, Orden HAC/1177/2024
kind: rule
domain: invoicing
region: ES
status: license-review
tier: B
valid_from: '2024-10-29'
valid_to: null
tags:
- invoicing
- e-invoicing
