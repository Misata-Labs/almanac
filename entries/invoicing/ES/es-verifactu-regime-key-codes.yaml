notes: 'Regime keys for the ClaveRegimen field of each tax breakdown in a VERI*FACTU record: list L8A where the
  tax is VAT (01 general regime, 02 export, 03 second-hand goods, 07 cash accounting, 17 OSS and IOSS, 18 equivalence
  surcharge, 20 simplified regime and the rest) and list L8B where it is the Canary Islands IGIC. Descriptions are
  as printed in the BOE. The BOE states no licence on the document, so the entry stays at license-review.'
