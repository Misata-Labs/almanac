spec:
  implementation: almanac.rules.enumeration
  parameters:
    sets:
      clave_regimen_iva:
        '01': Operación de régimen general.
        '02': Exportación.
        '03': Operaciones a las que se aplique el régimen especial de bienes usados, objetos de arte, antigüedades
          y objetos de colección.
        '04': Régimen especial del oro de inversión.
        '05': Régimen especial de las agencias de viajes.
        '06': Régimen especial grupo de entidades en IVA (Nivel Avanzado)
        '07': Régimen especial del criterio de caja.
        08: Operaciones sujetas al IPSI/IGIC (Impuesto sobre la Producción, los Servicios y la Importación/Impuesto
          General Indirecto Canario).
        09: Facturación de las prestaciones de servicios de agencias de viaje que actúan como mediadoras en nombre
          y por cuenta ajena (D.A.4.ª RD1619/2012)
        '10': Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad
          industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades,
          asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro.
        '11': Operaciones de arrendamiento de local de negocio.
        '14': Factura con IVA pendiente de devengo en certificaciones de obra cuyo destinatario sea una Administración
          Pública.
        '15': Factura con IVA pendiente de devengo en operaciones de tracto sucesivo.
        '17': Operación acogida a alguno de los regímenes previstos en el capítulo XI del título IX (OSS e IOSS)
        '18': Recargo de equivalencia.
        '19': Operaciones de actividades incluidas en el Régimen Especial de Agricultura, Ganadería y Pesca (REAGYP)
        '20': Régimen simplificado
      clave_regimen_igic:
        '01': Operación de régimen general.
        '02': Exportación.
        '03': Operaciones a las que se aplique el régimen especial de bienes usados, objetos de arte, antigüedades
          y objetos de colección.
        '04': Régimen especial del oro de inversión.
        '05': Régimen especial de las agencias de viajes.
        '06': Régimen especial grupo de entidades en IGIC (Nivel Avanzado).
        '07': Régimen especial del criterio de caja.
        08: Operaciones sujetas al IPSI/ IVA (Impuesto sobre la Producción, los Servicios y la Importación/ Impuesto
          sobre el Valor Añadido).
        09: Facturación de las prestaciones de servicios de agencias de viaje que actúan como mediadoras en nombre
          y por cuenta ajena (D.A.4.ª RD1619/2012).
        '10': Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad
          industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades,
          asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro.
        '11': Operaciones de arrendamiento de local de negocio.
        '14': Factura con IGIC pendiente de devengo en certificaciones de obra cuyo destinatario sea una Administración
          Pública.
        '15': Factura con IGIC pendiente de devengo en operaciones de tracto sucesivo.
        '17': Régimen especial de comerciante minorista.
        '18': Régimen especial del pequeño empresario o profesional.
        '19': Operaciones interiores exentas por aplicación artículo 25 Ley 19/1994.
  vectors:
  - input:
      set: clave_regimen_iva
      value: '01'
    expected: true
    origin: source
  - input:
      set: clave_regimen_iva
      value: '02'
    expected: true
    origin: source
  - input:
      set: clave_regimen_iva
      value: '20'
    expected: true
    origin: source
  - input:
      set: clave_regimen_igic
      value: '17'
    expected: true
    origin: source
  - input:
      set: clave_regimen_igic
      value: '20'
    expected: false
    origin: source
    note: L8B ends at 19
  - input:
      set: clave_regimen_iva
      value: '12'
    expected: false
    origin: derived
    note: the list jumps from 11 to 14
