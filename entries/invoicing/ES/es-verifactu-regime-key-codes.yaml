id: es-verifactu-regime-key-codes
title: Spain VERI*FACTU ClaveRegimen codes for VAT (L8A) and Canary Islands IGIC (L8B), Orden HAC/1177/2024
kind: rule
domain: invoicing
region: ES
status: license-review
tier: B
