notes: 'Four smaller FatturaPA vocabularies: TipoRitenuta (2.1.1.5.1) for the withholding type (RT01 natural persons,
  RT02 legal persons, RT03 to RT06 social security and pension contributions); CausalePagamento (2.1.1.5.4), the
  payment reason letters taken from the Certificazione Unica model; TipoCassa (2.1.1.7.1) for the professional pension
  fund (TC01 to TC22); and EsigibilitaIVA (2.2.2.7) for when VAT becomes due (D deferred, I immediate, S split payment).
  Codes and labels come from the 1.2.3 schema; it carries no licence statement.'
