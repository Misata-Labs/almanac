id: it-fatturapa-field-formats
title: 'Italy FatturaPA field formats: CodiceDestinatario, codice fiscale, IBAN, BIC, CAP and amounts (schema 1.2.3
  patterns)'
kind: rule
domain: invoicing
region: IT
status: license-review
tier: A
valid_from: '2025-01-31'
valid_to: null
tags:
- invoicing
- e-invoicing
- tax
- code-list
- fatturapa
- sdi
- italy
- field-format
- identifier
use_cases:
- invoicing-demo
- erp-demo
- tax-demo
- data-quality-validation
- invoicing
- kyb-onboarding
spec:
  implementation: almanac.rules.einvoice_field_format
  parameters:
    fields:
      CodiceDestinatario:
        patterns:
        - '[A-Z0-9]{6,7}'
      CodiceFiscale:
        patterns:
        - '[A-Z0-9]{11,16}'
      CodiceFiscalePF:
        patterns:
        - '[A-Z0-9]{16}'
      IBAN:
        patterns:
        - '[a-zA-Z]{2}[0-9]{2}[a-zA-Z0-9]{11,30}'
      BIC:
        patterns:
        - '[A-Z]{6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3}){0,1}'
      CAP:
        patterns:
        - '[0-9][0-9][0-9][0-9][0-9]'
      Provincia:
        patterns:
        - '[A-Z]{2}'
      Nazione:
        patterns:
        - '[A-Z]{2}'
      Divisa:
        patterns:
        - '[A-Z]{3}'
      Aliquota:
        patterns:
        - '[0-9]{1,3}\.[0-9]{2}'
      Importo:
        patterns:
        - '[\-]?[0-9]{1,11}\.[0-9]{2}'
      PrezzoUnitario:
        patterns:
        - '[\-]?[0-9]{1,11}\.[0-9]{2,8}'
  vectors:
  - input:
      field: CodiceDestinatario
      value: ABC1234
    expected: true
    origin: source
    note: B2B example invoice, 7 characters
  - input:
      field: CodiceDestinatario
      value: AAAAAA
    expected: true
    origin: source
    note: public administration example invoice, 6 characters
  - input:
      field: CodiceFiscale
      value: 09876543210
    expected: true
    origin: source
  - input:
      field: CodiceDestinatario
      value: abc1234
    expected: false
    origin: derived
    note: lower case is outside the pattern
  - input:
      field: CodiceDestinatario
      value: ABC12345
    expected: false
    origin: derived
    note: eight characters
  - input:
      field: CodiceFiscalePF
      value: 09876543210
    expected: false
    origin: derived
    note: a natural person's code has 16 characters
  - input:
      field: Aliquota
      value: '22.00'
    expected: true
    origin: derived
  - input:
      field: Importo
      value: '100.5'
    expected: false
    origin: derived
    note: amounts carry exactly two decimals
  - input:
      field: CAP
      value: '00144'
    expected: true
    origin: derived
