notes: 'Pattern and length facets of selected FatturaPA simple types, read from the 1.2.3 schema and applied as
  full matches. CodiceDestinatario routes the invoice through the Sistema di Interscambio: per the specification
  it has 6 characters (the office code from IndicePA) for a public administration and 7 characters (a code SdI assigns
  to a receiving channel) otherwise. CodiceFiscale admits 11 to 16 upper-case letters and digits, CodiceFiscalePF
  exactly 16; amounts carry exactly two decimals and unit prices two to eight. The positive vectors are the values
  in the example invoices published beside the schema. The schema carries no licence statement.'
