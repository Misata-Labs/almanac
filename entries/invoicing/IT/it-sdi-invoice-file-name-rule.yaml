assumed:
- parameter: identifier characters
  value: '[A-Za-z0-9]'
  method: assumed
  rationale: The specification gives the identifier's length but not its alphabet; tax identifiers are letters and
    digits.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count[extensions]
  expected: 3
  tolerance: 0
- statistic: value[progressive_max_length]
  expected: 5
  tolerance: 0
notes: 'Every file sent to the Sistema di Interscambio is named country code, transmitter tax identifier, underscore,
  a unique progressive of up to five letters or digits, and an extension: .xml when XAdES-signed, .xml.p7m when
  CAdES-signed, or .zip for an archive whose members follow the same rule. The identifier is 11 to 16 characters
  for country IT, where it is the transmitter''s codice fiscale, and 2 to 28 for a foreign tax identifier. The progressive
  only needs to make the name unique for that transmitter. valid_from is the date of specification 1.8.4''s revision
  as printed in its footer. The specification carries no licence statement.'
