id: it-sdi-invoice-file-name-rule
title: Italy Sistema di Interscambio invoice file name rule (country, tax identifier, progressive, extension)
kind: rule
domain: invoicing
region: IT
status: license-review
tier: B
valid_from: '2026-03-31'
valid_to: null
tags:
- invoicing
- e-invoicing
- tax
- code-list
- fatturapa
- sdi
- italy
- file-name
- field-format
use_cases:
- invoicing-demo
- erp-demo
- tax-demo
- data-quality-validation
- invoicing
spec:
  implementation: almanac.rules.it_sdi_file_name
  parameters:
    identifier_length:
      IT:
      - 11
      - 16
      other:
      - 2
      - 28
    progressive_max_length: 5
    extensions:
    - .xml
    - .xml.p7m
    - .zip
  vectors:
  - input:
      name: ITAAABBB99T99X999W_00001.xml
    expected: true
    origin: source
    note: XAdES-signed example
  - input:
      name: IT99999999999_00002.xml.p7m
    expected: true
    origin: source
    note: CAdES-signed example
  - input:
      name: ITAAABBB99T99X999W_00004.xml.p7m
    expected: true
    origin: source
  - input:
      name: IT99999999999_00002.xml.p7m
      part: progressive
    expected: '00002'
    origin: source
  - input:
      name: IT01234567890_FPA01.xml
    expected: true
    origin: source
    note: name of an example invoice published on fatturapa.gov.it
  - input:
      name: IT01234567890_000001.xml
    expected: false
    origin: derived
    note: progressive longer than five characters
  - input:
      name: IT0123456789_00001.xml
    expected: false
    origin: derived
    note: ten-character Italian identifier
  - input:
      name: DE123456789_00001.xml
    expected: true
    origin: derived
  - input:
      name: IT01234567890-00001.xml
    expected: false
    origin: derived
    note: the separator must be an underscore
  - input:
      name: IT01234567890_00001.pdf
    expected: false
    origin: derived
