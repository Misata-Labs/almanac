notes: Document-type codes for the TipoDocumento element (2.1.1.1) of an Italian electronic invoice sent through
  the Sistema di Interscambio, with the Italian descriptions the schema annotates them with. TD01 is an ordinary
  invoice, TD04 a credit note, TD16 to TD19 the integration and self-invoicing documents for reverse charge, and
  TD29 the notice of omitted or irregular invoicing that version 1.4 of the specification added. Codes and labels
  are read from Schema_VFPR12_v1.2.3.xsd as published on fatturapa.gov.it; the schema carries no licence statement.
