spec:
  implementation: almanac.rules.enumeration
  parameters:
    sets:
      tipo_documento:
        TD01: Fattura
        TD02: Acconto / anticipo su fattura
        TD03: Acconto / anticipo su parcella
        TD04: Nota di credito
        TD05: Nota di debito
        TD06: Parcella
        TD16: Integrazione fattura reverse charge interno
        TD17: Integrazione/autofattura per acquisto servizi dall'estero
        TD18: Integrazione per acquisto di beni intracomunitari
        TD19: Integrazione/autofattura per acquisto di beni ex art.17 c.2 DPR 633/72
        TD20: Autofattura per regolarizzazione e integrazione delle fatture (ex art. 6 c.9-bis d.lgs. 471/97 o art.46
          c.5 D.L. 331/93)
        TD21: Autofattura per splafonamento
        TD22: Estrazione benida Deposito IVA
        TD23: Estrazione beni da Deposito IVA con versamento dell'IVA
        TD24: Fattura differita di cui all'art.21, comma 4, terzo periodo lett. a) DPR 633/72
        TD25: Fattura differita di cui all'art.21, comma 4, terzo periodo lett. b) DPR 633/72
        TD26: Cessione di beni ammortizzabili e per passaggi interni (ex art.36 DPR 633/72)
        TD27: Fattura per autoconsumo o per cessioni gratuite senza rivalsa
        TD28: Acquisti da San Marino con IVA (fattura cartacea)
        TD29: Comunicazione per omessa o irregolare fatturazione da parte del cedente/prestatore italiano (art.
          6, comma 8, D.Lgs. 471/97)
  vectors:
  - input:
      set: tipo_documento
      value: TD01
    expected: true
    origin: source
  - input:
      set: tipo_documento
      value: TD04
    expected: true
    origin: source
  - input:
      set: tipo_documento
      value: TD29
    expected: true
    origin: source
    note: added by specification 1.4
  - input:
      set: tipo_documento
      value: TD07
    expected: false
    origin: derived
    note: the schema jumps from TD06 to TD16
  - input:
      set: tipo_documento
      value: td01
    expected: false
    origin: derived
    note: codes are upper case
