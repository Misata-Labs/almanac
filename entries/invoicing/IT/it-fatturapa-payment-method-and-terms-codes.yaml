notes: 'Payment method codes for ModalitaPagamento (2.4.2.2): MP01 cash, MP02 cheque, MP05 bank transfer, MP08 payment
  card, MP12 RIBA, MP19 to MP21 SEPA direct debits, MP23 PagoPA, and the others in the schema; and payment terms
  codes for CondizioniPagamento (2.4.1): TP01 instalments, TP02 full payment, TP03 advance. Codes and Italian labels
  come from the 1.2.3 schema; it carries no licence statement.'
