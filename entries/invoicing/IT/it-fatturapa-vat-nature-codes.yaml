  tolerance: 0
notes: 'Codes for the Natura element, which states why an invoice line or VAT summary carries no VAT: N1 excluded
  under article 15 of DPR 633/1972, N2.x not subject, N3.x non-taxable (exports, intra-EU supplies, San Marino and
  so on), N4 exempt, N5 margin scheme, N6.x reverse charge by sector, and N7 VAT paid in another EU state. The parent
  codes N2, N3 and N6 remain in the schema but, per the schema comments and the specification, may not be used on
  invoices issued from 1 January 2021; the valid_for_invoices_issued_from_2021_01_01 column records that. parent
  is the code before the dot. The schema carries no licence statement.'
