assumed:
- parameter: valid_from
  value: '2025-01-31'
  method: derived
  rationale: The specification's revision table dates version 1.4, which introduced the 1.2.3 schema, 31 January
    2025; it gives no separate start date for the new codes.
- parameter: rows.*.parent
  value: code prefix before the dot
  method: derived
  rationale: The schema lists sub-codes flat; the parent is read from the code itself.
