notes: 'Codes for the RegimeFiscale element (1.2.1.8) that states the tax regime of the seller (cedente/prestatore):
  RF01 ordinary, RF02 minimum taxpayers, RF19 the flat-rate scheme, RF20 the cross-border VAT franchise of Directive
  2020/285, and the special regimes between them. RF03 was withdrawn in revision 1.2.1 and is absent from the schema.
  Codes and labels come from the 1.2.3 schema; it carries no licence statement.'
