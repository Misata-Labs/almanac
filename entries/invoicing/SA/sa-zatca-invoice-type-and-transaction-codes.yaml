notes: 'A ZATCA (FATOORA) e-invoice states its document type in cbc:InvoiceTypeCode (BT-3): 388 tax invoice, 386
  prepayment invoice, 383 debit note, 381 credit note. The name attribute carries the seven-character transaction
  code KSA-2, NNPNESB: subtype 01 tax invoice (B2B) or 02 simplified tax invoice (B2C), then 0/1 flags for third-party,
  nominal, export, summary and self-billed transactions (BR-KSA-06). BR-KSA-07 forbids self-billing on export invoices.
  type_codes lists, per code, the document each subtype makes. No licence is stated, so the entry stays at license-review.'
