id: sa-zatca-invoice-type-and-transaction-codes
title: Saudi Arabia ZATCA e-invoice type codes (388, 386, 383, 381) and KSA-2 transaction code NNPNESB
kind: rule
domain: invoicing
region: SA
status: license-review
tier: B
valid_from: '2023-05-19'
valid_to: null
tags:
- invoicing
- e-invoicing
- tax
- code-list
- zatca
- fatoora
- saudi-arabia
- document-type
use_cases:
- invoicing-demo
- erp-demo
- tax-demo
- data-quality-validation
- invoicing
- accounts-payable
spec:
  implementation: almanac.rules.sa_zatca_transaction_code
  parameters:
    type_codes:
      '388':
        documents:
          '01': Tax Invoice
          '02': Simplified Tax Invoice
      '383':
        documents:
          '01': tax invoice debit note
          '02': simplified debit note
      '381':
        documents:
          '01': tax invoice credit note
          '02': simplified credit note
      '386':
        documents:
          '01': Prepayment Tax Invoice
          '02': Prepayment Simplified Tax Invoice
    subtypes:
      '01': tax invoice
      '02': simplified tax invoice
    flags:
    - third_party
    - nominal
    - export
    - summary
    - self_billed
    forbidden_combinations:
    - - export
      - self_billed
  vectors:
  - input:
      transaction_code: '0100000'
    expected: true
    origin: source
    note: tax invoice example
  - input:
      transaction_code: '0200000'
    expected: true
    origin: source
    note: simplified tax invoice example
  - input:
      transaction_code: '0200000'
      field: subtype
    expected: '02'
    origin: source
  - input:
      type_code: '388'
    expected: true
    origin: source
  - input:
      type_code: '381'
    expected: true
    origin: source
  - input:
      type_code: '380'
    expected: false
    origin: derived
    note: outside the KSA subset of UNCL1001
  - input:
      transaction_code: '0100101'
    expected: false
    origin: derived
    note: 'BR-KSA-07: export invoice cannot be self-billed'
  - input:
      transaction_code: '0100100'
      field: export
    expected: true
    origin: derived
  - input:
      transaction_code: '0300000'
    expected: false
    origin: derived
    note: unknown subtype
  - input:
      transaction_code: '010000'
    expected: false
    origin: derived
    note: six characters
