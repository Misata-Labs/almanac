assumed:
- parameter: rows.*.vat_category
  value: table grouping
  method: derived
  rationale: Each code's category is the row group it sits under in table 11.2.4.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 16
  tolerance: 0
notes: 'Exemption and exception reason codes a ZATCA e-invoice gives in BT-121 when a line''s VAT category (BT-151,
  a subset of UN/CEFACT 5305) is not S: category E exempt supplies (financial services, life insurance, real estate),
  Z zero-rated supplies (exports, international transport, qualifying transport means, medicines, qualifying metals,
  private education and healthcare to citizens, military goods), and O out of scope, where VATEX-SA-OOS takes a
  free-text reason. Reasons are the English text of table 11.2.4 of the standard. No licence is stated, so the entry
  stays at license-review.'
