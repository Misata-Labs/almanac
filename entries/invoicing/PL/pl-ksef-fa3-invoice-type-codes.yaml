id: pl-ksef-fa3-invoice-type-codes
title: Poland KSeF FA(3) RodzajFaktury invoice types and TypKorekty correction types
kind: rule
domain: invoicing
region: PL
status: license-review
tier: A
valid_from: '2026-02-01'
valid_to: null
tags:
- invoicing
- e-invoicing
- tax
- code-list
- ksef
- fa-3
- poland
