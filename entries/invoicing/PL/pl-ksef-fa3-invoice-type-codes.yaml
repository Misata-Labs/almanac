- data-quality-validation
- invoicing
- accounts-payable
spec:
  implementation: almanac.rules.enumeration
  parameters:
    sets:
      rodzaj_faktury:
        VAT: Faktura podstawowa
        KOR: Faktura korygująca
        ZAL: Faktura dokumentująca otrzymanie zapłaty lub jej części przed dokonaniem czynności oraz faktura wystawiona
          w związku z art. 106f ust. 4 ustawy (faktura zaliczkowa)
        ROZ: Faktura wystawiona w związku z art. 106f ust. 3 ustawy
        UPR: Faktura, o której mowa w art. 106e ust. 5 pkt 3 ustawy
        KOR_ZAL: Faktura korygująca fakturę dokumentującą otrzymanie zapłaty lub jej części przed dokonaniem czynności
          oraz fakturę wystawioną w związku z art. 106f ust. 4 ustawy (faktura korygująca fakturę zaliczkową)
        KOR_ROZ: Faktura korygująca fakturę wystawioną w związku z art. 106f ust. 3 ustawy
      typ_korekty:
        '1': Korekta skutkująca w dacie ujęcia faktury pierwotnej
        '2': Korekta skutkująca w dacie wystawienia faktury korygującej
        '3': Korekta skutkująca w dacie innej, w tym gdy dla różnych pozycji faktury korygującej daty te są różne
  vectors:
  - input:
      set: rodzaj_faktury
      value: VAT
    expected: true
    origin: source
  - input:
      set: rodzaj_faktury
      value: KOR
    expected: true
    origin: source
  - input:
      set: rodzaj_faktury
      value: ZAL
    expected: true
    origin: source
  - input:
      set: rodzaj_faktury
      value: KOR_ROZ
    expected: true
    origin: source
  - input:
      set: typ_korekty
      value: '1'
    expected: true
    origin: source
  - input:
      set: rodzaj_faktury
      value: vat
    expected: false
    origin: derived
    note: codes are upper case
