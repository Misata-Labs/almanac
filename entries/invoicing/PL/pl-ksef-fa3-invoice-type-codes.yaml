notes: 'Invoice kinds for the RodzajFaktury element of a KSeF structured invoice in the FA(3) schema: VAT basic
  invoice, KOR corrective invoice, ZAL advance-payment invoice, ROZ the invoice of art. 106f(3) of the VAT act,
  UPR the invoice of art. 106e(5)(3), and KOR_ZAL and KOR_ROZ correcting those; and TypKorekty, the date from which
  a correction takes effect. Labels are the Polish annotations of the schema. valid_from is the validity date the
  signed FA(3) metadata record gives. The repository states no licence, so the entry stays at license-review.'
