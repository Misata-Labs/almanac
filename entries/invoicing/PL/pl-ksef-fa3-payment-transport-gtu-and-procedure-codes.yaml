notes: 'Four FA(3) vocabularies: FormaPlatnosci payment forms (1 cash, 2 card, 3 voucher, 4 cheque, 5 credit, 6
  transfer, 7 mobile); RodzajTransportu transport modes; the GTU_01 to GTU_13 goods and services group markings
  of the VAT records regulation; and the procedure markings (WSTO_EE, IED, TT_D, I_42, I_63, B_SPV and others).
  Labels are the Polish annotations of the schema. The repository states no licence, so the entry stays at license-review.'
