notes: 'Values allowed in P_12, the VAT rate of an invoice line in a KSeF FA(3) invoice. The numeric values (23,
  22, 8, 7, 5, 4, 3) are percentages and the schema gives them no label, so their label is empty; the others are
  annotated: 0 KR domestic zero rate, 0 WDT intra-community supply, 0 EX export, zw exempt, oo reverse charge, np
  I and np II not subject to Polish VAT. A plain 0 is not a valid value. The repository states no licence, so the
  entry stays at license-review.'
