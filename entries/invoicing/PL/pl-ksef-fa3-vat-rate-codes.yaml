id: pl-ksef-fa3-vat-rate-codes
title: 'Poland KSeF FA(3) P_12 VAT rate values (TStawkaPodatku: numeric rates, 0 KR/WDT/EX, zw, oo, np I/II)'
kind: rule
domain: invoicing
region: PL
status: license-review
tier: A
valid_from: '2026-02-01'
valid_to: null
tags:
- invoicing
- e-invoicing
- tax
- code-list
- ksef
- fa-3
- poland
