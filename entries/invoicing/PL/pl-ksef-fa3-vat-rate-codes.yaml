spec:
  implementation: almanac.rules.enumeration
  parameters:
    sets:
      stawka_podatku:
        '23': ''
        '22': ''
        '8': ''
        '7': ''
        '5': ''
        '4': ''
        '3': ''
        0 KR: Stawka 0% w przypadku sprzedaży towarów i świadczenia usług na terytorium kraju (z wyłączeniem WDT
          i eksportu)
        0 WDT: Stawka 0% w przypadku wewnątrzwspólnotowej dostawy towarów (WDT)
        0 EX: Stawka 0% w przypadku eksportu towarów
        zw: zwolnione od podatku
        oo: odwrotne obciążenie
        np I: niepodlegające opodatkowaniu- dostawy towarów oraz świadczenia usług poza terytorium kraju, z wyłączeniem
          transakcji, o których mowa w art. 100 ust. 1 pkt 4 ustawy oraz OSS
        np II: niepodlegajace opodatkowaniu na terytorium kraju, świadczenie usług o których mowa w art. 100 ust.
          1 pkt 4 ustawy
  vectors:
  - input:
      set: stawka_podatku
      value: '23'
    expected: true
    origin: source
  - input:
      set: stawka_podatku
      value: '8'
    expected: true
    origin: source
  - input:
      set: stawka_podatku
      value: '5'
    expected: true
    origin: source
  - input:
      set: stawka_podatku
      value: 0 WDT
    expected: true
    origin: source
  - input:
      set: stawka_podatku
      value: zw
    expected: true
    origin: source
  - input:
      set: stawka_podatku
      value: np I
    expected: true
    origin: source
  - input:
      set: stawka_podatku
      value: '0'
    expected: false
    origin: derived
    note: 'zero rate must say which: 0 KR, 0 WDT or 0 EX'
  - input:
      set: stawka_podatku
      value: 23%
    expected: false
    origin: derived
    note: values carry no percent sign
