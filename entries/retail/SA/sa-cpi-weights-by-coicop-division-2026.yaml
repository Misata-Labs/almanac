notes: Weights of the thirteen COICOP 2018 divisions in Saudi Arabia's consumer price index (base 2023=100) as shown
  in Table 1.1 of GASTAT's September 2026 CPI workbook. GASTAT updates the weights at the start of each year under
  its chain-linking method, so these are the 2026 weights. They describe the household consumption basket and suit
  allocating synthetic household or card spend across categories. Division names are GASTAT's English labels in
  title case. Neither file carries a licence statement, so the entry stays at license-review; GASTAT's website use
  policy permits reuse, including commercial reuse, with GASTAT acknowledged as the source and changes indicated.
