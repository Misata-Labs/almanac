notes: Monthly consumer price index for Saudi Arabia (base 2023=100) for the general index (value) and the thirteen
  COICOP 2018 divisions from Table 5.1 of GASTAT's September 2026 CPI workbook, with the general index's year-on-year
  change in per cent from Table 5.2. Use the division indices to drift synthetic prices month by month or to index
  contracts. Neither file carries a licence statement, so the entry stays at license-review; GASTAT's website use
  policy permits reuse, including commercial reuse, with GASTAT acknowledged as the source and changes indicated.
