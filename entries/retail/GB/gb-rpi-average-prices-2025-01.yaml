assumed:
- parameter: rows[*].item
  value: 'series title with the ''RPI: Ave price -'' prefix removed'
  method: derived
  rationale: The item label is the ONS series title minus its common prefix; series_title keeps the title verbatim.
tests:
- statistic: vector_pass_fraction
  expected: 1
  tolerance: 0
- statistic: count
  expected: 52
  tolerance: 0
- statistic: max[price_pence]
  expected: 65301.0
  tolerance: 1.0e-09
notes: Average retail prices in pence for the 52 RPI average price series that carry a value for 2025 JAN in version
  v138 of the ONS MM23 consumer price inflation time series CSV (one row per CDID, keyed by the series identifier;
  the unit of each item, such as per pint, per kg or per litre, is part of its title). 2025 JAN is the latest month
  with values for these series in that version; series that stopped earlier are left out. ONS publishes the dataset
  under the Open Government Licence v3.0, as the cpih01 metadata states.
