notes: 'Enterprise e-commerce for 2025 from the ICT usage in enterprises survey (Eurostat dataflows isoc_ec_eseln2
  and isoc_ec_evaln2), enterprises with ten or more employees in manufacturing and services (NACE C10 to S95.1 excluding
  K): the percentage of enterprises with any e-commerce sales, with e-commerce sales of at least one percent of
  turnover, with web sales (websites, apps or marketplaces), with B2B or B2G web sales and with web sales to other
  countries; and, from the value flow, the share of total turnover earned through web sales and how web sales split
  between B2C and B2B or B2G customers and between own websites or apps and marketplaces. France withholds the foreign
  web sales cell as unreliable, so it is null. Rows are keyed by the Eurostat geo code and carry the English country
  name from the GEO codelist; a cell Eurostat does not publish is stored as null. Observation flags published with
  the data: break in time series (b): NL (enterprises_with_web_sales_to_foreign_countries_percent, web_sales_share_of_turnover_percent,
  b2b_or_b2g_share_of_web_sales_percent, marketplace_share_of_web_sales_percent, own_website_or_app_share_of_web_sales_percent).
  Eurostat''s copyright notice states that its data are released under the Creative Commons Attribution 4.0 International
  licence; the notice page renders dynamically and is referenced rather than hashed.'
