[project]
name = "almanac"
version = "0.1.0"
description = "Synthetic data rules for realistic synthetic data: check digits, identifier formats, tax rates, calendars, code lists and official statistics, each cited to its primary source with a content hash and executable tests."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Muhammed Rasin" }]
keywords = ["synthetic data", "test data", "data validation", "check digit", "identifier formats", "tax rates", "bank holidays", "official statistics", "reference data", "data quality"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pydantic>=2.10",
    "pypdf>=6.21.4",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://www.misata.studio"
Repository = "https://github.com/Misata-labs/almanac"
Catalogue = "https://github.com/Misata-labs/almanac/blob/main/CATALOGUE.md"
Misata = "https://pypi.org/project/misata/"

[project.scripts]
almanac = "almanac.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
