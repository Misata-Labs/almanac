<text x="48" y="228" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="500" fill="#64d8cb" text-anchor="start" >value  →  primary source  →  URL  →  sha256  →  tests  →  verified</text>
<rect x="672" y="34" width="250" height="182" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="688" y="64" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" fill="#8c959f" text-anchor="start" >RECEIPT</text>
<text x="762" y="64" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#1f2328" text-anchor="start" >gb-vrn-check-digits</text>
<text x="688" y="86" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" fill="#8c959f" text-anchor="start" >publisher</text>
<text x="762" y="86" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" >HM Revenue &amp; Customs</text>
<text x="688" y="108" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" fill="#8c959f" text-anchor="start" >weights</text>
<text x="762" y="108" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" >8 7 6 5 4 3 2</text>
