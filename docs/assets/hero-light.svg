<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Misata Almanac: the rules real-world data obeys, with receipts">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1b2a4a"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2b3a5c" stroke-width="0.7"/></pattern></defs>
<rect width="960" height="250" rx="18" fill="url(#g)"/><rect width="960" height="250" rx="18" fill="url(#grid)" opacity="0.6"/>
<text x="48" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc" text-anchor="start" >Misata Almanac</text>
<text x="48" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9fb0cc" text-anchor="start" >The rules real-world data obeys. With receipts.</text>
