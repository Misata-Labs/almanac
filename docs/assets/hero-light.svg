<text x="762" y="152" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" >28370b88…ff6b</text>
<text x="688" y="174" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" fill="#8c959f" text-anchor="start" >vectors</text>
<text x="762" y="174" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" >7/7 from the source</text>
<g transform="translate(852 184) rotate(-12)"><rect x="-44" y="-13" width="88" height="26" rx="4" fill="none" stroke="#1a7f37" stroke-width="2.5"/><text x="0" y="5" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle" >VERIFIED</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.56;1" dur="4s" repeatCount="indefinite"/></g>
