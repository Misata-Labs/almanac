<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Anatomy of an entry: spec is executed by the data engine, evidence, assumed and tests are checked by the verifier">
<rect width="960" height="300" rx="18" fill="#0d1117"/>
<text x="28" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" >Anatomy of an entry</text>
<text x="28" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9da7b3" text-anchor="start" >One YAML file. Four blocks. Two readers.</text>
<rect x="28" y="74" width="150" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="74" width="150" height="6" rx="3" fill="#58a6ff"/>
<text x="42" y="106" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" >spec</text>
<text x="42" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" font-style="italic">what runs</text>
<text x="42" y="154" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >implementation</text>
<text x="42" y="174" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >parameters</text>
<text x="42" y="194" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >vectors</text>
<rect x="192" y="74" width="150" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="192" y="74" width="150" height="6" rx="3" fill="#3fb950"/>
<text x="206" y="106" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" >evidence</text>
<text x="206" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" font-style="italic">why believe it</text>
<text x="206" y="154" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >publisher, URL</text>
<text x="206" y="174" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >sha256, locator</text>
<text x="206" y="194" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >snippet, licence</text>
<rect x="356" y="74" width="150" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="356" y="74" width="150" height="6" rx="3" fill="#9da7b3"/>
<text x="370" y="106" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" >assumed</text>
<text x="370" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" font-style="italic">what we derived</text>
<text x="370" y="154" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >parameter</text>
<text x="370" y="174" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >method</text>
<text x="370" y="194" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >rationale</text>
<rect x="520" y="74" width="150" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="520" y="74" width="150" height="6" rx="3" fill="#9da7b3"/>
<text x="534" y="106" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" >tests</text>
<text x="534" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" font-style="italic">what reproduces</text>
<text x="534" y="154" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >statistic</text>
<text x="534" y="174" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >expected</text>
<text x="534" y="194" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9da7b3" text-anchor="start" >tolerance</text>
<rect x="704" y="74" width="200" height="64" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="720" y="101" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#58a6ff" text-anchor="start" >data engine</text>
<text x="720" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9da7b3" text-anchor="start" >executes spec, samples, validates</text>
<rect x="704" y="160" width="200" height="64" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="720" y="187" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#3fb950" text-anchor="start" >verifier</text>
<text x="720" y="207" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9da7b3" text-anchor="start" >re-fetches, re-hashes, re-runs</text>
<path d="M154 74 V62 H688 Q704 62 704 76 V84" stroke="#58a6ff" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
<path d="M670 204 C 700 204, 674 192, 704 192" stroke="#3fb950" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
<text x="28" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e7681" text-anchor="start" >valid_from · valid_to · observed_period answer “what applied on date X”; tags and use_cases answer “which entry do I need”.</text>
</svg>