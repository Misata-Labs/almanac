<svg xmlns="http://www.w3.org/2000/svg" width="960" height="120" viewBox="0 0 960 120" role="img" aria-label="The proof chain: primary source, exact URL, sha256, snippet, test vectors, verifier">
  <style>
    .box { fill: #ffffff; stroke: #94a3b8; }
    .t { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .s { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
    .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="120" rx="14" fill="#f8fafc"/>
  <g>
    <g transform="translate(20 28)"><rect class="box" width="140" height="64" rx="8"/><text x="12" y="26" class="t">primary source</text><text x="12" y="46" class="s">statistical office, central bank, regulator</text></g>
    <path class="arrow" d="M162 60h26" marker-end="url(#m)"/>
    <g transform="translate(190 28)"><rect class="box" width="140" height="64" rx="8"/><text x="12" y="26" class="t">exact URL</text><text x="12" y="46" class="s">pinned revision or API query</text></g>
    <path class="arrow" d="M332 60h26"/>
    <g transform="translate(360 28)"><rect class="box" width="140" height="64" rx="8"/><text x="12" y="26" class="t">sha256</text><text x="12" y="46" class="s">of the bytes we read</text></g>
    <path class="arrow" d="M502 60h26"/>
    <g transform="translate(530 28)"><rect class="box" width="140" height="64" rx="8"/><text x="12" y="26" class="t">locator + snippet</text><text x="12" y="46" class="s">under 25 words, finds the value</text></g>
    <path class="arrow" d="M672 60h26"/>
    <g transform="translate(700 28)"><rect class="box" width="110" height="64" rx="8"/><text x="12" y="26" class="t">test vectors</text><text x="12" y="46" class="s">the source's own</text></g>
    <path class="arrow" d="M812 60h26"/>
    <g transform="translate(840 28)"><rect class="box" width="100" height="64" rx="8" stroke="#16a34a"/><text x="12" y="26" class="t" fill="#16a34a">verifier</text><text x="12" y="46" class="s">re-fetch, re-check</text></g>
  </g>
  <circle r="4" fill="#16a34a">
    <animateMotion dur="5s" repeatCount="indefinite" path="M90 102 H900"/>
  </circle>
</svg>
