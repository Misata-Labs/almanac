<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="Three panels of synthetic data failing real-world checks, and one passing with the Almanac">
<rect width="960" height="330" rx="18" fill="#f6f8fa"/>
<text x="28" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Synthetic data in the wild</text>
<text x="28" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start" >Before and after the Almanac. Same fields, different outcome.</text>
<rect x="28" y="78" width="218" height="226" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="44" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >The invoice</text>
<text x="44" y="134" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >VAT no.  GB123456789</text>
<text x="44" y="153" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >date     2026-12-28</text>
<text x="44" y="172" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >amount   ¥1,234.56</text>
<text x="44" y="203" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >✗ check digits fail MOD 97</text>
<text x="44" y="222" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >✗ substitute bank holiday</text>
<text x="44" y="241" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >✗ yen has no minor units</text>
<text x="44" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8c959f" text-anchor="start" font-style="italic">Three strikes in three fields.</text>
<rect x="260" y="78" width="218" height="226" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="276" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >The customer</text>
<text x="276" y="134" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >NINO     AO 12 34 56 E</text>
<text x="276" y="153" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >tax code 0500L</text>
<text x="276" y="172" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >e-mail   a@.uk</text>
<text x="276" y="203" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >✗ O never in position 2</text>
<text x="276" y="222" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >✗ leading zero</text>
<text x="276" y="241" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >✗ domain starts with a dot</text>
<text x="276" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8c959f" text-anchor="start" font-style="italic">HMRC bounces all three.</text>
<rect x="492" y="78" width="218" height="226" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="508" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >The Pix</text>
<text x="508" y="134" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >txid   7978c0c9-7ea8-…</text>
<text x="508" y="153" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >CNPJ   12.ABC.345/01DE-53</text>
<text x="508" y="172" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >valor  100</text>
<text x="508" y="203" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >✗ hyphens not allowed</text>
<text x="508" y="222" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >✗ check digits must be 35</text>
<text x="508" y="241" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >✗ two decimals required</text>
<text x="508" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8c959f" text-anchor="start" font-style="italic">Banco Central says no.</text>
<rect x="724" y="78" width="218" height="226" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
<text x="740" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >With the Almanac</text>
<text x="740" y="134" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >VAT no.  101747696</text>
<text x="740" y="153" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >NINO     AB 12 34 56 C</text>
<text x="740" y="172" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >CNPJ     12.ABC.345/01DE-35</text>
<text x="740" y="203" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="start" >✓ HMRC's own test vector</text>
<text x="740" y="222" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="start" >✓ prefix and suffix rules</text>
<text x="740" y="241" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="start" >✓ Receita's worked example</text>
<text x="740" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8c959f" text-anchor="start" font-style="italic">Every line has a receipt.</text>
<g transform="translate(894 102) rotate(12)"><rect x="-26" y="-10" width="52" height="20" rx="3" fill="none" stroke="#1a7f37" stroke-width="2"/><text x="0" y="4" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle" >PASS</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.52;1" dur="3.5s" repeatCount="indefinite"/></g>
</svg>