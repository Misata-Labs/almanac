<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="Misata Almanac: every number has a receipt">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#334155" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="960" height="220" rx="16" fill="url(#g)"/>
  <rect width="960" height="220" rx="16" fill="url(#grid)" opacity="0.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="78" font-size="40" font-weight="700" fill="#f8fafc">Misata Almanac</text>
    <text x="48" y="112" font-size="18" fill="#94a3b8">The rules real-world data obeys. With receipts.</text>
    <g font-size="13" fill="#cbd5e1">
      <text x="48" y="156">check digits · identifier formats · tax rates · calendars · code lists · official distributions</text>
      <text x="48" y="180" fill="#64d8cb">every value → primary source → URL → sha256 → test → verified</text>
    </g>
  </g>
  <g transform="translate(700 36)">
    <rect x="0" y="0" width="212" height="148" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0f172a">
      <text x="14" y="24" font-weight="700">RECEIPT · gb-vrn-check-digits</text>
      <text x="14" y="44">publisher   HM Revenue &amp; Customs</text>
      <text x="14" y="60">weights     8 7 6 5 4 3 2</text>
      <text x="14" y="76">modulus     97  (+55 variant)</text>
      <text x="14" y="92">sha256      28370b88…</text>
      <text x="14" y="108">vectors     7/7 from source</text>
    </g>
    <g transform="translate(150 96) rotate(-14)">
      <rect x="-40" y="-14" width="80" height="28" rx="4" fill="none" stroke="#16a34a" stroke-width="2.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#16a34a">VERIFIED</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
